{id:"um5",s:"umdat",d:"easy",t:"mcq",q:"Kitab mein taqreeban kitni ahadees hain?",o:["419","419 + 44","500","350"],a:0,e:"Ahadees mukhtasar hain \u2014 do-teen satar ki \u2014 is liye yaad karna aasan hai; kitab taqreeban 140\u2013150 safhaat par hai.",r:"Lecture 1"},
{id:"um6",s:"umdat",d:"easy",t:"mcq",q:"Umdatul-Ahkam ki ahadees kin do kitabon se muntakhab ki gayi hain?",o:["Sahih al-Bukhari aur Sahih Muslim","Sahih al-Bukhari aur Sunan Abi Dawood","Sahih Muslim aur Muwatta Imam Malik","Sunan Nasa'i aur Jami' Tirmidhi"],a:0,e:"Musannif ke talabah ne \u201cAs-Sahihayn\u201d ki mukhtasar ahkam wali ahadees jama karne ki talab ki thi.",r:"Lecture 1 / 3"},
{id:"um7",s:"umdat",d:"easy",t:"mcq",q:"Kitab mein Fiqh se mutalliq taqreeban kitni \u201ckitabein\u201d (topics) bayan ki gayi hain?",o:["17","10","7","24"],a:0,e:"Kitab at-Taharah se le kar Kitab al-Itq tak \u2014 kul 17 abwab/kitabein.",r:"Lecture 1"},
{id:"um8",s:"umdat",d:"easy",t:"mcq",q:"Course mein jo Urdu tarjama-o-sharah padhi ja rahi hai uska naam kya hai?",o:["<span class='ar'>ضِيَاءُ الكَلَامِ فِي شَرْحِ عُمْدَةِ الأَحْكَامِ</span>","<span class='ar'>تَيْسِيرُ العَلَّامِ</span>","<span class='ar'>رِيَاضُ الأَفْهَامِ</span>","<span class='ar'>الإِفْهَامُ</span>"],a:0,e:"Isme tarjama, alfaz ke ma'na, aur masail-o-ahkam shamil hain.",r:"Lecture 1 / 3"},
{id:"um9",s:"umdat",d:"easy",t:"mcq",q:"Baaz ulama ke mutabiq Umdatul-Ahkam ki sabse umda sharah kaunsi hai?",o:["<span class='ar'>إِحْكَامُ الأَحْكَامِ</span> \u2014 Ibn Daqeeq al-Eid ki","<span class='ar'>الإِعْلامُ بِفَوَائِدِ عُمْدَةِ الأَحْكَامِ</span> \u2014 Ibn al-Mulaqqin ki","<span class='ar'>تَيْسِيرُ العَلَّامِ</span>","<span class='ar'>ضِيَاءُ الكَلَامِ</span>"],a:0,e:"Doosri buland darje ki sharah Ibn al-Mulaqqin (rahimahullah) ki \u201cAl-I'lam bi-Fawa'id\u201d hai.",r:"Lecture 1"},
{id:"um10",s:"umdat",d:"easy",t:"mcq",q:"Kitab ki sabse pehli hadees ka mauzu kya hai?",o:["Ikhlas-e-Niyyat \u2014 <span class='ar'>إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ</span>","Wudu ki fazilat","Taharat ki qismein","Miswaak"],a:0,e:"Ye Sahih al-Bukhari ki bhi pehli hadees hai; har kitab ke shuru mein isay likha jana chahiye kyunki koi bhi amal beghair niyyat qabool nahi.",r:"Lecture 2"},
{id:"um11",s:"umdat",d:"easy",t:"mcq",q:"Pehli hadees ke rawi kaun hain?",o:["Hazrat Umar bin al-Khattab (RA)","Hazrat Abu Hurairah (RA)","Hazrat Aisha (RA)","Hazrat Uthman (RA)"],a:0,e:"In alfaz ke saath ye hadees sirf Hazrat Umar (RA) hi riwayat karte hain; unse bhi aage sirf chand Tabi'een ne isay riwayat kiya.",r:"Lecture 2"},
{id:"um12",s:"umdat",d:"easy",t:"mcq",q:"Hazrat Umar (RA) ki kunyat aur laqab kya hai?",o:["Kunyat: Abu Hafs \u00b7 Laqab: Farooq","Kunyat: Abu Abdullah \u00b7 Laqab: Zun-Noorain","Kunyat: Abu Turab \u00b7 Laqab: Haider","Kunyat: Abu Bakr \u00b7 Laqab: Siddique"],a:0,e:"Wo doosre Khaleefah-e-Rashid hain aur unki khilafat 10 saal se zaid arse par muheet thi.",r:"Lecture 2"},
{id:"um13",s:"umdat",d:"easy",t:"mcq",q:"Hazrat Umar (RA) ne Nabi <span class='ar'>\uFDFA</span> se taqreeban kitni ahadees riwayat ki hain?",o:["539","146","5374","43"],a:0,e:"<span class='ar'>خَمْسُ مِائَةٍ وَتِسْعٌ وَثَلاثُونَ</span>.",r:"Lecture 2"},
{id:"um14",s:"umdat",d:"easy",t:"mcq",q:"Hazrat Umar (RA) ki shahadat kab aur kis ke hathon hui?",o:["26 Dhul Hijjah 23 Hijri \u00b7 Abu Lu'lu'ah al-Majusi","13 Ramadhan 40 Hijri \u00b7 Abdur Rahman bin Muljim","35 Hijri \u00b7 Khawarij","36 Hijri \u00b7 Abu Lu'lu'ah"],a:0,e:"Unhein Fajr ki namaz mein khanjar se waar kar ke zakhmi aur shaheed kiya gaya.",r:"Lecture 2"},
{id:"um15",s:"umdat",d:"easy",t:"mcq",q:"\u201cAbu Hurairah\u201d kunniyat kis wajah se padi?",o:["Hirrah (billi) ki wajah se \u2014 wo apne saath hamesha ek billi rakhte the","Apne bete Hurairah ki wajah se","Apne qabeele ki nisbat se","Apne ustad ke naam par"],a:0,e:"Nabi <span class='ar'>\uFDFA</span> unhein pyaar se <span class='ar'>أَبَا هِرٍّ</span> bhi kehte the. Islam ke baad mash'hoor naam: Abdur Rahman bin Sakhr.",r:"Lecture 3"},
{id:"um16",s:"umdat",d:"easy",t:"mcq",q:"Hazrat Abu Hurairah (RA) ki kul marwiyaat kitni hain?",o:["5374","539","146","2645"],a:0,e:"Wo tamam Sahaba mein sabse zyada ahadees riwayat karne wale hain; Sahihayn mein unki taqreeban 600 se zaid ahadees hain.",r:"Lecture 3"},
{id:"um17",s:"umdat",d:"easy",t:"mcq",q:"Hazrat Abu Hurairah (RA) kab Musalman hue?",o:["7 Hijri \u00b7 Ghazwa-e-Khaibar ke mauqe par","2 Hijri \u00b7 Badr ke mauqe par","6 Hijri \u00b7 Hudaybiyyah ke mauqe par","8 Hijri \u00b7 Fath-e-Makkah par"],a:0,e:"Unka talluq Yemen ke qabeela Daws se tha; taqreeban 3 saal Nabi <span class='ar'>\uFDFA</span> ke saath rahe. Wafat 59 Hijri, umar 78 saal.",r:"Lecture 3"},
{id:"um18",s:"umdat",d:"easy",t:"mcq",q:"Hazrat Uthman bin Affan (RA) ka laqab \u201cZun-Noorain\u201d kyun hai?",o:["Unki shadi Nabi <span class='ar'>\uFDFA</span> ki do betiyon (Ruqayyah, phir Umm-e-Kulsoom RA) se ba-tarteeb hui","Unhone do hijratein ki","Unhone do Quran likhwaye","Unhone do masjidein banayi"],a:0,e:"Unki khilafat 12 saal (siwaye 12 din ke) rahi aur shahadat 35 Hijri mein hui. Unse 146 ahadees marwi hain.",r:"Lecture 4"},
{id:"um19",s:"umdat",d:"easy",t:"mcq",q:"Kitab at-Taharah mein kul kitni ahadees hain (jo is saal ke imtehan mein aayi)?",o:["Taqreeban 44","Taqreeban 419","Taqreeban 60","Taqreeban 30"],a:0,e:"Lecture 10 mein ustad ne bataya: Kitab at-Taharah ki taqreeban kul 44 ahadees hain, aur imtehan isi kitab se aayega.",r:"Lecture 10"},

/* --- MEDIUM --- */
{id:"um25",s:"umdat",d:"medium",t:"mcq",q:"Hadith ka lughawi ma'na kya hai?",o:["Baat cheet / guftagu","Naya","Sunna hua","Riwayat"],a:0,e:"Istilahi ma'na: har qawl, fi'l, taqreer, sifat khalqiyyah ya khuluqiyyah jiski nisbat Nabi <span class='ar'>\uFDFA</span> ki taraf ki gayi ho.",r:"Lecture 1"},
{id:"um26",s:"umdat",d:"medium",t:"mcq",q:"Hadith ki istilahi tareef mein \u201cTaqreer\u201d se kya murad hai?",o:["Aap <span class='ar'>\uFDFA</span> ke saamne koi kaam kiya gaya aur Aap khamosh rahe (inkar nahi kiya)","Aap <span class='ar'>\uFDFA</span> ka farman","Aap <span class='ar'>\uFDFA</span> ka amal","Aap <span class='ar'>\uFDFA</span> ki jismani sifat"],a:0,e:"Qawl = farman, Fi'l = amal, Taqreer = khamoshi se tasdeeq, Sifat = akhlaqi/jismani sifaat.",r:"Lecture 1"},
{id:"um27",s:"umdat",d:"medium",t:"mcq",q:"Muhadditheen aur Fuqaha ke yahan Hadith aur Sunnah ka farq kya hai?",o:["Muhadditheen ke yahan dono ek hi ma'na mein; Fuqaha ke yahan Sunnah wo hai jo Wajib ke muqable mein ho","Dono ke yahan ek hi ma'na","Muhadditheen ke yahan farq hai, Fuqaha ke yahan nahi","Fuqaha ke yahan Sunnah sirf fi'l ko kehte hain"],a:0,e:"Fuqaha (Usul al-Fiqh) ke haan Sunnah: jiska karna behtar hai lekin na karne par gunah nahi.",r:"Lecture 1"},
{id:"um28",s:"umdat",d:"medium",t:"mcq",q:"Tadween-e-Hadith (ahadees likhne) ka hukm kis khalifa ne diya aur kis ko?",o:["Umar bin Abdul Aziz (rahimahullah) ne Imam Zuhri ko","Hazrat Umar (RA) ne Imam Malik ko","Haroon ar-Rasheed ne Imam Bukhari ko","Hazrat Uthman (RA) ne Imam Zuhri ko"],a:0,e:"Is se pehle Saheefah the aur Al-Muwatta (Imam Malik) likhi gayi; baad mein Imam Bukhari aur Imam Muslim ne khalis sahih kitabein likhin.",r:"Lecture 1"},
{id:"um29",s:"umdat",d:"medium",t:"mcq",q:"Hadath-e-Asghar se kya wajib hota hai?",o:["Wudu \u2014 jaise hawa nikalna, peshab, pakhana, Madhi, Wadi","Ghusl","Tayammum","Sirf haath dhona"],a:0,e:"Hadath-e-Akbar se Ghusl wajib hota hai \u2014 jaise Janabat, Ihtilaam, Haidh aur Nifaas.",r:"Lecture 3"},
{id:"um30",s:"umdat",d:"medium",t:"mcq",q:"Taharat ki shar'i tareef kya hai?",o:["<span class='ar'>رَفْعُ الحَدَثِ وَإِزَالَةُ النَّجَسِ</span> \u2014 Hadath ko khatam karna aur nijasat ko zayil karna","Sirf paani se nahana","Sirf wudu karna","Dil ki safai"],a:0,e:"Raf'ul Hadath = wudu/ghusl ke zariye. Izaalatun Najas = paani se kapde, jism ya jagah se napaki hatana.",r:"Lecture 3"},
{id:"um31",s:"umdat",d:"medium",t:"mcq",q:"Taharat ki jagah ke aitbar se do qismein kaunsi hain?",o:["Taharat-e-Manawiyyah (dil ki paaki) aur Taharat-e-Hissiyyah (mehsoos cheezon se)","Taharat-e-Sughra aur Kubra","Taharat-e-Zahiri aur Batini sirf","Taharat-e-Wudu aur Ghusl"],a:0,e:"Manawiyyah ki daleel: <span class='ar'>قَدْ أَفْلَحَ مَنْ زَكَّاهَا</span> aur <span class='ar'>إِنَّمَا المُشْرِكُونَ نَجَسٌ</span>.",r:"Lecture 3"},
{id:"um32",s:"umdat",d:"medium",t:"mcq",q:"Al-Wudu ka lughawi ma'na kya hai?",o:["Khoobsurti, chamak (<span class='ar'>وَضَاءَة</span>)","Dhona","Safai","Paani"],a:0,e:"Istilahi tareef (Shaikh Ibn Uthaymeen): <span class='ar'>التَّعَبُّدُ لِلَّهِ بِغَسْلِ أَعْضَاءٍ مَخْصُوصَةٍ عَلَى صِفَةٍ مَخْصُوصَةٍ</span>.",r:"Lecture 3 / 4"},
{id:"um33",s:"umdat",d:"medium",t:"mcq",q:"Doosri hadees <span class='ar'>لا يَقْبَلُ اللهُ صَلاةَ أَحَدِكُمْ إِذَا أَحْدَثَ حَتَّى يَتَوَضَّأَ</span> se kya saabit hota hai?",o:["Wudu Salah ke liye Shart hai \u2014 baghair wudu Salah qabool nahi","Wudu Salah ka Rukn hai","Wudu Mustahab hai","Wudu sirf Fajr ke liye zaroori hai"],a:0,e:"Shart ibadat se kharij hoti hai magar zaroori hai (jaise qibla rukh hona); Rukn ibadat ke andar dakhil hoti hai (jaise Sajdah).",r:"Lecture 3"},
{id:"um34",s:"umdat",d:"medium",t:"mcq",q:"Agar kisi ne bhool kar baghair wudu Salah padh li to hukm kya hai?",o:["Maloom hone par dobara wudu kar ke Salah padhni hogi, magar gunah nahi","Kuch nahi karna, Salah ho gayi","Kaffara dena hoga","Qaza ke saath sadqa bhi"],a:0,e:"Ye roze ke masle se mukhtalif hai: roze mein bhool kar kha lene se roza nahi toot'ta, magar namaz baatil ho jati hai.",r:"Lecture 3"},
{id:"um35",s:"umdat",d:"medium",t:"mcq",q:"Kutta bartan mein munh daal de to bartan ko kitni baar dhona hai?",o:["7 baar \u2014 aur ek baar (behtar hai pehli martaba) mitti ke saath","3 baar","5 baar","8 baar, aathvi mitti se"],a:0,e:"\u201cAathvi martaba mitti\u201d se murad 7 dafa dhona hai, jis mein se ek baar mitti mila kar ragadna hai.",r:"Lecture 4 \u00b7 Hadees 6"},
{id:"um36",s:"umdat",d:"medium",t:"mcq",q:"Thehre hue paani mein peshab karne aur usmein Janabat ka ghusl karne ka hukm?",o:["Dono haraam hain","Dono makrooh hain","Peshab haraam, ghusl jaiz","Dono jaiz hain agar paani zyada ho"],a:0,e:"Hadees mein \u201cThumma yaghtasil\u201d par jazm hai, yaani peshab karna bhi mustaqil mana hai aur ghusl karna bhi.",r:"Lecture 4 \u00b7 Hadees 5"},
{id:"um37",s:"umdat",d:"medium",t:"mcq",q:"\u201cDo Qullay\u201d (<span class='ar'>قُلَّتَيْن</span>) ki miqdar taqreeban kitni batayi gayi hai?",o:["Taqreeban 250 kilo/liter","Taqreeban 100 liter","Taqreeban 500 liter","Taqreeban 50 liter"],a:0,e:"Pehli rai: 2 Qullay ho to rang, boo ya maza badalne tak paani napak nahi hota. Doosri rai (Imam Malik): kam ya zyada, jab tak teen sifat mein se koi na badle paani paak hai.",r:"Lecture 4"},
{id:"um38",s:"umdat",d:"medium",t:"mcq",q:"Insani sharamgah se nikalne wali 4 cheezein kaunsi hain?",o:["Peshab, Mani, Madhi, Wadi","Peshab, Pakhana, Mani, Madhi","Mani, Madhi, Wadi, Haidh","Peshab, Mani, Wadi, Nifaas"],a:0,e:"Peshab, Madhi aur Wadi = Hadath-e-Asghar. Mani = Hadath-e-Akbar (isse ghusl wajib hota hai).",r:"Lecture 6 \u00b7 Bab fi al-Madhi"},
{id:"um39",s:"umdat",d:"medium",t:"mcq",q:"Madhi nikalne par kya wajib hota hai?",o:["Sirf wudu, aur jis jagah lagi ho use dhona \u2014 ghusl wajib nahi","Ghusl wajib hota hai","Kuch bhi nahi","Poora kapda dhona"],a:0,e:"Madhi ek najaasah hai jo Taharat-e-Sughra ko todti hai, magar Hadath-e-Akbar nahi.",r:"Lecture 6 \u00b7 Bab fi al-Madhi"},
{id:"um40",s:"umdat",d:"medium",t:"mcq",q:"Madhi ki hadees ke rawi kaun hain aur Nabi <span class='ar'>\uFDFA</span> se kis ne poocha tha?",o:["Rawi: Hazrat Ali bin Abi Talib (RA) \u00b7 Poochne wale: Miqdad bin al-Aswad (RA)","Rawi: Abu Hurairah (RA) \u00b7 Poochne wale: Miqdad (RA)","Rawi: Miqdad (RA) \u00b7 Poochne wale: Ali (RA)","Rawi: Uthman (RA) \u00b7 Poochne wale: Humran"],a:0,e:"Hazrat Ali (RA) ne Nabi <span class='ar'>\uFDFA</span> ki sahibzadi (Hazrat Fatima RA) ki wajah se khud poochne mein sharam mehsoos ki.",r:"Lecture 6"},
{id:"um41",s:"umdat",d:"medium",t:"mcq",q:"Mozon par masah ki muddat kitni hai?",o:["Muqeem: 1 din 1 raat \u00b7 Musafir: 3 din 3 raat","Muqeem: 3 din \u00b7 Musafir: 1 din","Dono ke liye 1 din 1 raat","Dono ke liye 3 din 3 raat"],a:0,e:"Janabat laahiq na ho to mozay utarna zaroori nahi; peshab/qaza-e-hajat se masah baatil nahi hota.",r:"Lecture 6 \u00b7 Bab-ul-Mash"},
{id:"um42",s:"umdat",d:"medium",t:"mcq",q:"Mozon par masah ki sabse aham shart kya hai?",o:["Mozay ba-wuzu haalat (wudu kar ke paak hone ke baad) pehne gaye hon","Mozay chamde ke hon","Mozay naye hon","Mozay safed hon"],a:0,e:"Hadees-e-Mughirah (RA): <span class='ar'>دَعْهُمَا فَإِنِّي أَدْخَلْتُهُمَا طَاهِرَتَيْنِ</span>.",r:"Lecture 6 \u00b7 Bab-ul-Mash"},
{id:"um43",s:"umdat",d:"medium",t:"mcq",q:"Gardan ka masah karne ka hukm kya hai?",o:["Bid'at hai \u2014 iski koi sahih daleel nahi","Sunnat hai","Wajib hai","Mustahab hai"],a:0,e:"Sar ke masah ka masnoon tareeqa: aage se guddi tak le jaayein aur waheen se wapas aage laayein. Kaan sar ka hissa hain \u2014 <span class='ar'>الأُذُنَانِ مِنَ الرَّأْسِ</span>.",r:"Lecture 3"},
{id:"um44",s:"umdat",d:"medium",t:"mcq",q:"Siwaak ka lughawi ma'na kya hai?",o:["Ragadna","Safai","Lakdi","Khushboo"],a:0,e:"Miswaak ke zariye munh aur daant ragde jate hain. Amooman Peelu ke darakht ki jadd hoti hai; neem waghera bhi jaiz hai.",r:"Lecture 6 \u00b7 Baab-us-Siwaak"},
{id:"um45",s:"umdat",d:"medium",t:"mcq",q:"Sayyidah Aisha (RA) ki riwayat mein miswaak ki fazilat kaunse alfaz se bayan hui?",o:["<span class='ar'>السِّوَاكُ مَطْهَرَةٌ لِلْفَمِ مَرْضَاةٌ لِلرَّبِّ</span>","<span class='ar'>السِّوَاكُ سُنَّةٌ مُؤَكَّدَةٌ</span>","<span class='ar'>السِّوَاكُ نِصْفُ الوُضُوءِ</span>","<span class='ar'>السِّوَاكُ زِينَةُ الفَمِ</span>"],a:0,e:"Yaani munh ki safai aur Rabb ki razaamandi ka zariya.",r:"Lecture 6 \u00b7 Baab-us-Siwaak"},
{id:"um46",s:"umdat",d:"medium",t:"mcq",q:"Nabi <span class='ar'>\uFDFA</span> ka aakhri amal (aakhri waqton mein) kya tha?",o:["Miswaak karna","Namaz padhna","Dua karna","Quran ki tilawat"],a:0,e:"Sayyidah Aisha (RA) ki riwayat: unke bhai Abdur Rahman bin Abi Bakr ki tar miswaak ko unhone chaba kar naram kiya aur Aap <span class='ar'>\uFDFA</span> ne behtareen tareeqe se miswaak ki.",r:"Lecture 6 \u00b7 Hadees 3"},
{id:"um47",s:"umdat",d:"medium",t:"mcq",q:"Khuff aur Jawrab mein kya farq hai?",o:["Khuff aksar chamde ke mozay, Jawrab kapde waghera ke mozay","Khuff kapde ke, Jawrab chamde ke","Khuff lambe, Jawrab chhote","Dono ek hi hain"],a:0,e:"Khuff ki jama <span class='ar'>خِفَاف</span>, Jawrab ki jama <span class='ar'>جَوَارِب</span>. Nabi <span class='ar'>\uFDFA</span> se chamde ke mozon par masah saabit hai, Sahaba se kapde ke bhi.",r:"Lecture 6 \u00b7 Bab-ul-Mash"},
{id:"um48",s:"umdat",d:"medium",t:"mcq",q:"Wudu mein aaza ko kitni baar dhona Farz hai aur kitni baar Mustahab?",o:["1 baar Farz \u00b7 3 baar Mustahab/Afzal (2 baar bhi jaiz)","3 baar Farz \u00b7 1 baar Mustahab","2 baar Farz \u00b7 3 baar Mustahab","1 baar Farz \u00b7 5 baar Mustahab"],a:0,e:"3 se zyada dhona zyadti aur Zulm shumar hota hai: <span class='ar'>فَمَنْ زَادَ أَوْ نَقَصَ فَقَدْ أَسَاءَ وَظَلَمَ</span>. Masah sirf 1 baar.",r:"Lecture 3 / 4"},
{id:"um49",s:"umdat",d:"medium",t:"mcq",q:"Wudu mein Tarteeb (order) ka hukm kya hai?",o:["Farz hai \u2014 Surah Al-Ma'idah ayat 6 ki tarteeb todi to wudu baatil","Sunnat hai","Mustahab hai","Koi hukm nahi"],a:0,e:"Chehra \u2192 Haath kohniyon tak \u2192 Sar ka masah \u2192 Pair takhnon tak.",r:"Lecture 4 \u00b7 Hadees 7"},
{id:"um50",s:"umdat",d:"medium",t:"mcq",q:"Neend se uthne par bartan mein haath daalne se pehle kya hukm hai?",o:["Teen baar haath dhona \u2014 <span class='ar'>فَإِنَّ أَحَدَكُمْ لا يَدْرِي أَيْنَ بَاتَتْ يَدُهُ</span>","Sirf ek baar dhona","Kuch nahi","Wudu karna"],a:0,e:"Baaz ulama ke nazdeek Wajib, baaz ke nazdeek Mustahab. Scientific taur par bhi haath par jaraseem lag sakte hain.",r:"Lecture 3 / 11"},

/* --- HARD --- */
{id:"um60",s:"umdat",d:"hard",t:"mcq",q:"Imam al-Shafi'i (rahimahullah) ne <span class='ar'>إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ</span> ke bare mein kya farmaya?",o:["Ye hadees ek tihai (1/3) deeni ilm ke barabar hai","Ye hadees nisf deen hai","Ye hadees chauthai ilm hai","Ye poora deen hai"],a:0,e:"Imam Ahmad (rahimahullah) ke mutabiq Islam ki buniyad 3 ahadees par hai jin mein ye pehli hai.",r:"Lecture 2"},
{id:"um61",s:"umdat",d:"hard",t:"mcq",q:"Imam Ahmad (rahimahullah) ke mutabiq Islam ki buniyad kaunsi 3 ahadees par hai?",o:["<span class='ar'>إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ</span> \u00b7 <span class='ar'>مَنْ أَحْدَثَ فِي أَمْرِنَا هَذَا…</span> \u00b7 <span class='ar'>الحَلالُ بَيِّنٌ وَالحَرَامُ بَيِّنٌ</span>","<span class='ar'>إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ</span> \u00b7 <span class='ar'>الدِّينُ النَّصِيحَةُ</span> \u00b7 <span class='ar'>لا ضَرَرَ وَلا ضِرَارَ</span>","Sirf pehli aur teesri","Buniyad 4 ahadees par hai"],a:0,e:"Pehli hadees batini amal ki daleel hai, doosri zahiri amal ki, aur teesri halal-haram ki bunyad.",r:"Lecture 2"},
{id:"um62",s:"umdat",d:"hard",t:"mcq",q:"Imam Abu Dawood (rahimahullah) ne kitni ahadees jama ki aur kitni apni Sunan mein darj ki?",o:["5 lakh jama ki, 4,800 Sunan mein darj ki, aur farmaya deen ke liye 4 ahadees kaafi hain","1 lakh jama ki, 4,800 darj ki","5 lakh jama ki, 2,800 darj ki","6 lakh jama ki, 5,000 darj ki"],a:0,e:"Wo 4 ahadees: Innamal-a'malu bin-niyyaat; Min husni Islam al-mar' tarkuhu ma la ya'neeh; La yu'minu ahadukum\u2026; Al-halalu bayyinun wal-haramu bayyin.",r:"Lecture 2"},
{id:"um63",s:"umdat",d:"hard",t:"mcq",q:"Imam Muslim ki riwayat ke mutabiq Qiyamat ke din sabse pehle kin 3 logon ka faisla hoga?",o:["Shaheed, Sakhi (maal kharch karne wala), aur Aalim/Qari-e-Quran","Shaheed, Hajji, aur Aalim","Sakhi, Hafiz, aur Muezzin","Shaheed, Imam, aur Mu'allim"],a:0,e:"Teeno ko <span class='ar'>كَذَبْتَ</span> kaha jayega kyunki maqsood dikhawa aur nam-o-namood tha, aur unhein Jahannam mein daal diya jayega.",r:"Lecture 2"},
{id:"um64",s:"umdat",d:"hard",t:"mcq",q:"Niyyat ki fiqhi haisiyat ke bare mein sahih baat kya hai?",o:["Niyyat ki jagah dil hai, zaban se ada nahi ki jati; Wudu mein Rukn/Shart hai, aur Roza-Namaz mein amal ke baad bhi istimrar lazmi","Niyyat zaban se kehni zaroori hai","Niyyat sirf Roze mein shart hai","Niyyat sirf Hajj mein shart hai"],a:0,e:"Namaz ya roze ke dauran agar dil mein todne ka iradah kar le to baaz ulama ke mutabiq wo baatil ho jata hai kyunki tasalsul baqi nahi raha.",r:"Lecture 2"},
{id:"um65",s:"umdat",d:"hard",t:"mcq",q:"Haidh ka lughawi ma'na kya hai?",o:["Behna (jaise paani behta hai)","Rukna","Napaki","Mahina"],a:0,e:"Istilahi ma'na: wo mahwari khoon jo ek baligha, ghair-hamila aurat se har mahine makhsoos ayyam mein baghair kisi bimari ke nikalta hai.",r:"Lecture 10 \u00b7 Bab ul-Haidh"},
{id:"um66",s:"umdat",d:"hard",t:"mcq",q:"Haaidhah aurat ke bare mein namaz aur roze ki Qaza ka hukm kya hai?",o:["Namaz Haram hai aur uski Qaza bhi nahi; Roza Haram hai magar uski Qaza hai","Dono ki Qaza hai","Kisi ki Qaza nahi","Namaz ki Qaza hai, roze ki nahi"],a:0,e:"Is par Ijma hai. Mu'adha (Tabi'ya) ke sawal par Sayyidah Aisha (RA) ne farmaya: humein roze ki Qaza ka hukm diya jata tha, namaz ki nahi.",r:"Lecture 10 \u00b7 Hadees 5"},
{id:"um67",s:"umdat",d:"hard",t:"mcq",q:"Sayyidah Aisha (RA) ne Mu'adha se poocha <span class='ar'>أَحَرُورِيَّةٌ أَنْتِ؟</span> \u2014 \u201cHaroora\u201d kya tha?",o:["Ek gaon jahan se Khawarij nikle the, jo Hazrat Ali (RA) ke khilaf the","Ek qabeela","Ek shehar Yemen ka","Ek firqa Shia ka"],a:0,e:"Khawarij isi tarah ke (be-zaroorat) sawalaat karte the, is liye Sayyidah Aisha (RA) ne ye poocha.",r:"Lecture 10 \u00b7 Hadees 5"},
{id:"um68",s:"umdat",d:"hard",t:"mcq",q:"Istihadha ka khoon kis wajah se nikalta hai?",o:["Ek rag (jiska naam Aadil/Aazil hai) ke phatne ki wajah se \u2014 ye bimari hai","Bacha-daani se fitri taur par","Haml ki wajah se","Nifaas ki wajah se"],a:0,e:"Haidh ka khoon kaala, badbudar aur garha hota hai; Istihadha ka khoon patla, aam khoon jaisa aur bina badbu.",r:"Lecture 10"},
{id:"um69",s:"umdat",d:"hard",t:"mcq",q:"Istihadha mein Tameez (pehchan) ke 3 darjay kaunse hain?",o:["Ayyam maloom hon \u2192 Sifat maloom ho \u2192 qareebi auraton ki misl 6 ya 7 din","Sifat \u2192 Ayyam \u2192 40 din intezar","Ayyam \u2192 15 din \u2192 40 din","Sirf sifat aur ayyam"],a:0,e:"Istihadha mein har namaz ke liye Wuzu karegi; Ghusl wajib nahi. Namaz, roza aur Jima sab jaiz hain.",r:"Lecture 10"},
{id:"um70",s:"umdat",d:"hard",t:"mcq",q:"Umm Habiba (RA) ko kitne saal Istihadha ka khoon aata raha?",o:["7 saal","3 saal","10 saal","1 saal"],a:0,e:"Nabi <span class='ar'>\uFDFA</span> ne unhein Ghusl ka hukm diya; wo paaki ki khatir har namaz ke liye Ghusl karti theen (halanki wajib nahi tha).",r:"Lecture 10 \u00b7 Hadees 2"},
{id:"um71",s:"umdat",d:"hard",t:"mcq",q:"Haaidhah ke masjid se cheez laane par Nabi <span class='ar'>\uFDFA</span> ne Sayyidah Aisha (RA) se kya farmaya?",o:["<span class='ar'>إِنَّ حَيْضَتَكِ لَيْسَتْ فِي يَدِكِ</span> \u2014 tumhara Haidh tumhare hathon mein nahi hai","<span class='ar'>اُخْرُجِي مِنَ المَسْجِدِ</span>","<span class='ar'>اِغْتَسِلِي ثُمَّ خُذِي</span>","<span class='ar'>لا تَدْخُلِي المَسْجِدَ</span>"],a:0,e:"Ye jawaz ke qayil ulama ki daleel hai; doosri daleel wo laundi hai jiska masjid mein khema tha.",r:"Lecture 10"},
{id:"um72",s:"umdat",d:"hard",t:"mcq",q:"Haidh ki haalat mein Talaq dene ka hukm kya hai?",o:["Jaiz nahi; jumhoor ke haan Talaq waqi ho jayegi (magar usne ghalat kiya), Ibn Qayyim ke haan waqi nahi hogi","Bilkul jaiz hai","Jaiz nahi aur jumhoor ke haan bhi waqi nahi hogi","Sirf Hanafiyon ke haan jaiz hai"],a:0,e:"Daleel: <span class='ar'>فَطَلِّقُوهُنَّ لِعِدَّتِهِنَّ</span> \u2014 iddat Tuhr se shuru hoti hai. Agar aurat hamila ho to Talaq jaiz hai kyunki wahan Haml iddat hai.",r:"Lecture 10"},
{id:"um73",s:"umdat",d:"hard",t:"mcq",q:"Haidh ki haalat mein kya jaiz hai aur kya nahi?",o:["Jima haram hai, magar Mubasharat (jism milana), khana-peena aur saath sona jaiz hai","Sab kuch haram hai","Jima bhi jaiz hai","Sirf khana-peena jaiz hai"],a:0,e:"Sayyidah Aisha (RA) ki hadees: Aap <span class='ar'>\uFDFA</span> unhein izaar pehanne ka hukm dete aur mubasharat karte; aitekaf ki haalat mein Aap ka sar bhi wo dhoti theen.",r:"Lecture 10 \u00b7 Hadees 3"},
{id:"um74",s:"umdat",d:"hard",t:"mcq",q:"Bab-ul-Jami' (<span class='ar'>بَابُ الجَامِعِ</span>) ka matlab kya hai?",o:["Aisa bab jo namaz ke mutafarriq (mukhtalif) masail ko jama karta hai","Jumme ki namaz ka bab","Masjid-e-Jami' ka bab","Jamaat ka bab"],a:0,e:"Jami' = ikattha karne wala. Isme masjid mein dakhil hone ke ahkam, khane-peene ke baad namaz ke adab waghera jama hain.",r:"Lecture 26"},
{id:"um75",s:"umdat",d:"hard",t:"mcq",q:"Tahiyyat-ul-Masjid ka shar'i hukm jumhoor ulama ke nazdeek kya hai?",o:["Sunnat-e-Muakkadah (baaz ke nazdeek Wajib \u2014 dono aqwaal qawi hain)","Farz","Mubah","Makrooh"],a:0,e:"Hadees-e-Abu Qatadah (RA): <span class='ar'>إِذَا دَخَلَ أَحَدُكُمُ المَسْجِدَ فَلا يَجْلِسْ حَتَّى يُصَلِّيَ رَكْعَتَيْنِ</span>.",r:"Lecture 26"},
{id:"um76",s:"umdat",d:"hard",t:"mcq",q:"Sulaik al-Ghatafani (RA) ka waqia kya hai?",o:["Wo khutbah ke dauran masjid mein aa kar baith gaye, to Nabi <span class='ar'>\uFDFA</span> ne unhein khade ho kar 2 rakat (ikhtisar ke saath) padhne ka hukm diya","Unhone masjid mein jhagda kiya","Unhone azaan di","Unhone khutbah ke dauran baat ki"],a:0,e:"<span class='ar'>قُمْ فَصَلِّ رَكْعَتَيْنِ وَتَجَوَّزْ فِيهِمَا</span> \u2014 isse saabit hota hai ke bhool kar baithne wala uth kar padh le.",r:"Lecture 26"},
{id:"um77",s:"umdat",d:"hard",t:"mcq",q:"Auqat-e-Mamnoo'ah mein namazon ka sahih aur raajih hukm kya hai?",o:["Zat-ul-Asbab (sabab wali) namazein jaiz hain, Nafle Mutlaq jaiz nahi","Dono jaiz hain","Dono najaiz hain","Sirf Nafle Mutlaq jaiz hai"],a:0,e:"Daleel: Nabi <span class='ar'>\uFDFA</span> ki Zohar ki chhooti hui 2 rakat sunnat Aap ne Asar ke baad ada ki, kyunki ek wafd aa gaya tha.",r:"Lecture 26"},
{id:"um78",s:"umdat",d:"hard",t:"mcq",q:"Agar masjid mein dakhil ho kar farz ya us waqt ki Sunnat-e-Muakkadah padh li jaye to Tahiyyat-ul-Masjid ka kya hoga?",o:["Sakit ho jayegi \u2014 alag se niyat karne ki zaroorat nahi","Phir bhi alag padhni hogi","Uska gunah hoga","Sirf Fajr mein sakit hogi"],a:0,e:"Sahaba jab 5 waqt namaz ke liye aate the to sirf sunnatein padhte the; agar alag zaroori hota to Nabi <span class='ar'>\uFDFA</span> zaroor bayan farmate.",r:"Lecture 26"},
{id:"um79",s:"umdat",d:"hard",t:"mcq",q:"Hazrat Ali (RA) ki shahadat kab aur kis ke hathon hui?",o:["13 Ramadhan 40 Hijri \u00b7 Abdur Rahman bin Muljim al-Khariji","35 Hijri \u00b7 Khawarij","23 Hijri \u00b7 Abu Lu'lu'ah","40 Hijri \u00b7 Abu Lu'lu'ah"],a:0,e:"Unki kunyat Abu-ul-Hasan aur laqab Abu Turab tha; bachon mein sabse pehle (13 saal ki umar mein) Islam qabool kiya aur 5 saal khilafat ki.",r:"Lecture 6"},
{id:"um80",s:"umdat",d:"hard",t:"mcq",q:"Al-Mughirah bin Shu'bah (RA) ke bare mein kya sahih hai?",o:["Khandaq ke saal Islam qabool kiya, 136 ahadees ke rawi, 50 Hijri mein ta'oon se wafat","Badr ke saal Islam laye, 43 ahadees ke rawi","Khaibar ke saal Islam laye, 360 ahadees ke rawi","Fath-e-Makkah par Islam laye, 146 ahadees ke rawi"],a:0,e:"Unki kunyat Abu Isa thi aur wo aqlmandi-o-hoshiyari ki misaal the.",r:"Lecture 6 \u00b7 Bab-ul-Mash"},
{id:"um81",s:"umdat",d:"hard",t:"mcq",q:"Abdullah bin Mughaffal (RA) \u2014 kutte wali riwayat ke rawi \u2014 ke bare mein kya sahih hai?",o:["43 ahadees ke rawi, wafat 60 Hijri, Ashaab-ush-Shajara mein se the","136 ahadees ke rawi, wafat 50 Hijri","360 ahadees ke rawi, wafat 53 Hijri","539 ahadees ke rawi, wafat 23 Hijri"],a:0,e:"Wo un 10 Sahaba mein shamil the jinhein Hazrat Umar (RA) ne Basra bheja tha taake log Deen aur Fiqh ki samajh hasil karein.",r:"Lecture 4 \u00b7 Hadees 6"},
{id:"um82",s:"umdat",d:"hard",t:"mcq",q:"Abu Musa al-Ash'ari (RA) ke bare mein kya sahih hai?",o:["Asal naam Abdullah bin Qais; Hazrat Umar (RA) ke daur mein Basra ke governor; 360 ahadees ke rawi","Asal naam Abdur Rahman bin Sakhr; Kufa ke governor","Asal naam Abdullah bin Mughaffal; Basra ke governor","Asal naam Humran; Misr ke governor"],a:0,e:"Unki wafat 50, 51 ya 53 Hijri mein hui. Unhi ki riwayat mein hai ke Nabi <span class='ar'>\uFDFA</span> zabaan par bhi miswaak karte the.",r:"Lecture 6 \u00b7 Hadees 4"},
{id:"um83",s:"umdat",d:"hard",t:"mcq",q:"Hudhaifah bin al-Yaman (RA) ke bare mein kya sahih hai?",o:["Wo aur unke walid dono Sahabi the; Uhud mein walid ko ghalat-fahmi se shaheed kar diya gaya; wafat 36 Hijri","Unke walid Sahabi nahi the; wafat 50 Hijri","Wo Badr mein shaheed hue","Unse sirf 7 ahadees marwi hain"],a:0,e:"Unki kunyat Abu Abdullah; Sahihayn mein unse 37 ahadees aur kul taqreeban 220 ahadees riwayat ki gayi hain.",r:"Lecture 6 \u00b7 Hadees 2"},
{id:"um84",s:"umdat",d:"hard",t:"mcq",q:"Humran bin Aban kaun the?",o:["Hazrat Uthman (RA) ke azad-karda ghulam aur katib; wafat 75 Hijri","Hazrat Umar (RA) ke katib","Hazrat Ali (RA) ke ghulam","Ek Tabi'ee jo Basra ke qazi the"],a:0,e:"Ain at-Tamr ke maarke mein Khalid bin Walid (RA) ne unhein qaidi banaya tha; Hazrat Uthman (RA) ne khareed kar azad kiya. Unhi ki riwayat Uthman (RA) ke wudu ki hadees hai.",r:"Lecture 4 \u00b7 Hadees 7"},
{id:"um85",s:"umdat",d:"hard",t:"mcq",q:"Hazrat Uthman (RA) ke wudu ki hadees ke aakhir mein kya fazilat bayan hui?",o:["Jisne aise wudu kiya phir 2 rakat padhi aur unme apne nafs se baatein nahi ki, uske pichle gunah maaf","Usko 70 rakat ka sawab milega","Uski dua qabool hogi","Uske liye Jannat wajib ho jayegi"],a:0,e:"Notes ki wazahat: Kabeera gunah tauba ke baghair maaf nahi hote.",r:"Lecture 4 \u00b7 Hadees 7"},
{id:"um86",s:"umdat",d:"hard",t:"mcq",q:"Nawaqid-ul-Wuzu (wudu todne wali cheezein) mein muhaqqiqeen ke nazdeek kya shamil hai?",o:["Peshab/pakhane ki jagah se kisi cheez ka nikalna, gehri neend, aur oont ka gosht khana","Sirf peshab aur pakhana","Sirf gehri neend","Sirf hawa nikalna"],a:0,e:"An-Naum al-Mustaghraq (gehri neend) se wudu toot jata hai; halki oongh se nahi jis mein aas-paas ka ehsaas baqi rahe.",r:"Lecture 3"},
{id:"um87",s:"umdat",d:"hard",t:"mcq",q:"Istijmar (dhelay ya tissue se paaki) mein kitne adad istemal karna chahiye?",o:["Taaq (Witr) adad \u2014 kam az kam 3","Juft adad \u2014 kam az kam 2","Sirf 1","Kam az kam 7"],a:0,e:"Haddi ya janwaron ke gobar se istinja mana hai kyunki ye napak hain ya jinnat ki khoraak.",r:"Lecture 3"},
{id:"um88",s:"umdat",d:"hard",t:"mcq",q:"Ghusl ke kitne Rukn batae gaye hain?",o:["2 \u2014 Niyat (janabat ke ghusl ke liye) aur poore jism par paani bahana","3 \u2014 Niyat, wudu, jism dhona","1 \u2014 sirf jism par paani bahana","4"],a:0,e:"Ghusl se pehle wudu karna, pehle haath dhona aur gandagi saaf karna sunnat aur mustahab aamaal mein dakhil hain.",r:"Lecture 6 \u00b7 Q&A"},
{id:"um89",s:"umdat",d:"hard",t:"mcq",q:"Khade ho kar peshab karne ka hukm kya hai?",o:["Zaroorat ho, cheenton se bachaav yaqeeni ho aur parda ho to jaiz hai \u2014 magar afzal baith kar karna hai","Hamesha haram hai","Hamesha jaiz hai","Sirf safar mein jaiz hai"],a:0,e:"Hadees-e-Hudhaifah (RA): Nabi <span class='ar'>\uFDFA</span> ek qaum ke koodedaan ke paas khade ho kar peshab kiya, phir wudu kiya aur mozon par masah kiya.",r:"Lecture 6 \u00b7 Hadees 2"},
{id:"um90",s:"umdat",d:"hard",t:"mcq",q:"Kutte ko paalne ke bare mein sahih hukm kya hai?",o:["Bina wajah paalna jaiz nahi; sirf hifazat, kheti-baadi ya maveshiyon ki hifazat ke liye jaiz hai","Bilkul haram hai har surat mein","Har surat mein jaiz hai","Sirf shikar ke liye jaiz hai"],a:0,e:"Shikari kutta (Mu'allam) agar \u201cBismillah\u201d padh kar chhora jaye to uska shikar halal hai, magar kutta apni zaat mein napak hi rahega.",r:"Lecture 4 \u00b7 Hadees 6"},
{id:"um91",s:"umdat",d:"hard",t:"mcq",q:"Lecture 10 mein imtehan ke liye kitni ahadees Hifz (zabani yaad) karne ko kaha gaya?",o:["12 ahadees","10 ahadees","20 ahadees","44 ahadees"],a:0,e:"Nishan lagwaye gaye hadees numbers: 43, 45, 1, 39, 33, 28, 24, 22, 21, 17, 15, 11 aur 9.",r:"Lecture 10 \u00b7 Imtehan ki Hidayat"},
{id:"um92",s:"umdat",d:"hard",t:"mcq",q:"Quran aur Hadith mein bunyadi farq kya bataya gaya?",o:["Quran ke alfaz aur ma'na dono Allah ki taraf se; Hadees ke alfaz Nabi <span class='ar'>\uFDFA</span> ke, magar ma'na aur hukm Allah ki taraf se","Dono ke alfaz Allah ki taraf se","Dono ke alfaz Nabi <span class='ar'>\uFDFA</span> ke","Hadees mein hukm Nabi <span class='ar'>\uFDFA</span> ka apna hota hai"],a:0,e:"Amal ke aitbar se dono ek hain, magar martabe mein farq hai kyunki Quran Al-Khaliq ka kalam hai.",r:"Lecture 11"},
{id:"um93",s:"umdat",d:"hard",t:"daleel",q:"Imran bin Husain (RA) ka waqia kis baat ki daleel hai?",o:["Quran beghair Hadees ke samjha aur us par amal nahi kiya ja sakta","Hadees Quran ke muqable mein hai","Sirf Quran kaafi hai","Hadees sirf akhlaq ke liye hai"],a:0,e:"Unhone poocha: Quran mein kahan hai ke Zohr ki 4 aur Maghrib ki 3 rakat farz hain? Ye tafseel Hadees mein hai.",r:"Lecture 1"},
{id:"um94",s:"umdat",d:"hard",t:"mcq",q:"Hadees yaad karne aur doosron tak pohanchane wale ke liye Nabi <span class='ar'>\uFDFA</span> ne kya dua farmayi?",o:["<span class='ar'>نَضَّرَ اللهُ امْرَأً سَمِعَ مِنَّا حَدِيثاً فَحَفِظَهَا حَتَّى يُبَلِّغَهَا غَيْرَهُ</span>","<span class='ar'>اللَّهُمَّ عَلِّمْهُ الكِتَابَ</span>","<span class='ar'>اللَّهُمَّ بَارِكْ لَهُ</span>","<span class='ar'>رَحِمَ اللهُ مَنْ قَرَأَ</span>"],a:0,e:"Yaani Allah use tar-o-taza rakhe / Jannah mein nazarat de \u2014 jisne hadees suni, yaad ki, aur doosron tak pohanchayi.",r:"Lecture 1"},
{id:"um95",s:"umdat",d:"hard",t:"mcq",q:"Musannif ki deegar kutub mein kaunsi shamil hai?",o:["<span class='ar'>الكَمَالُ فِي أَسْمَاءِ الرِّجَالِ</span> \u2014 Kutub as-Sittah ke rijal par","<span class='ar'>تَهْذِيبُ الكَمَالِ</span>","<span class='ar'>سِيَرُ أَعْلامِ النُّبَلاءِ</span>","<span class='ar'>الإِصَابَةُ</span>"],a:0,e:"Deegar kutub: Manaqib as-Sahabah, Fada'il Umar, Hadith al-Ifk, Mukhtasar Seerat ar-Rasool.",r:"Lecture 1"},
{id:"um96",s:"umdat",d:"hard",t:"mcq",q:"Shan-e-Nuzool aur Shan-e-Wurood mein farq kya hai?",o:["Shan-e-Nuzool Quran ki aayat/surah ke sabab ko kehte hain; Shan-e-Wurood Hadees ke pas-e-manzar ko","Dono ek hi hain","Shan-e-Wurood Quran ke liye hai","Shan-e-Nuzool sirf Makki surahon ke liye hai"],a:0,e:"Pehli hadees ke Shan-e-Wurood mein \u201cMuhajir-e-Ummi Qays\u201d ka qissa mash'hoor hai, magar ulama kehte hain ke wo saabit nahi.",r:"Lecture 2"},
{id:"um97",s:"umdat",d:"hard",t:"mcq",q:"Ahadees ki hifazat Allah ne kis zariye karwayi?",o:["Ruwat (Rawiyon) ke zariye \u2014 Sahaba se Tabi'een, phir Taba Tabi'een tak seena-dar-seena","Sirf kitabon ke zariye","Sirf hifz ke zariye","Sirf khulafa ke zariye"],a:0,e:"Quran ummat-dar-ummat seena-dar-seena hifz hota raha; ahadees ki hifazat rawiyon ke zariye hui, aur baad mein tadween shuru hui.",r:"Lecture 1"},
{id:"um98",s:"umdat",d:"hard",t:"mcq",q:"Hazrat Abu Hurairah (RA) ki quwwat-e-hafiza ka mojiza kya tha?",o:["Nabi <span class='ar'>\uFDFA</span> ne unke liye dua ki aur chadar phailane ko kaha; uske baad wo kabhi ahadees nahi bhoole","Unhein khwab mein ahadees yaad karayi gayi","Unhone Quran ki tarah hadees likh li","Unhein 5 lakh ahadees yaad thin"],a:0,e:"Imam Shafi'i ka qaul unke bare mein: <span class='ar'>أَحْفَظُ مَنْ رَوَى الحَدِيثَ فِي دَهْرِهِ</span>. Unke shagird 600 se zaid the.",r:"Lecture 3"},
{id:"um99",s:"umdat",d:"hard",t:"mcq",q:"Qibla rukh hone ke bare mein safar/jangal ke masle ka hukm kya hai?",o:["Sitaron ya sooraj se maloom karne ki koshish kare; koshish ke bawajood rukh ghalat nikle to Salah ho jayegi","Salah nahi hogi, dohrana zaroori hai","Salah chhod de","Kisi bhi rukh padh le, koshish zaroori nahi"],a:0,e:"Farz namaz sawari par nahi padh sakte; hawai jahaz/train mein majboori mein shuru karte waqt qibla rukh shart hai. Nafl namaz sawari par kisi bhi rukh jaiz hai.",r:"Lecture 3"}

{id:"tw1",s:"tawheed",d:"easy",t:"mcq",q:"Kitab <span class='ar'>الأُصُولُ الثَّلاثَةُ وَأَدِلَّتُها</span> ke musannif kaun hain?",o:["Shaikh Muhammad bin Abdul Wahhab bin Sulaiman at-Tamimi","Shaikh Abdul Ghani al-Maqdisi","Imam Ibn Taymiyyah","Imam Ibn Qayyim"],a:0,e:"Unhein <span class='ar'>إِمَامُ الدَّعْوَة</span> (Imam-ud-Dawah) kaha jata hai. Wiladat 1115 H, wafat 1206 H.",r:"Thalathat al-Usul \u00b7 Title page"},
{id:"tw2",s:"tawheed",d:"easy",t:"mcq",q:"Shuru mein musannif ne kitni masail seekhna hum par wajib bataya?",o:["4 masail","3 masail","10 masail","6 masail"],a:0,e:"<span class='ar'>أَنَّهُ يَجِبُ عَلَيْنَا تَعَلُّمُ أَرْبَعِ مَسَائِلَ</span> \u2014 chaar masail ka seekhna wajib hai.",r:"Thalathat al-Usul \u00b7 p.43"},
{id:"tw3",s:"tawheed",d:"easy",t:"mcq",q:"Pehla masla <span class='ar'>العِلْمُ</span> hai. Uski teen cheezein kaunsi hain?",o:["<span class='ar'>مَعْرِفَةُ اللهِ</span>, <span class='ar'>مَعْرِفَةُ نَبِيِّهِ</span>, aur <span class='ar'>مَعْرِفَةُ دِينِ الإِسْلامِ بِالأَدِلَّةِ</span>","Ilm, Amal, Dawah","Islam, Iman, Ihsan","Tawheed, Risalat, Aakhirat"],a:0,e:"Yaani Allah ki pehchan, Aap <span class='ar'>\uFDFA</span> ki pehchan, aur deen-e-Islam ki daleelon ke saath pehchan.",r:"Thalathat al-Usul \u00b7 p.43"},
{id:"tw4",s:"tawheed",d:"easy",t:"mcq",q:"Chaaro masail ki tarteeb kaunsi hai?",o:["Al-Ilm \u2192 Al-Amal bihi \u2192 Ad-Dawah ilaih \u2192 As-Sabr alal-adha feeh","Al-Amal \u2192 Al-Ilm \u2192 As-Sabr \u2192 Ad-Dawah","Ad-Dawah \u2192 Al-Ilm \u2192 Al-Amal \u2192 As-Sabr","Al-Ilm \u2192 Ad-Dawah \u2192 As-Sabr \u2192 Al-Amal"],a:0,e:"Pehle ilm, phir us par amal, phir uski dawat, phir us raah mein takleef par sabr.",r:"Thalathat al-Usul \u00b7 p.43"},
{id:"tw5",s:"tawheed",d:"easy",t:"daleel",q:"In chaar masail ki daleel kaunsi Surah hai?",o:["Surah Al-Asr (<span class='ar'>وَالعَصْرِ</span>)","Surah Al-Ikhlas","Surah Al-Fatihah","Surah Al-Kafirun"],a:0,e:"<span class='ar'>وَالْعَصْرِ \u2217 إِنَّ الإِنْسَانَ لَفِي خُسْرٍ \u2217 إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ</span>.",r:"Thalathat al-Usul \u00b7 p.43 (Daleel)"},
{id:"tw6",s:"tawheed",d:"easy",t:"mcq",q:"Imam al-Bukhari (rahimahullah) ne kaunsa baab qayam kiya?",o:["<span class='ar'>بَابٌ: العِلْمُ قَبْلَ القَوْلِ وَالعَمَلِ</span> \u2014 Ilm, qawl aur amal se pehle","<span class='ar'>بَابُ النِّيَّةِ</span>","<span class='ar'>بَابُ الإِيمَانِ</span>","<span class='ar'>بَابُ الصَّبْرِ</span>"],a:0,e:"Unki daleel: <span class='ar'>فَاعْلَمْ أَنَّهُ لا إِلَهَ إِلَّا اللهُ وَاسْتَغْفِرْ لِذَنْبِكَ</span> \u2014 Allah ne ilm (fa'lam) ko qawl aur amal se pehle zikr kiya.",r:"Thalathat al-Usul \u00b7 p.44"},
{id:"tw7",s:"tawheed",d:"easy",t:"mcq",q:"Teen Usul (Al-Usul ath-Thalathah) kaunse hain jinki pehchan har insan par wajib hai?",o:["<span class='ar'>مَعْرِفَةُ العَبْدِ رَبَّهُ، وَدِينَهُ، وَنَبِيَّهُ مُحَمَّداً \uFDFA</span>","Tawheed, Shirk, Kufr","Islam, Iman, Ihsan","Quran, Sunnah, Ijma"],a:0,e:"Banda apne Rabb ko, apne deen ko, aur apne Nabi Muhammad <span class='ar'>\uFDFA</span> ko pehchane.",r:"Thalathat al-Usul \u00b7 p.48"},
{id:"tw8",s:"tawheed",d:"easy",t:"mcq",q:"Nawaqid al-Islam ki kul tadaad kitni hai?",o:["10","7","5","12"],a:0,e:"<span class='ar'>اعْلَمْ أَنَّ نَوَاقِضَ الإِسْلامِ عَشَرَةُ نَوَاقِضَ</span>.",r:"Nawaqid al-Islam \u00b7 Aaghaz"},
{id:"tw9",s:"tawheed",d:"easy",t:"mcq",q:"Nawaqid al-Islam mein pehla naqiz kaunsa hai?",o:["<span class='ar'>الشِّرْكُ فِي عِبَادَةِ اللهِ</span> \u2014 Allah ki ibadat mein shirk karna","Jaadoo karna","Mushrikeen ki madad karna","Deen se aiteraaz"],a:0,e:"Isi mein se hai ghair-Allah ke liye zabah karna, jaise jinn ke liye ya qabar ke liye zabah karna.",r:"Nawaqid al-Islam \u00b7 Awwal"},
{id:"tw10",s:"tawheed",d:"easy",t:"mcq",q:"Al-Hanifiyyah (Millat-e-Ibrahim) ka matlab kya hai?",o:["<span class='ar'>أَنْ تَعْبُدَ اللهَ وَحْدَهُ مُخْلِصاً لَهُ الدِّينَ</span> \u2014 sirf Allah ki ibadat, deen ko uske liye khalis kar ke","Sirf namaz padhna","Ibrahim (AS) ki qabr ki ziyarat","Har deen ko sacha maanna"],a:0,e:"Isi ka Allah ne tamam logon ko hukm diya aur isi liye unhein paida kiya: <span class='ar'>وَمَا خَلَقْتُ الجِنَّ وَالإِنْسَ إِلَّا لِيَعْبُدُونِ</span>.",r:"Thalathat al-Usul \u00b7 p.47"},
{id:"tw11",s:"tawheed",d:"easy",t:"mcq",q:"Allah ne jis cheez ka sabse bada hukm diya wo kya hai, aur jis se sabse bada mana kiya wo kya hai?",o:["Sabse bada hukm: Tawheed \u00b7 Sabse bada mana: Shirk","Sabse bada hukm: Namaz \u00b7 Sabse bada mana: Zina","Sabse bada hukm: Ilm \u00b7 Sabse bada mana: Jahalat","Sabse bada hukm: Sabr \u00b7 Sabse bada mana: Ghussa"],a:0,e:"Tawheed = <span class='ar'>إِفْرَادُ اللهِ بِالعِبَادَةِ</span> (ibadat mein Allah ko akela karna). Shirk = <span class='ar'>دَعْوَةُ غَيْرِهِ مَعَهُ</span> (uske sath ghair ko pukarna).",r:"Thalathat al-Usul \u00b7 p.47"},
{id:"tw12",s:"tawheed",d:"easy",t:"mcq",q:"Doosra Usul (Al-Asl ath-Thani) kya hai?",o:["<span class='ar'>مَعْرِفَةُ دِينِ الإِسْلامِ بِالأَدِلَّةِ</span> \u2014 deen-e-Islam ki daleelon ke sath pehchan","Allah ki pehchan","Nabi <span class='ar'>\uFDFA</span> ki pehchan","Aakhirat ki pehchan"],a:0,e:"Islam = <span class='ar'>الاسْتِسْلامُ لِلهِ بِالتَّوْحِيدِ، وَالانْقِيَادُ لَهُ بِالطَّاعَةِ، وَالبَرَاءَةُ مِنَ الشِّرْكِ وَأَهْلِهِ</span>.",r:"Thalathat al-Usul \u00b7 p.56"},
{id:"tw13",s:"tawheed",d:"easy",t:"mcq",q:"Deen-e-Islam ke kitne maratib (levels) hain?",o:["3 \u2014 Al-Islam, Al-Iman, Al-Ihsan","2 \u2014 Al-Islam aur Al-Iman","4","5"],a:0,e:"<span class='ar'>وَكُلُّ مَرْتَبَةٍ لَهَا أَرْكَانٌ</span> \u2014 har martaba ke apne arkan hain.",r:"Thalathat al-Usul \u00b7 p.56"},
{id:"tw14",s:"tawheed",d:"easy",t:"mcq",q:"Arkan-ul-Islam kitne hain?",o:["5","6","3","7"],a:0,e:"Shahadatain, Iqam-us-Salah, Eeta-uz-Zakah, Sawm-e-Ramadan, aur Hajj-e-Baitullah al-Haram.",r:"Thalathat al-Usul \u00b7 p.56"},
{id:"tw15",s:"tawheed",d:"easy",t:"mcq",q:"Arkan-ul-Iman kitne hain?",o:["6","5","3","7"],a:0,e:"Allah par, uske farishton par, uski kitabon par, uske rasoolon par, Yaum-ul-Aakhir par, aur Taqdeer ke khair-o-shar par imaan.",r:"Thalathat al-Usul \u00b7 p.60"},
{id:"tw16",s:"tawheed",d:"easy",t:"mcq",q:"Al-Ihsan ka rukn kitna hai?",o:["Ek hi rukn \u2014 <span class='ar'>أَنْ تَعْبُدَ اللهَ كَأَنَّكَ تَرَاهُ</span>","Do arkan","Teen arkan","Chaar arkan"],a:0,e:"<span class='ar'>رُكْنٌ وَاحِدٌ</span>: Allah ki ibadat is tarah karo goya tum use dekh rahe ho, aur agar ye na kar sako to (yaad rakho) wo tumhein dekh raha hai.",r:"Thalathat al-Usul \u00b7 p.61"},
{id:"tw17",s:"tawheed",d:"easy",t:"mcq",q:"Teesra Usul (Al-Asl ath-Thalith) kya hai?",o:["<span class='ar'>مَعْرِفَةُ نَبِيِّكُمْ مُحَمَّدٍ \uFDFA</span>","Allah ki pehchan","Islam ki pehchan","Taqdeer ki pehchan"],a:0,e:"Aap Muhammad bin Abdullah bin Abdul Muttalib bin Hashim hain; Hashim Quraish se, Quraish Arab se, aur Arab Ismail bin Ibrahim al-Khaleel ki nasl se.",r:"Thalathat al-Usul \u00b7 p.65"},
{id:"tw18",s:"tawheed",d:"easy",t:"mcq",q:"Nabi <span class='ar'>\uFDFA</span> ki kul umar kitni thi?",o:["63 saal \u2014 40 nubuwwat se pehle, 23 nabi-o-rasool ki haisiyat se","60 saal","65 saal","63 saal \u2014 43 pehle, 20 baad"],a:0,e:"<span class='ar'>وَلَهُ مِنَ العُمُرِ ثَلاثٌ وَسِتُّونَ سَنَةً</span>.",r:"Thalathat al-Usul \u00b7 p.65"},
{id:"tw19",s:"tawheed",d:"easy",t:"mcq",q:"Nabi <span class='ar'>\uFDFA</span> ko Nubuwwat aur Risalat kis Surah se mili?",o:["Nubuwwat <span class='ar'>بِـ﴿اقْرَأْ﴾</span> se, Risalat <span class='ar'>بِـ﴿المُدَّثِّرِ﴾</span> se","Dono Surah Al-Alaq se","Nubuwwat Al-Muddaththir se, Risalat Al-Alaq se","Dono Surah Al-Fatihah se"],a:0,e:"<span class='ar'>نُبِّئَ بِـ﴿اقْرَأْ﴾، وَأُرْسِلَ بِـ﴿المُدَّثِّرِ﴾، وَبَلَدُهُ مَكَّةُ</span> \u2014 aur Aap ka shehar Makkah tha.",r:"Thalathat al-Usul \u00b7 p.65"},

/* --- MEDIUM --- */
{id:"tw25",s:"tawheed",d:"medium",t:"mcq",q:"Imam ash-Shafi'i (rahimahullah) ne Surah Al-Asr ke bare mein kya farmaya?",o:["Agar Allah is Surah ke siwa koi hujjat nazil na karta to yehi makhlooq ke liye kaafi hoti","Ye Surah nisf Quran hai","Ye Surah Makki nahi hai","Isme sirf sabr ka zikr hai"],a:0,e:"<span class='ar'>لَوْ مَا أَنْزَلَ اللهُ حُجَّةً عَلَى خَلْقِهِ إِلَّا هَذِهِ السُّورَةَ لَكَفَتْهُمْ</span>.",r:"Thalathat al-Usul \u00b7 p.44"},
{id:"tw26",s:"tawheed",d:"medium",t:"mcq",q:"Teen masail jinka seekhna aur amal karna har Musalman mard-o-aurat par wajib hai \u2014 pehla kya hai?",o:["Allah ne humein paida kiya, rizq diya, aur be-maqsad nahi chhoda; balki rasool bheja","Namaz farz hai","Shirk se bachna","Sabr karna"],a:0,e:"Jisne rasool ki itaat ki wo Jannat mein, aur jisne nafarmani ki wo Aag mein. Daleel: <span class='ar'>إِنَّا أَرْسَلْنَا إِلَيْكُمْ رَسُولاً شَاهِداً عَلَيْكُمْ\u2026</span>",r:"Thalathat al-Usul \u00b7 p.45"},
{id:"tw27",s:"tawheed",d:"medium",t:"daleel",q:"Doosra masla: Allah is baat par raazi nahi ke uski ibadat mein kisi ko shareek kiya jaye \u2014 iski daleel?",o:["<span class='ar'>وَأَنَّ المَسَاجِدَ لِلهِ فَلا تَدْعُوا مَعَ اللهِ أَحَداً</span>","<span class='ar'>قُلْ هُوَ اللهُ أَحَدٌ</span>","<span class='ar'>إِنَّ الإِنْسَانَ لَفِي خُسْرٍ</span>","<span class='ar'>وَالعَصْرِ</span>"],a:0,e:"Chahe wo muqarrab farishta ho ya bheja gaya nabi \u2014 <span class='ar'>لا مَلَكٌ مُقَرَّبٌ، وَلا نَبِيٌّ مُرْسَلٌ</span>.",r:"Thalathat al-Usul \u00b7 p.45 (Daleel)"},
{id:"tw28",s:"tawheed",d:"medium",t:"mcq",q:"Teesra masla kya hai?",o:["Jisne Rasool ki itaat ki aur Allah ki Tawheed ki, uske liye Allah-o-Rasool ke dushmanon se dosti rakhna jaiz nahi \u2014 chahe qareebi rishtedar ho","Har Musalman se mohabbat karna","Sirf namaz qayam karna","Quran hifz karna"],a:0,e:"Daleel: <span class='ar'>لا تَجِدُ قَوْماً يُؤْمِنُونَ بِاللهِ وَاليَوْمِ الآخِرِ يُوَادُّونَ مَنْ حَادَّ اللهَ وَرَسُولَهُ\u2026 أُولَئِكَ حِزْبُ اللهِ أَلا إِنَّ حِزْبَ اللهِ هُمُ المُفْلِحُونَ</span>.",r:"Thalathat al-Usul \u00b7 p.46"},
{id:"tw29",s:"tawheed",d:"medium",t:"mcq",q:"Pehla Usul: <span class='ar'>مَنْ رَبُّكَ؟</span> ka jawab kya hai?",o:["<span class='ar'>رَبِّيَ اللهُ الَّذِي رَبَّانِي وَرَبَّى جَمِيعَ العَالَمِينَ بِنِعَمِهِ</span>","Rabb meri aql hai","Rabb wo hai jise log maante hain","Rabb ka ilm nahi ho sakta"],a:0,e:"Aur wo hi mera maabood hai, uske siwa mera koi maabood nahi. Daleel: <span class='ar'>الحَمْدُ لِلهِ رَبِّ العَالَمِينَ</span>. Allah ke siwa sab kuch \u201cAalam\u201d hai.",r:"Thalathat al-Usul \u00b7 p.49"},
{id:"tw30",s:"tawheed",d:"medium",t:"mcq",q:"<span class='ar'>بِمَ عَرَفْتَ رَبَّكَ؟</span> \u2014 tune apne Rabb ko kis cheez se pehchana?",o:["<span class='ar'>بِآيَاتِهِ وَمَخْلُوقَاتِهِ</span> \u2014 uski nishaniyon aur makhlooqat se","Sirf aql se","Sirf logon ke kehne se","Khwab se"],a:0,e:"Uski Aayat mein se hain: raat, din, sooraj aur chand. Uski makhlooqat mein se hain: saat aasman, saat zameen, aur unke darmiyan ki har cheez.",r:"Thalathat al-Usul \u00b7 p.49\u201350"},
{id:"tw31",s:"tawheed",d:"medium",t:"mcq",q:"Ibn Kathir (rahimahullah) ne farmaya: <span class='ar'>الخَالِقُ لِهَذِهِ الأَشْيَاءِ</span>\u2026 kya?",o:["<span class='ar'>هُوَ المُسْتَحِقُّ لِلْعِبَادَةِ</span> \u2014 wohi ibadat ka haqdar hai","Wo sirf Rabb hai, maabood nahi","Wo nazar aa sakta hai","Wo makhlooq jaisa hai"],a:0,e:"Yehi Tawheed-ur-Ruboobiyyah se Tawheed-ul-Uloohiyyah par hujjat hai.",r:"Thalathat al-Usul \u00b7 p.51"},
{id:"tw32",s:"tawheed",d:"medium",t:"mcq",q:"Matn mein Anwa-ul-Ibadah (ibadat ki kismein) mein kaunse shamil hain?",o:["Islam, Iman, Ihsan; Du'a, Khawf, Raja, Tawakkul, Raghbah, Rahbah, Khushoo', Khashyah, Inabah, Isti'anah, Isti'adhah, Istighathah, Dhabh, Nadhr","Sirf namaz, roza, zakat, hajj","Sirf dua aur zabah","Sirf tawakkul aur sabr"],a:0,e:"Ye sab Allah ke liye khaalis honi chahiye. Daleel: <span class='ar'>وَأَنَّ المَسَاجِدَ لِلهِ فَلا تَدْعُوا مَعَ اللهِ أَحَداً</span>.",r:"Thalathat al-Usul \u00b7 p.51\u201352"},
{id:"tw33",s:"tawheed",d:"medium",t:"mcq",q:"Jisne in ibadaton mein se koi ek bhi ghair-Allah ke liye pher di, uska hukm kya hai?",o:["<span class='ar'>فَهُوَ مُشْرِكٌ كَافِرٌ</span>","Wo gunahgaar hai magar Musalman hai","Uspar sirf tauba lazim hai","Koi harj nahi"],a:0,e:"Daleel: <span class='ar'>وَمَنْ يَدْعُ مَعَ اللهِ إِلَهاً آخَرَ لا بُرْهَانَ لَهُ بِهِ فَإِنَّمَا حِسَابُهُ عِنْدَ رَبِّهِ إِنَّهُ لا يُفْلِحُ الكَافِرُونَ</span>.",r:"Thalathat al-Usul \u00b7 p.52"},
{id:"tw34",s:"tawheed",d:"medium",t:"mcq",q:"Hadees mein Du'a ke bare mein kya aaya hai?",o:["<span class='ar'>الدُّعَاءُ مُخُّ العِبَادَةِ</span> \u2014 Dua ibadat ka maghz hai","Dua sirf mustahab hai","Dua ibadat nahi","Dua sirf Ramzan mein qabool hoti hai"],a:0,e:"Daleel: <span class='ar'>وَقَالَ رَبُّكُمُ ادْعُونِي أَسْتَجِبْ لَكُمْ إِنَّ الَّذِينَ يَسْتَكْبِرُونَ عَنْ عِبَادَتِي سَيَدْخُلُونَ جَهَنَّمَ دَاخِرِينَ</span>.",r:"Thalathat al-Usul \u00b7 p.52"},
{id:"tw35",s:"tawheed",d:"medium",t:"mcq",q:"Kalimah <span class='ar'>لا إِلَهَ إِلَّا اللهُ</span> ka ma'na kya hai?",o:["<span class='ar'>لا مَعْبُودَ بِحَقٍّ إِلَّا اللهُ</span> \u2014 Allah ke siwa koi barhaq maabood nahi","Allah ke siwa koi khaliq nahi","Allah ke siwa koi razzaq nahi","Allah ke siwa koi zinda nahi"],a:0,e:"<span class='ar'>لا إِلَهَ</span> nafi karta hai Allah ke siwa har us cheez ki jiski ibadat ki jati hai; <span class='ar'>إِلَّا اللهُ</span> ibadat ko akele Allah ke liye saabit karta hai.",r:"Thalathat al-Usul \u00b7 p.57"},
{id:"tw36",s:"tawheed",d:"medium",t:"mcq",q:"<span class='ar'>شَهَادَةُ أَنَّ مُحَمَّداً رَسُولُ اللهِ</span> ka ma'na kya hai?",o:["Jis baat ka hukm diya us mein itaat, jis ki khabar di us mein tasdeeq, jis se mana kiya us se bachna, aur Allah ki ibadat sirf usi tareeqe se jo Aap ne muqarrar kiya","Sirf Aap ki mohabbat rakhna","Sirf Aap ka naam lena","Sirf Aap par durood padhna"],a:0,e:"<span class='ar'>طَاعَتُهُ فِيمَا أَمَرَ، وَتَصْدِيقُهُ فِيمَا أَخْبَرَ، وَاجْتِنَابُ مَا عَنْهُ نَهَى وَزَجَرَ، وَأَلَّا يُعْبَدَ اللهُ إِلَّا بِمَا شَرَعَ</span>.",r:"Thalathat al-Usul \u00b7 p.58"},
{id:"tw37",s:"tawheed",d:"medium",t:"mcq",q:"Al-Iman ke kitne shu'be (branches) hain aur unka sab se aala aur sab se adna darja kya hai?",o:["Bidh'un wa sab'oona shu'bah \u00b7 aala: <span class='ar'>لا إِلَهَ إِلَّا اللهُ</span> \u00b7 adna: raaste se rukawat hatana","70 shu'be \u00b7 aala: namaz \u00b7 adna: salam","60 shu'be \u00b7 aala: roza \u00b7 adna: miswaak","100 shu'be \u00b7 aala: hajj \u00b7 adna: sadqa"],a:0,e:"Aur <span class='ar'>الحَيَاءُ شُعْبَةٌ مِنَ الإِيمَانِ</span> \u2014 haya imaan ka ek shu'bah hai.",r:"Thalathat al-Usul \u00b7 p.60"},
{id:"tw38",s:"tawheed",d:"medium",t:"mcq",q:"Hijrah ki shar'i tareef kya hai?",o:["<span class='ar'>الانْتِقَالُ مِنْ بَلَدِ الشِّرْكِ إِلَى بَلَدِ الإِسْلامِ</span>","Makkah se Madinah jana","Gaon se shehar jana","Deen ke liye safar karna"],a:0,e:"Aur Hijrah is ummat par Faridah (farz) hai, aur ye Qiyamat tak baqi rahegi.",r:"Thalathat al-Usul \u00b7 p.67"},
{id:"tw39",s:"tawheed",d:"medium",t:"daleel",q:"Hijrah ke Qiyamat tak baqi rehne ki Sunnat se daleel kaunsi hai?",o:["<span class='ar'>لا تَنْقَطِعُ الهِجْرَةُ حَتَّى تَنْقَطِعَ التَّوْبَةُ، وَلا تَنْقَطِعُ التَّوْبَةُ حَتَّى تَطْلُعَ الشَّمْسُ مِنْ مَغْرِبِهَا</span>","<span class='ar'>إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ</span>","<span class='ar'>الدُّعَاءُ مُخُّ العِبَادَةِ</span>","<span class='ar'>بُنِيَ الإِسْلامُ عَلَى خَمْسٍ</span>"],a:0,e:"Yaani Hijrah ka silsila tauba ke khatam hone tak, aur tauba sooraj maghrib se tuloo hone tak khatam nahi hogi.",r:"Thalathat al-Usul \u00b7 p.68"},
{id:"tw40",s:"tawheed",d:"medium",t:"mcq",q:"Nawaqid al-Islam ka doosra naqiz kya hai?",o:["Apne aur Allah ke darmiyan waasite banana, unhein pukarna, unse shifa'at maangna aur un par bharosa karna \u2014 <span class='ar'>كَفَرَ إِجْمَاعاً</span>","Namaz chhod dena","Zakat na dena","Sharaab peena"],a:0,e:"Matn ne is par Ijma ka lafz istemal kiya: aisa shakhs bil-ijma kafir hai.",r:"Nawaqid al-Islam \u00b7 Thani"},
{id:"tw41",s:"tawheed",d:"medium",t:"mcq",q:"Teesra naqiz kya hai?",o:["Jo mushrikeen ki takfeer na kare, ya unke kufr mein shak kare, ya unke mazhab ko sahih kahe \u2014 wo kafir hai","Jo mushrikeen se tijarat kare","Jo mushrikeen ke mulk mein rahe","Jo mushrikeen ki zabaan seekhe"],a:0,e:"<span class='ar'>مَنْ لَمْ يُكَفِّرِ المُشْرِكِينَ، أَوْ شَكَّ فِي كُفْرِهِمْ، أَوْ صَحَّحَ مَذْهَبَهُمْ؛ كَفَرَ</span>.",r:"Nawaqid al-Islam \u00b7 Thalith"},
{id:"tw42",s:"tawheed",d:"medium",t:"mcq",q:"Chautha naqiz kya hai?",o:["Ye aqeedah rakhna ke Nabi <span class='ar'>\uFDFA</span> ki hidayat ke ilawa koi hidayat zyada mukammal hai, ya Aap ke hukm se kisi ka hukm behtar hai","Namaz mein ghaflat","Quran na padhna","Deen mein sawal karna"],a:0,e:"Jaise wo log jo Tawagheet ke hukm ko Aap <span class='ar'>\uFDFA</span> ke hukm par tarjeeh dete hain \u2014 <span class='ar'>فَهُوَ كَافِرٌ</span>.",r:"Nawaqid al-Islam \u00b7 Rabi'"},
{id:"tw43",s:"tawheed",d:"medium",t:"mcq",q:"Paanchwa naqiz kya hai?",o:["Jo Rasool <span class='ar'>\uFDFA</span> ki layi hui kisi cheez se bughz (nafrat) rakhe, agarche us par amal bhi karta ho \u2014 kafir hai","Jo Rasool <span class='ar'>\uFDFA</span> ki hadees na padhe","Jo sunnat chhod de","Jo bid'at kare"],a:0,e:"<span class='ar'>مَنْ أَبْغَضَ شَيْئاً مِمَّا جَاءَ بِهِ الرَّسُولُ \uFDFA وَلَوْ عَمِلَ بِهِ كَفَرَ</span> \u2014 amal karne ke bawajood bughz naqiz hai.",r:"Nawaqid al-Islam \u00b7 Khamis"},

/* --- HARD --- */
{id:"tw50",s:"tawheed",d:"hard",t:"daleel",q:"Daleel-e-Khawf (dar) ki aayat kaunsi hai?",o:["<span class='ar'>فَلا تَخَافُوهُمْ وَخَافُونِ إِنْ كُنْتُمْ مُؤْمِنِينَ</span>","<span class='ar'>وَعَلَى اللهِ فَتَوَكَّلُوا</span>","<span class='ar'>فَلا تَخْشَوْهُمْ وَاخْشَوْنِ</span>","<span class='ar'>وَأَنِيبُوا إِلَى رَبِّكُمْ</span>"],a:0,e:"Matn mein har ibadat ki alag daleel di gayi hai; Khawf ki daleel yehi aayat hai.",r:"Thalathat al-Usul \u00b7 p.53"},
{id:"tw51",s:"tawheed",d:"hard",t:"daleel",q:"Daleel-e-Raja (ummeed) ki aayat kaunsi hai?",o:["<span class='ar'>فَمَنْ كَانَ يَرْجُو لِقَاءَ رَبِّهِ فَلْيَعْمَلْ عَمَلاً صَالِحاً وَلا يُشْرِكْ بِعِبَادَةِ رَبِّهِ أَحَداً</span>","<span class='ar'>فَلا تَخَافُوهُمْ وَخَافُونِ</span>","<span class='ar'>وَمَنْ يَتَوَكَّلْ عَلَى اللهِ فَهُوَ حَسْبُهُ</span>","<span class='ar'>إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ</span>"],a:0,e:"Raja ke sath amal-e-salih aur shirk se bachna bhi zaroori qarar diya gaya.",r:"Thalathat al-Usul \u00b7 p.53"},
{id:"tw52",s:"tawheed",d:"hard",t:"daleel",q:"Daleel-e-Tawakkul ki aayaat kaunsi hain?",o:["<span class='ar'>وَعَلَى اللهِ فَتَوَكَّلُوا إِنْ كُنْتُمْ مُؤْمِنِينَ</span> aur <span class='ar'>وَمَنْ يَتَوَكَّلْ عَلَى اللهِ فَهُوَ حَسْبُهُ</span>","<span class='ar'>فَلا تَخَافُوهُمْ وَخَافُونِ</span>","<span class='ar'>قُلْ أَعُوذُ بِرَبِّ الفَلَقِ</span>","<span class='ar'>وَأَنِيبُوا إِلَى رَبِّكُمْ</span>"],a:0,e:"Dono aayaat matn mein Tawakkul ki daleel ke taur par zikr ki gayi hain.",r:"Thalathat al-Usul \u00b7 p.53"},
{id:"tw53",s:"tawheed",d:"hard",t:"daleel",q:"Raghbah, Rahbah aur Khushoo' ki daleel kaunsi aayat hai?",o:["<span class='ar'>إِنَّهُمْ كَانُوا يُسَارِعُونَ فِي الخَيْرَاتِ وَيَدْعُونَنَا رَغَباً وَرَهَباً وَكَانُوا لَنَا خَاشِعِينَ</span>","<span class='ar'>فَلا تَخْشَوْهُمْ وَاخْشَوْنِ</span>","<span class='ar'>وَأَنِيبُوا إِلَى رَبِّكُمْ وَأَسْلِمُوا لَهُ</span>","<span class='ar'>إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ</span>"],a:0,e:"Ek hi aayat mein teeno ibadaat (raghban, rahaban, khashi'een) ka zikr hai.",r:"Thalathat al-Usul \u00b7 p.53"},
{id:"tw54",s:"tawheed",d:"hard",t:"daleel",q:"Daleel-e-Khashyah ki aayat kaunsi hai?",o:["<span class='ar'>فَلا تَخْشَوْهُمْ وَاخْشَوْنِ</span>","<span class='ar'>فَلا تَخَافُوهُمْ وَخَافُونِ</span>","<span class='ar'>وَعَلَى اللهِ فَتَوَكَّلُوا</span>","<span class='ar'>ادْعُونِي أَسْتَجِبْ لَكُمْ</span>"],a:0,e:"Dhyaan: Khawf ki daleel <span class='ar'>خَافُونِ</span> wali aayat hai aur Khashyah ki <span class='ar'>اخْشَوْنِ</span> wali \u2014 imtehan mein ye dono mila di jati hain.",r:"Thalathat al-Usul \u00b7 p.53"},
{id:"tw55",s:"tawheed",d:"hard",t:"daleel",q:"Daleel-e-Inabah ki aayat kaunsi hai?",o:["<span class='ar'>وَأَنِيبُوا إِلَى رَبِّكُمْ وَأَسْلِمُوا لَهُ</span>","<span class='ar'>إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ</span>","<span class='ar'>قُلْ أَعُوذُ بِرَبِّ النَّاسِ</span>","<span class='ar'>إِذْ تَسْتَغِيثُونَ رَبَّكُمْ</span>"],a:0,e:"Inabah = Allah ki taraf rujoo karna aur uske liye jhuk jana.",r:"Thalathat al-Usul \u00b7 p.54"},
{id:"tw56",s:"tawheed",d:"hard",t:"daleel",q:"Daleel-e-Isti'anah ki aayat aur hadees kaunsi hai?",o:["Aayat: <span class='ar'>إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ</span> \u00b7 Hadees: <span class='ar'>إِذَا اسْتَعَنْتَ فَاسْتَعِنْ بِاللهِ</span>","Aayat: <span class='ar'>قُلْ أَعُوذُ بِرَبِّ الفَلَقِ</span> \u00b7 Hadees: <span class='ar'>الدُّعَاءُ مُخُّ العِبَادَةِ</span>","Aayat: <span class='ar'>وَأَنِيبُوا إِلَى رَبِّكُمْ</span> \u00b7 Hadees: <span class='ar'>لَعَنَ اللهُ مَنْ ذَبَحَ لِغَيْرِ اللهِ</span>","Aayat: <span class='ar'>إِذْ تَسْتَغِيثُونَ رَبَّكُمْ</span> \u00b7 Hadees: koi nahi"],a:0,e:"Aayat Surah Al-Fatihah ki hai, aur hadees Hazrat Ibn Abbas (RA) ki mash'hoor wasiyat se hai.",r:"Thalathat al-Usul \u00b7 p.54"},
{id:"tw57",s:"tawheed",d:"hard",t:"daleel",q:"Daleel-e-Isti'adhah (panah maangna) ki aayaat kaunsi hain?",o:["<span class='ar'>قُلْ أَعُوذُ بِرَبِّ الفَلَقِ</span> aur <span class='ar'>قُلْ أَعُوذُ بِرَبِّ النَّاسِ</span>","<span class='ar'>إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ</span>","<span class='ar'>إِذَا تَسْتَغِيثُونَ رَبَّكُمْ فَاسْتَجَابَ لَكُمْ</span>","<span class='ar'>وَأَنِيبُوا إِلَى رَبِّكُمْ</span>"],a:0,e:"Yaani Surah Al-Falaq aur Surah An-Naas ki ibtedayi aayaat.",r:"Thalathat al-Usul \u00b7 p.54"},
{id:"tw58",s:"tawheed",d:"hard",t:"daleel",q:"Daleel-e-Istighathah (faryaad karna) ki aayat kaunsi hai?",o:["<span class='ar'>إِذْ تَسْتَغِيثُونَ رَبَّكُمْ فَاسْتَجَابَ لَكُمْ</span>","<span class='ar'>قُلْ أَعُوذُ بِرَبِّ الفَلَقِ</span>","<span class='ar'>إِيَّاكَ نَعْبُدُ</span>","<span class='ar'>وَأَنِيبُوا إِلَى رَبِّكُمْ</span>"],a:0,e:"Istighathah bhi khaalis Allah ke liye hai; ghair-Allah se faryaad shirk hai.",r:"Thalathat al-Usul \u00b7 p.54"},
{id:"tw59",s:"tawheed",d:"hard",t:"daleel",q:"Daleel-e-Dhabh (zabah) ki aayat aur Sunnat kaunsi hai?",o:["Aayat: <span class='ar'>قُلْ إِنَّ صَلاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلهِ رَبِّ العَالَمِينَ \u2217 لا شَرِيكَ لَهُ</span> \u00b7 Sunnat: <span class='ar'>لَعَنَ اللهُ مَنْ ذَبَحَ لِغَيْرِ اللهِ</span>","Aayat: <span class='ar'>وَأَنِيبُوا إِلَى رَبِّكُمْ</span> \u00b7 Sunnat: <span class='ar'>الدُّعَاءُ مُخُّ العِبَادَةِ</span>","Aayat: <span class='ar'>يُوفُونَ بِالنَّذْرِ</span> \u00b7 Sunnat: koi nahi","Aayat: <span class='ar'>إِيَّاكَ نَعْبُدُ</span> \u00b7 Sunnat: <span class='ar'>إِذَا اسْتَعَنْتَ فَاسْتَعِنْ بِاللهِ</span>"],a:0,e:"Nusuk = qurbani/zabah. Sunnat ki daleel bataati hai ke ghair-Allah ke liye zabah par laanat hai.",r:"Thalathat al-Usul \u00b7 p.54"},
{id:"tw60",s:"tawheed",d:"hard",t:"daleel",q:"Daleel-e-Nadhr (mannat) ki aayat kaunsi hai?",o:["<span class='ar'>يُوفُونَ بِالنَّذْرِ وَيَخَافُونَ يَوْماً كَانَ شَرُّهُ مُسْتَطِيراً</span>","<span class='ar'>قُلْ إِنَّ صَلاتِي وَنُسُكِي</span>","<span class='ar'>إِذْ تَسْتَغِيثُونَ رَبَّكُمْ</span>","<span class='ar'>وَعَلَى اللهِ فَتَوَكَّلُوا</span>"],a:0,e:"Nadhr bhi ibadat hai, is liye ghair-Allah ke liye mannat maanna shirk hai.",r:"Thalathat al-Usul \u00b7 p.55"},
{id:"tw61",s:"tawheed",d:"hard",t:"daleel",q:"Daleel-e-Shahadatain (Kalimah) ki aayat kaunsi hai?",o:["<span class='ar'>شَهِدَ اللهُ أَنَّهُ لا إِلَهَ إِلَّا هُوَ وَالمَلائِكَةُ وَأُولُو العِلْمِ قَائِماً بِالقِسْطِ</span>","<span class='ar'>وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللهَ مُخْلِصِينَ</span>","<span class='ar'>لَقَدْ جَاءَكُمْ رَسُولٌ مِنْ أَنْفُسِكُمْ</span>","<span class='ar'>وَلِلهِ عَلَى النَّاسِ حِجُّ البَيْتِ</span>"],a:0,e:"Aur Shahadat \u201cMuhammad Rasoolullah\u201d ki daleel: <span class='ar'>لَقَدْ جَاءَكُمْ رَسُولٌ مِنْ أَنْفُسِكُمْ عَزِيزٌ عَلَيْهِ مَا عَنِتُّمْ\u2026</span>",r:"Thalathat al-Usul \u00b7 p.57\u201358"},
{id:"tw62",s:"tawheed",d:"hard",t:"daleel",q:"Salah, Zakah aur Tafseer-e-Tawheed ki daleel ek hi aayat hai \u2014 kaunsi?",o:["<span class='ar'>وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللهَ مُخْلِصِينَ لَهُ الدِّينَ حُنَفَاءَ وَيُقِيمُوا الصَّلاةَ وَيُؤْتُوا الزَّكَاةَ وَذَلِكَ دِينُ القَيِّمَةِ</span>","<span class='ar'>يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ</span>","<span class='ar'>وَلِلهِ عَلَى النَّاسِ حِجُّ البَيْتِ</span>","<span class='ar'>شَهِدَ اللهُ أَنَّهُ لا إِلَهَ إِلَّا هُوَ</span>"],a:0,e:"Isi aayat se ikhlas (Tawheed), Salah aur Zakah teeno saabit hote hain.",r:"Thalathat al-Usul \u00b7 p.59"},
{id:"tw63",s:"tawheed",d:"hard",t:"daleel",q:"Daleel-e-Siyam aur Daleel-e-Hajj kaunsi aayaat hain?",o:["Siyam: <span class='ar'>يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ</span> \u00b7 Hajj: <span class='ar'>وَلِلهِ عَلَى النَّاسِ حِجُّ البَيْتِ مَنِ اسْتَطَاعَ إِلَيْهِ سَبِيلاً</span>","Siyam: <span class='ar'>وَأَتِمُّوا الحَجَّ</span> \u00b7 Hajj: <span class='ar'>كُتِبَ عَلَيْكُمُ الصِّيَامُ</span>","Siyam: <span class='ar'>وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللهَ</span> \u00b7 Hajj: <span class='ar'>شَهِدَ اللهُ</span>","Dono ki ek hi daleel hai"],a:0,e:"Dono ki alag alag daleelein matn mein di gayi hain \u2014 imtehan mein inhein mila kar poocha jata hai.",r:"Thalathat al-Usul \u00b7 p.59"},
{id:"tw64",s:"tawheed",d:"hard",t:"daleel",q:"Arkan-e-Sittah (Iman ke 6 arkan) par daleel kaunsi aayat hai?",o:["<span class='ar'>لَيْسَ البِرَّ أَنْ تُوَلُّوا وُجُوهَكُمْ قِبَلَ المَشْرِقِ وَالمَغْرِبِ وَلَكِنَّ البِرَّ مَنْ آمَنَ بِاللهِ وَاليَوْمِ الآخِرِ وَالمَلائِكَةِ وَالكِتَابِ وَالنَّبِيِّينَ</span>","<span class='ar'>إِنَّا كُلَّ شَيْءٍ خَلَقْنَاهُ بِقَدَرٍ</span>","<span class='ar'>شَهِدَ اللهُ أَنَّهُ لا إِلَهَ إِلَّا هُوَ</span>","<span class='ar'>إِنَّ اللهَ مَعَ الَّذِينَ اتَّقَوْا</span>"],a:0,e:"Aur Daleel-ul-Qadar khaas taur par: <span class='ar'>إِنَّا كُلَّ شَيْءٍ خَلَقْنَاهُ بِقَدَرٍ</span>.",r:"Thalathat al-Usul \u00b7 p.60"},
{id:"tw65",s:"tawheed",d:"hard",t:"daleel",q:"Al-Ihsan ki Sunnat se daleel kya hai?",o:["Hadees-e-Jibreel al-Mash'hoor \u2014 Hazrat Umar (RA) se marwi","Hadees-e-Niyyat","Hadees-e-Siwaak","Hadees-e-Mash ala al-Khuffain"],a:0,e:"Is hadees mein Jibreel (AS) ne Islam, Iman, Ihsan aur Qiyamat ki nishaniyon ke bare mein poocha; aakhir mein Nabi <span class='ar'>\uFDFA</span> ne farmaya: <span class='ar'>فَإِنَّهُ جِبْرِيلُ، أَتَاكُمْ يُعَلِّمُكُمْ دِينَكُمْ</span>.",r:"Thalathat al-Usul \u00b7 p.61\u201364"},
{id:"tw66",s:"tawheed",d:"hard",t:"mcq",q:"Hadees-e-Jibreel mein Qiyamat ki Amaraat (nishaniyan) kya batayi gayin?",o:["Laundi apni maalikah ko janam degi, aur nange-paa, nange-badan, muflis bakriyon ke charwahe sardar ban jayenge","Sooraj maghrib se niklega aur Dajjal aayega","Aag Yemen se niklegi","Dabbah-tul-Ardh zahir hoga"],a:0,e:"<span class='ar'>أَنْ تَلِدَ الأَمَةُ رَبَّتَهَا، وَأَنْ تَرَى الحُفَاةَ العُرَاةَ العَالَةَ رِعَاءَ الشَّاءِ يَتَطَاوَلُونَ فِي البُنْيَانِ</span>.",r:"Thalathat al-Usul \u00b7 p.63\u201364"},
{id:"tw67",s:"tawheed",d:"hard",t:"daleel",q:"Allah ne Nabi <span class='ar'>\uFDFA</span> ko kis baat ke sath bheja aur iski daleel kaunsi Surah hai?",o:["Shirk se darane aur Tawheed ki dawat dene ke liye \u00b7 Surah Al-Muddaththir (<span class='ar'>يَا أَيُّهَا المُدَّثِّرُ</span>)","Sirf Quran sunane ke liye \u00b7 Surah Al-Alaq","Sirf akhlaq sikhane ke liye \u00b7 Surah Al-Qalam","Jihad ke liye \u00b7 Surah At-Tawbah"],a:0,e:"<span class='ar'>بَعَثَهُ اللهُ بِالنِّذَارَةِ عَنِ الشِّرْكِ، وَيَدْعُو إِلَى التَّوْحِيدِ</span>. Ma'na <span class='ar'>﴿قُمْ فَأَنْذِرْ﴾</span>: shirk se dara aur Tawheed ki dawat de.",r:"Thalathat al-Usul \u00b7 p.66"},
{id:"tw68",s:"tawheed",d:"hard",t:"mcq",q:"Matn ki tafseer ke mutabiq <span class='ar'>﴿وَرَبَّكَ فَكَبِّرْ﴾</span> aur <span class='ar'>﴿وَثِيَابَكَ فَطَهِّرْ﴾</span> ka ma'na kya hai?",o:["Pehla: apne Rabb ki Tawheed ke sath azmat bayan kar \u00b7 Doosra: apne aamal ko shirk se paak kar","Pehla: buland aawaz se takbeer keh \u00b7 Doosra: kapde dho","Pehla: azaan de \u00b7 Doosra: wudu kar","Pehla: namaz padh \u00b7 Doosra: ghusl kar"],a:0,e:"Matn ki tafseer: <span class='ar'>﴿وَرَبَّكَ فَكَبِّرْ﴾ أَيْ: عَظِّمْهُ بِالتَّوْحِيدِ</span>, aur <span class='ar'>﴿وَثِيَابَكَ فَطَهِّرْ﴾ أَيْ: طَهِّرْ أَعْمَالَكَ عَنِ الشِّرْكِ</span>.",r:"Thalathat al-Usul \u00b7 p.66"},
{id:"tw69",s:"tawheed",d:"hard",t:"mcq",q:"<span class='ar'>﴿وَالرُّجْزَ فَاهْجُرْ﴾</span> mein \u201cAr-Rujz\u201d se kya murad hai?",o:["Al-Asnam (but) \u2014 aur unse hijrat ka matlab unhein chhodna aur un se aur unke ahl se baraat karna","Gunah","Napaki","Shaitan"],a:0,e:"Matn: <span class='ar'>وَالرُّجْزَ: الأَصْنَامُ، وَهَجْرُهَا: تَرْكُهَا، وَالبَرَاءَةُ مِنْهَا وَأَهْلِهَا</span>.",r:"Thalathat al-Usul \u00b7 p.66"},
{id:"tw70",s:"tawheed",d:"hard",t:"mcq",q:"Nabi <span class='ar'>\uFDFA</span> ne kitne saal Tawheed ki dawat di aur uske baad kya hua?",o:["10 saal \u00b7 phir Me'raj hui, 5 namazein farz huin, 3 saal Makkah mein namaz padhi, phir Hijrat ka hukm mila","5 saal \u00b7 phir Hijrat","13 saal \u00b7 phir Me'raj","10 saal \u00b7 phir fauran Hijrat"],a:0,e:"<span class='ar'>أَخَذَ عَلَى هَذَا عَشْرَ سِنِينَ يَدْعُو إِلَى التَّوْحِيدِ، وَبَعْدَ العَشْرِ عُرِجَ بِهِ إِلَى السَّمَاءِ\u2026</span>",r:"Thalathat al-Usul \u00b7 p.67"},
{id:"tw71",s:"tawheed",d:"hard",t:"mcq",q:"Madinah aane ke baad kaunse ahkam diye gaye aur uspar kitna arsa guzra?",o:["Zakah, Sawm, Hajj, Azaan, Jihad, Amr bil-Ma'roof wa Nahi anil-Munkar \u00b7 10 saal","Sirf Zakah aur Sawm \u00b7 5 saal","Sirf Jihad \u00b7 3 saal","Sirf Azaan aur Hajj \u00b7 13 saal"],a:0,e:"<span class='ar'>أُمِرَ بِبَقِيَّةِ شَرَائِعِ الإِسْلامِ\u2026 أَخَذَ عَلَى هَذَا عَشْرَ سِنِينَ</span>. Iske baad Aap <span class='ar'>\uFDFA</span> ki wafat hui magar Aap ka deen baqi hai.",r:"Thalathat al-Usul \u00b7 p.69"},
{id:"tw72",s:"tawheed",d:"hard",t:"mcq",q:"Matn ke mutabiq Aap <span class='ar'>\uFDFA</span> ne jis khair ki rehnumai ki aur jis shar se daraya \u2014 wo kya hai?",o:["Khair: Tawheed aur har wo cheez jo Allah ko pasand ho \u00b7 Shar: Shirk aur har wo cheez jo Allah ko napasand ho","Khair: Namaz \u00b7 Shar: Bid'at","Khair: Ilm \u00b7 Shar: Jahalat","Khair: Sabr \u00b7 Shar: Ghussa"],a:0,e:"<span class='ar'>وَالخَيْرُ الَّذِي دَلَّهَا عَلَيْهِ: التَّوْحِيدُ، وَجَمِيعُ مَا يُحِبُّهُ اللهُ وَيَرْضَاهُ. وَالشَّرُّ الَّذِي حَذَّرَهَا مِنْهُ: الشِّرْكُ، وَجَمِيعُ مَا يَكْرَهُهُ اللهُ وَيَأْبَاهُ</span>.",r:"Thalathat al-Usul \u00b7 p.69"},
{id:"tw73",s:"tawheed",d:"hard",t:"daleel",q:"Allah ne Nabi <span class='ar'>\uFDFA</span> ko kis ki taraf bheja, aur uski daleel?",o:["Tamam logon ki taraf, aur unki itaat Jinn-o-Ins dono par farz ki \u00b7 <span class='ar'>قُلْ يَا أَيُّهَا النَّاسُ إِنِّي رَسُولُ اللهِ إِلَيْكُمْ جَمِيعاً</span>","Sirf Arabon ki taraf \u00b7 <span class='ar'>وَأَنْذِرْ عَشِيرَتَكَ</span>","Sirf Quraish ki taraf \u00b7 <span class='ar'>قُمْ فَأَنْذِرْ</span>","Sirf Ahl-e-Kitab ki taraf"],a:0,e:"<span class='ar'>بَعَثَهُ اللهُ إِلَى النَّاسِ كَافَّةً، وَافْتَرَضَ طَاعَتَهُ عَلَى جَمِيعِ الثَّقَلَيْنِ \u2014 الجِنِّ وَالإِنْسِ</span>.",r:"Thalathat al-Usul \u00b7 p.70"},
{id:"tw74",s:"tawheed",d:"hard",t:"daleel",q:"\u201cAllah ne Aap <span class='ar'>\uFDFA</span> ke zariye deen mukammal kiya\u201d \u2014 iski daleel?",o:["<span class='ar'>اليَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِي وَرَضِيتُ لَكُمُ الإِسْلامَ دِيناً</span>","<span class='ar'>إِنَّكَ مَيِّتٌ وَإِنَّهُمْ مَيِّتُونَ</span>","<span class='ar'>قُلْ يَا أَيُّهَا النَّاسُ</span>","<span class='ar'>وَمَا كَانَ مُحَمَّدٌ أَبَا أَحَدٍ مِنْ رِجَالِكُمْ</span>"],a:0,e:"Aur Aap ki maut par daleel: <span class='ar'>إِنَّكَ مَيِّتٌ وَإِنَّهُمْ مَيِّتُونَ \u2217 ثُمَّ إِنَّكُمْ يَوْمَ القِيَامَةِ عِنْدَ رَبِّكُمْ تَخْتَصِمُونَ</span>.",r:"Thalathat al-Usul \u00b7 p.70"},
{id:"tw75",s:"tawheed",d:"hard",t:"daleel",q:"Ba'ath (dobara uthaye jaane) ke baad logon ka kya hoga, aur uski daleel?",o:["Muhasaba hoga aur aamal ka badla milega \u00b7 <span class='ar'>لِيَجْزِيَ الَّذِينَ أَسَاءُوا بِمَا عَمِلُوا وَيَجْزِيَ الَّذِينَ أَحْسَنُوا بِالحُسْنَى</span>","Sab Jannat mein jayenge \u00b7 <span class='ar'>وَاللهُ غَفُورٌ رَحِيمٌ</span>","Sab ka hisaab maaf hoga","Sirf kuffar ka hisaab hoga"],a:0,e:"Matn: <span class='ar'>وَبَعْدَ البَعْثِ مُحَاسَبُونَ وَمَجْزِيُّونَ بِأَعْمَالِهِمْ</span>.",r:"Thalathat al-Usul \u00b7 p.71"},
{id:"tw76",s:"tawheed",d:"hard",t:"daleel",q:"Jo Ba'ath ka inkaar kare uska hukm kya hai, aur daleel?",o:["Wo kafir hai \u00b7 <span class='ar'>زَعَمَ الَّذِينَ كَفَرُوا أَنْ لَنْ يُبْعَثُوا قُلْ بَلَى وَرَبِّي لَتُبْعَثُنَّ ثُمَّ لَتُنَبَّؤُنَّ بِمَا عَمِلْتُمْ</span>","Wo gunahgaar hai magar Musalman hai","Uspar sirf tauba lazim hai","Ye masla ikhtilafi hai"],a:0,e:"<span class='ar'>وَمَنْ كَذَّبَ بِالبَعْثِ كَفَرَ</span> \u2014 matn ne saraahatan kafir qarar diya.",r:"Thalathat al-Usul \u00b7 p.71"},
{id:"tw77",s:"tawheed",d:"hard",t:"mcq",q:"Allah ne tamam Rasoolon ko kis haisiyat se bheja, aur unmein pehle aur aakhir kaun hain?",o:["Mubashshireen wa Mundhireen \u00b7 Pehle: Nuh (AS) \u00b7 Aakhir: Muhammad <span class='ar'>\uFDFA</span> (Khatam-un-Nabiyyeen)","Sirf Mundhireen \u00b7 Pehle: Adam (AS) \u00b7 Aakhir: Isa (AS)","Sirf Mubashshireen \u00b7 Pehle: Ibrahim (AS) \u00b7 Aakhir: Muhammad <span class='ar'>\uFDFA</span>","Mubashshireen wa Mundhireen \u00b7 Pehle: Ibrahim (AS) \u00b7 Aakhir: Isa (AS)"],a:0,e:"Daleel-e-Nuh: <span class='ar'>إِنَّا أَوْحَيْنَا إِلَيْكَ كَمَا أَوْحَيْنَا إِلَى نُوحٍ وَالنَّبِيِّينَ مِنْ بَعْدِهِ</span>. Daleel-e-Khatm: <span class='ar'>وَمَا كَانَ مُحَمَّدٌ أَبَا أَحَدٍ مِنْ رِجَالِكُمْ وَلَكِنْ رَسُولَ اللهِ وَخَاتَمَ النَّبِيِّينَ</span>.",r:"Thalathat al-Usul \u00b7 p.72"},
{id:"tw78",s:"tawheed",d:"hard",t:"daleel",q:"Har ummat ki taraf Rasool bheja gaya \u2014 kis do baaton ke sath? Daleel?",o:["Allah ki akeli ibadat ka hukm aur Taghoot ki ibadat se mana \u00b7 <span class='ar'>وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَسُولاً أَنِ اعْبُدُوا اللهَ وَاجْتَنِبُوا الطَّاغُوتَ</span>","Namaz aur Zakat ka hukm \u00b7 <span class='ar'>وَأَقِيمُوا الصَّلاةَ</span>","Sirf Tawheed \u00b7 <span class='ar'>قُلْ هُوَ اللهُ أَحَدٌ</span>","Sirf akhlaq \u00b7 <span class='ar'>إِنَّكَ لَعَلَى خُلُقٍ عَظِيمٍ</span>"],a:0,e:"Aur Allah ne tamam bandon par farz kiya: Taghoot ka kufr aur Allah par imaan.",r:"Thalathat al-Usul \u00b7 p.73"},
{id:"tw79",s:"tawheed",d:"hard",t:"mcq",q:"Ibn al-Qayyim (rahimahullah) ke mutabiq Taghoot ka ma'na kya hai?",o:["<span class='ar'>مَا تَجَاوَزَ بِهِ العَبْدُ حَدَّهُ مِنْ مَعْبُودٍ، أَوْ مَتْبُوعٍ، أَوْ مُطَاعٍ</span>","Sirf but","Sirf Shaitan","Sirf zaalim badshah"],a:0,e:"Yaani har wo cheez jiske zariye banda apni hadd se guzar jaye \u2014 chahe maabood ho, ya jiski pairawi ki jaye, ya jiski itaat ki jaye.",r:"Thalathat al-Usul \u00b7 p.73"},
{id:"tw80",s:"tawheed",d:"hard",t:"mcq",q:"Tawagheet bohot hain, magar unke Ru'oos (sardar) kitne hain?",o:["5","3","7","10"],a:0,e:"Iblees (mal'oon), jiski ibadat ki jaye aur wo raazi ho, jo logon ko apni ibadat ki dawat de, jo ghaib ka ilm ka dawa kare, aur jo Allah ke nazil kiye hue ke ilawa faisla kare.",r:"Thalathat al-Usul \u00b7 p.73\u201374"},
{id:"tw81",s:"tawheed",d:"hard",t:"daleel",q:"Matn ke aakhir mein kaunsi aayat <span class='ar'>لا إِلَهَ إِلَّا اللهُ</span> ka ma'na bayan karti hai?",o:["<span class='ar'>لا إِكْرَاهَ فِي الدِّينِ قَدْ تَبَيَّنَ الرُّشْدُ مِنَ الغَيِّ فَمَنْ يَكْفُرْ بِالطَّاغُوتِ وَيُؤْمِنْ بِاللهِ فَقَدِ اسْتَمْسَكَ بِالعُرْوَةِ الوُثْقَى</span>","<span class='ar'>قُلْ هُوَ اللهُ أَحَدٌ</span>","<span class='ar'>شَهِدَ اللهُ أَنَّهُ لا إِلَهَ إِلَّا هُوَ</span>","<span class='ar'>وَمَا خَلَقْتُ الجِنَّ وَالإِنْسَ إِلَّا لِيَعْبُدُونِ</span>"],a:0,e:"Matn: <span class='ar'>وَهَذَا مَعْنَى \u2018لا إِلَهَ إِلَّا اللهُ\u2019</span> \u2014 Taghoot ka kufr aur Allah par imaan.",r:"Thalathat al-Usul \u00b7 p.74"},
{id:"tw82",s:"tawheed",d:"hard",t:"mcq",q:"Matn ke aakhri hadees mein deen ka sar, sutoon aur choti kya batayi gayi?",o:["<span class='ar'>رَأْسُ الأَمْرِ: الإِسْلامُ، وَعَمُودُهُ: الصَّلاةُ، وَذِرْوَةُ سَنَامِهِ: الجِهَادُ فِي سَبِيلِ اللهِ</span>","Sar: Namaz \u00b7 Sutoon: Zakat \u00b7 Choti: Hajj","Sar: Ilm \u00b7 Sutoon: Amal \u00b7 Choti: Dawah","Sar: Tawheed \u00b7 Sutoon: Roza \u00b7 Choti: Sabr"],a:0,e:"Iske baad musannif ne farmaya: <span class='ar'>وَاللهُ أَعْلَمُ</span> aur kitab mukammal hui.",r:"Thalathat al-Usul \u00b7 p.74"},
{id:"tw83",s:"tawheed",d:"hard",t:"daleel",q:"Nawaqid al-Islam ka chhata naqiz aur uski daleel?",o:["Deen ki kisi cheez, uske sawab ya azaab ka mazaq udana \u00b7 <span class='ar'>قُلْ أَبِاللهِ وَآيَاتِهِ وَرَسُولِهِ كُنْتُمْ تَسْتَهْزِئُونَ</span>","Jaadoo karna \u00b7 <span class='ar'>وَمَا كَفَرَ سُلَيْمَانُ</span>","Mushrikeen ki madad \u00b7 <span class='ar'>وَمَنْ يَتَوَلَّهُمْ مِنْكُمْ</span>","Deen se aiteraaz \u00b7 <span class='ar'>وَمَنْ أَعْرَضَ عَنْ ذِكْرِي</span>"],a:0,e:"<span class='ar'>مَنِ اسْتَهْزَأَ بِشَيْءٍ مِنْ دِينِ اللهِ أَوْ ثَوَابِهِ أَوْ عِقَابِهِ؛ كَفَرَ</span>.",r:"Nawaqid al-Islam \u00b7 Sadis"},
{id:"tw84",s:"tawheed",d:"hard",t:"mcq",q:"Saatwa naqiz kya hai aur usme kya shamil hai?",o:["As-Sihr (jaadoo) \u2014 aur usme Sarf aur Atf shamil hain; jisne kiya ya us par raazi hua, kafir hua","Shirk \u2014 usme dua shamil hai","Riya \u2014 usme namaz shamil hai","Kibr \u2014 usme takabbur shamil hai"],a:0,e:"Daleel: <span class='ar'>وَمَا كَفَرَ سُلَيْمَانُ وَلَكِنَّ الشَّيَاطِينَ كَفَرُوا يُعَلِّمُونَ النَّاسَ السِّحْرَ</span>. Sarf = mohabbat ko nafrat mein badalna, Atf = nafrat ko mohabbat mein.",r:"Nawaqid al-Islam \u00b7 Sabi'"},
{id:"tw85",s:"tawheed",d:"hard",t:"daleel",q:"Aathwa naqiz kya hai aur uski daleel?",o:["Mushrikeen ki pusht-panahi aur Musalmanon ke khilaf unki madad karna \u00b7 <span class='ar'>وَمَنْ يَتَوَلَّهُمْ مِنْكُمْ فَإِنَّهُ مِنْهُمْ إِنَّ اللهَ لا يَهْدِي القَوْمَ الظَّالِمِينَ</span>","Mushrikeen se tijarat \u00b7 <span class='ar'>لا تَأْكُلُوا الرِّبَا</span>","Mushrikeen ke mulk mein rehna \u00b7 <span class='ar'>وَاعْتَصِمُوا</span>","Mushrikeen ko salam karna"],a:0,e:"<span class='ar'>مُظَاهَرَةُ المُشْرِكِينَ وَمُعَاوَنَتُهُمْ عَلَى المُسْلِمِينَ</span>.",r:"Nawaqid al-Islam \u00b7 Thamin"},
{id:"tw86",s:"tawheed",d:"hard",t:"mcq",q:"Nauwa naqiz kya hai?",o:["Ye aqeedah ke ba'z logon ke liye Muhammad <span class='ar'>\uFDFA</span> ki shariat se nikalna jaiz hai, jaise Khidr ke liye Musa (AS) ki shariat se nikalna jaiz tha \u2014 wo kafir hai","Namaz mein kotahi","Shariat ka ilm na hona","Deen mein aasani talash karna"],a:0,e:"<span class='ar'>مَنِ اعْتَقَدَ أَنَّ بَعْضَ النَّاسِ يَسَعُهُ الخُرُوجُ عَنْ شَرِيعَةِ مُحَمَّدٍ \uFDFA\u2026 فَهُوَ كَافِرٌ</span>.",r:"Nawaqid al-Islam \u00b7 Tasi'"},
{id:"tw87",s:"tawheed",d:"hard",t:"daleel",q:"Daswa naqiz kya hai aur uski daleel?",o:["Al-I'raad (Allah ke deen se munh modna) \u2014 na seekhna aur na us par amal karna \u00b7 <span class='ar'>وَمَنْ أَظْلَمُ مِمَّنْ ذُكِّرَ بِآيَاتِ رَبِّهِ فَأَعْرَضَ عَنْهَا</span>","Jaadoo \u00b7 <span class='ar'>وَمَا كَفَرَ سُلَيْمَانُ</span>","Istehza \u00b7 <span class='ar'>قُلْ أَبِاللهِ</span>","Shirk \u00b7 <span class='ar'>إِنَّ اللهَ لا يَغْفِرُ أَنْ يُشْرَكَ بِهِ</span>"],a:0,e:"<span class='ar'>العَاشِرُ: الإِعْرَاضُ عَنْ دِينِ اللهِ، لا يَتَعَلَّمُهُ وَلا يَعْمَلُ بِهِ</span>.",r:"Nawaqid al-Islam \u00b7 Aashir"},
{id:"tw88",s:"tawheed",d:"hard",t:"mcq",q:"In tamam nawaqid mein Hazil (mazaq karne wale) aur Jaad (sanjeedah) ke darmiyan farq hai ya nahi?",o:["Koi farq nahi \u2014 siwaye Mukrah (majboor kiye gaye) ke","Hazil maaf hai","Khaif (darne wala) bhi shamil hai","Jaad hi kafir hota hai"],a:0,e:"<span class='ar'>وَلا فَرْقَ فِي جَمِيعِ هَذِهِ النَّوَاقِضِ بَيْنَ الهَازِلِ وَالجَادِّ وَالخَائِفِ، إِلَّا المُكْرَهَ</span> \u2014 khaif bhi mustasna nahi, sirf mukrah hai.",r:"Nawaqid al-Islam \u00b7 Khatimah"},
{id:"tw89",s:"tawheed",d:"hard",t:"mcq",q:"Nawaqid al-Islam ke khatimah mein Musalman ko kya naseehat di gayi?",o:["Ye sab sab se bade khatre aur sab se zyada waqe hone wale umoor hain, is liye Musalman inse bache aur apni zaat par inka khauf rakhe","Ye sirf ulama ka masla hai","Ye umoor bohot kam pesh aate hain","In par bahas na ki jaye"],a:0,e:"Aakhir mein dua: <span class='ar'>نَعُوذُ بِاللهِ مِنْ مُوجِبَاتِ غَضَبِهِ وَأَلِيمِ عِقَابِهِ</span>.",r:"Nawaqid al-Islam \u00b7 Khatimah"}
);
