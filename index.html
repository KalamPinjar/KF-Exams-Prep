tb27:{q:"موظف کہتا ہے <span class='ar'>اِدْفَعْ خَمْسِينَ دُولاراً</span> — آپ سے کیا کہا جا رہا ہے؟",o:["پچاس ڈالر ادا کریں","پچاس ڈالر واپس لیں","پچاس کلو سامان رکھیں","پچاس منٹ انتظار کریں"],e:"<span class='ar'>دَفَعَ / يَدْفَعُ / اِدْفَعْ</span> = ادا کرنا۔"},
tb28:{q:"”بکنگ کب کنفرم کرنی ہے؟“ — موظف کا جواب تھا:",o:["<span class='ar'>قَبْلَ السَّفَرِ بِيَوْمٍ</span> — سفر سے ایک دن پہلے","<span class='ar'>يَوْمَ السَّفَرِ</span> — سفر والے دن","<span class='ar'>قَبْلَ السَّفَرِ بِأُسْبُوعٍ</span> — ہفتہ پہلے","کنفرم کرنے کی ضرورت نہیں"],e:"<span class='ar'>أَكَّدَ / يُؤَكِّدُ الحَجْزَ</span> = بکنگ کنفرم کرنا۔"},
tb29:{q:"”میں لائبریری جا رہا ہوں“ — اسم الفاعل کے ساتھ؟",o:["<span class='ar'>أَنَا ذَاهِبٌ إِلَى المَكْتَبَةِ</span>","<span class='ar'>أَنَا ذَهَبْتُ إِلَى المَكْتَبَةِ</span>","<span class='ar'>أَنَا مَذْهُوبٌ إِلَى المَكْتَبَةِ</span>","<span class='ar'>أَنَا ذِهَابٌ إِلَى المَكْتَبَةِ</span>"],e:"بول چال میں اسم الفاعل (<span class='ar'>ذَاهِب، خَارِج، قَادِم</span>) سے ”ابھی جا رہا ہوں“ والی حالت ظاہر ہوتی ہے۔"},
tb30:{q:"ایک خاتون کہے گی ”میں پیرس سے آ رہی ہوں“ — صحیح شکل؟",o:["<span class='ar'>أَنَا قَادِمَةٌ مِنْ بَارِيسَ</span>","<span class='ar'>أَنَا قَادِمٌ مِنْ بَارِيسَ</span>","<span class='ar'>أَنَا قَادِمُونَ مِنْ بَارِيسَ</span>","<span class='ar'>أَنَا قُدُومٌ مِنْ بَارِيسَ</span>"],e:"مؤنث کے لیے تاء مربوطہ: <span class='ar'>قَادِم ← قَادِمَة</span>۔"},
tb31:{q:"بول چال میں <span class='ar'>يُمْكِنُكَ أَنْ تَخْرُجَ</span> کا مطلب؟",o:["آپ جا سکتے ہیں","آپ کو جانا پڑے گا","آپ نہیں جا سکتے","آپ کب جائیں گے؟"],e:"<span class='ar'>يُمْكِنُكَ</span> = آپ کے لیے ممکن ہے۔ دوسرا انداز: <span class='ar'>يُمْكِنُكَ الخُرُوجُ</span>۔"},
tb32:{q:"”کون سے ریستوران میں؟“ پوچھنے کی صحیح شکل؟",o:["<span class='ar'>فِي أَيِّ مَطْعَمٍ؟</span>","<span class='ar'>فِي أَيَّ مَطْعَمٌ؟</span>","<span class='ar'>فِي أَيُّ مَطْعَمٌ؟</span>","<span class='ar'>فِي أَيِّ مَطْعَمُ؟</span>"],e:"<span class='ar'>أَيّ</span> کے بعد اسم ہمیشہ مجرور (زیر) — بولتے وقت یہ سن کر پتا چل جاتا ہے۔"},
tb33:{q:"<span class='ar'>اِسْتَخْرَجَ</span> کا مطلب اور اس کا امر؟",o:["نکلوانا / جاری کروانا · امر: <span class='ar'>اِسْتَخْرِجْ</span>","خرچ کرنا · امر: <span class='ar'>اُخْرُجْ</span>","باہر نکلنا · امر: <span class='ar'>اِخْرَجْ</span>","تلاش کرنا · امر: <span class='ar'>اِسْتَخْبِرْ</span>"],e:"جیسے <span class='ar'>اِسْتَخْرَجَ التَّأْشِيرَةَ</span> = ویزا نکلوایا۔"},
tb34:{q:"اعلان میں <span class='ar'>سُرْعَةُ التَّوَجُّهِ إِلَى بَوَّابَةِ الخُرُوجِ</span> سنائی دے تو کیا کرنا ہے؟",o:["جلدی ایگزٹ گیٹ کی طرف جانا ہے","گیٹ پر انتظار کرنا ہے","سامان واپس لینا ہے","ٹکٹ دکھانا ہے"],e:"<span class='ar'>سُرْعَة</span> جلدی، <span class='ar'>تَوَجُّه</span> رخ کرنا، <span class='ar'>بَوَّابَةُ الخُرُوجِ</span> ایگزٹ گیٹ۔"},
tb35:{q:"کسی کو ”جوس لے لیجیے“ کہنے کے لیے؟",o:["<span class='ar'>تَنَاوَلْ عَصِيرَ الفَوَاكِهِ</span>","<span class='ar'>اِشْتَرِ عَصِيرَ الفَوَاكِهِ</span>","<span class='ar'>بِعْ عَصِيرَ الفَوَاكِهِ</span>","<span class='ar'>اُنْظُرْ عَصِيرَ الفَوَاكِهِ</span>"],e:"<span class='ar'>تَنَاوَلَ / يَتَنَاوَلُ / تَنَاوَلْ</span> = لینا / کھانا پینا۔"},
tb36:{q:"<span class='ar'>الجَمَارِك</span> کا مطلب؟",o:["کسٹم","امیگریشن","بیگیج کلیم","ڈیوٹی فری"],e:"سبق ۵ کسٹم کے مکالمے پر ہے — وہاں <span class='ar'>اِفْتَحْ / أَقْفِلْ</span> کے حکم آتے ہیں۔"},
tb37:{q:"”کیا آپ کے پاس کوئی ممنوع چیز ہے؟“ پوچھنے کا انداز؟",o:["<span class='ar'>هَلْ مَعَكَ شَيْءٌ مَمْنُوعٌ؟</span>","<span class='ar'>مَتَى مَعَكَ شَيْءٌ مَمْنُوعٌ؟</span>","<span class='ar'>أَيْنَ مَعَكَ شَيْءٌ مَمْنُوعٌ؟</span>","<span class='ar'>كَمْ مَعَكَ شَيْءٌ مَمْنُوعٌ؟</span>"],e:"<span class='ar'>هَلْ</span> سے ہاں/نہیں والا سوال بنتا ہے؛ <span class='ar'>مَمْنُوع</span> = ممنوع۔"},
tb38:{q:"”مجھے یونیورسٹی ایڈمنسٹریشن لے چلیں“ — صحیح جملہ؟",o:["<span class='ar'>خُذْنِي إِلَى إِدَارَةِ الجَامِعَةِ</span>","<span class='ar'>اِذْهَبْ مِنْ إِدَارَةِ الجَامِعَةِ</span>","<span class='ar'>أَعْرِفُ إِدَارَةَ الجَامِعَةِ</span>","<span class='ar'>أَيْنَ إِدَارَةُ الجَامِعَةِ</span>"],e:"<span class='ar'>أَخَذَ / يَأْخُذُ / خُذْ</span> = لے جانا؛ <span class='ar'>ـنِي</span> = مجھے۔"},
tb39:{q:"<span class='ar'>السَّكَنُ الجَامِعِيُّ</span> کا مطلب؟",o:["یونیورسٹی ہاسٹل / رہائش گاہ","یونیورسٹی کا دفتر","یونیورسٹی کا میدان","یونیورسٹی کی لائبریری"],e:"<span class='ar'>سَكَن</span> = رہنے کی جگہ، <span class='ar'>جَامِعِيّ</span> = یونیورسٹی کا۔"},
tb40:{q:"زبانی امتحان میں ”سفر کے مراحل ترتیب سے بتائیں“ — سبق ۱ تا ۶ کی صحیح ترتیب؟",o:["ٹکٹ/ویزا ← بکنگ ← وزن و بورڈنگ ← ایئرپورٹ ندا ← کسٹم ← ٹیکسی","کسٹم ← ٹیکسی ← بکنگ ← ٹکٹ ← ایئرپورٹ ندا ← وزن","بکنگ ← ٹیکسی ← ٹکٹ ← کسٹم ← ایئرپورٹ ندا ← وزن","ٹیکسی ← وزن ← کسٹم ← بکنگ ← ٹکٹ ← ایئرپورٹ ندا"],e:"یہ کورس کے اسباق کی ترتیب ہے — زبانی میں پورا سفر اسی ترتیب سے بیان کرنا آسان رہتا ہے۔"},

tb50:{q:"پورا جملہ: ”میں اگلے ہفتے ریاض کے لیے بکنگ کرنا چاہتا ہوں“",o:["<span class='ar'>أُرِيدُ أَنْ أَحْجِزَ لِلرِّيَاضِ فِي الأُسْبُوعِ القَادِمِ</span>","<span class='ar'>أُرِيدُ أَحْجِزُ لِلرِّيَاضِ فِي الأُسْبُوعِ القَادِمِ</span>","<span class='ar'>أُرِيدُ أَنْ حَجَزْتُ لِلرِّيَاضِ فِي الأُسْبُوعِ القَادِمِ</span>","<span class='ar'>أُرِيدُ الحَجْزُ لِلرِّيَاضِ فِي الأُسْبُوعِ القَادِمِ</span>"],e:"<span class='ar'>أَنْ</span> کے بعد فعل منصوب: <span class='ar'>أَحْجِزَ</span>۔ مصدر سے بولنا ہو تو <span class='ar'>أُرِيدُ الحَجْزَ</span>۔"},
tb51:{q:"”رشید نے ابھی تک ویزا نہیں نکلوایا“ — صحیح نفی والا جملہ؟",o:["<span class='ar'>رَشِيدٌ لَمْ يَسْتَخْرِجْ التَّأْشِيرَةَ</span>","<span class='ar'>رَشِيدٌ لَمْ يَسْتَخْرِجُ التَّأْشِيرَةَ</span>","<span class='ar'>رَشِيدٌ لَمْ اسْتَخْرَجَ التَّأْشِيرَةَ</span>","<span class='ar'>رَشِيدٌ لَمْ يَسْتَخْرِجَ التَّأْشِيرَةَ</span>"],e:"<span class='ar'>لَمْ</span> ماضی کی نفی کرتا ہے مگر فعل مضارع مجزوم (سکون) ہو جاتا ہے۔"},
tb52:{q:"”میرے پاس نوے ریال ہیں“ — بولتے وقت صحیح عدد؟",o:["<span class='ar'>مَعِي تِسْعُونَ رِيَالاً</span>","<span class='ar'>مَعِي تِسْعِينَ رِيَالاً</span>","<span class='ar'>مَعِي تِسْعُونَ رِيَالٍ</span>","<span class='ar'>مَعِي تِسْعِينَ رِيَالٌ</span>"],e:"یہاں عدد مبتدا ہے تو مرفوع (ـون)۔ لیکن <span class='ar'>اِدْفَعْ تِسْعِينَ رِيَالاً</span> میں مفعول ہونے سے منصوب (ـین)۔"},
tb53:{q:"”آپ جدہ سے آئے ہیں؟“ — جدہ کے ساتھ صحیح اعراب؟",o:["<span class='ar'>هَلْ أَنْتَ قَادِمٌ مِنْ جِدَّةَ؟</span>","<span class='ar'>هَلْ أَنْتَ قَادِمٌ مِنْ جِدَّةٍ؟</span>","<span class='ar'>هَلْ أَنْتَ قَادِمٌ مِنْ جِدَّةُ؟</span>","<span class='ar'>هَلْ أَنْتَ قَادِمٌ مِنْ جِدَّةً؟</span>"],e:"<span class='ar'>جِدَّة، أَنْقَرَة، عَمَّان</span> ممنوع من الصرف ہیں — حرفِ جر کے بعد بھی فتحہ پر بولتے ہیں۔"},
tb54:{q:"<span class='ar'>مَتَى نَوْمُكَ؟</span> کا مطلب کیا ہے؟",o:["آپ کب سوتے ہیں؟ (فعل کی جگہ مصدر)","آپ کہاں سوتے ہیں؟","آپ کتنا سوتے ہیں؟","آپ کس کے ساتھ سوتے ہیں؟"],e:"<span class='ar'>مَتَى تَنَامُ؟</span> کو مصدر کے ساتھ <span class='ar'>مَتَى نَوْمُكَ؟</span> بھی بولا جاتا ہے۔"},
tb55:{q:"کسٹم پر بیگ کھولنے کے بعد افسر کیا کہتا ہے اور پھر کیا؟",o:["<span class='ar'>أَقْفِلْهَا</span> پھر <span class='ar'>يُمْكِنُكَ أَنْ تَخْرُجَ</span>","<span class='ar'>اِفْتَحْهَا</span> پھر <span class='ar'>اِدْفَعْ</span>","<span class='ar'>اِحْجِزْ</span> پھر <span class='ar'>أَقْفِلْهَا</span>","<span class='ar'>اُدْخُلْ</span> پھر <span class='ar'>اِفْتَحْهَا</span>"],e:"سبق ۵: <span class='ar'>اِفْتَحِ الحَقِيبَةَ … أَقْفِلْهَا … يُمْكِنُكَ أَنْ تَخْرُجَ</span>۔"},
tb56:{q:"<span class='ar'>مُقْفِلُ الحَقِيبَةِ</span> میں دوسرے لفظ پر زیر کیوں آتی ہے؟",o:["اسم الفاعل اور اس کا مفعول مل کر اضافت بنا رہے ہیں","اس پر حرفِ جر آیا ہے","وہ مبتدا ہے","وہ ممنوع من الصرف ہے"],e:"یہ پیٹرن بول چال میں بہت آتا ہے: <span class='ar'>فَاتِحُ البَابِ، حَامِلُ الحَقِيبَةِ</span>۔"},
tb57:{q:"”مسافروں نے ندا سنی“ — فاعل جمع ہے، مگر فعل کیسا رہے گا؟",o:["فعل واحد ہی رہے گا: <span class='ar'>سَمِعَ المُسَافِرُونَ النِّدَاءَ</span>","فعل جمع ہوگا: <span class='ar'>سَمِعُوا المُسَافِرُونَ النِّدَاءَ</span>","فعل تثنیہ ہوگا","فعل حذف ہو جائے گا"],e:"فعل-فاعل ترتیب میں جب فاعل صراحتاً ذکر ہو تو فعل واحد رہتا ہے۔"},
tb58:{q:"سبق ۴ کے ایئرپورٹ اعلان میں فلائٹ اور گیٹ نمبر؟",o:["فلائٹ <span class='ar'>رَقْم ٩٠</span> · گیٹ <span class='ar'>رَقْم ٣</span>","فلائٹ <span class='ar'>رَقْم ٣</span> · گیٹ <span class='ar'>رَقْم ٩٠</span>","فلائٹ <span class='ar'>رَقْم ٩</span> · گیٹ <span class='ar'>رَقْم ١٠</span>","فلائٹ <span class='ar'>رَقْم ١٠</span> · گیٹ <span class='ar'>رَقْم ٩</span>"],e:"<span class='ar'>الخُطُوط العَرَبِيَّة السُّعُودِيَّة</span> نے فلائٹ ۹۰ کا اعلان کیا اور گیٹ نمبر ۳ بتایا۔"},
tb59:{q:"”میں اس (ادارہ) کو نہیں جانتا“ — صحیح ضمیر؟",o:["<span class='ar'>لا أَعْرِفُهَا</span>","<span class='ar'>لا أَعْرِفُهُ</span>","<span class='ar'>لا أَعْرِفُهُمْ</span>","<span class='ar'>لا أَعْرِفُهُنَّ</span>"],e:"تاء مربوطہ والی جگہیں (<span class='ar'>إِدَارَة، صَالَة، بَوَّابَة</span>) مؤنث ہیں ← <span class='ar'>ـهَا</span>۔"},
tb60:{q:"<span class='ar'>مِنْ أَيْنَ اسْتَخْرَجَ مَحْمُودٌ تَأْشِيرَةَ الخُرُوجِ؟</span> — صحیح جواب؟",o:["<span class='ar'>مِنْ وِزَارَةِ الدَّاخِلِيَّةِ</span>","<span class='ar'>مِنَ السَّفَارَةِ</span>","<span class='ar'>مِنَ المَطَارِ</span>","<span class='ar'>مِنْ مَكْتَبِ الحَجْزِ</span>"],e:"انٹری ویزا سفارت خانے کے موظف سے ملا، ایگزٹ ویزا <span class='ar'>وِزَارَة الدَّاخِلِيَّة</span> (وزارتِ داخلہ) سے۔"},

/* ---------- AL-QIRA'AH WAL-KITABAH ---------- */
qr1:{q:"<span class='ar'>طَبِيب</span> کی جمع؟",o:["<span class='ar'>أَطِبَّاء</span>","<span class='ar'>طَبِيبُون</span>","<span class='ar'>طُبُب</span>","<span class='ar'>طِبَاب</span>"],e:"<span class='ar'>طَبِيب – طَبِيبَان – أَطِبَّاء</span> = ڈاکٹر۔"},
qr2:{q:"<span class='ar'>كِتَاب</span> کی جمع؟",o:["<span class='ar'>كُتُب</span>","<span class='ar'>كِتَابَات</span>","<span class='ar'>أَكْتِبَة</span>","<span class='ar'>كَوَاتِب</span>"],e:"<span class='ar'>كِتَاب – كِتَابَان – كُتُب</span>۔"},
qr3:{q:"<span class='ar'>قَلَم</span> کی جمع؟",o:["<span class='ar'>أَقْلام</span>","<span class='ar'>قُلُم</span>","<span class='ar'>قَلَمَات</span>","<span class='ar'>قَوَالِم</span>"],e:"<span class='ar'>قَلَم – قَلَمَان – أَقْلام</span>۔"},
qr4:{q:"<span class='ar'>حَقِيبَة</span> کی جمع؟",o:["<span class='ar'>حَقَائِب</span>","<span class='ar'>حَقِيبَات</span>","<span class='ar'>حُقُب</span>","<span class='ar'>أَحْقَاب</span>"],e:"<span class='ar'>حَقِيبَة – حَقِيبَتَان – حَقَائِب</span> = بیگ۔"},
qr5:{q:"<span class='ar'>بِنْت</span> کی جمع؟",o:["<span class='ar'>بَنَات</span>","<span class='ar'>بُنُوت</span>","<span class='ar'>أَبْنَات</span>","<span class='ar'>بِنْتَات</span>"],e:"<span class='ar'>بِنْت – بِنْتَان – بَنَات</span>۔"},
qr6:{q:"<span class='ar'>صَحِيفَة</span> (اخبار) کی جمع؟",o:["<span class='ar'>صُحُف</span>","<span class='ar'>صَحَائِف</span>","<span class='ar'>صَحِيفَات</span>","<span class='ar'>أَصْحَاف</span>"],e:"<span class='ar'>صَحِيفَة – صَحِيفَتَان – صُحُف</span>۔"},
qr7:{q:"<span class='ar'>مَكْتَبَة</span> (لائبریری) کی جمع؟",o:["<span class='ar'>مَكْتَبَات</span>","<span class='ar'>مَكَاتِب</span>","<span class='ar'>كُتُب</span>","<span class='ar'>مَكْتُوبَات</span>"],e:"دھیان: <span class='ar'>مَكْتَبَة</span> (لائبریری) ← <span class='ar'>مَكْتَبَات</span>؛ مگر <span class='ar'>مَكْتَب</span> (میز/دفتر) ← <span class='ar'>مَكَاتِب</span>۔"},
qr8:{q:"<span class='ar'>كُرْسِيّ</span> کی جمع؟",o:["<span class='ar'>كَرَاسِيّ</span>","<span class='ar'>كُرْسِيَّات</span>","<span class='ar'>أَكْرَاس</span>","<span class='ar'>كَرَائِس</span>"],e:"<span class='ar'>كُرْسِيّ – كُرْسِيَّان – كَرَاسِيّ</span>۔"},
qr9:{q:"<span class='ar'>رِسَالَة</span> (خط) کی جمع؟",o:["<span class='ar'>رَسَائِل</span>","<span class='ar'>رِسَالات</span>","<span class='ar'>رُسُل</span>","<span class='ar'>أَرْسَال</span>"],e:"<span class='ar'>رِسَالَة – رِسَالَتَان – رَسَائِل</span>۔"},
qr10:{q:"<span class='ar'>مِلْعَقَة</span> (چمچ) کی جمع؟",o:["<span class='ar'>مَلاعِق</span>","<span class='ar'>مِلْعَقَات</span>","<span class='ar'>مَلْعُوقَات</span>","<span class='ar'>مَلاعِب</span>"],e:"<span class='ar'>مِلْعَقَة ← مَلاعِق</span>۔ یاد رکھیں <span class='ar'>مَلاعِب</span> = کھیل کے میدان۔"},
qr11:{q:"<span class='ar'>بَقَّال</span> کا مطلب؟",o:["پنساری / گروسر","درزی","باورچی","ڈاکٹر"],e:"<span class='ar'>بَقَّال – بَقَّالان – بَقَّالُون</span>؛ دکان کو <span class='ar'>بَقَّالَة</span> کہتے ہیں۔"},
qr12:{q:"<span class='ar'>خَيَّاط</span> کا مطلب؟",o:["درزی","باورچی","لوہار","مستری"],e:"سبق کا جملہ: <span class='ar'>أَيْنَ الخَيَّاطُ؟</span> — درزی کہاں ہے؟"},
qr13:{q:"<span class='ar'>طَبَّاخ</span> کا مطلب؟",o:["باورچی","درزی","پنساری","ڈرائیور"],e:"سبق کا جملہ: <span class='ar'>هَلْ أَنْتَ طَبَّاخٌ؟</span>"},
qr14:{q:"کوئی پوچھتا ہے <span class='ar'>مَا مِهْنَتُكَ؟</span> — وہ کیا جاننا چاہتا ہے؟",o:["آپ کا پیشہ کیا ہے؟","آپ کا نام کیا ہے؟","آپ کہاں رہتے ہیں؟","آپ کی عمر کیا ہے؟"],e:"<span class='ar'>مِهْنَة</span> = پیشہ (جمع <span class='ar'>مِهَن</span>)۔ جواب: <span class='ar'>أَنَا طَالِبٌ</span>۔"},
qr15:{q:"<span class='ar'>الحَدِيقَة</span> کا مطلب؟",o:["باغ","دیوار","کمرہ","چھت"],e:"<span class='ar'>الحَدِيقَةُ جَمِيلَةٌ</span> = باغ خوبصورت ہے۔ جمع <span class='ar'>حَدَائِق</span>۔"},
qr16:{q:"<span class='ar'>المِسَاحَة</span> کا مطلب (اس سبق میں)؟",o:["ربر / eraser","پیمانہ","جگہ","چابی"],e:"<span class='ar'>المِسَاحَةُ فِي الدُّرْجِ</span> = ربر دراز میں ہے۔"},
qr17:{q:"<span class='ar'>صُنْدُوق</span> کا مطلب؟",o:["ڈبہ / بکس","چابی","بستر","شیلف"],e:"<span class='ar'>الصُّنْدُوقُ فَارِغٌ</span> = ڈبہ خالی ہے۔ جمع <span class='ar'>صَنَادِيق</span>۔"},
qr18:{q:"معجم کے مطابق <span class='ar'>سَيَّارَةُ الأُجْرَةِ</span> کا مطلب؟",o:["ٹیکسی","ایمبولینس","بس","کرائے کا گھر"],e:"معجم کے اسم سیکشن سے۔"},
qr19:{q:"معجم کے مطابق <span class='ar'>أَمِينُ المَكْتَبَةِ</span> کا مطلب؟",o:["لائبریرین","لائبریری کا دروازہ","لائبریری کی چابی","کتاب کا نام"],e:"حرف ہمزہ کے سبق میں بھی یہ جملہ آیا ہے۔"},
qr20:{q:"”یہ کیا ہے؟“ پوچھنے کے لیے عربی جملہ؟",o:["<span class='ar'>مَا هَذَا؟</span>","<span class='ar'>مَنْ هَذَا؟</span>","<span class='ar'>أَيْنَ هَذَا؟</span>","<span class='ar'>كَيْفَ هَذَا؟</span>"],e:"<span class='ar'>مَا</span> چیزوں کے لیے، <span class='ar'>مَنْ</span> انسان کے لیے (کون)۔"},

qr30:{q:"<span class='ar'>كَتَبَ</span> کا امر؟",o:["<span class='ar'>اُكْتُبْ</span>","<span class='ar'>يَكْتُبْ</span>","<span class='ar'>كَاتِبْ</span>","<span class='ar'>كِتَابْ</span>"],e:"<span class='ar'>كَتَبَ – يَكْتُبُ – اُكْتُبْ</span> = لکھنا۔"},
qr31:{q:"<span class='ar'>ذَهَبَ</span> کا مضارع؟",o:["<span class='ar'>يَذْهَبُ</span>","<span class='ar'>يَذْهُبُ</span>","<span class='ar'>يُذْهِبُ</span>","<span class='ar'>يَذَهَّبُ</span>"],e:"<span class='ar'>ذَهَبَ – يَذْهَبُ – اِذْهَبْ</span> = جانا۔"},
qr32:{q:"<span class='ar'>اِشْتَرَى</span> کا امر؟",o:["<span class='ar'>اِشْتَرِ</span>","<span class='ar'>اِشْتَرَى</span>","<span class='ar'>اُشْتُرْ</span>","<span class='ar'>يَشْتَرِ</span>"],e:"<span class='ar'>اِشْتَرَى – يَشْتَرِي – اِشْتَرِ</span> = خریدنا (ناقص فعل)۔"},
qr33:{q:"<span class='ar'>قَرَأَ</span> کا امر؟",o:["<span class='ar'>اِقْرَأْ</span>","<span class='ar'>اُقْرُأْ</span>","<span class='ar'>يَقْرَأْ</span>","<span class='ar'>قَارِئْ</span>"],e:"<span class='ar'>قَرَأَ – يَقْرَأُ – اِقْرَأْ</span> = پڑھنا۔"},
qr34:{q:"”مجھے آدھا ریال دیجیے“ — صحیح جملہ؟",o:["<span class='ar'>أَعْطِنِي نِصْفَ رِيَالٍ</span>","<span class='ar'>أَعْطَى نِصْفَ رِيَالٍ</span>","<span class='ar'>اُعْطُنِي نِصْفَ رِيَالٍ</span>","<span class='ar'>يُعْطِنِي نِصْفَ رِيَالٍ</span>"],e:"<span class='ar'>أَعْطَى – يُعْطِي – أَعْطِ</span> = دینا؛ <span class='ar'>ـنِي</span> = مجھے۔"},
qr35:{q:"معجم کے مطابق <span class='ar'>حَجَزَ</span> کا مصدر؟",o:["<span class='ar'>حَجْز</span>","<span class='ar'>حِجَازَة</span>","<span class='ar'>مَحْجُوز</span>","<span class='ar'>حُجُوز</span>"],e:"<span class='ar'>حَجَزَ – يَحْجُزُ – اُحْجُزْ – حَجْز</span> = بک کرنا۔"},
qr36:{q:"معجم کے مطابق <span class='ar'>دَرَسَ</span> کا مصدر؟",o:["<span class='ar'>دِرَاسَة</span>","<span class='ar'>دَرْس</span>","<span class='ar'>مَدْرَسَة</span>","<span class='ar'>تَدْرِيس</span>"],e:"<span class='ar'>دَرَسَ – يَدْرُسُ – اُدْرُسْ – دِرَاسَة</span> = پڑھنا۔"},
qr37:{q:"معجم کے مطابق <span class='ar'>حَصَلَ</span> کا مصدر؟",o:["<span class='ar'>حُصُول</span>","<span class='ar'>حَاصِل</span>","<span class='ar'>تَحْصِيل</span>","<span class='ar'>حَصْل</span>"],e:"<span class='ar'>حَصَلَ – يَحْصُلُ – حُصُول</span> = حاصل کرنا۔"},
qr38:{q:"معجم کے مطابق <span class='ar'>اِسْتَخْرَجَ</span> کا مصدر؟",o:["<span class='ar'>اِسْتِخْرَاج</span>","<span class='ar'>خُرُوج</span>","<span class='ar'>إِخْرَاج</span>","<span class='ar'>مُسْتَخْرَج</span>"],e:"<span class='ar'>اِسْتَخْرَجَ – يَسْتَخْرِجُ – اِسْتَخْرِجْ – اِسْتِخْرَاج</span>۔"},
qr39:{q:"<span class='ar'>بَاعَ</span> کا مضارع اور امر؟",o:["<span class='ar'>يَبِيعُ · بِعْ</span>","<span class='ar'>يَبُوعُ · بُعْ</span>","<span class='ar'>يَبْعُ · اِبْعَعْ</span>","<span class='ar'>يُبَاعُ · بَاعْ</span>"],e:"<span class='ar'>بَاعَ – يَبِيعُ – بِعْ</span> = بیچنا۔ جیسے <span class='ar'>بَاعَ البَقَّالُ البَيْضَ</span>۔"},
qr40:{q:"<span class='ar'>نَامَ</span> اور <span class='ar'>زَارَ</span> کے امر؟",o:["<span class='ar'>نَمْ</span> اور <span class='ar'>زُرْ</span>","<span class='ar'>نَامْ</span> اور <span class='ar'>زَارْ</span>","<span class='ar'>اِنَمْ</span> اور <span class='ar'>اِزْرْ</span>","<span class='ar'>نِمْ</span> اور <span class='ar'>زِرْ</span>"],e:"<span class='ar'>نَامَ – يَنَامُ – نَمْ</span> (سونا)؛ <span class='ar'>زَارَ – يَزُورُ – زُرْ</span> (زیارت کرنا)۔"},
qr41:{q:"<span class='ar'>رَأَى</span> کا مضارع؟",o:["<span class='ar'>يَرَى</span>","<span class='ar'>يَرْأَى</span>","<span class='ar'>يَرْئِي</span>","<span class='ar'>يُرِي</span>"],e:"<span class='ar'>رَأَى – يَرَى</span> = دیکھنا۔ جیسے <span class='ar'>رَأَيْتُ طِفْلاً</span>۔"},
qr42:{q:"<span class='ar'>طَبَخَ</span> کا امر؟",o:["<span class='ar'>اُطْبُخْ</span>","<span class='ar'>اِطْبَخْ</span>","<span class='ar'>طَبِّخْ</span>","<span class='ar'>يَطْبُخْ</span>"],e:"<span class='ar'>طَبَخَ – يَطْبُخُ – اُطْبُخْ</span>۔ جیسے <span class='ar'>زَيْنَبُ تَطْبُخُ الطَّعَامَ</span>۔"},
qr43:{q:"<span class='ar'>حَفِظَ</span> کا امر؟",o:["<span class='ar'>اِحْفَظْ</span>","<span class='ar'>اُحْفُظْ</span>","<span class='ar'>حَافِظْ</span>","<span class='ar'>يَحْفَظْ</span>"],e:"<span class='ar'>حَفِظَ – يَحْفَظُ – اِحْفَظْ</span> = یاد کرنا۔"},
qr44:{q:"<span class='ar'>شَاهَدَ</span> کا مطلب اور مضارع؟",o:["دیکھنا / مشاہدہ کرنا · <span class='ar'>يُشَاهِدُ</span>","سننا · <span class='ar'>يَسْمَعُ</span>","گواہی دینا · <span class='ar'>يَشْهَدُ</span>","حاضر ہونا · <span class='ar'>يَحْضُرُ</span>"],e:"<span class='ar'>شَاهَدَ – يُشَاهِدُ – شَاهِدْ</span>۔"},
qr45:{q:"”کھانا کھانے کا وقت ہو گیا“ — سبق کا جملہ؟",o:["<span class='ar'>حَانَ وَقْتُ الغَدَاءِ</span>","<span class='ar'>ذَهَبَ وَقْتُ الغَدَاءِ</span>","<span class='ar'>كَانَ وَقْتُ الغَدَاءِ</span>","<span class='ar'>بَلَغَ وَقْتُ الغَدَاءِ</span>"],e:"<span class='ar'>حَانَ – يَحِينُ – حِنْ</span> = وقت ہو جانا؛ <span class='ar'>غَدَاء</span> = دوپہر کا کھانا۔"},
qr46:{q:"”احمد سات سال کا ہو گیا“ — سبق کا جملہ؟",o:["<span class='ar'>بَلَغَ أَحْمَدُ السَّابِعَةَ</span>","<span class='ar'>حَانَ أَحْمَدُ السَّابِعَةَ</span>","<span class='ar'>وَصَلَ أَحْمَدُ السَّابِعَةَ</span>","<span class='ar'>كَانَ أَحْمَدُ السَّابِعَةَ</span>"],e:"<span class='ar'>بَلَغَ – يَبْلُغُ – اِبْلُغْ</span> = پہنچنا / عمر کو پہنچنا۔"},
qr47:{q:"<span class='ar'>سُؤَال</span> کی جمع اور ”پوچھنا“ کا فعل؟",o:["<span class='ar'>أَسْئِلَة</span> · <span class='ar'>سَأَلَ – يَسْأَلُ – اِسْأَلْ</span>","<span class='ar'>سُؤَالات</span> · <span class='ar'>سَأَلَ – يُسَائِلُ</span>","<span class='ar'>مَسَائِل</span> · <span class='ar'>سَاءَلَ – يُسَاءِلُ</span>","<span class='ar'>سَوَائِل</span> · <span class='ar'>سَالَ – يَسِيلُ</span>"],e:"<span class='ar'>سُؤَال – سُؤَالان – أَسْئِلَة</span>۔"},

qr55:{q:"بولتے وقت <span class='ar'>الدَّرْسُ صَعْبٌ</span> میں ”ال“ کا لام پڑھا جائے گا یا نہیں؟",o:["نہیں — <span class='ar'>د</span> شمسی حرف ہے، لام ادغام ہو جاتا ہے (الدَّرسُ)","ہاں — لام صاف پڑھیں گے","لام کی جگہ نون پڑھیں گے","لام پر سکون آئے گا"],e:"شمسی حروف پر لام نہیں پڑھا جاتا (الشَّمسُ)، قمری پر پڑھا جاتا ہے (الکِتابُ)۔"},
qr56:{q:"<span class='ar'>الشَّمْسُ سَاطِعَةٌ</span> کا مطلب؟",o:["سورج چمک رہا ہے","سورج ڈوب گیا","سورج نکل رہا ہے","سورج گرم ہے"],e:"<span class='ar'>سَاطِعَة</span> = چمکتی ہوئی۔"},
qr57:{q:"معجم کے مطابق حرف <span class='ar'>رُبَّ</span> کا مطلب؟",o:["شاید / بہت سے (حرفِ جر)","رب / پالنے والا","چوتھائی","پھر"],e:"معجم کے حرف سیکشن میں: <span class='ar'>رُبَّ</span> — شاید / بہت سے۔"},
qr58:{q:"معجم کے مطابق <span class='ar'>إِذَا</span> اور <span class='ar'>إِذَنْ</span> کے معنی؟",o:["<span class='ar'>إِذَا</span> = جب · <span class='ar'>إِذَنْ</span> = پھر / تب تو","<span class='ar'>إِذَا</span> = پھر · <span class='ar'>إِذَنْ</span> = جب","دونوں کا مطلب ”اگر“ ہے","دونوں کا مطلب ”اجازت“ ہے"],e:"معجم کے حرف سیکشن سے۔"},
qr59:{q:"معجم کے مطابق حرف <span class='ar'>أَمَّا</span> کا مطلب؟",o:["رہا یہ کہ / جہاں تک… کا تعلق ہے","ماں","کیا","اگر"],e:"اسی لیے تعبیر سبق ۱ میں <span class='ar'>أَمَّا رَشِيدٌ فَـ…</span> آتا ہے — ”رہے رشید، تو وہ…“"},
qr60:{q:"معجم کے مطابق <span class='ar'>لَدَى</span> اور <span class='ar'>عِنْدَ</span> کے معنی؟",o:["دونوں کا مطلب ”پاس“ ہے","<span class='ar'>لَدَى</span> = لیے، <span class='ar'>عِنْدَ</span> = سے","<span class='ar'>لَدَى</span> = تک، <span class='ar'>عِنْدَ</span> = پر","<span class='ar'>لَدَى</span> = جب، <span class='ar'>عِنْدَ</span> = کہاں"],e:"معجم: <span class='ar'>لَدَى</span> = پاس؛ <span class='ar'>عِنْدَ</span> = پاس / قریب۔"},
qr61:{q:"کسی کو بلانے کے لیے <span class='ar'>هَيَّا</span> کب بولیں گے؟",o:["جب ”آؤ / چلو“ کہنا ہو","جب ”ہرگز نہیں“ کہنا ہو","جب ”شکریہ“ کہنا ہو","جب ”معاف کیجیے“ کہنا ہو"],e:"معجم (حرف): <span class='ar'>هَيَّا</span> = آؤ/چلو۔ اس کے مقابلے میں <span class='ar'>كَلَّا</span> = ہرگز نہیں۔"},
qr62:{q:"معجم کے مطابق <span class='ar'>كَلَّا</span>، <span class='ar'>كَمَا</span> اور <span class='ar'>كُلّ</span> کے معنی ترتیب سے؟",o:["ہرگز نہیں · جیسا کہ · سب","سب · ہرگز نہیں · جیسا کہ","جیسا کہ · سب · ہرگز نہیں","کیا · کیسے · کتنا"],e:"تینوں ملتے جلتے لگتے ہیں مگر معنی الگ — زبانی میں غلطی سے بچنے کے لیے یاد رکھیں۔"},
qr63:{q:"<span class='ar'>عَدَّ البَقَّالُ النُّقُودَ</span> کا مطلب اور <span class='ar'>عَدَّ</span> کا امر؟",o:["پنساری نے پیسے گنے · امر: <span class='ar'>عُدَّ</span>","پنساری نے پیسے دیے · امر: <span class='ar'>اُعْدُدْ</span>","پنساری نے پیسے لیے · امر: <span class='ar'>عَادِدْ</span>","پنساری نے پیسے رکھے · امر: <span class='ar'>عِدَّ</span>"],e:"<span class='ar'>عَدَّ – يَعُدُّ – عُدَّ</span> = گننا؛ <span class='ar'>نُقُود</span> = پیسے۔"},

qr65:{q:"حرف ثاء کے سبق کے مطابق <span class='ar'>يَثْرِب</span> کس شہر کا اسلام سے پہلے کا نام تھا؟",o:["المدینۃ المنورہ","مکہ مکرمہ","طائف","خیبر"],e:"<span class='ar'>يَثْرِبُ اسْمُ المَدِينَةِ المُنَوَّرَةِ قَبْلَ الإِسْلامِ</span>۔"},
qr66:{q:"<span class='ar'>تَاهَ أَحْمَدُ عَنِ السَّكَنِ</span> کا مطلب؟",o:["احمد رہائش گاہ کا راستہ بھول گیا","احمد گھر سے نکل گیا","احمد گھر پہنچ گیا","احمد گھر میں سو گیا"],e:"<span class='ar'>تَاهَ – يَتِيهُ – تِهْ</span> = کھو جانا / بھٹکنا۔"},

{n:11, t:"Baitul Khala mein Dakhil Hone ki Dua", tu:"بیت الخلا میں داخل ہونے کی دعا",

{n:15, t:"Safai aur Peene ke Aadaab", tu:"صفائی اور پینے کے آداب",

tl:"\u02BFAn Ab\u012B Qat\u0101data al-\u1E24\u0101rithi bni Rib\u02BFiyyi al-An\u1E63\u0101riyyi ra\u1E0Diyall\u0101hu \u02BFanhu anna an-Nabiyya \u1E63allall\u0101hu \u02BFalayhi wa sallama q\u0101la: L\u0101 yumsikanna a\u1E25adukum dhakarahu bi yam\u012Bnih\u012B wa huwa yab\u016Blu, wa l\u0101 yatamassa\u1E25 minal khal\u0101\u02BEi bi yam\u012Bnih\u012B, wa l\u0101 yatanaffas fil in\u0101\u02BEi.",
en:"The Prophet \u0635 said: \u201cNone of you should hold his private part with his right hand while urinating, nor should he clean himself after using the toilet with his right hand, nor should he breathe into the drinking vessel.\u201d",
ur:"Nabi \u0635 ne farmaya: \u201cTum mein se koi bhi apni sharamgah daayein haath se na pakde jab wo peshab kar raha ho, aur na daayein haath se istinja kare, aur na (peene ke) bartan mein saans le.\u201d",
uru:"نبی ﷺ نے فرمایا: ”تم میں سے کوئی بھی اپنی شرمگاہ دائیں ہاتھ سے نہ پکڑے جب وہ پیشاب کر رہا ہو، اور نہ دائیں ہاتھ سے استنجا کرے، اور نہ (پینے کے) برتن میں سانس لے۔“",
rawi:"Hazrat Abu Qatadah al-Harith bin Rib'i al-Ansari (RA)",

{n:17, t:"Miswaak ki Fazilat", tu:"مسواک کی فضیلت",
ar:"عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ عَنِ النَّبِيِّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ قَالَ: لَوْلَا أَنْ أَشُقَّ عَلَى أُمَّتِي لَأَمَرْتُهُمْ بِالسِّوَاكِ مَعَ كُلِّ وُضُوءٍ عِنْدَ كُلِّ صَلَاةٍ",
tl:"\u02BFAn Ab\u012B Hurayrata ra\u1E0Diyall\u0101hu \u02BFanhu \u02BFanin Nabiyyi \u1E63allall\u0101hu \u02BFalayhi wa sallama q\u0101la: Lawl\u0101 an ashuqqa \u02BFal\u0101 ummat\u012B la-amartuhum bis-siw\u0101ki ma\u02BFa kulli wu\u1E0D\u016B\u02BEin \u02BFinda kulli \u1E63al\u0101tin.",
en:"The Prophet \u0635 said: \u201cWere it not that I would cause hardship upon my Ummah, I would have commanded them to use the Siwak with every ablution at the time of every prayer.\u201d",
ur:"Nabi \u0635 ne farmaya: \u201cAgar mujhe apni ummat par mashaqqat ka andesha na hota to main unhein har namaz ke waqt wudu ke sath miswaak karne ka hukm deta.\u201d",
uru:"نبی ﷺ نے فرمایا: ”اگر مجھے اپنی امت پر مشقت کا اندیشہ نہ ہوتا تو میں انہیں ہر نماز کے وقت وضو کے ساتھ مسواک کرنے کا حکم دیتا۔“",
rawi:"Hazrat Abu Hurairah Abdur Rahman bin Sakhr ad-Dawsi (RA)",
rawiNote:"Sabse zyada ahadees riwayat karne wale Sahabi \u2014 kul 5374 marwiyaat. 7 Hijri mein Khaibar ke mauqe par Islam laaye aur taqreeban 3 saal Nabi \u0635 ki sohbat mein rahe. Wafat 59 Hijri, umar 78 saal. \u201cAbu Hurairah\u201d kunniyat billi (hirrah) ki wajah se padi.",
key:[["لَوْلَا","Lawla \u2014 agar na hota"],["أَشُقَّ","Ashuqqa \u2014 main mashaqqat mein daaloon"],["أُمَّتِي","Ummati \u2014 meri ummat"],["السِّوَاك","As-Siwaak \u2014 miswaak (lughatan: ragadna)"]],
src:"Bukhari: Kitab al-Jumu'ah \u00b7 Muslim: Kitab at-Taharah \u00b7 Muttafaqun Alayhi",

{n:21, t:"Mozon par Masah", tu:"موزوں پر مسح",
ar:"عَنِ الْمُغِيرَةِ بْنِ شُعْبَةَ رَضِيَ اللهُ عَنْهُ قَالَ: كُنْتُ مَعَ النَّبِيِّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ فِي سَفَرٍ فَأَهْوَيْتُ لِأَنْزِعَ خُفَّيْهِ فَقَالَ: دَعْهُمَا فَإِنِّي أَدْخَلْتُهُمَا طَاهِرَتَيْنِ، فَمَسَحَ عَلَيْهِمَا",
tl:"\u02BFAn al-Mugh\u012Brati bni Shu\u02BFbata ra\u1E0Diyall\u0101hu \u02BFanhu q\u0101la: Kuntu ma\u02BFa an-Nabiyyi \u1E63allall\u0101hu \u02BFalayhi wa sallama f\u012B safarin, fa-ahwaytu li-anzi\u02BFa khuffayhi, fa-q\u0101la: Da\u02BFhum\u0101, fa-inn\u012B adkhaltuhum\u0101 \u1E6D\u0101hiratayni, fa-masa\u1E25a \u02BFalayhim\u0101.",
en:"Al-Mughirah said: I was with the Prophet \u0635 on a journey. I bent down to remove his leather socks, so he said: \u201cLeave them, for indeed I put my feet into them while they were in a state of purity.\u201d So he wiped over them.",
ur:"Mughirah (RA) farmate hain: Main ek safar mein Nabi \u0635 ke hamrah tha. Main jhuka taake Aap ke mozay utaroon. Aap ne farmaya: \u201cInhein rehne dijiye, main ne pak halat mein paanv in mein dakhil kiye hain.\u201d To Aap ne in par masah kiya.",
uru:"مغیرہ رضی اللہ عنہ فرماتے ہیں: میں ایک سفر میں نبی ﷺ کے ہمراہ تھا۔ میں جھکا تاکہ آپ کے موزے اتاروں۔ آپ نے فرمایا: ”انہیں رہنے دیجیے، میں نے پاک حالت میں پاؤں ان میں داخل کیے ہیں۔“ تو آپ نے ان پر مسح کیا۔",
rawi:"Hazrat Al-Mughirah bin Shu'bah ath-Thaqafi (RA)",
rawiNote:"Kunniyat Abu Isa. Ghazwa-e-Khandaq ke saal Islam qabool kiya. 136 ahadees ke rawi. Aqlmandi aur hoshiyari ki misal samjhe jate the; Kufa aur Basra ki wilayat bhi ki. Wafat 50 Hijri mein ta'oon se hui.",

src:"Bukhari: Kitab al-Wudu \u00b7 Muslim: Kitab at-Taharah \u00b7 Muttafaqun Alayhi",
fawaid:["Mozon par masah karna masnoon hai \u2014 ba-shart ye ke wo wudu kar ke pehne gaye hon","Masah mozay ki baalai (ooper wali) jaanib kiya jaye, neechli jaanib nahi","Ulama, mashaikh aur buzurgon ki khidmat mustahab amal hai"]},

{n:22, t:"Safar mein Peshab aur Mozon par Masah", tu:"سفر میں پیشاب اور موزوں پر مسح",
ar:"عَنْ حُذَيْفَةَ بْنِ الْيَمَانِ رَضِيَ اللهُ عَنْهُمَا قَالَ: كُنْتُ مَعَ النَّبِيِّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ فِي سَفَرٍ فَبَالَ وَتَوَضَّأَ وَمَسَحَ عَلَى خُفَّيْهِ مُخْتَصَرًا",
tl:"\u02BFAn \u1E24udhayfata bnil Yam\u0101ni ra\u1E0Diyall\u0101hu \u02BFanhum\u0101 q\u0101la: Kuntu ma\u02BFa an-Nabiyyi \u1E63allall\u0101hu \u02BFalayhi wa sallama f\u012B safarin, fa-b\u0101la wa tawa\u1E0D\u1E0Da\u02BEa wa masa\u1E25a \u02BFal\u0101 khuffayhi mukhta\u1E63aran.",
en:"Hudhaifah said: I was with the Prophet \u0635 on a journey. He urinated, then performed wudu, and wiped over his leather socks. (Narrated concisely.)",
ur:"Hudhaifah (RA) farmate hain: Main Nabi \u0635 ke sath ek safar mein tha. Aap ne peshab kiya, phir wudu kiya aur apne mozon par masah kiya. (Ye hadees ikhtisaar ke sath bayan ki gayi hai.)",
uru:"حذیفہ رضی اللہ عنہ فرماتے ہیں: میں نبی ﷺ کے ساتھ ایک سفر میں تھا۔ آپ نے پیشاب کیا، پھر وضو کیا اور اپنے موزوں پر مسح کیا۔",
rawi:"Hazrat Hudhaifah bin al-Yaman (RA)",
rawiNote:"Kunniyat Abu Abdullah. Sahib-e-Sirr-e-Rasool \u2014 Nabi \u0635 ne unhein munafiqeen ke naam batlaye the. Unke walid Yaman (RA) bhi Sahabi the jo Uhud mein ghalat-fahmi se shaheed ho gaye. Sahihayn mein unki 37 ahadees hain, kul taqreeban 220. Wafat 36 Hijri.",
key:[["فِي سَفَرٍ","Fi safarin \u2014 ek safar mein"],["فَبَالَ","Fa-bala \u2014 to Aap ne peshab kiya"],["تَوَضَّأَ","Tawadda'a \u2014 wudu kiya"],["مُخْتَصَرًا","Mukhtasaran \u2014 ikhtisaar ke sath"]],
src:"Bukhari: Kitab al-Wudu \u00b7 Muslim: Kitab at-Taharah \u00b7 Muttafaqun Alayhi",
fawaid:["Wudu ke waqt mozon par masah karna jaiz hai \u2014 ba-shart ye ke mozay ba-wudu pehne gaye hon","Musafir 3 din 3 raat aur muqeem 1 din 1 raat masah kar sakta hai \u2014 ba-shart ye ke is dauran ghusl wajib na hua ho","Peshab ke baad wudu karte waqt mozon par masah jaiz aur durust hai","Har hadath-e-asghar se mozon par masah saabit hai"]},

{n:24, t:"Shakk mein Wudu Nahi Tootega", tu:"شک میں وضو نہیں ٹوٹے گا",
ar:"عَنْ عَبَّادِ بْنِ تَمِيمٍ عَنْ عَبْدِ اللهِ بْنِ زَيْدِ بْنِ عَاصِمٍ الْمَازِنِيِّ رَضِيَ اللهُ عَنْهُ قَالَ: شُكِيَ إِلَى النَّبِيِّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ الرَّجُلُ يُخَيَّلُ إِلَيْهِ أَنَّهُ يَجِدُ الشَّيْءَ فِي الصَّلَاةِ، فَقَالَ: لَا يَنْصَرِفْ حَتَّى يَسْمَعَ صَوْتًا أَوْ يَجِدَ رِيحًا",
tl:"\u02BFAn \u02BFAbb\u0101di bni Tam\u012Bmin \u02BFan \u02BFAbdill\u0101hi bni Zaydi bni \u02BF\u0100\u1E63imin al-M\u0101ziniyyi ra\u1E0Diyall\u0101hu \u02BFanhu q\u0101la: Shukiya ilan Nabiyyi \u1E63allall\u0101hu \u02BFalayhi wa sallama ar-rajulu yukhayyalu ilayhi annahu yajidu ash-shay\u02BEa fi\u1E63-\u1E63al\u0101ti, fa-q\u0101la: L\u0101 yan\u1E63arif \u1E25att\u0101 yasma\u02BFa \u1E63awtan aw yajida r\u012B\u1E25an.",
en:"A complaint was made to the Prophet \u0635 about a man who imagines that he feels something during the prayer. He \u0635 said: \u201cHe should not leave the prayer until he hears a sound or perceives a smell.\u201d",
ur:"Nabi \u0635 ki khidmat mein shikayat ki gayi ke ek shakhs ko khayal aata hai ke wo namaz ke dauran kuch mehsoos karta hai. To Aap \u0635 ne farmaya: \u201cWo na phire yahan tak ke awaz sune ya boo mehsoos kare.\u201d",
uru:"نبی ﷺ کی خدمت میں شکایت کی گئی کہ ایک شخص کو خیال آتا ہے کہ وہ نماز کے دوران کچھ محسوس کرتا ہے۔ تو آپ ﷺ نے فرمایا: ”وہ نہ پھرے یہاں تک کہ آواز سنے یا بو محسوس کرے۔“",
rawi:"Hazrat Abdullah bin Zaid bin Aasim al-Mazini (RA)",
rawiNote:"Ansari Sahabi. Unhi se Nabi \u0635 ke wudu ka mukammal tareeqa bhi marwi hai. Unse Abbad bin Tameem (unke bhatije) riwayat karte hain. Yaum-ul-Harrah mein shaheed hue.",
key:[["شُكِيَ","Shukiya \u2014 shikayat ki gayi"],["يُخَيَّلُ إِلَيْهِ","Yukhayyalu ilayhi \u2014 use khayal aata hai / gumaan hota hai"],["لَا يَنْصَرِفْ","La yansarif \u2014 wo (namaz se) na phire"],["صَوْتًا","Sawtan \u2014 awaz"],["رِيحًا","Reehan \u2014 boo"]],
src:"Bukhari: Kitab al-Wudu \u00b7 Muslim: Kitab al-Haidh \u00b7 Muttafaqun Alayhi",
fawaid:["Shakk ki bunyaad par na wudu tootega aur na namaz baatil hogi \u2014 Yaqeen shakk se zail nahi hota","Bila sabab namaz ko todna shar'an mamnoo hai","Hawa kharij hone se wudu toot jata hai \u2014 chahe awaz se ho ya baghair awaz ke","Awaz ya boo pet se hawa kharij hone ki alamatein hain"]},

{n:28, t:"Paanch Fitri Cheezein", tu:"پانچ فطری چیزیں",
ar:"عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: سَمِعْتُ رَسُولَ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ يَقُولُ: الْفِطْرَةُ خَمْسٌ: الْخِتَانُ، وَالْاسْتِحْدَادُ، وَقَصُّ الشَّارِبِ، وَتَقْلِيمُ الْأَظْفَارِ، وَنَتْفُ الْإِبِطِ",
tl:"\u02BFAn Ab\u012B Hurayrata ra\u1E0Diyall\u0101hu \u02BFanhu q\u0101la: Sami\u02BFtu Ras\u016Blall\u0101hi \u1E63allall\u0101hu \u02BFalayhi wa sallama yaq\u016Blu: Al-fi\u1E6Dratu khamsun: al-khit\u0101nu, wal-isti\u1E25d\u0101du, wa qa\u1E63\u1E63ush-sh\u0101ribi, wa taql\u012Bmul a\u1E93f\u0101ri, wa natful ibi\u1E6Di.",
en:"The Messenger of Allah \u0635 said: \u201cThe Fitrah is five things: circumcision, shaving the pubic hair, trimming the moustache, clipping the nails, and plucking the armpit hair.\u201d",
ur:"Rasoolullah \u0635 ne farmaya: \u201cPaanch cheezein fitri hain: (1) khatna karna, (2) zer-e-naaf baal saaf karna, (3) moonchein katna, (4) nakhun katna, aur (5) baghlon ke baal ukhadna.\u201d",
uru:"رسول اللہ ﷺ نے فرمایا: ”پانچ چیزیں فطری ہیں: (۱) ختنہ کرنا، (۲) زیرِ ناف بال صاف کرنا، (۳) مونچھیں کاٹنا، (۴) ناخن کاٹنا، اور (۵) بغلوں کے بال اکھاڑنا۔“",
rawi:"Hazrat Abu Hurairah (RA)",
rawiNote:"Sabse zyada ahadees ke rawi (5374). Nabi \u0635 ne unki quwwat-e-hifza ke liye khaas dua farmayi thi, jiske baad wo kabhi koi hadees na bhoole. Imam Shafi'i ne unhein apne daur ka sabse bada hafiz-e-hadees qarar diya.",
key:[["الْفِطْرَة","Al-Fitrah \u2014 fitri / qudrati taqaza"],["الْخِتَان","Al-Khitaan \u2014 khatna"],["الْاسْتِحْدَاد","Al-Istihdaad \u2014 zer-e-naaf baal saaf karna (ustra istemal karna)"],["قَصُّ الشَّارِب","Qass ash-Shaarib \u2014 moonchein katna"],["تَقْلِيمُ الْأَظْفَار","Taqleem al-Azfaar \u2014 nakhun katna"],["نَتْفُ الْإِبِط","Natf al-Ibit \u2014 baghal ke baal ukhadna"]],
src:"Bukhari: Kitab al-Libas #5550 \u00b7 Muslim: Kitab at-Taharah #257 \u00b7 Muttafaqun Alayhi",
fawaid:["Deen-e-Islam nazafat, pakizgi aur taharat ikhtiyar karne ki talqeen karta hai","Nakhun badhana fitrat ke munaafi amal hai","Zer-e-naaf baalon ki safai ka ehtimam har Musalman ke liye zaroori hai","Badi badi moonchein rakhna ghair-fitri amal hai \u2014 aatish-parast iske aadi the","Baghal ke baal ukhadna fitrat mein hai; kisi sahih hadees mein moondne ka zikr nahi"]},

{n:33, t:"Aurat par Ghusl ka Hukm (Ihtilaam ke baad)", tu:"عورت پر غسل کا حکم (احتلام کے بعد)",
ar:"عَنْ أُمِّ سَلَمَةَ رَضِيَ اللهُ عَنْهَا زَوْجِ النَّبِيِّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ قَالَتْ: جَاءَتْ أُمُّ سُلَيْمٍ امْرَأَةُ أَبِي طَلْحَةَ إِلَى رَسُولِ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ فَقَالَتْ: يَا رَسُولَ اللهِ، إِنَّ اللهَ لَا يَسْتَحْيِي مِنَ الْحَقِّ، فَهَلْ عَلَى الْمَرْأَةِ مِنْ غُسْلٍ إِذَا هِيَ احْتَلَمَتْ؟ فَقَالَ رَسُولُ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: نَعَمْ، إِذَا رَأَتِ الْمَاءَ",
tl:"\u02BFAn Ummi Salamata ra\u1E0Diyall\u0101hu \u02BFanh\u0101 zawjin Nabiyyi \u1E63allall\u0101hu \u02BFalayhi wa sallama q\u0101lat: J\u0101\u02BEat Ummu Sulaymin imra\u02BEatu Ab\u012B \u1E6Cal\u1E25ata il\u0101 Ras\u016Blill\u0101hi \u1E63allall\u0101hu \u02BFalayhi wa sallama fa-q\u0101lat: Y\u0101 Ras\u016Blall\u0101h! Innall\u0101ha l\u0101 yasta\u1E25y\u012B minal \u1E25aqqi, fa-hal \u02BFalal mar\u02BEati min ghuslin idh\u0101 hiya i\u1E25talamat? Fa-q\u0101la Ras\u016Bull\u0101hi \u1E63allall\u0101hu \u02BFalayhi wa sallama: Na\u02BFam, idh\u0101 ra\u02BEatil m\u0101\u02BEa.",
en:"Umm Sulaim, the wife of Abu Talhah, came to the Messenger of Allah \u0635 and said: \u201cO Messenger of Allah! Indeed Allah does not shy away from the truth. Is ghusl obligatory upon a woman if she has a wet dream?\u201d He \u0635 said: \u201cYes, when she sees the water (i.e. the discharge).\u201d",
ur:"Umm Sulaim (RA), Abu Talhah (RA) ki biwi, Nabi \u0635 ke paas aayin aur kaha: \u201cAe Allah ke Rasool! Yaqeenan Allah haq se sharm nahi farmata; kya aurat par bhi ghusl lazim hai jab use ihtilaam ho jaye?\u201d Aap \u0635 ne farmaya: \u201cHaan, jab wo paani dekhe.\u201d",
uru:"ام سلیم رضی اللہ عنہا نبی ﷺ کے پاس آئیں اور کہا: ”اے اللہ کے رسول! یقیناً اللہ حق سے شرم نہیں فرماتا؛ کیا عورت پر بھی غسل لازم ہے جب اسے احتلام ہو جائے؟“ آپ ﷺ نے فرمایا: ”ہاں، جب وہ پانی دیکھے۔“",
rawi:"Umm-ul-Mu'mineen Sayyidah Umm Salamah Hind bint Abi Umayyah (RA)",
rawiNote:"Nabi \u0635 ki zawja mutahhara. Sahaba mein bade martabe ki aalima aur faqeeha khatoon. Habsha aur Madinah dono hijraton mein shareek rahin. Sab se aakhir mein wafat pane wali Ummahat-ul-Mu'mineen hain.",
key:[["لَا يَسْتَحْيِي","La yastahyi \u2014 sharm nahi farmata"],["الْحَقّ","Al-Haqq \u2014 haq baat / sachai"],["احْتَلَمَتْ","Ihtalamat \u2014 use ihtilaam ho jaye"],["رَأَتِ الْمَاءَ","Ra'at al-Maa \u2014 wo paani (mani) dekhe"]],
src:"Bukhari: Kitab al-Ghusl \u00b7 Muslim: Kitab al-Haidh \u00b7 Muttafaqun Alayhi",
fawaid:["Aurat ko ihtilaam aa jaye aur wo paani (mani) dekhe to us par ghusl wajib ho jata hai","Aurat ko bhi isi tarah inzaal hota hai jis tarah mard ko","Sharm-o-haya ilm ke husool mein rukawat nahi honi chahiye","Guftagu ka aaghaz aise andaz se ho ke sunne wale par nagawar asar na pade","Haya Allah ki sifat-e-aaliya mein se ek sifat hai, jaisa Uski shaan ke laiq hai"]},

{n:39, t:"Nabi \u0635 ko Ata ki gayi Paanch Khaas Cheezein", tu:"نبی ﷺ کو عطا کی گئی پانچ خاص چیزیں",
ar:"عَنْ جَابِرِ بْنِ عَبْدِ اللهِ رَضِيَ اللهُ عَنْهُمَا أَنَّ النَّبِيَّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ قَالَ: أُعْطِيتُ خَمْسًا لَمْ يُعْطَهُنَّ أَحَدٌ مِنَ الْأَنْبِيَاءِ قَبْلِي: نُصِرْتُ بِالرُّعْبِ مَسِيرَةَ شَهْرٍ، وَجُعِلَتْ لِيَ الْأَرْضُ مَسْجِدًا وَطَهُورًا فَأَيُّمَا رَجُلٍ مِنْ أُمَّتِي أَدْرَكَتْهُ الصَّلَاةُ فَلْيُصَلِّ، وَأُحِلَّتْ لِيَ الْمَغَانِمُ وَلَمْ تَحِلَّ لِأَحَدٍ قَبْلِي، وَأُعْطِيتُ الشَّفَاعَةَ، وَكَانَ النَّبِيُّ يُبْعَثُ إِلَى قَوْمِهِ خَاصَّةً وَبُعِثْتُ إِلَى النَّاسِ عَامَّةً",
tl:"\u02BFAn J\u0101biri bni \u02BFAbdill\u0101hi ra\u1E0Diyall\u0101hu \u02BFanhum\u0101 annan Nabiyya \u1E63allall\u0101hu \u02BFalayhi wa sallama q\u0101la: U\u02BF\u1E6D\u012Btu khamsan lam yu\u02BF\u1E6Dahunna a\u1E25adun minal anbiy\u0101\u02BEi qabl\u012B: Nu\u1E63irtu bir-ru\u02BFbi mas\u012Brata shahrin, wa ju\u02BFilat liyal ar\u1E0Du masjidan wa \u1E6Dah\u016Bran fa-ayyum\u0101 rajulin min ummat\u012B adrakathu\u1E63 \u1E63al\u0101tu fal-yu\u1E63alli, wa u\u1E25illat liyal magh\u0101nimu wa lam ta\u1E25illa li-a\u1E25adin qabl\u012B, wa u\u02BF\u1E6D\u012Btush shaf\u0101\u02BFata, wa k\u0101nan Nabiyyu yub\u02BFathu il\u0101 qawmih\u012B kh\u0101\u1E63\u1E63atan wa bu\u02BFithtu ilan n\u0101si \u02BF\u0101mmah.",
en:"The Prophet \u0635 said: \u201cI have been given five things that were not given to any Prophet before me: (1) I have been aided with awe for a distance of one month\u2019s travel, (2) the earth has been made for me a place of prayer and a means of purification \u2014 so whoever of my Ummah is overtaken by the prayer, let him pray, (3) the spoils of war have been made lawful for me, (4) I have been given intercession, and (5) every Prophet was sent to his own people specifically, but I have been sent to all of mankind.\u201d",
ur:"Nabi \u0635 ne farmaya: \u201cMujhe paanch cheezein ata ki gayin jo mujh se pehle kisi Nabi ko nahi di gayin: (1) ek mahine ki masaafat par ru'b ke sath meri madad ki gayi, (2) mere liye zameen ko sajdah-gah aur pak-karne wali banaya gaya \u2014 lihaza meri ummat mein se jise namaz ka waqt aa jaye wo namaz padh le, (3) mere liye ghaneemat ka maal halal kiya gaya, (4) mujhe shifa'at di gayi, (5) har Nabi khaas apni qaum ki taraf bheja jata tha, magar main tamam logon ki taraf bheja gaya hoon.\u201d",
uru:"نبی ﷺ نے فرمایا: ”مجھے پانچ چیزیں عطا کی گئیں جو مجھ سے پہلے کسی نبی کو نہیں دی گئیں: (۱) ایک مہینے کی مسافت پر رعب کے ساتھ میری مدد کی گئی، (۲) میرے لیے زمین کو سجدہ گاہ اور پاک کرنے والی بنایا گیا، (۳) میرے لیے غنیمت کا مال حلال کیا گیا، (۴) مجھے شفاعت دی گئی، (۵) ہر نبی خاص اپنی قوم کی طرف بھیجا جاتا تھا، مگر میں تمام لوگوں کی طرف بھیجا گیا ہوں۔“",
rawi:"Hazrat Jabir bin Abdullah al-Ansari (RA)",
rawiNote:"Ansari Sahabi, Bay'at-e-Aqabah mein apne walid ke sath shareek the. Unke walid Abdullah (RA) Uhud mein shaheed hue. Kathir-ur-Riwayah Sahaba mein se hain aur Madinah mein unka ilmi halqa qayam tha. Taweel umr payi.",
key:[["أُعْطِيتُ","U'teetu \u2014 mujhe diya gaya"],["الرُّعْب","Ar-Ru'b \u2014 ru'b / dabdaba / khauf"],["مَسِيرَةَ شَهْرٍ","Maseerata shahrin \u2014 ek mahine ki masaafat"],["مَسْجِدًا وَطَهُورًا","Masjidan wa Tahooran \u2014 sajdah-gah aur pak karne wali"],["الْمَغَانِم","Al-Maghaanim \u2014 ghaneemat ka maal"],["الشَّفَاعَة","Ash-Shafa'ah \u2014 shifa'at"]],
src:"Bukhari: Kitab at-Tayammum #438 \u00b7 Muslim: Kitab al-Masajid #1191 \u00b7 Muttafaqun Alayhi",
fawaid:["Nabi \u0635 tamam Ambiya mein afzal hain aur Aap ki ummat tamam ummaton se afzal hai","Shukar ada karte hue Allah ki ne'maton ka tazkira karna bhi ibadat hai","Roo-e-zameen par mamnoo maqamaat ke ilawa har jagah namaz ada ki ja sakti hai","Saaf-suthri zameen par tayammum karna jaiz hai \u2014 isi hadees se tayammum ki asal nikalti hai"]},

{n:41, t:"Istihaza wali Aurat ka Ghusl", tu:"استحاضہ والی عورت کا غسل",
ar:"عَنْ عَائِشَةَ رَضِيَ اللهُ عَنْهَا أَنَّ أُمَّ حَبِيبَةَ اسْتُحِيضَتْ سَبْعَ سِنِينَ فَسَأَلَتْ رَسُولَ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ عَنْ ذَلِكَ فَأَمَرَهَا أَنْ تَغْتَسِلَ، قَالَتْ: فَكَانَتْ تَغْتَسِلُ لِكُلِّ صَلَاةٍ",
tl:"\u02BFAn \u02BF\u0100\u02BEishata ra\u1E0Diyall\u0101hu \u02BFanh\u0101 anna Umma \u1E24ab\u012Bbata ustu\u1E25\u012B\u1E0Dat sab\u02BFa sin\u012Bna fa-sa\u02BEalat Ras\u016Blall\u0101hi \u1E63allall\u0101hu \u02BFalayhi wa sallama \u02BFan dh\u0101lika fa-amarah\u0101 an taghtasila, q\u0101lat: fa-k\u0101nat taghtasilu likulli \u1E63al\u0101tin.",

var GRAND_PER_SUBJECT = 6;
var GRAND_COUNT = 3;

function getBuiltinTestDef(id){
  if(!id) return null;
  if(id.indexOf('sub:')===0){
    var parts = id.split(':');
    var subj = parts[1], diff = parts[2];
    var subject = SUBJECTS.filter(function(s){ return s.id===subj; })[0];
    if(!subject) return null;
    var qids;
    if(diff==='full'){
      qids = BANK.filter(function(q){ return q.s===subj; }).map(function(q){ return q.id; });
    } else {
      qids = BANK.filter(function(q){ return q.s===subj && q.d===diff; }).map(function(q){ return q.id; });
    }
    return { id:id, titleKey:diff, subjectId:subj, kind:diff, qids:qids };
  }
  if(id==='hifz:all'){
    return { id:'hifz:all', title:null, titleKey:'hifz', subjectId:'umdat', kind:'hifz',
      qids: BANK.filter(function(q){ return q.id.indexOf('hz')===0; }).map(function(q){ return q.id; }) };
  }
  if(id.indexOf('grand:')===0){
    var n = parseInt(id.split(':')[1],10);
    return buildGrandMock(n);
  }
  return null;
}
function buildGrandMock(n){
  var rng = mulberry32(1000+n);
  var subs = activeSubjectIds();
  var qids = [];
  subs.forEach(function(sid){
    var pool = BANK.filter(function(q){ return q.s===sid; }).map(function(q){ return q.id; });
    var shuffled = seededShuffle(pool, rng);
    qids = qids.concat(shuffled.slice(0, Math.min(GRAND_PER_SUBJECT, shuffled.length)));
  });
  qids = seededShuffle(qids, rng);
  return { id:'grand:'+n, titleKey:'grand', grandN:n, subjectId:null, kind:'grand', qids:qids };
}
/* Titles are computed at render time so they follow the language setting */
function testTitle(def){
  if(!def) return '';
  if(def.title) return def.title;
  var sub = def.subjectId ? SUBJECTS.filter(function(s){ return s.id===def.subjectId; })[0] : null;
  if(def.kind==='grand'){
    return isUr() ? ('مکمل ماک امتحان '+def.grandN) : ('Grand Mock Exam '+def.grandN);
  }
  if(def.kind==='hifz'){
    return isUr() ? 'حفظ کی ۱۲ احادیث — مشق' : 'Hifz ki 12 Ahadith \u2014 Practice';
  }
  if(!sub) return def.id;
  var suffix = def.kind==='full' ? t('fullPaper') : diffLabel(def.kind);
  return subjName(sub) + ' — ' + suffix;
}
function resolveTestDefById(id){
  if(!id) return null;
  if(id.indexOf('sub:')===0 || id.indexOf('grand:')===0) return getBuiltinTestDef(id);
  if(state.progress && state.progress.testId===id){
    return { id:id, title:state.progress.title, subjectId:state.progress.subjectId, kind:state.progress.kind, qids: state.progress.qids.slice() };
  }
  var found = state.attempts.filter(function(a){ return a.testId===id; })[0];
  if(found) return { id:id, title:found.title, subjectId:found.subjectId, kind:found.kind, qids: found.qids.slice() };
  return null;
}

function makeOptOrder(on){ var base=[0,1,2,3]; return on ? shuffleArr(base) : base; }

function createFreshAttempt(def){
  var qOrder = state.settings.shuffleQuestions ? shuffleArr(def.qids) : def.qids.slice();
  var optOrder = {};
  qOrder.forEach(function(qid){ optOrder[qid] = makeOptOrder(state.settings.shuffleOptions); });
  state.progress = {
    id: 'a_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    testId: def.id,
    title: testTitle(def),
    subjectId: def.subjectId,
    kind: def.kind,

    finishedAt: null,
    qids: qOrder,
    optOrder: optOrder,
    answers: {},
    flags: {},

    liveSince: Date.now(),
    cur: 0
  };

  goToRunner(def.id);
}
function startTest(def, opts){
  opts = opts || {};
  var forceNew = !!opts.forceNew;
  var existing = state.progress;
  if(existing && !existing.finishedAt){
    if(existing.testId===def.id){
      if(forceNew){ openModal('confirmRestart', {testDef:def}); return; }
      goToRunner(def.id);
      return;
    }
    openModal('discardProgress', {pendingTestDef:def});
    return;
  }
  createFreshAttempt(def);
}
function goToRunner(id){ closeOverlays(); navigate('#/test/'+encodeURIComponent(id)); }
function ensureLive(){ var p=state.progress; if(p && !p.liveSince) p.liveSince = Date.now(); }
function commitElapsed(){
  var p = state.progress; if(!p || !p.liveSince) return;
  p.elapsedSec += (Date.now()-p.liveSince)/1000;
  p.liveSince = null;
}
function currentElapsedSeconds(){
  var p = state.progress; if(!p) return 0;
  return p.elapsedSec + (p.liveSince ? (Date.now()-p.liveSince)/1000 : 0);
}
function selectOption(qid, dispIndex){
  var p = state.progress; if(!p || p.finishedAt) return;
  if(p.mode==='practice' && p.answers[qid]!==undefined && p.answers[qid]!==null) return;
  p.answers[qid] = dispIndex;
  saveProgress();

}
function toggleFlag(qid){

  p.flags[qid] = !p.flags[qid];

}
function gotoQuestion(idx){
  var p = state.progress; if(!p) return;
  if(idx<0 || idx>=p.qids.length) return;
  p.cur = idx;

}
function nextQuestion(){ var p=state.progress; if(!p) return; gotoQuestion(Math.min(p.cur+1, p.qids.length-1)); }
function prevQuestion(){ var p=state.progress; if(!p) return; gotoQuestion(Math.max(p.cur-1, 0)); }
function attemptSubmit(){
  var p = state.progress; if(!p) return;
  var unanswered = p.qids.length - answeredCount(p);
  if(unanswered>0){ openModal('confirmSubmit', {unanswered:unanswered}); return; }
  finalizeAndGoResults();
}
function finalizeAndGoResults(){
  var p = state.progress; if(!p) return;
  commitElapsed();
  var score = 0;
  p.qids.forEach(function(qid){
    var disp = p.answers[qid];
    if(disp===undefined || disp===null) return;
    var q = BANK_BY_ID[qid];
    if(p.optOrder[qid][disp]===q.a) score++;
  });
  p.score = score;
  p.total = p.qids.length;
  p.finishedAt = Date.now();
  state.attempts.unshift(p);
  saveAttempts();
  state.progress = null;
  saveProgress();
  closeOverlays();
  navigate('#/results/'+p.id);
}
function countSkipped(a){ return a.qids.length - answeredCount(a); }

 * Stats
 * ---------------------------------------------------------- */
function computeStats(){
  var finished = state.attempts.filter(function(a){ return a.finishedAt; });
  var totalAttempts = finished.length;
  var avgScore = null;
  if(totalAttempts){
    var sum = finished.reduce(function(s,a){ return s + (a.total ? (a.score/a.total*100) : 0); }, 0);
    avgScore = Math.round(sum/totalAttempts);
  }
  var answeredQids = {};
  finished.forEach(function(a){ Object.keys(a.answers||{}).forEach(function(qid){ answeredQids[qid]=1; }); });
  var questionsPracticed = Object.keys(answeredQids).length;
  var days = {};
  finished.forEach(function(a){ days[new Date(a.finishedAt).toDateString()] = 1; });
  var streak = 0;
  var cursor = new Date();
  if(!days[cursor.toDateString()]) cursor.setDate(cursor.getDate()-1);
  while(days[cursor.toDateString()]){ streak++; cursor.setDate(cursor.getDate()-1); }
  return { totalAttempts:totalAttempts, avgScore:avgScore, questionsPracticed:questionsPracticed, streak:streak };
}
function subjectStats(id){
  var finished = state.attempts.filter(function(a){ return a.subjectId===id && a.finishedAt; });
  var bestPct = null;
  finished.forEach(function(a){ var pct = a.total ? Math.round(a.score/a.total*100) : 0; if(bestPct===null || pct>bestPct) bestPct=pct; });
  return { attempts: finished.length, bestPct: bestPct };
}

function parseHash(){
  var h = (location.hash||'').replace(/^#\/?/,'');
  var parts = h.split('/').filter(Boolean).map(function(p){ try{ return decodeURIComponent(p); }catch(e){ return p; } });
  if(!parts.length) return {screen:'home'};
  if(parts[0]==='subject' && parts[1]) return {screen:'subject', id:parts[1]};
  if(parts[0]==='test' && parts[1]) return {screen:'test', testId:parts[1]};
  if(parts[0]==='results' && parts[1]) return {screen:'results', attemptId:parts[1]};
  if(parts[0]==='history') return {screen:'history'};
  if(parts[0]==='hifz') return {screen:'hifz'};
  if(parts[0]==='builder') return {screen:'builder'};
  if(parts[0]==='settings') return {screen:'settings'};
  return {screen:'home'};
}
function navigate(hash){
  if(location.hash===hash){ onRouteChange(); }
  else { location.hash = hash; }
}
function onRouteChange(){
  var wasTest = state.route.screen==='test';
  var next = parseHash();
  if(wasTest && next.screen!=='test'){ commitElapsed(); saveProgress(); }
  state.route = next;
  if(next.screen==='results') state.ui.reviewFilter='all';
  state.ui.sheet=null;
  state.ui.modal=null;
  render();

}

function applyTheme(theme){
  try{
    var html = document.documentElement;
    if(theme==='light') html.setAttribute('data-theme','light');
    else if(theme==='dark') html.setAttribute('data-theme','dark');
    else html.removeAttribute('data-theme');
  }catch(e){}
}
function applyLang(l){
  try{
    var html = document.documentElement;
    if(l==='ur'){
      html.setAttribute('data-lang','ur');
      html.setAttribute('lang','ur');
      html.setAttribute('dir','rtl');
    } else {
      html.removeAttribute('data-lang');
      html.setAttribute('lang','en');
      html.setAttribute('dir','ltr');
    }
  }catch(e){}
}
function cycleTheme(){
  var order=['auto','light','dark'];
  var i = order.indexOf(state.settings.theme);
  state.settings.theme = order[(i+1)%order.length];
  applyTheme(state.settings.theme);
  saveSettings();
  render();
  showToast(t('theme')+': ' + (state.settings.theme==='auto' ? t('auto') : state.settings.theme==='light' ? t('light') : t('dark')));
}
function toggleLang(){
  state.settings.lang = (state.settings.lang==='ur') ? 'en' : 'ur';
  applyLang(state.settings.lang);
  saveSettings();
  render();
  showToast(t('language')+': ' + (state.settings.lang==='ur' ? t('langUrdu') : t('langEnglish')));
}
function setLang(l){
  state.settings.lang = l;
  applyLang(l);
  saveSettings();
  render();
}

function renderFoot(){ return '<div class="foot">'+t('footer')+'</div>'; }
function renderOverlays(){
  var html='';
  if(state.ui.sheet==='palette') html += renderPaletteSheet();
  if(state.ui.modal) html += renderModal();
  if(state.ui.toast) html += '<div class="toast">'+state.ui.toast+'</div>';
  return html;
}
function renderModal(){
  var m = state.ui.modal; if(!m) return '';
  var title='', body='', confirmAct='', confirmLabel='', danger=false;
  if(m.kind==='discardProgress'){
    title=t('unfinishedTitle');
    body=t('unfinishedBody')+' \u201c'+testTitle(m.payload.pendingTestDef)+'\u201d. '+t('unfinishedBody2');
    confirmAct='modal-confirm-discard'; confirmLabel=t('discardStart');
  } else if(m.kind==='confirmRestart'){
    title=t('startOverTitle');
    body=t('startOverBody')+' \u201c'+testTitle(m.payload.testDef)+'\u201d '+t('startOverBody2');
    confirmAct='modal-confirm-restart'; confirmLabel=t('startOver'); danger=true;
  } else if(m.kind==='confirmSubmit'){
    title=t('submitTitle');
    body=t('submitBody')+' '+m.payload.unanswered+' '+t('submitBody2');
    confirmAct='confirm-submit'; confirmLabel=t('submitAnyway');
  } else if(m.kind==='confirmReset'){
    title=t('resetTitle');
    body=t('resetBody');
    confirmAct='do-reset'; confirmLabel=t('resetConfirm'); danger=true;
  }
  return '<div class="modal-bg"><div class="modal">' +
    '<h3>'+title+'</h3><p>'+body+'</p>' +
    '<div class="modal-acts">' +
      '<button class="btn btn-ghost" data-act="close-modal">'+t('cancel')+'</button>' +
      '<button class="btn '+(danger?'btn-danger':'')+'" data-act="'+confirmAct+'">'+confirmLabel+'</button>' +
    '</div>' +
  '</div></div>';
}
function renderPaletteSheet(){
  var p = state.progress; if(!p) return '';
  var cells='';
  p.qids.forEach(function(qid,i){
    var answered = p.answers[qid]!==undefined && p.answers[qid]!==null;
    var marked = !!p.flags[qid];
    var isCur = i===p.cur;
    cells += '<button data-act="goto-q" data-idx="'+i+'" '+(answered?'data-a="1"':'')+' '+(marked?'data-m="1"':'')+' '+(isCur?'data-cur="1"':'')+' aria-label="'+t('question')+' '+(i+1)+'">'+(i+1)+'</button>';
  });
  var unanswered = p.qids.length - answeredCount(p);
  return '<div class="sheet-bg"><div class="sheet">' +
    '<div class="sheet-head"><h3>'+t('questionsSheet')+'</h3><button class="iconbtn" data-act="close-sheet" aria-label="Close">'+ICONS.x+'</button></div>' +
    '<div class="legend"><span><i class="sw a"></i> '+t('answered')+'</span><span><i class="sw m"></i> '+t('markedForReview')+'</span></div>' +
    '<div class="pal">'+cells+'</div>' +
    '<div style="margin-top:16px;display:flex;gap:8px">' +
      '<button class="btn btn-ghost" data-act="close-sheet" style="flex:1">'+t('continueBtn')+'</button>' +
      '<button class="btn" data-act="submit-test" style="flex:1">'+t('submitTest')+(unanswered?(' ('+unanswered+' '+t('left')+')'):'')+'</button>' +
    '</div>' +
  '</div></div>';
}
function renderTestRow(def){
  if(!def) return '';
  var title = testTitle(def);
  var finished = state.attempts.filter(function(a){ return a.testId===def.id && a.finishedAt; });
  var attemptsCt = finished.length;
  var bestPct = null;
  finished.forEach(function(a){ var pct=a.total?Math.round(a.score/a.total*100):0; if(bestPct===null||pct>bestPct) bestPct=pct; });
  var activeProgress = (state.progress && !state.progress.finishedAt && state.progress.testId===def.id) ? state.progress : null;
  var diffTag = def.kind==='easy'?'tag-easy':def.kind==='medium'?'tag-medium':def.kind==='hard'?'tag-hard':'tag-mixed';
  var dLabel = def.kind==='full'?t('fullPaper'):def.kind==='grand'?t('mixedAll'):def.kind==='custom'?t('custom'):diffLabel(def.kind);
  var metaExtra='';
  if(activeProgress){
    metaExtra = '<span class="dot"></span><span>'+answeredCount(activeProgress)+'/'+activeProgress.qids.length+' '+t('inProgress')+'</span>';
  } else if(attemptsCt){
    metaExtra = '<span class="dot"></span><span class="'+(bestPct>=70?'best':'best-low')+'">'+bestPct+'% '+t('best')+'</span><span class="dot"></span><span>'+attemptsCt+' '+(attemptsCt>1?t('attempts'):t('attempt'))+'</span>';
  }
  var actionsHtml;
  if(activeProgress){
    actionsHtml = '<button class="btn btn-sm" data-act="start-test" data-testid="'+def.id+'">'+t('resume')+'</button>' +
      '<button class="btn btn-quiet btn-sm" data-act="confirm-restart" data-testid="'+def.id+'">'+t('startOver')+'</button>';
  } else if(attemptsCt>0){
    actionsHtml = '<button class="btn btn-ghost btn-sm" data-act="force-start" data-testid="'+def.id+'">'+t('retake')+'</button>';
  } else {
    actionsHtml = '<button class="btn btn-sm" data-act="start-test" data-testid="'+def.id+'">'+t('start')+'</button>';
  }
  return '<div class="test">' +
    '<div class="test-main">' +
      '<strong>'+title+'</strong>' +
      '<div class="test-meta">' +
        '<span class="tag '+diffTag+'">'+dLabel+'</span>' +
        '<span class="dot"></span><span>'+def.qids.length+' '+(def.qids.length!==1?t('questions'):t('question'))+'</span>' +
        metaExtra +
      '</div>' +
    '</div>' +
    actionsHtml +
  '</div>';
}
