fq25:{q:"نجاست دور کرنے کے بارے میں: نیند سے بیدار ہونے پر کیا حکم ہے؟",
o:["تین بار ہاتھ دھوئے بغیر پانی میں ہاتھ ڈالنا منع ہے","صرف ایک بار دھونا کافی ہے","کوئی حکم نہیں","پانچ بار دھونا ضروری ہے"],
e:"دلیل: مسلم۔ وجہ: انسان کو معلوم نہیں کہ اس کا ہاتھ رات بھر کہاں رہا۔"},

fq26:{q:"شیر خوار (دودھ پیتے) بچے کے پیشاب کو پاک کرنے کا طریقہ کیا ہے؟",
o:["لڑکے کے پیشاب پر پانی چھڑک دینا کافی ہے، اور لڑکی کے پیشاب کو دھونا چاہیے","دونوں کا دھونا ضروری ہے","دونوں پر چھڑکنا کافی ہے","صرف لڑکی کے پیشاب پر چھڑکنا کافی ہے"],
e:"البتہ جب بچہ کھانا کھانے لگے تو اس کے پیشاب کو بھی دھونا ضروری ہے (صحیح ابو داؤد)۔"},

fq27:{q:"عورت کے لمبے کپڑے (برقع یا دامن) کا حکم جب وہ گندی جگہ سے گزر جائے؟",
o:["بعد والی پاک زمین سے گزرنے پر وہ پاک ہو جاتا ہے","اسے دھونا ضروری ہے","وہ ہمیشہ ناپاک رہتا ہے","نماز اس میں نہیں ہو سکتی"],
e:"ام سلمہ رضی اللہ عنہا کے سوال پر نبی <span class='ar'>ﷺ</span> نے فرمایا: <span class='ar'>اس کے بعد والا حصہ اس کو پاک کر دے گا</span> (ابن ماجہ: صحیح)۔"},

fq28:{q:"زمین کی گندگی کیسے پاک ہوتی ہے؟",
o:["دھوپ یا ہوا میں سوکھ کر ختم ہو جائے تو زمین پاک ہو جاتی ہے","صرف پانی بہانے سے","مٹی ڈالنے سے","وہ کبھی پاک نہیں ہوتی"],
e:"اسی طرح جوتے یا چپل کی گندگی زمین پر رگڑنے سے پاک ہو جاتی ہے، اور پھر انہیں پہن کر نماز پڑھنا بھی جائز ہے (ابو داؤد: صحیح)۔"},

fq29:{q:"کتے نے برتن میں منہ ڈال دیا تو کیا کرنا چاہیے؟",
o:["پہلے اسے الٹ کر خالی کریں، پھر سات مرتبہ دھوئیں — پہلی مرتبہ مٹی سے","صرف سات مرتبہ پانی سے دھوئیں","تین مرتبہ دھوئیں","برتن توڑ دیں"],
e:"دلیل: بخاری، ترمذی۔ کتے کا جوٹھا ناپاک ہے۔"},

fq30:{q:"مأکول اللحم (حلال گوشت والے) مردہ جانور کا چمڑا کیسے پاک ہوتا ہے؟",
o:["دباغت (ٹیننگ) دینے سے","دھونے سے","دھوپ میں رکھنے سے","وہ پاک نہیں ہوتا"],
e:"دلیل: احمد، ابو داؤد — بحوالہ الشرح الممتع۔"},

fq31:{q:"دس فطری چیزیں (خصالِ فطرت) میں کون سی شامل ہیں؟",
o:["مونچھ کاٹنا، داڑھی بڑھانا، مسواک، ناک میں پانی، ناخن تراشنا، جوڑوں کو دھونا، بغل کے بال، زیرِ ناف بال، استنجا، ختنہ","صرف مسواک اور ناخن کاٹنا","صرف ختنہ اور استنجا","صرف داڑھی بڑھانا اور مونچھ کاٹنا"],
e:"سیدہ عائشہ رضی اللہ عنہا کی روایت (مسلم) — کل دس چیزیں جو طہارت اور نظافت سے متعلق ہیں۔"},

fq32:{q:"بیت الخلا میں داخل ہونے سے پہلے کون سی دعا پڑھی جاتی ہے؟",
o:["<span class='ar'>اَللّٰهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ</span>","<span class='ar'>غُفْرَانَكَ</span>","<span class='ar'>بِسْمِ اللهِ تَوَكَّلْتُ عَلَى اللهِ</span>","<span class='ar'>اَللّٰهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ</span>"],
e:"نکلنے کے بعد <span class='ar'>غُفْرَانَكَ</span> پڑھی جاتی ہے (ابو داؤد)۔ داخل ہوتے وقت بایاں پاؤں پہلے، نکلتے وقت دایاں پاؤں پہلے۔"},

fq33:{q:"قضائے حاجت کے وقت کس طرف منہ یا پیٹھ کرنا منع ہے؟",
o:["قبلہ کی طرف","مشرق کی طرف","مغرب کی طرف","شمال کی طرف"],
e:"دیگر آداب: شرمگاہ چھپانا، چھینٹوں سے بچنا، گفتگو نہ کرنا، اور سیدھے ہاتھ سے شرمگاہ کو نہ چھونا (بخاری، مسلم)۔"},

fq34:{q:"وہ کون سی تین جگہیں ہیں جہاں قضائے حاجت کرنا حرام ہے؟",
o:["عام راستوں میں، سایہ دار جگہوں/پھل دار درختوں کے نیچے، اور ٹھہرے ہوئے پانی میں","صرف راستوں میں","صرف پانی میں","صرف مسجد کے قریب"],
e:"دلیل: مسلم، ابو داؤد۔"},

fq35:{q:"وہ چیزیں جن سے استجمار جائز نہیں — کون سی ہیں؟",
o:["جن میں اللہ کا نام ہو، انسانوں و جانوروں کی خوراک، ہڈی، اور لید/سوکھا گوبر","صرف ہڈی","صرف کاغذ","صرف پتھر"],
e:"ہڈی جنوں کی غذا ہے اور لید و گوبر جنوں کے جانوروں کی غذا ہے، اس لیے ان سے استجمار منع ہے۔"},

fq36:{q:"وضو کی فضیلت میں <span class='ar'>الطُّهُورُ شَطْرُ الإِيمَانِ</span> کا مطلب کیا ہے؟",
o:["طہارت آدھا ایمان ہے","طہارت ایمان کی کنجی ہے","طہارت نماز کی شرط ہے","طہارت سنت ہے"],
e:"اور دوسری حدیث: <span class='ar'>مِفْتَاحُ الصَّلاةِ الطُّهُورُ</span> — طہارت نماز کی کنجی ہے (ابن ماجہ: صحیح)۔"},

fq37:{q:"وضو کرنے والوں کی قیامت کے دن کیا پہچان ہوگی؟",
o:["ان کے چہرے اور اعضا وضو کے نشانات سے روشن اور چمکدار ہوں گے","انہیں سب سے پہلے بلایا جائے گا","ان کے سر پر تاج ہوگا","انہیں جنت کی چابی ملے گی"],
e:"<span class='ar'>إِنَّ أُمَّتِي يُدْعَوْنَ يَوْمَ القِيَامَةِ غُرّاً مُحَجَّلِينَ مِنْ آثَارِ الوُضُوءِ</span> (بخاری، مسلم)۔"},

fq38:{q:"وضو کے شروط (شرائط) کتنی اور کون سی ہیں؟",
o:["۳ — نیت، پانی کا پاک ہونا، اور پانی پہنچنے سے روکنے والی چیز کا نہ ہونا","۲","۴","۵"],
e:"روکنے والی چیزیں: موم، نیل پالش، پینٹ، تیل وغیرہ۔ اگر ایک شرط بھی پوری نہ ہو تو وضو صحیح نہیں ہوگا۔"},

fq39:{q:"وضو کے فرائض کتنے ہیں؟",
o:["۶","۴","۵","۷"],
e:"چہرہ دھونا (کلی + ناک)، ہاتھ کہنیوں سمیت، پورے سر کا مسح (کانوں سمیت)، پاؤں ٹخنوں سمیت، ترتیب، اور موالات۔"},

fq40:{q:"”موالات“ کا مطلب کیا ہے؟",
o:["تمام اعضا ایک دوسرے کے بعد بلا تاخیر دھونا","ترتیب سے دھونا","تین مرتبہ دھونا","نیت کرنا"],
e:"رہنمائے معلم: ایک عضو دھونے کے بعد دوسرے کو دھونے میں اتنی تاخیر نہیں ہونی چاہیے کہ پہلا عضو سوکھ جائے۔"},

fq41:{q:"وضو کے فرائض کی قرآن سے دلیل کون سی آیت ہے؟",
o:["<span class='ar'>يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا قُمْتُمْ إِلَى الصَّلاةِ فَاغْسِلُوا وُجُوهَكُمْ وَأَيْدِيَكُمْ إِلَى المَرَافِقِ وَامْسَحُوا بِرُءُوسِكُمْ وَأَرْجُلَكُمْ إِلَى الكَعْبَيْنِ</span> — المائدہ: ۶","<span class='ar'>وَأَقِيمُوا الصَّلاةَ</span>","<span class='ar'>إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ</span>","<span class='ar'>الطُّهُورُ شَطْرُ الإِيمَانِ</span>"],
e:"اسی آیت سے چار فرائض اور ان کی ترتیب دونوں ثابت ہوتے ہیں۔"},

fq42:{q:"وضو میں اعضا کو دھونے کا حکم کیا ہے؟",
o:["ایک مرتبہ دھونا فرض ہے، تین مرتبہ سے زیادہ دھونا اسراف اور حرام ہے","تین مرتبہ دھونا فرض ہے","دو مرتبہ فرض ہے","جتنا مرضی دھویا جا سکتا ہے"],
e:"دلیل: بخاری، مسلم؛ اور زیادتی کے بارے میں ابو داؤد (حسن)۔"},

fq43:{q:"مسواک کے پانچ مستحب اوقات کون سے ہیں؟",
o:["وضو کے وقت، نماز کے وقت، تلاوتِ قرآن کے وقت، نیند سے بیدار ہونے پر، اور منہ کی کیفیت بدلنے پر","صرف وضو اور نماز کے وقت","صرف صبح اور شام","صرف رمضان میں"],
e:"مسواک ہر وقت مستحب ہے، مگر ان پانچ اوقات میں اس کی اہمیت زیادہ ہے (شرح مسلم — امام نووی)۔"},

fq44:{q:"نواقضِ وضو (وضو توڑنے والی چیزیں) کتنی اور کون سی ہیں؟",
o:["۵ — سبیلین سے کسی چیز کا خارج ہونا، گہری نیند، بے ہوش ہونا، شرمگاہ کو بلا کپڑے ہاتھ لگانا، اور اونٹ کا گوشت کھانا","۳","۴","۶"],
e:"دلیل: بخاری، مسلم، ترمذی؛ اونٹ کے گوشت کے لیے مسلم؛ گہری نیند کے لیے ابو داؤد (حسن)۔"},

fq45:{q:"وہ حالات جو نواقضِ وضو نہیں ہیں — کون سے ہیں؟",
o:["آگ پر پکی چیز کھانا، قے ہونا، نکسیر پھوٹنا، اور سبیلین کے علاوہ جسم سے خون/پیپ نکلنا","صرف قے ہونا","صرف نکسیر","اونٹ کا گوشت کھانا"],
e:"ان حالات میں وضو نہیں ٹوٹتا، اگر کر لیں تو بہتر ہے لیکن واجب نہیں۔"},

fq46:{q:"وہ کون سے تین افعال ہیں جن کے لیے وضو کرنا واجب ہے؟",
o:["نماز پڑھنے کے لیے، بیت اللہ کا طواف کرنے کے لیے، اور قرآن پکڑنے کے لیے","صرف نماز کے لیے","صرف طواف کے لیے","صرف سونے سے پہلے"],
e:"دلیل: المائدہ: ۶ (نماز)، متفق علیہ (طواف)، مؤطا اور نسائی (قرآن پکڑنا)۔"},

fq47:{q:"موزوں پر مسح کی شروط کتنی اور کون سی ہیں؟",
o:["۲ — موزے وضو کی حالت میں پہنے گئے ہوں، اور موزے گندگی سے پاک ہوں","۱ — صرف چمڑے کے ہوں","۳","۴"],
e:"دلیل: بخاری، مسلم۔ مرد اپنے عمامہ (پگڑی) پر بھی مسح کر سکتا ہے (مسلم، صحیح ابن ماجہ)۔"},

fq48:{q:"موزوں پر مسح کی مدت کتنی ہے؟",
o:["مقیم کے لیے: ایک دن اور ایک رات · مسافر کے لیے: تین دن اور تین راتیں","دونوں کے لیے ایک دن","دونوں کے لیے تین دن","مقیم: تین دن · مسافر: ایک دن"],
e:"دلیل دونوں کے لیے: مسلم۔"},

fq49:{q:"موزوں پر مسح کرنے کا صحیح طریقہ کیا ہے؟",
o:["دونوں ہاتھ تر کر کے دایاں ہاتھ دائیں پاؤں پر اور بایاں ہاتھ بائیں پاؤں پر ایک ساتھ پھیرنا — صرف موزوں کے اوپر","موزوں کے نیچے مسح کرنا","پہلے دایاں پھر بایاں، موزوں کے اوپر اور نیچے دونوں","تین مرتبہ مسح کرنا"],
e:"مسح ایک ہی مرتبہ کرنا چاہیے۔ موزوں کے نیچے مسح کرنا سنت سے ثابت نہیں۔"},

fq50:{q:"تیمم کے شروط کتنے اور کون سے ہیں؟",
o:["۲ — دل میں تیمم کی نیت کرنا، اور مٹی کا پاک ہونا","۱","۳","۴"],
e:"تیمم کا طریقہ: ”بسم اللہ“ کہہ کر پاک زمین پر ایک بار دونوں ہاتھ مارنا، پھر چہرے اور دونوں ہتھیلیوں کی پشت پر مسح کرنا (بخاری، مسلم)۔"},

fq60:{q:"وضو کا مسنون طریقہ — سر کے مسح کا صحیح طریقہ کیا ہے؟",
o:["دونوں ہاتھ سر کے اگلے حصے سے گدی تک لے جائیں اور وہیں سے واپس اگلے حصے تک لے آئیں","صرف اگلے حصے پر مسح کریں","صرف گدی پر مسح کریں","تین مرتبہ پورے سر پر مسح کریں"],
e:"دلیل: بخاری۔ اور مسح ایک ہی بار کرنا ہے۔"},

fq61:{q:"کانوں کے مسح کا مسنون طریقہ کیا ہے؟",
o:["شہادت کی دونوں انگلیوں سے کانوں کے اندر، اور دونوں انگوٹھوں سے کانوں کے اوپر والے حصے پر مسح کریں","صرف کانوں کے اندر مسح کریں","صرف کانوں کے پیچھے مسح کریں","کانوں کا مسح ضروری نہیں"],
e:"دلیل: صحیح سنن نسائی۔ وضو کے فرائض میں بھی کانوں کا مسح سر کے مسح میں شامل ہے۔"},

fq62:{q:"وضو کے بعد کی مسنون دعا کون سی ہے؟",
o:["<span class='ar'>أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللهُ وَحْدَهُ لا شَرِيكَ لَهُ وَأَشْهَدُ أَنَّ مُحَمَّداً…</span>","<span class='ar'>غُفْرَانَكَ</span>","<span class='ar'>اَللّٰهُمَّ بَاعِدْ بَيْنِي وَبَيْنَ خَطَايَايَ</span>","<span class='ar'>بِسْمِ اللهِ تَوَكَّلْتُ عَلَى اللهِ</span>"],
e:"کتاب نے یہ دعا وضو کے طریقے کے آخر میں ذکر کی ہے (مسلم، ترمذی، نسائی)۔"},

fq63:{q:"حضرت حمران رضی اللہ عنہ کی روایت میں حضرت عثمان رضی اللہ عنہ کے وضو کے بعد کون سے الفاظ آئے؟",
o:["<span class='ar'>رَأَيْتُ رَسُولَ اللهِ ﷺ تَوَضَّأَ نَحْوَ وُضُوئِي هَذَا</span>","<span class='ar'>هَذَا وُضُوءٌ لا يَقْبَلُهُ اللهُ إِلَّا بِهِ</span>","<span class='ar'>مَنْ تَوَضَّأَ هَكَذَا غُفِرَ لَهُ</span>","<span class='ar'>الوُضُوءُ شَطْرُ الإِيمَانِ</span>"],
e:"یعنی: ”میں نے رسول اللہ <span class='ar'>ﷺ</span> کو دیکھا کہ آپ نے اسی طرح وضو کیا“ (مسلم)۔"},

fq64:{q:"وضو کے شروط میں <span class='ar'>إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ</span> سے کیا ثابت ہوتا ہے، اور نیت کا محل کیا ہے؟",
o:["نیت شرط ہے، اور اس کا محل دل ہے — زبان سے کہنا مراد نہیں","نیت زبان سے کہنا ضروری ہے","نیت مستحب ہے","نیت صرف غسل میں شرط ہے"],
e:"رہنمائے معلم: <span class='ar'>اس کا مطلب زبان سے نیت کرنا نہیں ہے، بلکہ دل سے نیت کرنا مراد ہے</span> — کیونکہ نیت کا تعلق دل سے ہے۔"},

fq65:{q:"وہ کون سے افعال ہیں جن کے لیے وضو کرنا مستحب ہے؟",
o:["ذکر کرنے کے لیے، وضو ٹوٹنے پر فوراً دوبارہ، غسلِ جنابت سے پہلے، رات کو سونے سے پہلے، میت اٹھانے کی وجہ سے، اور قے ہونے کے بعد","صرف سونے سے پہلے","صرف ذکر کے لیے","صرف غسل سے پہلے"],
e:"دلیل: صحیح ابو داؤد (ذکر)، صحیح الترغیب، بخاری (غسل اور سونا)، صحیح ترمذی (میت اور قے)۔"},

fq66:{q:"موزوں پر مسح کی مدت کب سے شروع ہوتی ہے؟",
o:["وضو ٹوٹنے کے بعد جب پہلی بار مسح کیا جائے، اسی وقت سے مدت شروع ہوتی ہے","موزے پہنتے وقت سے","وضو کرتے وقت سے","سورج طلوع ہونے سے"],
e:"کتاب کی مثال: فجر کا وضو ظہر تک باقی رہا، ظہر میں ٹوٹا، پھر مسح کیا — مدت اسی وقت سے شروع ہوئی۔"},

fq67:{q:"مسح کی مدت ختم ہونے کے بعد اگر شخص با وضو ہے تو کیا حکم ہے؟",
o:["جب تک وضو باقی رہے اس وقت تک نمازیں پڑھ سکتا ہے؛ اگلا وضو کرتے وقت موزے اتارنے اور پاؤں دھونے ہوں گے","فوراً وضو ٹوٹ جاتا ہے","موزے اتارنا ضروری نہیں","نماز نہیں ہو سکتی"],
e:"کتاب کی مثال: عصر کے وقت مدت ختم ہوئی مگر وضو باقی تھا — اس نے عصر اور مغرب اسی وضو سے پڑھی، پھر وضو ٹوٹا۔"},

fq68:{q:"غسل واجب ہونے کے حالات کون سے ہیں؟",
o:["شہوت کے ساتھ منی خارج ہونے پر، احتلام پر (تر تری دیکھنے پر)، جماع پر، حیض کا خون بند ہونے پر، نفاس کا خون بند ہونے پر، اور انسان کے مرنے پر (میت کو غسل دینا)","صرف جماع کے بعد","صرف حیض کے بعد","صرف احتلام پر"],
e:"مذی یا ودی خارج ہونے پر صرف دھونا اور وضو کافی ہے، غسل ضروری نہیں (ترمذی: صحیح)۔"},

fq69:{q:"مسنون غسل (مستحب غسل) کون سے مواقع پر ہے؟",
o:["نمازِ جمعہ کے لیے، عیدین کے لیے، میت کو غسل دینے والے کے لیے، حج/عمرہ کا احرام باندھنے والے کے لیے، اور غیر مسلمان کے اسلام قبول کرنے کے بعد","صرف جمعہ کے لیے","صرف عیدین کے لیے","صرف احرام کے لیے"],
e:"دلیل: متفق علیہ (جمعہ)، مؤطا امام مالک (عیدین)، صحیح ترمذی (میت)، ترمذی حسن (احرام)، احمد/ابو داؤد صحیح (اسلام قبول کرنا)۔"},

fq70:{q:"تیمم کن دو حالتوں میں جائز ہے؟",
o:["جب پانی نہ ملے، اور جب پانی کے استعمال میں کوئی مجبوری ہو","صرف جب پانی نہ ملے","صرف سفر میں","جب وقت کم ہو"],
e:"دلیل: <span class='ar'>فَلَمْ تَجِدُوا مَاءً فَتَيَمَّمُوا صَعِيداً طَيِّباً</span> (المائدہ: ۶)، اور مجبوری کے لیے صحیح ابو داؤد/صحیح ابن ماجہ۔"},

fq71:{q:"تیمم کن چیزوں سے جائز ہے اور کن سے نہیں؟",
o:["جائز: مٹی، پتھر، اینٹ، سیمنٹ، ریت، غبار (زمین کی قسم سے) · ناجائز: راکھ، لکڑی، لوہا (جو زمین کی قسم سے نہیں)","صرف مٹی سے جائز","ہر چیز سے جائز","صرف ریت سے جائز"],
e:"اور اگر مٹی وغیرہ بھی میسر نہ ہو تو تیمم کے بغیر ہی اس وقت نماز پڑھ لیں (بخاری)۔"},

fq72:{q:"نواقضِ تیمم (تیمم توڑنے والی چیزیں) کیا ہیں؟",
o:["پانی مل جانا، اور وہ تمام چیزیں جن سے وضو ٹوٹتا ہے","صرف پانی مل جانا","صرف نیند","صرف وقت گزر جانا"],
e:"تیمم وضو اور غسل دونوں کا بدل بن سکتا ہے — پانی نہ ملنے پر وضو کے بدلے بھی اور غسل کے بدلے بھی۔"},

fq73:{q:"حیض کی ابتدا اور انتہا کی کم سے کم اور عام طور پر عمر کیا بتائی گئی ہے؟",
o:["ابتدا کم از کم ۹ سال، اور انتہا عموماً ۵۰ سال","ابتدا ۷ سال، انتہا ۴۰ سال","ابتدا ۱۲ سال، انتہا ۶۰ سال","کوئی حد مقرر نہیں"],
e:"حیض کے دنوں کی تعداد متعین نہیں ہے؛ عورتوں کی عمر، طبیعت اور آب و ہوا کے لحاظ سے مختلف ہو سکتی ہے۔"},

fq74:{q:"<span class='ar'>القَصَّةُ البَيْضَاءُ</span> کیا ہے؟",
o:["حیض کے آخری دنوں میں خون کی جگہ صاف سفید پانی کا آنا — جو حیض ختم ہونے کی علامت ہے","نفاس کا خون","استحاضہ کا خون","حیض کی ابتدا کی علامت"],
e:"کتاب: ”صاف سفیدی“ — عورت جب اپنے آخری دنوں میں خون کی بجائے صاف سفید پانی کا قطرہ دیکھے تو ایامِ حیض ختم (بخاری)۔"},

fq75:{q:"نفاس کیا ہے اور اس کی مدت کتنی ہے؟",
o:["ولادت کے سبب رحم سے نکلنے والا خون · مدت ۴۰ دن، یا اس سے کم بھی ہو سکتی ہے","ماہواری خون · مدت ۱۰ دن","بیماری کا خون · مدت ۷ دن","ولادت سے پہلے کا خون · مدت ۴۰ دن"],
e:"مسئلہ: اگر ولادت سے ۱ یا ۲ دن پہلے درد کے ساتھ خون آئے تو وہ نفاس شمار ہوگا؛ اور اگر درد کے بغیر ہو تو وہ استحاضہ کے حکم میں ہوگا۔"},

fq76:{q:"حیض اور نفاس کی حالت میں کون سے کام ممنوع ہیں؟",
o:["نماز، روزہ، مسجد میں قیام، بیت اللہ کا طواف، مصحف کو چھونا، جماع، اور طلاق دینا","صرف نماز اور روزہ","صرف جماع","صرف طواف"],
e:"نماز کی قضا ضروری نہیں (نسائی: صحیح) مگر روزے کی قضا ضروری ہے (بخاری)۔ ضرورت کے وقت مسجد سے گزر سکتی ہے اور پردے سے مصحف پکڑ سکتی ہے۔"},

fq77:{q:"حیض اور نفاس کی حالت میں کون سے امور جائز ہیں؟",
o:["عورت کے ساتھ کھانا پینا اور اٹھنا بیٹھنا، اللہ کا ذکر اور دعائیں پڑھنا (ضرورت کے مطابق قرآن پڑھنا)، اور طواف کے علاوہ حج کے باقی مناسک ادا کرنا","کچھ بھی جائز نہیں","صرف کھانا پینا","صرف ذکر"],
e:"دلیل: مسلم (کھانا پینا/اٹھنا بیٹھنا)، بخاری (حج کے مناسک)۔"},

fq78:{q:"استحاضہ کیا ہے اور اس کی کتنی صورتیں ہیں؟",
o:["وہ خون جو عادت (ایامِ حیض) کے علاوہ آئے · ۳ صورتیں","ولادت کا خون · ۲ صورتیں","ماہواری خون · ۴ صورتیں","صرف بیماری کا خون · ۱ صورت"],
e:"۱) ایام متعین ہوں تو وہی شمار کرے گی۔ ۲) ایام متعین نہ ہوں تو رنگ سے فرق کرے گی (کالا = حیض، دوسرا رنگ = استحاضہ)۔ ۳) نہ ایام متعین ہوں نہ رنگ سے فرق — تو پرانی عادت یا جیسی عورتوں کی عادت کے مطابق۔"},

fq79:{q:"استحاضہ کے احکام کیا ہیں؟",
o:["اس حالت میں معمول کے مطابق تمام عبادات انجام دے گی؛ ہر نماز کے لیے نیا وضو کرنا ضروری ہے","نماز اور روزہ دونوں منع ہیں","غسل ہر نماز کے لیے واجب ہے","کچھ بھی ادا نہیں کرے گی"],
e:"دلیل: بخاری (عبادات)، ابو داؤد/نسائی حسن (ہر نماز کا وضو)۔ ہر نماز کے لیے غسل کرنا صرف مستحب ہے۔"},

fq80:{q:"مسجد جانے کے آداب میں سب سے پہلا ادب کیا ہے؟",
o:["با وضو ہو کر جانا","بلند آواز سے ذکر کرنا","جلدی چلنا","نئے کپڑے پہننا"],
e:"گھر سے نکلتے وقت دعا: <span class='ar'>بِسْمِ اللهِ تَوَكَّلْتُ عَلَى اللهِ وَلا حَوْلَ وَلا قُوَّةَ إِلَّا بِاللهِ</span> (ابو داؤد، ترمذی: صحیح)۔ اور سنجیدگی و وقار کے ساتھ چلنا۔"},

fq81:{q:"مسجد میں داخل ہوتے اور نکلتے وقت کی دعائیں اور پاؤں کی ترتیب کیا ہے؟",
o:["داخل ہوتے وقت دایاں پاؤں پہلے اور <span class='ar'>اَللّٰهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ</span>؛ نکلتے وقت بایاں پاؤں پہلے اور <span class='ar'>اَللّٰهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ</span>","داخل ہوتے وقت بایاں پاؤں، نکلتے وقت دایاں","دونوں وقت دایاں پاؤں","کوئی ترتیب نہیں"],
e:"دلیل: مسلم۔ دھیان: بیت الخلا کے برعکس مسجد میں دایاں پاؤں پہلے ہے۔"},

fq82:{q:"مسجد کے آداب میں ”تشبیک“ کیا ہے اور اس کا حکم؟",
o:["ایک ہاتھ کی انگلیاں دوسرے ہاتھ کی انگلیوں میں ڈالنا — (مسجد میں نماز کے انتظار میں) منع ہے","انگلیاں چٹخانا — جائز ہے","ہاتھ باندھنا — سنت ہے","انگلیوں سے اشارہ کرنا — واجب ہے"],
e:"انگلیوں کو چٹخانا بھی منع ہے (صحیح سنن نسائی)۔ اور مسجد جانے سے پہلے کچا لہسن پیاز کھانا منع ہے کیونکہ اس کی بدبو نمازیوں اور فرشتوں کو تکلیف دیتی ہے۔"},

fq83:{q:"فجر کی اذان میں <span class='ar'>حَيَّ عَلَى الفَلاحِ</span> کے بعد کیا اضافہ کیا جاتا ہے؟",
o:["<span class='ar'>اَلصَّلاةُ خَيْرٌ مِنَ النَّوْمِ</span> — دو مرتبہ","<span class='ar'>قَدْ قَامَتِ الصَّلاةُ</span> — دو مرتبہ","<span class='ar'>اَللهُ أَكْبَرُ</span> — چار مرتبہ","کوئی اضافہ نہیں"],
e:"یہ اضافہ صرف فجر کی اذان میں ہے، اور <span class='ar'>حَيَّ عَلَى الفَلاحِ</span> کے بعد کہنا چاہیے۔"},

fq84:{q:"اذان سننے والا جواب کیسے دے؟",
o:["ویسا ہی کہے جیسا مؤذن کہتا ہے، البتہ <span class='ar'>حَيَّ عَلَى الصَّلاةِ</span> اور <span class='ar'>حَيَّ عَلَى الفَلاحِ</span> کے جواب میں <span class='ar'>لا حَوْلَ وَلا قُوَّةَ إِلَّا بِاللهِ</span> کہے","بالکل خاموش رہے","صرف آخر میں آمین کہے","صرف تکبیر کا جواب دے"],
e:"دلیل: بخاری، مسلم۔ اور نبی <span class='ar'>ﷺ</span> نے فرمایا: جو دل سے اذان کا جواب دے وہ جنت میں داخل ہوگا (مسلم)۔"},

fq85:{q:"اذان کی سنتوں میں ”حی علی الصلاۃ“ اور ”حی علی الفلاح“ پر کیا کیا جاتا ہے؟",
o:["”حی علی الصلاۃ“ پر دائیں جانب اور ”حی علی الفلاح“ پر بائیں جانب مڑنا — تاکہ دونوں طرف آواز پہنچے","دونوں پر دائیں مڑنا","دونوں پر بائیں مڑنا","قبلہ رخ ہی رہنا"],
e:"دلیل: ابو داؤد (صحیح)۔ مگر جب مائیک سے یہ مقصد پورا ہو جاتا ہے تو اس کی ضرورت نہیں رہتی۔"},

fq86:{q:"اذان کے بعد کی مسنون دعا کون سی ہے؟",
o:["<span class='ar'>اَللّٰهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ وَالصَّلاةِ القَائِمَةِ آتِ مُحَمَّداً الوَسِيلَةَ وَالفَضِيلَةَ وَابْعَثْهُ مَقَاماً مَحْمُوداً الَّذِي وَعَدْتَهُ</span>","<span class='ar'>اَللّٰهُمَّ بَاعِدْ بَيْنِي وَبَيْنَ خَطَايَايَ</span>","<span class='ar'>غُفْرَانَكَ</span>","<span class='ar'>سُبْحَانَ رَبِّيَ الأَعْلَى</span>"],
e:"پہلے درود پڑھا جاتا ہے (مسلم)، پھر یہ دعا (بخاری)۔ جو یہ دعا پڑھے اس کے لیے قیامت کے دن شفاعت یقینی ہے۔"},

fq87:{q:"نماز کب اور کہاں فرض کی گئی؟",
o:["معراج کی رات، جب اللہ نے نبی <span class='ar'>ﷺ</span> کو ساتوں آسمانوں کے اوپر اپنے پاس بلا کر پانچ نمازیں فرض فرمائیں","ہجرت کے بعد مدینہ میں","نبوت کے پہلے سال مکہ میں","غزوۂ بدر کے بعد"],
e:"دلیل: بخاری۔ اور نماز اسلام کا دوسرا رکن ہے۔"},

fq88:{q:"نماز مومن اور کافر کے درمیان فرق کرنے والی چیز ہے — اس کا نتیجہ کیا ہے؟",
o:["جس نے نماز چھوڑ دی اس نے کفر کیا","وہ گناہ گار ہے مگر مسلمان ہے","اس پر صرف قضا لازم ہے","یہ مسئلہ اختلافی ہے"],
e:"دلیل: ابن ماجہ، نسائی، ابن حبان (صحیح)۔ اور قیامت کے دن سب سے پہلے نماز کا حساب لیا جائے گا۔"},

sr16:{q:"اصحاب الفیل کا حملہ کرنے والا بادشاہ کون تھا اور کہاں کا تھا؟",o:["ابرہہ — یمن کا","ہرقل — روم کا","نجاشی — حبشہ کا","نعمان بن منذر — حیرہ کا"],e:"اس نے کعبہ کے بجائے اپنے کلیسا کی طرف لوگوں کو بلانے کی کوشش کی تھی؛ اللہ نے ابابیل کے ذریعے لشکر تباہ کیا (سورۃ الفیل)۔"},
sr17:{q:"جبیر بن مطعم رضی اللہ عنہ کی حدیث میں نبی <span class='ar'>ﷺ</span> کے کتنے نام بیان ہوئے؟",o:["۵ — محمد، احمد، الماحی، الحاشر، العاقب","۳ — محمد، احمد، العاقب","۹۹","۷"],e:"قرآن و حدیث میں ۹۹ ناموں کی کوئی دلیل نہیں؛ زبردستی گنتی پوری کرنا غلو ہے۔"},
sr18:{q:"نبی <span class='ar'>ﷺ</span> کی کنیت کیا تھی؟",o:["ابو القاسم","ابو حفص","ابو تراب","ابو الحسن"],e:"اس دور میں التباس سے بچنے کے لیے یہ کنیت رکھنے سے منع فرمایا تھا؛ اب رکھی جا سکتی ہے۔"},

sr25:{q:"قصی بن کلاب کا لقب ”مجمع“ کیوں پڑا؟",o:["بکھرے ہوئے قریش کو مکہ میں جمع کر کے ایک طاقتور قبیلہ بنایا","کعبہ کی چابی جمع کی","حاجیوں کا چندہ جمع کرتا تھا","نسب نامے جمع کیے"],e:"مجمع = جمع کرنے والا۔ ان کی وفات تقریباً ۴۸۰ عیسوی میں ہوئی۔"},
sr26:{q:"دار الندوہ کیا تھا؟",o:["مسجدِ حرام کے شمال میں قریش کا ”پارلیمنٹ ہاؤس“ جہاں فیصلے، مشورے، نکاح اور جنگ کے معاملات طے ہوتے تھے","کعبہ کا خزانہ","حاجیوں کی رہائش","قریش کا بازار"],e:"قصی بن کلاب نے اسے قائم کیا تھا۔"},
sr27:{q:"قصی نے کون سے ۵ اہم منصب اپنے پاس رکھے؟",o:["حجابہ/سدانہ، سقایہ، رفادہ، ندوہ، لواء","حجابہ، امارہ، قضا، ندوہ، لواء","سدانہ، سقایہ، زکات، ندوہ، جہاد","رفادہ، سقایہ، تجارت، لواء، قضا"],e:"حجابہ = کعبہ کی چابی، سقایہ = پانی پلانا، رفادہ = مہمان نوازی، ندوہ = مجلسِ شوریٰ کی صدارت، لواء = جھنڈا اٹھانا۔"},
sr28:{q:"عبد مناف کا اصل نام کیا تھا اور ان کے کتنے بیٹے تھے؟",o:["مغیرہ · ۴ بیٹے (ہاشم، المطلب، النوفل، عبد شمس)","عمرو · ۳ بیٹے","شیبہ · ۴ بیٹے","مجمع · ۵ بیٹے"],e:"ہاشم نبی <span class='ar'>ﷺ</span> کے پردادا تھے۔"},
sr29:{q:"ہاشم کا اصل نام کیا تھا اور لقب ”ہاشم“ کیوں پڑا؟",o:["عمرو · حاجیوں کے لیے روٹیاں توڑ کر شوربے میں ملا کر ثرید کھلانے کی وجہ سے","مغیرہ · کعبہ کی دیوار توڑنے کی وجہ سے","شیبہ · بتوں کو توڑنے کی وجہ سے","عمرو · دشمن کی صفیں توڑنے کی وجہ سے"],e:"ہاشم کا مطلب ”توڑنے والا“۔ انہی کی نسبت سے نبی <span class='ar'>ﷺ</span> ”ہاشمی“ کہلاتے ہیں۔"},
sr30:{q:"ہاشم نے قریش کے لیے کون سے ۲ بڑے تجارتی سفر کا نظام قائم کیا؟",o:["رحلۃ الشتاء (سردیوں میں یمن) اور رحلۃ الصیف (گرمیوں میں شام)","رحلۃ الشتاء (شام) اور رحلۃ الصیف (یمن)","رحلۃ الحج اور رحلۃ العمرہ","رحلۃ البحر اور رحلۃ البر"],e:"قرآن میں بھی ذکر: <span class='ar'>رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ</span>۔"},
sr31:{q:"ہاشم کی وفات کہاں ہوئی اور ان کے بیٹے کا نام ”شیبہ“ کیوں رکھا گیا؟",o:["غزہ (فلسطین) · بالوں میں سفیدی کی وجہ سے","مدینہ · ان کے دادا کے نام پر","مکہ · کعبہ کی نسبت سے","شام · وہاں کے رواج سے"],e:"شیبہ = سفید بال والا۔ یہی بعد میں ”عبد المطلب“ کے نام سے مشہور ہوئے۔"},
sr32:{q:"شیبہ کا نام ”عبد المطلب“ کیوں پڑا؟",o:["مکہ والوں نے سمجھا کہ مطلب کوئی نیا غلام خرید کر لائے ہیں","انہوں نے مطلب کی خدمت کی تھی","مطلب نے انہیں گود لیا تھا","وہ مطلب کے نام پر پیدا ہوئے تھے"],e:"بھتیجا ہونے کے باوجود یہی نام مشہور ہو گیا — ”مطلب کا غلام“۔"},
sr33:{q:"حضرت عبد اللہ کے فدیہ میں کتنے اونٹ ذبح کیے گئے؟",o:["۱۰۰","۱۰","۵۰","۱۰۰۰"],e:"قرعہ ہر بار عبد اللہ کے نام نکلتا اور ۱۰ اونٹ بڑھائے جاتے؛ دسویں مرتبہ (۱۰۰ اونٹ) پر اونٹوں کے نام نکلا۔"},
sr34:{q:"<span class='ar'>أَنَا ابْنُ الذَّبِيحَيْنِ</span> — ”دو ذبیح“ سے کون مراد ہیں؟",o:["حضرت اسماعیل علیہ السلام اور حضرت عبد اللہ","حضرت ابراہیم اور حضرت اسماعیل علیہما السلام","حضرت عبد اللہ اور حضرت عبد المطلب","حضرت اسحاق اور حضرت اسماعیل علیہما السلام"],e:"بعد میں اسلامی شریعت نے بھی انسان کی جان کی دیت ۱۰۰ اونٹ ہی مقرر کی۔"},
sr35:{q:"حضرت عبد اللہ کی وفات کہاں ہوئی اور کہاں دفن ہوئے؟",o:["مدینہ (یثرب) — ننھیال بنو نجار کے یہاں؛ ’دار النابغہ‘ میں دفن","مکہ — شعبِ بنی ہاشم میں","غزہ — فلسطین میں","ابواء — راستے میں"],e:"انتقال کے وقت نبی <span class='ar'>ﷺ</span> ابھی والدہ کے پیٹ میں تھے۔"},
sr36:{q:"نبی <span class='ar'>ﷺ</span> کو سب سے پہلے دودھ کس نے پلایا؟",o:["ثویبہ — ابو لہب کی لونڈی","حلیمہ سعدیہ — بنو سعد","آمنہ بنت وہب","ام ایمن"],e:"ثویبہ نے حضرت حمزہ اور ابو سلمہ رضی اللہ عنہما کو بھی دودھ پلایا؛ تینوں رضاعی بھائی بنے۔"},
sr37:{q:"رضاعت ثابت ہونے کی شرط کیا ہے؟",o:["۲ سال کے اندر ۵ مرتبہ پیٹ بھر کر دودھ پینا","۳ مرتبہ دودھ پینا","صرف ایک بار دودھ پینا","۲ سال کے بعد بھی دودھ پینا"],e:"رضاعت سے وہ تمام رشتے حرام ہوتے ہیں جو نسب سے حرام ہوتے ہیں، مگر وارث نہیں بنتے۔"},
sr38:{q:"حلیمہ سعدیہ کا تعلق کس قبیلے سے تھا اور ان کے شوہر کا نام؟",o:["بنو سعد (ہوازن کی شاخ) · حارث بن عبد العزیٰ (ابو کبشہ)","بنو نجار · ابو ذؤیب","بنو خزاعہ · حلیل","بنو زہرہ · وہب"],e:"کفارِ مکہ تحقیر کے لیے نبی <span class='ar'>ﷺ</span> کو ”ابن ابی کبشہ“ کہتے تھے۔"},
sr39:{q:"شقِ صدر کا واقعہ نبی <span class='ar'>ﷺ</span> کی زندگی میں کتنی بار پیش آیا؟",o:["۲ بار — بچپن میں (بنو سعد) اور معراج کے سفر سے قبل","۱ بار — صرف بچپن میں","۳ بار","۴ بار"],e:"حضرت انس رضی اللہ عنہ فرماتے ہیں کہ وہ آپ <span class='ar'>ﷺ</span> کے سینے پر سلائی کے نشانات دیکھتے تھے (صحیح مسلم)۔"},
sr40:{q:"والدہ کا انتقال کہاں ہوا اور اس وقت نبی <span class='ar'>ﷺ</span> کی عمر کتنی تھی؟",o:["ابواء کے مقام پر · ۶ سال","مدینہ میں · ۶ سال","مکہ میں · ۸ سال","ابواء میں · ۴ سال"],e:"یثرب سے واپسی پر ابواء میں بیماری، وفات اور تدفین ہوئی۔ آپ <span class='ar'>ﷺ</span> پیدائشی یتیم تھے۔"},
sr41:{q:"عبد المطلب کی وفات کے وقت نبی <span class='ar'>ﷺ</span> کی عمر کتنی تھی؟",o:["۸ سال، ۲ مہینے، ۱۰ دن","۶ سال","۱۰ سال","۱۲ سال"],e:"ان کے بعد والد کے سگے بھائی ابو طالب نے کفالت کی۔"},
sr42:{q:"ملکِ شام کے سفر میں کس عیسائی راہب نے نبی <span class='ar'>ﷺ</span> کو پہچانا؟",o:["بحیرا — بصریٰ کے قریب","ورقہ بن نوفل — مکہ میں","قس بن ساعدہ — یمن میں","نجاشی — حبشہ میں"],e:"اس وقت آپ <span class='ar'>ﷺ</span> کی عمر ۱۲ سال تھی؛ راہب نے آپ کو ”سردار“ اور ”رحمۃ للعالمین“ قرار دیا۔"},
sr43:{q:"جنگِ فجار کے وقت نبی <span class='ar'>ﷺ</span> کی عمر اور وہ مہینہ؟",o:["۲۰ برس · ذو القعدہ (حرمت والا مہینہ)","۲۵ برس · رجب","۲۰ برس · محرم","۱۵ برس · ذو الحجہ"],e:"”فجار“ لفظ ”فجور“ سے ہے — حرمت والے مہینے میں جنگ کرنا گناہ تھا، اسی لیے یہ نام پڑا۔"},
sr44:{q:"حلف الفضول میں کون سے ۵ قبائل شریک تھے؟",o:["بنو ہاشم، بنو المطلب، بنو اسد، بنو زہرہ، بنو تیم","بنو ہاشم، بنو امیہ، بنو مخزوم، بنو زہرہ، بنو تیم","بنو خزاعہ، بنو کنانہ، بنو اسد، بنو تیم، بنو سہم","بنو نجار، بنو اوس، بنو خزرج، بنو زہرہ، بنو اسد"],e:"عہد نامہ: مکہ میں ہر مظلوم کی حمایت کی جائے گی۔ آپ <span class='ar'>ﷺ</span> فرماتے تھے کہ اس کے بدلے سرخ اونٹ بھی پسند نہیں۔"},
sr45:{q:"حضرت خدیجہ رضی اللہ عنہا سے نکاح کے وقت نبی <span class='ar'>ﷺ</span> کی عمر کتنی تھی؟",o:["۲۵ سال (اس پر اجماع ہے)","۳۰ سال","۳۵ سال","۲۰ سال"],e:"خدیجہ رضی اللہ عنہا کی عمر کا مشہور قول ۴۰ سال ہے؛ دیگر اقوال ۲۸ یا ۳۰، جدید تحقیق میں ۲۸ راجح ہے۔"},
sr46:{q:"حضرت خدیجہ رضی اللہ عنہا کے پہلے دو شوہر کون تھے؟",o:["عتیق بن عائذ مخزومی اور ابو ہالہ تمیمی","ابو ہالہ تمیمی اور ورقہ بن نوفل","عتیق بن عائذ اور حکیم بن حزام","ابو سفیان اور ابو ہالہ"],e:"آپ رضی اللہ عنہا دو مرتبہ بیوہ تھیں؛ ابو ہالہ سے ایک بچہ بھی تھا جو بعد میں مسلمان ہوا۔"},
sr47:{q:"نبی <span class='ar'>ﷺ</span> کی کتنی اولاد تھی اور ان کے نام؟",o:["۶ — ۲ بیٹے (قاسم، عبد اللہ) اور ۴ بیٹیاں (زینب، رقیہ، ام کلثوم، فاطمہ)","۷ — ۳ بیٹے اور ۴ بیٹیاں","۵ — ۱ بیٹا اور ۴ بیٹیاں","۴ — ۲ بیٹے اور ۲ بیٹیاں"],e:"حضرت ابراہیم کے علاوہ تمام اولاد حضرت خدیجہ رضی اللہ عنہا سے تھی؛ ابراہیم حضرت ماریہ قبطیہ رضی اللہ عنہا سے تھے۔"},
sr48:{q:"نبی <span class='ar'>ﷺ</span> کی کون سی صاحبزادی آپ کی وفات کے بعد تک زندہ رہیں؟",o:["حضرت فاطمہ رضی اللہ عنہا — آپ کی وفات کے ۶ مہینے بعد فوت ہوئیں","حضرت زینب رضی اللہ عنہا","حضرت رقیہ رضی اللہ عنہا","حضرت ام کلثوم رضی اللہ عنہا"],e:"تمام بیٹے بچپن میں فوت ہو گئے اور باقی بیٹیاں آپ <span class='ar'>ﷺ</span> کی حیات میں۔"},

sr55:{q:"کعبہ کی ازسرِنو تعمیر کے وقت نبی <span class='ar'>ﷺ</span> کی عمر اور معمار کا نام؟",o:["۳۵ سال · معمار باقوم (رومی)","۳۰ سال · معمار ولید بن مغیرہ","۳۵ سال · معمار ابو امیہ","۴۰ سال · معمار باقوم"],e:"سیلاب سے دیواریں پھٹ گئی تھیں اور پہلے آگ سے کمزور ہو چکی تھیں۔"},
sr56:{q:"حجر / حطیم کیوں بنانا پڑا؟",o:["حلال مال کم پڑ گیا، اس لیے ابراہیم علیہ السلام کی بنیاد پر مکمل تعمیر نہ ہو سکی","جگہ کم تھی","قریش کا جھگڑا ہو گیا","سیلاب کا خطرہ تھا"],e:"شمال کی طرف تقریباً ۶ ہاتھ چھوڑ کر چھوٹی دیوار بنائی گئی — اسی کو حجر یا حطیم کہتے ہیں۔"},
sr57:{q:"حجرِ اسود کے جھگڑے کا حل کس کی تجویز سے نکلا؟",o:["ابو امیہ (سب سے بزرگ سردار) — جو صبح سب سے پہلے مسجدِ حرام میں داخل ہو وہ حکم بنے گا","ابو طالب","ولید بن مغیرہ","عبد المطلب"],e:"صبح سب سے پہلے نبی <span class='ar'>ﷺ</span> داخل ہوئے؛ قریش خوش ہو کر بولے <span class='ar'>هَذَا الأَمِينُ رَضِينَا</span>۔"},
sr58:{q:"نبی <span class='ar'>ﷺ</span> کو ”الامین“ کا لقب کیوں ملا؟",o:["معاملات میں بے مثال امانت داری، سچائی اور پرہیزگاری کی بنیاد پر","جنگ میں بہادری کی وجہ سے","سخاوت کی وجہ سے","علم کی وجہ سے"],e:"”الصادق“ لقب سچائی پر اور ”الامین“ امانت داری پر تھا۔"},
sr59:{q:"حضرت خدیجہ رضی اللہ عنہا کس طریقے پر تجارت کرواتی تھیں اور شام کے سفر میں ان کا غلام کون ساتھ گیا؟",o:["مضاربہ (نفع میں شراکت) · غلام میسرہ","مشارکہ · غلام زید بن حارثہ","مضاربہ · غلام زید بن حارثہ","اجارہ · غلام میسرہ"],e:"میسرہ نے امانت داری اور حسنِ سلوک کی تمام باتیں حضرت خدیجہ رضی اللہ عنہا تک پہنچائیں، جو نکاح کا سبب بنیں۔"},
sr60:{q:"نبی <span class='ar'>ﷺ</span> نے غارِ حرا میں عبادت کا معمول کتنے عرصے تک رکھا؟",o:["تقریباً ۳ سال — ہر سال رمضان کا پورا مہینہ","۶ مہینے","۱ سال","۵ سال"],e:"مہینہ پورا کر کے صبح مکہ آتے، کعبہ کا طواف کرتے، پھر گھر جاتے۔ حضرت خدیجہ رضی اللہ عنہا کھانا پہنچاتی تھیں۔"},

qw4:{q:"کلمہ کی کتنی قسمیں ہیں؟",o:["۳ — اسم، فعل، حرف","۲ — اسم اور فعل","۴ — اسم، فعل، حرف، جملہ","۲ — مفرد اور مرکب"],e:"کلمہ کی تین قسمیں: <span class='ar'>اِسْم</span>، <span class='ar'>فِعْل</span>، <span class='ar'>حَرْف</span>۔"},
qw5:{q:"اسم کی ٹھیک تعریف کون سی ہے؟",o:["ایسا کلمہ جو اپنا معنی خود بتلائے اور اس میں کوئی زمانہ نہ پایا جائے","ایسا کلمہ جس میں زمانہ پایا جائے","ایسا کلمہ جو اپنا معنی خود نہ بتلائے","ایسا کلمہ جس میں حکم پایا جائے"],e:"اسم میں تینوں زمانے (ماضی، حال، مستقبل) میں سے کوئی زمانہ نہیں پایا جاتا۔"},
qw6:{q:"فعل کی تعریف کیا ہے؟",o:["ایسا کلمہ جو اپنا معنی خود بتلائے اور اس میں زمانہ بھی پایا جائے","ایسا کلمہ جس میں زمانہ نہ پایا جائے","ایسا کلمہ جو دوسرے کے ساتھ مل کر معنی دے","دو یا زیادہ الفاظ کا مجموعہ"],e:"مثال: <span class='ar'>كَتَبَ</span> (اس نے لکھا)، <span class='ar'>يَكْتُبُ</span> (وہ لکھتا/لکھے گا)۔"},
qw7:{q:"حرف کی تعریف کیا ہے؟",o:["ایسا کلمہ جو اپنا معنی خود نہ بتلائے، بلکہ کسی دوسرے کلمے کے ساتھ مل کر بتلائے","ایسا کلمہ جس میں زمانہ پایا جائے","ایسا کلمہ جو اپنا معنی خود بتلائے","دو الفاظ کا مجموعہ"],e:"صرف <span class='ar'>إِلَى</span> کہنے سے بات سمجھ نہیں آتی؛ <span class='ar'>إِلَى المَسْجِدِ</span> سے پورا معنی ملتا ہے۔"},
qw8:{q:"علمِ نحو کی طرف پہلی توجہ دینے والے اور اس کی بنیاد رکھنے والے کون ہیں؟",o:["امیر المؤمنین حضرت علی رضی اللہ عنہ","ابو الاسود الدؤلی","امام خلیل بن احمد","سیبویہ"],e:"عجم میں اسلام پھیلنے پر غیر عرب لوگوں کی قرأت کی غلطیاں دور کرنے کے لیے حضرت علی رضی اللہ عنہ نے بنیاد رکھی۔"},
qw9:{q:"حضرت علی رضی اللہ عنہ کی سرپرستی میں قواعد جمع اور مرتب کرنے والے پہلے شاگرد کون تھے؟",o:["ابو الاسود الدؤلی","سیبویہ","امام خلیل","الکسائی"],e:"ابو الاسود الدؤلی نے حضرت علی رضی اللہ عنہ کی نظرِ ثانی میں اکثر قواعد جمع کیے۔"},
qw10:{q:"اس فن کا نام ”نحو“ کیوں پڑا؟",o:["حضرت علی رضی اللہ عنہ کے جملے <span class='ar'>مَا أَحْسَنَ هَذَا النَّحْوَ</span> سے، جس میں نحو کا مطلب طریقہ/انداز ہے","کیونکہ نحو کا مطلب گرامر ہے","کیونکہ سیبویہ کا لقب نحو تھا","کیونکہ یہ بصرہ کے محلے کا نام تھا"],e:"النحو = طریقہ، طرز، انداز۔ اسی مناسبت سے پورے علم کا نام علمِ نحو رکھ دیا گیا۔"},
qw11:{q:"لفظِ موضوع کی دوسری تقسیم کیا ہے؟",o:["مفرد اور مرکب","اسم اور فعل","مرفوع اور منصوب","تام اور ناقص"],e:"جو مفرد ہوگا اسی کو کلمہ کہا جاتا ہے؛ مرکب کو کلمہ نہیں کہا جاتا۔"},
qw12:{q:"مرکب کی تعریف کیا ہے؟",o:["دو یا دو سے زیادہ الفاظ کا مجموعہ","ایک اکیلا لفظ","ایسا لفظ جس کا معنی نہ ہو","ایسا لفظ جس میں زمانہ ہو"],e:"مرکب = دو یا زیادہ الفاظ کا گروہ۔"},
qw13:{q:"مرکب کی کتنی قسمیں ہیں؟",o:["۲ — تام اور ناقص","۳ — تام، ناقص، مفید","۴ — توصیفی، اضافی، اشاری، جاری","۶"],e:"مرکبِ تام (پورا مفہوم) اور مرکبِ ناقص (ادھورا مفہوم)۔"},
qw14:{q:"مرکبِ تام کے دوسرے نام کون سے ہیں؟",o:["مرکبِ مفید، جملہ، کلام","مرکبِ غیر مفید، کلمہ","مبتدا، خبر","فعل، فاعل، مفعول"],e:"<span class='ar'>مُرَكَّب مُفِيد</span>، <span class='ar'>جُمْلَة</span>، <span class='ar'>كَلَام</span> — تینوں مرکبِ تام کے نام ہیں۔"},
qw15:{q:"مرکبِ ناقص کا دوسرا نام کیا ہے؟",o:["مرکبِ غیر مفید","مرکبِ مفید","جملہ","کلام"],e:"ناقص = جس سے پوری بات سمجھ نہ آئے، اس لیے ”غیر مفید“۔"},
qw16:{q:"جنس (gender) کے اعتبار سے اسم کی کتنی قسمیں ہیں؟",o:["۲ — مذکر اور مؤنث","۳ — واحد، تثنیہ، جمع","۲ — معرب اور مبنی","۲ — معرفہ اور نکرہ"],e:"مذکر (زیدٌ، کتابٌ) اور مؤنث (فاطمۃٌ، کراسۃٌ)۔"},
qw17:{q:"اسم کی تقسیم کتنے مختلف اعتبارات سے کی گئی ہے؟",o:["۴ — جنس، عدد، اعراب، عام و خاص","۲","۳","۵"],e:"چار اعتبارات: جنس، عدد، اعراب (معرب/مبنی)، اور عام و خاص (معرفہ/نکرہ)۔"},

qw20:{q:"علاماتِ تانیث (مؤنث کی پہچان) کی تین علامتیں کون سی ہیں؟",o:["گول تا، الفِ مقصورہ، الفِ ممدودہ","گول تا، تنوین، الف لام","واو نون، یا نون، الف تا","کسرہ، فتحہ، ضمہ"],e:"اگر یہ تینوں نہ ہوں تو کلمہ مذکر ہوتا ہے — البتہ عورتوں کے نام (مریم، زینب) اور سماعی الفاظ بھی مؤنث ہوتے ہیں۔"},
qw21:{q:"عدد (number) کے اعتبار سے اسم کی قسمیں کون سی ہیں؟",o:["واحد، تثنیہ، جمع","مفرد، مرکب","معرفہ، نکرہ","ماضی، حال، مستقبل"],e:"واحد = ایک، تثنیہ = دو، جمع = دو سے زیادہ (رجلٌ / رجلانِ / رجالٌ)۔"},
qw22:{q:"کورس میں جمع کی کون سی تین قسمیں پڑھی گئی ہیں؟",o:["جمع مکسر، جمع مذکر سالم، جمع مؤنث سالم","جمع قلت، جمع کثرت، جمع منتہی الجموع","جمع مکسر، جمع سالم، جمع منتہی الجموع","جمع مذکر، جمع مؤنث، جمع مشترک"],e:"جمع منتہی الجموع کا نام ذکر ہوا مگر وہ ابھی نہیں پڑھائی گئی۔"},
qw23:{q:"جمع مذکر سالم کی پہچان کیا ہے؟",o:["واحد کا وزن سلامت رہے اور آخر میں واو نون یا یا نون آئے","آخر میں الف اور لمبی تا ہو","واحد کا وزن ٹوٹ جائے","آخر میں گول تا ہو"],e:"مثال: <span class='ar'>مُسْلِمُونَ / مُسْلِمِينَ</span>۔"},
qw24:{q:"جمع مؤنث سالم کی پہچان کیا ہے؟",o:["آخر میں الف اور لمبی تا ہو — جیسے <span class='ar'>مُسْلِمَاتٌ</span>","آخر میں واو نون ہو","واحد کا وزن ٹوٹ جائے","آخر میں گول تا ہو"],e:"لمبی تا جمع کی پہچان ہے، جبکہ گول تا واحد میں آتی ہے۔"},
qw25:{q:"جمع مکسر کس کو کہتے ہیں؟",o:["جس میں واحد کا وزن ٹوٹ جائے — جیسے <span class='ar'>رَجُل → رِجَال</span>","جس میں واو نون آئے","جس میں الف تا آئے","جس میں صرف الف لام آئے"],e:"مثالیں: <span class='ar'>كِتَاب → كُتُب</span>، <span class='ar'>قَلَم → أَقْلَام</span>۔"},
qw26:{q:"اعراب کے اعتبار سے اسم کی دو قسمیں کون سی ہیں؟",o:["معرب اور مبنی","معرفہ اور نکرہ","مذکر اور مؤنث","مرفوع اور منصوب"],e:"معرب: عامل بدلنے سے آخر کی حرکت بدلتی رہے (زیدٌ/زیداً/زیدٍ)۔ مبنی: کبھی نہ بدلے (ہذا، ذلک)۔"},
qw27:{q:"عام و خاص کے اعتبار سے اسم کی قسمیں اور معرفہ کی تعداد؟",o:["معرفہ (۷ قسمیں) اور نکرہ","معرفہ (۵ قسمیں) اور نکرہ","معرفہ (۱۰ قسمیں) اور نکرہ","معرفہ (۴ قسمیں) اور نکرہ"],e:"معرفہ کی سات قسمیں ہیں (علم، اسمِ اشارہ، اسمِ موصول، معرف باللام وغیرہ)۔"},
qw28:{q:"کلمہ کی کتنی اعرابی حالتیں ہوتی ہیں؟",o:["۴ — مرفوع، منصوب، مجرور، مجزوم","۳ — مرفوع، منصوب، مجرور","۲ — مرفوع اور منصوب","۵"],e:"مرفوع (رفع)، منصوب (نصب)، مجرور (جر)، مجزوم (جزم)۔"},
qw29:{q:"مجرور ہونا کس کے ساتھ خاص ہے؟",o:["صرف اسم کے ساتھ — فعل کبھی مجرور نہیں ہوتا","صرف فعل کے ساتھ","اسم اور فعل دونوں","صرف حرف کے ساتھ"],e:"فعل کے آخر میں زیر نہیں آتی۔ مرفوع اور منصوب دونوں (اسم + فعل) میں مشترک ہیں۔"},
qw30:{q:"مجزوم ہونا کس کے ساتھ خاص ہے؟",o:["صرف فعل کے ساتھ — اسم کے آخر میں جزم نہیں آتا","صرف اسم کے ساتھ","اسم اور فعل دونوں","صرف حرف کے ساتھ"],e:"جزم صرف فعل کی خصوصیت ہے، اسی لیے یہ فعل کی علامات میں بھی شمار ہوتی ہے۔"},
qw31:{q:"نسبت (voice) کے اعتبار سے فعل کی دو قسمیں؟",o:["معروف (active) اور مجہول (passive)","لازم اور متعدی","ماضی اور مضارع","معرب اور مبنی"],e:"معروف: نسبت فاعل کی طرف۔ مجہول: نسبت مفعول کی طرف (<span class='ar'>أُكِلَ التُّفَّاحُ</span>)۔"},
qw32:{q:"مجہول میں جو مفعول فاعل کی جگہ رکھا جاتا ہے، اسے کیا کہتے ہیں؟",o:["نائب فاعل (مفعول ما لم یسم فاعلہ)","مبتدا","خبر","مفعول بہ"],e:"<span class='ar'>أُكِلَ التُّفَّاحُ</span> میں ”التفاحُ“ نائب فاعل ہے۔"},
qw33:{q:"مفعول کی ضرورت کے اعتبار سے فعل کی قسمیں؟",o:["لازم (intransitive) اور متعدی (transitive)","معروف اور مجہول","ماضی، مضارع، امر","معرب اور مبنی"],e:"لازم: <span class='ar'>ذَهَبَ زَيْدٌ</span>۔ متعدی: <span class='ar'>ضَرَبَ زَيْدٌ عَمْراً</span>۔"},
qw34:{q:"فعلِ امر کے اندر کون سا زمانہ ہوتا ہے؟",o:["مستقبل (future) — حکم پہلے، کام بعد میں","ماضی","حال","کوئی زمانہ نہیں"],e:"ریویژن درس: امر میں مستقبل زمانہ ہوتا ہے کیونکہ حکم پہلے دیا جاتا ہے اور کام بعد میں ہوتا ہے۔"},
qw35:{q:"فعلِ مضارع میں کون سے زمانے پائے جاتے ہیں؟",o:["حال اور مستقبل دونوں","صرف حال","صرف مستقبل","ماضی اور حال"],e:"<span class='ar'>يَذْهَبُ</span> = وہ جاتا ہے (حال) یا جائے گا (مستقبل)۔"},
qw36:{q:"علمِ صرف کا خاص فائدہ کیا بتایا گیا ہے؟",o:["صیغہ پہچان کر درست ترجمہ کرنا","صرف اعراب لگانا","صرف جملے کی ساخت سمجھنا","صرف لغت یاد کرنا"],e:"نحو کا خاص فائدہ: عربی عبارت صحیح پڑھنا۔ صرف کا خاص فائدہ: صیغہ پہچان کر درست ترجمہ۔"},

qw45:{q:"حروفِ عاملہ کی کتنی اور کون سی قسمیں ہیں؟",o:["۴ — جارہ، مشبہ بالفعل، جازمہ، ناصبہ","۲ — جارہ اور ناصبہ","۳ — جارہ، جازمہ، عطف","۵"],e:"پہلی دو اسم پر داخل ہوتی ہیں، بعد کی دو فعلِ مضارع پر۔"},
qw46:{q:"حروفِ جارہ کی تعداد کتنی ہے؟",o:["۱۷","۱۰","۶","۵"],e:"۱۷ حروف؛ یہ اسم پر داخل ہو کر اس کے آخر کو جر/زیر دیتے ہیں — <span class='ar'>فِي المَسْجِدِ</span>۔"},
qw47:{q:"حروفِ مشبہ بالفعل کتنے ہیں اور کون سے؟",o:["۶ — إنَّ، أنَّ، كأنَّ، لكنَّ، ليت، لعلَّ","۵ — إنَّ، أنَّ، لكنَّ، ليت، لعلَّ","۴ — أن، لن، كي، إذن","۱۰"],e:"یہ مبتدا خبر (جملہ اسمیہ) پر داخل ہوتے ہیں۔"},
qw48:{q:"حروفِ مشبہ بالفعل کا عمل کیا ہے؟",o:["اسم (مبتدا) کو نصب دیتے ہیں اور خبر کو رفع","اسم کو رفع اور خبر کو نصب","فعل کو جزم دیتے ہیں","فعل کو نصب دیتے ہیں"],e:"مثال: <span class='ar'>زَيْدٌ قَائِمٌ → إِنَّ زَيْداً قَائِمٌ</span>۔"},
qw49:{q:"حروفِ جازمہ کتنے ہیں؟",o:["۵ — لم، لما، لامِ امر، لائے نہی، إن شرطیہ","۴ — أن، لن، كي، إذن","۶","۱۷"],e:"یہ فعلِ مضارع پر داخل ہو کر اس کے آخر کو جزم دیتے ہیں — <span class='ar'>لَمْ يَفْعَلْ</span>۔"},
qw50:{q:"حروفِ ناصبہ کتنے ہیں اور کون سے؟",o:["۴ — أن، لن، كي، إذن","۵ — لم، لما، لامِ امر، لائے نہی، إن","۶ — إنَّ، أنَّ، كأنَّ، لكنَّ، ليت، لعلَّ","۱۰"],e:"یہ فعلِ مضارع کو نصب دیتے ہیں — <span class='ar'>أَنْ يَذْهَبَ</span>، <span class='ar'>لَنْ يَفْعَلَ</span>۔"},
qw51:{q:"حروفِ غیر عاملہ کی دو قسمیں کون سی بتائی گئی ہیں؟",o:["حروفِ استفہام اور حروفِ عطف","حروفِ جارہ اور حروفِ عطف","حروفِ ناصبہ اور حروفِ جازمہ","حروفِ ندا اور حروفِ قسم"],e:"غیر عاملہ حروف جملے میں آتے ہیں مگر اعراب نہیں بدلتے۔"},
qw52:{q:"حروفِ استفہام کتنے ہیں اور کون سے؟",o:["۳ — ہمزہ، ہل، ما (تینوں کے معنی ”کیا“)","۲ — ہمزہ اور ہل","۴ — ہمزہ، ہل، ما، من","۵"],e:"<span class='ar'>هَلْ كَتَبَ زَيْدٌ؟</span> · <span class='ar'>مَا هَذَا؟</span>"},
qw53:{q:"حروفِ عطف کتنے ہیں؟",o:["۱۰","۶","۴","۱۷"],e:"واو، فا، ثم، حتیٰ، اما، ام، او، لا، بل، لکن — کل ۱۰۔"},
qw54:{q:"مرکبِ تام (جملہ) کی دو بنیادی قسمیں؟",o:["خبریہ اور انشائیہ","اسمیہ اور فعلیہ","تام اور ناقص","مفید اور غیر مفید"],e:"خبریہ: کہنے والے کو سچا یا جھوٹا کہا جا سکے۔ انشائیہ: نہ سچا نہ جھوٹا کہا جا سکے۔"},
qw55:{q:"جملہ خبریہ کی دو قسمیں اور ان کے اجزا؟",o:["اسمیہ (مبتدا + خبر) اور فعلیہ (فعل + فاعل + مفعول/جار مجرور)","اسمیہ (فعل + فاعل) اور فعلیہ (مبتدا + خبر)","امر اور نہی","تام اور ناقص"],e:"اسمیہ کا پہلا جزو اسم ہوتا ہے، فعلیہ کا پہلا جزو فعل۔"},

hz17c:{q:"اس حدیث سے مسواک کا شرعی حکم کیا ثابت ہوتا ہے؟",o:["مستحب — فرض نہیں، تاکہ امت مشقت میں نہ پڑے","فرض","واجب","مباح"],e:"حدیث کا ”لولا“ (اگر نہ ہوتا) کا انداز ہی بتا رہا ہے کہ حکم نہیں دیا گیا، یعنی فرض نہیں کیا گیا۔"},
hz17d:{q:"حدیث ۱۷ کے فوائد میں کون سا اصول بیان ہوا؟",o:["مفاسد کو دور کرنا مصالح حاصل کرنے سے پہلے ضروری ہے — پہلے نقصان روکو، پھر فائدے حاصل کرو","ہر مستحب کو فرض بنایا جا سکتا ہے","مشقت سے دین میں ثواب بڑھتا ہے","مسواک صرف جمعہ کے دن مسنون ہے"],e:"ساتھ ہی: اسلامی شریعت آسان ہے مشکل نہیں، اور کسی کو اس کی ہمت سے بڑھ کر تکلیف نہیں دی جاتی۔"},

hz21a:{q:"حدیث ۲۱ — <span class='ar'>دَعْهُمَا فَإِنِّي أَدْخَلْتُهُمَا طَاهِرَتَيْنِ</span> — کے راوی کون ہیں؟",o:["حضرت المغیرہ بن شعبہ رضی اللہ عنہ","حضرت حذیفہ بن الیمان رضی اللہ عنہ","حضرت انس بن مالک رضی اللہ عنہ","حضرت ابو قتادہ رضی اللہ عنہ"],e:"مغیرہ بن شعبہ رضی اللہ عنہ، کنیت ابو عیسیٰ، غزوۂ خندق کے سال اسلام لائے؛ ۱۳۶ احادیث کے راوی؛ وفات ۵۰ ہجری۔"},
hz21b:{q:"<span class='ar'>طَاهِرَتَيْنِ</span> سے کیا مراد ہے اور یہ کس مسئلے کی بنیاد ہے؟",o:["پاک حالت (با وضو) میں — یہی موزوں پر مسح کی سب سے اہم شرط ہے","نئے موزے — موزے نئے ہونے چاہئیں","سفید موزے — رنگ کی شرط","چمڑے کے موزے — مادے کی شرط"],e:"مسح کی اصل شرط یہی ہے کہ موزے وضو کی حالت میں پہنے گئے ہوں، نہ کہ ان کا مادہ یا رنگ۔"},
hz21c:{q:"<span class='ar'>فَأَهْوَيْتُ لِأَنْزِعَ خُفَّيْهِ</span> کا ترجمہ؟",o:["تو میں جھکا تاکہ آپ کے دونوں موزے اتاروں","تو میں جھکا تاکہ آپ کے پاؤں دھوؤں","تو میں آگے بڑھا تاکہ پانی لاؤں","تو میں بیٹھ گیا تاکہ انتظار کروں"],e:"أہویت = میں جھکا؛ أنزع = میں اتاروں؛ خفین = دونوں موزے۔"},
hz21d:{q:"حدیث ۲۱ سے مسح کا طریقہ اور ایک اخلاقی سبق کیا ملتا ہے؟",o:["مسح موزے کی بالائی جانب کیا جائے؛ اور علماء و بزرگوں کی خدمت مستحب عمل ہے","مسح نیچلی جانب کیا جائے؛ خدمت منع ہے","مسح تین مرتبہ کیا جائے؛ خدمت واجب ہے","مسح دونوں جانب کیا جائے؛ خدمت مکروہ ہے"],e:"مغیرہ رضی اللہ عنہ کا نبی <span class='ar'>ﷺ</span> کے موزے اتارنے کے لیے جھکنا خدمتِ بزرگان کی دلیل ہے۔"},

hz22a:{q:"حدیث ۲۲ کے راوی حضرت حذیفہ بن الیمان رضی اللہ عنہ کے بارے میں کیا صحیح ہے؟",o:["صاحبِ سرِ رسول تھے؛ ان کے والد بھی صحابی تھے جو احد میں غلط فہمی سے شہید ہوئے؛ وفات ۳۶ ہجری","وہ خیبر کے سال اسلام لائے؛ ۵۳۷۴ احادیث کے راوی","وہ انصاری تھے اور یومُ الحرہ میں شہید ہوئے","وہ نبی <span class='ar'>ﷺ</span> کے شہسوار تھے"],e:"کنیت ابو عبد اللہ۔ صحیحین میں ۳۷ احادیث، کل تقریباً ۲۲۰۔"},
hz22b:{q:"حدیث ۲۲ میں نبی <span class='ar'>ﷺ</span> نے سفر میں کون سے تین کام کیے؟",o:["پیشاب کیا، وضو کیا، اور موزوں پر مسح کیا","وضو کیا، نماز پڑھی، اور سو گئے","غسل کیا، وضو کیا، اور موزے اتارے","تیمم کیا، نماز پڑھی، اور سفر جاری رکھا"],e:"حدیث مختصر (<span class='ar'>مُخْتَصَرًا</span>) بیان کی گئی ہے — تین اعمال ترتیب کے ساتھ۔"},
hz22c:{q:"<span class='ar'>مُخْتَصَرًا</span> کا اس حدیث میں کیا مطلب ہے؟",o:["یہ حدیث اختصار (مختصر انداز) کے ساتھ بیان کی گئی ہے","نبی <span class='ar'>ﷺ</span> نے مختصر وضو کیا","سفر مختصر تھا","مسح مختصر کیا گیا"],e:"یہ راوی کی طرف سے اشارہ ہے کہ روایت کا متن مختصر نقل کیا گیا ہے۔"},
hz22d:{q:"حدیث ۲۲ سے مسح کی مدت کا کیا حکم مستنبط ہوتا ہے؟",o:["مسافر ۳ دن ۳ راتیں، مقیم ۱ دن ۱ رات — بشرطیکہ اس دوران غسل واجب نہ ہوا ہو","دونوں کے لیے ۱ دن ۱ رات","دونوں کے لیے ۳ دن ۳ راتیں","کوئی مدت مقرر نہیں"],e:"اور ہر حدثِ اصغر (پیشاب وغیرہ) سے موزوں پر مسح کرنا جائز ہے — مسح باطل نہیں ہوتا۔"},

hz24a:{q:"حدیث ۲۴ — <span class='ar'>لَا يَنْصَرِفْ حَتَّى يَسْمَعَ صَوْتًا أَوْ يَجِدَ رِيحًا</span> — کے راوی کون ہیں؟",o:["حضرت عبد اللہ بن زید بن عاصم المازنی رضی اللہ عنہ، ان سے عباد بن تمیم","حضرت ابو ہریرہ رضی اللہ عنہ، ان سے ہمام","حضرت انس رضی اللہ عنہ، ان سے قتادہ","حضرت عائشہ رضی اللہ عنہا، ان سے عروہ"],e:"عبد اللہ بن زید رضی اللہ عنہ انصاری صحابی ہیں؛ انہی سے نبی <span class='ar'>ﷺ</span> کے وضو کا مکمل طریقہ بھی مروی ہے۔"},
hz24b:{q:"<span class='ar'>يُخَيَّلُ إِلَيْهِ</span> کا ترجمہ؟",o:["اسے خیال آتا ہے / گمان ہوتا ہے","اسے یقین ہو جاتا ہے","اسے حکم دیا جاتا ہے","اسے معلوم ہو جاتا ہے"],e:"یہی لفظ مسئلے کی جان ہے: محض گمان اور خیال — یقین نہیں۔"},
hz24c:{q:"اس حدیث سے کون سا فقہی قاعدہ ثابت ہوتا ہے؟",o:["یقین شک سے زائل نہیں ہوتا — شک پر وضو نہیں ٹوٹے گا اور نماز باطل نہیں ہوگی","شک ہو تو نماز دہرانی چاہیے","شک ہو تو وضو دہرانا واجب ہے","شک کی حالت میں نماز مکروہ ہے"],e:"آواز یا بو ہوا خارج ہونے کی علامتیں ہیں — ان کے بغیر محض وسوسہ معتبر نہیں۔ بلا سبب نماز توڑنا بھی ممنوع ہے۔"},
hz24d:{q:"اگر کسی کو نماز میں ہوا خارج ہونے کا یقین ہو جائے تو؟",o:["نماز توڑ کر وضو کرنا ہوگا — کیونکہ اب شک نہیں یقین ہے","پھر بھی نماز جاری رکھے","صرف سلام پھیر دے","نماز بعد میں دہرا لے مگر اب جاری رکھے"],e:"حدیث کا حکم صرف شک کی حالت کے لیے ہے۔ ہوا خارج ہونے سے وضو ٹوٹ جاتا ہے، چاہے آواز سے ہو یا بغیر آواز کے۔"},

hz28a:{q:"حدیث ۲۸ کے مطابق فطرت کی پانچ چیزیں کون سی ہیں؟",o:["ختان، استحداد، قص الشارب، تقلیم الاظفار، نتف الابط","مسواک، وضو، غسل، استنجا، ختان","ناخن کاٹنا، بال کاٹنا، غسل، مسواک، ختان","ختان، مسواک، ناک میں پانی، ناخن کاٹنا، داڑھی بڑھانا"],e:"یعنی ختنہ، زیرِ ناف بال صاف کرنا، مونچھیں کاٹنا، ناخن کاٹنا، اور بغل کے بال اکھاڑنا۔"},
hz28b:{q:"<span class='ar'>الْاسْتِحْدَاد</span> اور <span class='ar'>نَتْفُ الْإِبِط</span> کا معنی؟",o:["زیرِ ناف بال صاف کرنا · بغل کے بال اکھاڑنا","ناخن کاٹنا · مونچھیں کاٹنا","ختنہ کرنا · داڑھی بڑھانا","مسواک کرنا · ناک صاف کرنا"],e:"استحداد لفظ ”حدید“ (لوہا/استرا) سے ہے۔ نتف کا معنی اکھاڑنا ہے — اسی لیے مونڈنے کے بجائے اکھاڑنے کی کوشش بہتر ہے۔"},
hz28c:{q:"حدیث ۲۸ کے فوائد میں بغل کے بالوں کے بارے میں کیا کہا گیا؟",o:["کسی صحیح حدیث میں مونڈنے کا ذکر نہیں؛ کوشش یہ ہو کہ اکھاڑے جائیں، اگرچہ آج اکثر لوگ مونڈتے ہیں","صرف مونڈنا مسنون ہے","انہیں چھوڑ دینا بہتر ہے","یہ مسئلہ حدیث میں نہیں ہے"],e:"متن کا لفظ <span class='ar'>نَتْف</span> (اکھاڑنا) ہے، <span class='ar'>حَلْق</span> (مونڈنا) نہیں۔"},
hz28d:{q:"حدیث ۲۸ میں بڑی مونچھیں رکھنے کے بارے میں کون سا فائدہ بیان ہوا؟",o:["یہ غیر فطری عمل ہے — آتش پرست اس کے عادی تھے، اس لیے مسلمانوں کو منع کیا گیا","یہ مستحب ہے","یہ مباح ہے","اس کا کوئی حکم نہیں"],e:"دینِ اسلام نظافت اور طہارت اختیار کرنے کی تلقین کرتا ہے؛ ناخن بڑھانا بھی فطرت کے منافی ہے۔"},

hz33a:{q:"حدیث ۳۳ (عورت کو احتلام) کی راوی کون ہیں اور سوال کس نے کیا تھا؟",o:["راوی: ام سلمہ رضی اللہ عنہا · سوال: ام سلیم رضی اللہ عنہا، ابو طلحہ رضی اللہ عنہ کی بیوی","راوی: عائشہ رضی اللہ عنہا · سوال: ام حبیبہ رضی اللہ عنہا","راوی: ام سلیم رضی اللہ عنہا · سوال: ام سلمہ رضی اللہ عنہا","راوی: عائشہ رضی اللہ عنہا · سوال: فاطمہ بنت ابی حبیش رضی اللہ عنہا"],e:"ام سلمہ رضی اللہ عنہا نبی <span class='ar'>ﷺ</span> کی زوجہ مطہرہ اور سب سے آخر میں وفات پانے والی امہات المؤمنین ہیں۔"},
hz33b:{q:"<span class='ar'>نَعَمْ، إِذَا رَأَتِ الْمَاءَ</span> کا ترجمہ اور اس کا حکم؟",o:["”ہاں، جب وہ پانی (منی) دیکھے“ — یعنی منی دیکھنے پر غسل واجب ہے","”ہاں، جب وہ پانی پیے“ — کھانے پینے کا مسئلہ","”ہاں، جب پانی مل جائے“ — تیمم کا مسئلہ","”ہاں، جب وہ پانی میں اترے“ — غسل کا طریقہ"],e:"غسل کا مدار منی کے خارج ہونے پر ہے، محض خواب دیکھنے پر نہیں۔"},
hz33c:{q:"<span class='ar'>إِنَّ اللهَ لَا يَسْتَحْيِي مِنَ الْحَقِّ</span> کا ترجمہ؟",o:["بے شک اللہ حق (سچائی) سے شرم نہیں فرماتا","بے شک اللہ حق کو پسند فرماتا ہے","بے شک اللہ شرم کرنے والوں کو پسند کرتا ہے","بے شک اللہ حق کو ظاہر فرماتا ہے"],e:"ام سلیم رضی اللہ عنہا نے اپنے نازک سوال کا آغاز اسی تمہید سے کیا — یہ ادبِ گفتگو کی مثال ہے۔"},
hz33d:{q:"حدیث ۳۳ سے کون سا تربیتی فائدہ نکلتا ہے؟",o:["شرم و حیا علم کے حصول میں رکاوٹ نہیں ہونی چاہیے، اور گفتگو کا انداز ایسا ہو کہ سننے والے پر ناگوار اثر نہ پڑے","عورتوں کو سوال نہیں کرنا چاہیے","ایسے مسائل پر بات کرنا مکروہ ہے","یہ سوال صرف مردوں کے لیے تھا"],e:"ساتھ ہی یہ کہ حیا اللہ کی صفاتِ عالیہ میں سے ایک صفت ہے، جیسا اس کی شان کے لائق ہے۔"},

hz39a:{q:"حدیث ۳۹ (پانچ خصوصیات) کے راوی کون ہیں؟",o:["حضرت جابر بن عبد اللہ الانصاری رضی اللہ عنہ","حضرت ابو ہریرہ رضی اللہ عنہ","حضرت انس بن مالک رضی اللہ عنہ","حضرت عبد اللہ بن عمر رضی اللہ عنہ"],e:"جابر رضی اللہ عنہ بیعتِ عقبہ میں اپنے والد کے ساتھ شریک تھے؛ ان کے والد عبد اللہ رضی اللہ عنہ احد میں شہید ہوئے۔"},
hz39b:{q:"حدیث ۳۹ میں بیان کی گئی پانچ خصوصیات کون سی ہیں؟",o:["رعب سے مدد، زمین کا مسجد و طہور ہونا، غنیمت کا حلال ہونا، شفاعت، اور تمام لوگوں کی طرف بھیجنا","قرآن، معراج، شفاعت، کوثر، اور ختم نبوت","نماز، روزہ، زکات، حج، اور جہاد","علم، حلم، صبر، شکر، اور توکل"],e:"<span class='ar'>أُعْطِيتُ خَمْسًا لَمْ يُعْطَهُنَّ أَحَدٌ مِنَ الْأَنْبِيَاءِ قَبْلِي</span> — یہ پانچ آپ <span class='ar'>ﷺ</span> کی خصوصیات ہیں۔"},
hz39c:{q:"<span class='ar'>وَجُعِلَتْ لِيَ الْأَرْضُ مَسْجِدًا وَطَهُورًا</span> سے کون سا فقہی مسئلہ نکلتا ہے؟",o:["زمین سجدہ گاہ بھی ہے اور پاک کرنے والی بھی — اسی سے تیمم کی اصل ثابت ہوتی ہے","صرف مسجد میں نماز جائز ہے","زمین پر سجدہ کرنا فرض ہے","مٹی کھانا جائز ہے"],e:"اسی لیے امام بخاری نے یہ حدیث کتاب التیمم میں لائی ہے۔ ممنوع مقامات کے علاوہ ہر جگہ نماز ہو سکتی ہے۔"},
hz39d:{q:"حدیث ۳۹ کے مطابق نبی <span class='ar'>ﷺ</span> اور سابقہ انبیا کی بعثت میں بنیادی فرق کیا ہے؟",o:["ہر نبی خاص اپنی قوم کی طرف بھیجا جاتا تھا، مگر آپ <span class='ar'>ﷺ</span> تمام انسانیت کی طرف","سابقہ انبیا کو شفاعت نہیں دی گئی تھی","سابقہ انبیا پر غنیمت حلال تھی","سابقہ انبیا کو کتاب نہیں دی گئی تھی"],e:"<span class='ar'>وَبُعِثْتُ إِلَى النَّاسِ عَامَّةً</span>۔ اسی سے ثابت ہوتا ہے کہ آپ <span class='ar'>ﷺ</span> تمام انبیا میں افضل ہیں۔"},

hz41a:{q:"حدیث ۴۱ میں کس خاتون کو کتنے عرصے تک استحاضہ رہا؟",o:["ام حبیبہ رضی اللہ عنہا — سات (۷) سال","فاطمہ بنت ابی حبیش رضی اللہ عنہا — تین سال","ام سلیم رضی اللہ عنہا — پانچ سال","ام سلمہ رضی اللہ عنہا — سات سال"],e:"راوی سیدہ عائشہ رضی اللہ عنہا ہیں۔ ام حبیبہ بنت جحش رضی اللہ عنہا عبد الرحمن بن عوف رضی اللہ عنہ کی زوجہ تھیں۔"},

um29:{q:"حدثِ اصغر سے کیا واجب ہوتا ہے؟",o:["وضو — جیسے ہوا نکلنا، پیشاب، پاخانہ، مذی، ودی","غسل","تیمم","صرف ہاتھ دھونا"],e:"حدثِ اکبر سے غسل واجب ہوتا ہے — جیسے جنابت، احتلام، حیض اور نفاس۔"},
um30:{q:"طہارت کی شرعی تعریف کیا ہے؟",o:["<span class='ar'>رَفْعُ الحَدَثِ وَإِزَالَةُ النَّجَسِ</span> — حدث کو ختم کرنا اور نجاست کو زائل کرنا","صرف پانی سے نہانا","صرف وضو کرنا","دل کی صفائی"],e:"رفع الحدث = وضو/غسل کے ذریعے۔ ازالۃ النجس = پانی سے کپڑے، جسم یا جگہ سے ناپاکی ہٹانا۔"},
um31:{q:"طہارت کی جگہ کے اعتبار سے دو قسمیں کون سی ہیں؟",o:["طہارتِ معنویہ (دل کی پاکی) اور طہارتِ حسیہ (محسوس چیزوں سے)","طہارتِ صغریٰ اور کبریٰ","طہارتِ ظاہری اور باطنی صرف","طہارتِ وضو اور غسل"],e:"معنویہ کی دلیل: <span class='ar'>قَدْ أَفْلَحَ مَنْ زَكَّاهَا</span> اور <span class='ar'>إِنَّمَا المُشْرِكُونَ نَجَسٌ</span>۔"},
um32:{q:"الوضوء کا لغوی معنی کیا ہے؟",o:["خوبصورتی، چمک (<span class='ar'>وَضَاءَة</span>)","دھونا","صفائی","پانی"],e:"اصطلاحی تعریف (شیخ ابن عثیمین): <span class='ar'>التَّعَبُّدُ لِلَّهِ بِغَسْلِ أَعْضَاءٍ مَخْصُوصَةٍ عَلَى صِفَةٍ مَخْصُوصَةٍ</span>۔"},
um33:{q:"دوسری حدیث <span class='ar'>لا يَقْبَلُ اللهُ صَلاةَ أَحَدِكُمْ إِذَا أَحْدَثَ حَتَّى يَتَوَضَّأَ</span> سے کیا ثابت ہوتا ہے؟",o:["وضو صلاۃ کے لیے شرط ہے — بغیر وضو صلاۃ قبول نہیں","وضو صلاۃ کا رکن ہے","وضو مستحب ہے","وضو صرف فجر کے لیے ضروری ہے"],e:"شرط عبادت سے خارج ہوتی ہے مگر ضروری ہے (جیسے قبلہ رخ ہونا)؛ رکن عبادت کے اندر داخل ہوتا ہے (جیسے سجدہ)۔"},
um34:{q:"اگر کسی نے بھول کر بغیر وضو صلاۃ پڑھ لی تو حکم کیا ہے؟",o:["معلوم ہونے پر دوبارہ وضو کر کے صلاۃ پڑھنی ہوگی، مگر گناہ نہیں","کچھ نہیں کرنا، صلاۃ ہو گئی","کفارہ دینا ہوگا","قضا کے ساتھ صدقہ بھی"],e:"یہ روزے کے مسئلے سے مختلف ہے: روزے میں بھول کر کھا لینے سے روزہ نہیں ٹوٹتا، مگر نماز باطل ہو جاتی ہے۔"},
um35:{q:"کتا برتن میں منہ ڈال دے تو برتن کو کتنی بار دھونا ہے؟",o:["۷ بار — اور ایک بار (بہتر ہے پہلی مرتبہ) مٹی کے ساتھ","۳ بار","۵ بار","۸ بار، آٹھویں مٹی سے"],e:"”آٹھویں مرتبہ مٹی“ سے مراد ۷ دفعہ دھونا ہے، جس میں سے ایک بار مٹی ملا کر رگڑنا ہے۔"},
um36:{q:"ٹھہرے ہوئے پانی میں پیشاب کرنے اور اس میں جنابت کا غسل کرنے کا حکم؟",o:["دونوں حرام ہیں","دونوں مکروہ ہیں","پیشاب حرام، غسل جائز","دونوں جائز ہیں اگر پانی زیادہ ہو"],e:"حدیث میں ”ثم یغتسل“ پر جزم ہے، یعنی پیشاب کرنا بھی مستقل منع ہے اور غسل کرنا بھی۔"},
um37:{q:"”دو قلے“ (<span class='ar'>قُلَّتَيْن</span>) کی مقدار تقریباً کتنی بتائی گئی ہے؟",o:["تقریباً ۲۵۰ کلو/لیٹر","تقریباً ۱۰۰ لیٹر","تقریباً ۵۰۰ لیٹر","تقریباً ۵۰ لیٹر"],e:"پہلی رائے: ۲ قلے ہو تو رنگ، بو یا مزہ بدلنے تک پانی ناپاک نہیں ہوتا۔ دوسری رائے (امام مالک): کم یا زیادہ، جب تک تین صفات میں سے کوئی نہ بدلے پانی پاک ہے۔"},
um38:{q:"انسانی شرمگاہ سے نکلنے والی ۴ چیزیں کون سی ہیں؟",o:["پیشاب، منی، مذی، ودی","پیشاب، پاخانہ، منی، مذی","منی، مذی، ودی، حیض","پیشاب، منی، ودی، نفاس"],e:"پیشاب، مذی اور ودی = حدثِ اصغر۔ منی = حدثِ اکبر (اس سے غسل واجب ہوتا ہے)۔"},
um39:{q:"مذی نکلنے پر کیا واجب ہوتا ہے؟",o:["صرف وضو، اور جس جگہ لگی ہو اسے دھونا — غسل واجب نہیں","غسل واجب ہوتا ہے","کچھ بھی نہیں","پورا کپڑا دھونا"],e:"مذی ایک نجاست ہے جو طہارتِ صغریٰ کو توڑتی ہے، مگر حدثِ اکبر نہیں۔"},
um40:{q:"مذی کی حدیث کے راوی کون ہیں اور نبی <span class='ar'>ﷺ</span> سے کس نے پوچھا تھا؟",o:["راوی: حضرت علی بن ابی طالب رضی اللہ عنہ · پوچھنے والے: مقداد بن الاسود رضی اللہ عنہ","راوی: ابو ہریرہ رضی اللہ عنہ · پوچھنے والے: مقداد رضی اللہ عنہ","راوی: مقداد رضی اللہ عنہ · پوچھنے والے: علی رضی اللہ عنہ","راوی: عثمان رضی اللہ عنہ · پوچھنے والے: حمران"],e:"حضرت علی رضی اللہ عنہ نے نبی <span class='ar'>ﷺ</span> کی صاحبزادی (حضرت فاطمہ رضی اللہ عنہا) کی وجہ سے خود پوچھنے میں شرم محسوس کی۔"},
um41:{q:"موزوں پر مسح کی مدت کتنی ہے؟",o:["مقیم: ۱ دن ۱ رات · مسافر: ۳ دن ۳ راتیں","مقیم: ۳ دن · مسافر: ۱ دن","دونوں کے لیے ۱ دن ۱ رات","دونوں کے لیے ۳ دن ۳ راتیں"],e:"جنابت لاحق نہ ہو تو موزے اتارنا ضروری نہیں؛ پیشاب/قضائے حاجت سے مسح باطل نہیں ہوتا۔"},
um42:{q:"موزوں پر مسح کی سب سے اہم شرط کیا ہے؟",o:["موزے با وضو حالت (وضو کر کے پاک ہونے کے بعد) پہنے گئے ہوں","موزے چمڑے کے ہوں","موزے نئے ہوں","موزے سفید ہوں"],e:"حدیثِ مغیرہ رضی اللہ عنہ: <span class='ar'>دَعْهُمَا فَإِنِّي أَدْخَلْتُهُمَا طَاهِرَتَيْنِ</span>۔"},
um43:{q:"گردن کا مسح کرنے کا حکم کیا ہے؟",o:["بدعت ہے — اس کی کوئی صحیح دلیل نہیں","سنت ہے","واجب ہے","مستحب ہے"],e:"سر کے مسح کا مسنون طریقہ: آگے سے گدی تک لے جائیں اور وہیں سے واپس آگے لائیں۔ کان سر کا حصہ ہیں — <span class='ar'>الأُذُنَانِ مِنَ الرَّأْسِ</span>۔"},
um44:{q:"سواک کا لغوی معنی کیا ہے؟",o:["رگڑنا","صفائی","لکڑی","خوشبو"],e:"مسواک کے ذریعے منہ اور دانت رگڑے جاتے ہیں۔ عموماً پیلو کے درخت کی جڑ ہوتی ہے؛ نیم وغیرہ بھی جائز ہے۔"},
um45:{q:"سیدہ عائشہ رضی اللہ عنہا کی روایت میں مسواک کی فضیلت کون سے الفاظ سے بیان ہوئی؟",o:["<span class='ar'>السِّوَاكُ مَطْهَرَةٌ لِلْفَمِ مَرْضَاةٌ لِلرَّبِّ</span>","<span class='ar'>السِّوَاكُ سُنَّةٌ مُؤَكَّدَةٌ</span>","<span class='ar'>السِّوَاكُ نِصْفُ الوُضُوءِ</span>","<span class='ar'>السِّوَاكُ زِينَةُ الفَمِ</span>"],e:"یعنی منہ کی صفائی اور رب کی رضامندی کا ذریعہ۔"},
um46:{q:"نبی <span class='ar'>ﷺ</span> کا آخری عمل (آخری وقتوں میں) کیا تھا؟",o:["مسواک کرنا","نماز پڑھنا","دعا کرنا","قرآن کی تلاوت"],e:"سیدہ عائشہ رضی اللہ عنہا کی روایت: ان کے بھائی عبد الرحمن بن ابی بکر کی تر مسواک کو انہوں نے چبا کر نرم کیا اور آپ <span class='ar'>ﷺ</span> نے بہترین طریقے سے مسواک کی۔"},
um47:{q:"خف اور جورب میں کیا فرق ہے؟",o:["خف اکثر چمڑے کے موزے، جورب کپڑے وغیرہ کے موزے","خف کپڑے کے، جورب چمڑے کے","خف لمبے، جورب چھوٹے","دونوں ایک ہی ہیں"],e:"خف کی جمع <span class='ar'>خِفَاف</span>، جورب کی جمع <span class='ar'>جَوَارِب</span>۔ نبی <span class='ar'>ﷺ</span> سے چمڑے کے موزوں پر مسح ثابت ہے، صحابہ سے کپڑے کے بھی۔"},
um48:{q:"وضو میں اعضا کو کتنی بار دھونا فرض ہے اور کتنی بار مستحب؟",o:["۱ بار فرض · ۳ بار مستحب/افضل (۲ بار بھی جائز)","۳ بار فرض · ۱ بار مستحب","۲ بار فرض · ۳ بار مستحب","۱ بار فرض · ۵ بار مستحب"],e:"۳ سے زیادہ دھونا زیادتی اور ظلم شمار ہوتا ہے: <span class='ar'>فَمَنْ زَادَ أَوْ نَقَصَ فَقَدْ أَسَاءَ وَظَلَمَ</span>۔ مسح صرف ۱ بار۔"},
um49:{q:"وضو میں ترتیب کا حکم کیا ہے؟",o:["فرض ہے — سورۃ المائدہ آیت ۶ کی ترتیب توڑی تو وضو باطل","سنت ہے","مستحب ہے","کوئی حکم نہیں"],e:"چہرہ ← ہاتھ کہنیوں تک ← سر کا مسح ← پاؤں ٹخنوں تک۔"},
um50:{q:"نیند سے اٹھنے پر برتن میں ہاتھ ڈالنے سے پہلے کیا حکم ہے؟",o:["تین بار ہاتھ دھونا — <span class='ar'>فَإِنَّ أَحَدَكُمْ لا يَدْرِي أَيْنَ بَاتَتْ يَدُهُ</span>","صرف ایک بار دھونا","کچھ نہیں","وضو کرنا"],e:"بعض علماء کے نزدیک واجب، بعض کے نزدیک مستحب۔ سائنسی طور پر بھی ہاتھ پر جراثیم لگ سکتے ہیں۔"},

um60:{q:"امام الشافعی رحمہ اللہ نے <span class='ar'>إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ</span> کے بارے میں کیا فرمایا؟",o:["یہ حدیث ایک تہائی (۱/۳) دینی علم کے برابر ہے","یہ حدیث نصف دین ہے","یہ حدیث چوتھائی علم ہے","یہ پورا دین ہے"],e:"امام احمد رحمہ اللہ کے مطابق اسلام کی بنیاد ۳ احادیث پر ہے جن میں یہ پہلی ہے۔"},
um61:{q:"امام احمد رحمہ اللہ کے مطابق اسلام کی بنیاد کون سی ۳ احادیث پر ہے؟",o:["<span class='ar'>إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ</span> · <span class='ar'>مَنْ أَحْدَثَ فِي أَمْرِنَا هَذَا…</span> · <span class='ar'>الحَلالُ بَيِّنٌ وَالحَرَامُ بَيِّنٌ</span>","<span class='ar'>إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ</span> · <span class='ar'>الدِّينُ النَّصِيحَةُ</span> · <span class='ar'>لا ضَرَرَ وَلا ضِرَارَ</span>","صرف پہلی اور تیسری","بنیاد ۴ احادیث پر ہے"],e:"پہلی حدیث باطنی عمل کی دلیل ہے، دوسری ظاہری عمل کی، اور تیسری حلال حرام کی بنیاد۔"},
um62:{q:"امام ابو داؤد رحمہ اللہ نے کتنی احادیث جمع کیں اور کتنی اپنی سنن میں درج کیں؟",o:["۵ لاکھ جمع کیں، ۴,۸۰۰ سنن میں درج کیں، اور فرمایا دین کے لیے ۴ احادیث کافی ہیں","۱ لاکھ جمع کیں، ۴,۸۰۰ درج کیں","۵ لاکھ جمع کیں، ۲,۸۰۰ درج کیں","۶ لاکھ جمع کیں، ۵,۰۰۰ درج کیں"],e:"وہ ۴ احادیث: إنما الأعمال بالنيات؛ من حسن إسلام المرء تركه ما لا يعنيه؛ لا يؤمن أحدكم…؛ الحلال بين والحرام بين۔"},
um63:{q:"امام مسلم کی روایت کے مطابق قیامت کے دن سب سے پہلے کن ۳ لوگوں کا فیصلہ ہوگا؟",o:["شہید، سخی (مال خرچ کرنے والا)، اور عالم/قاریِ قرآن","شہید، حاجی، اور عالم","سخی، حافظ، اور مؤذن","شہید، امام، اور معلم"],e:"تینوں کو <span class='ar'>كَذَبْتَ</span> کہا جائے گا کیونکہ مقصود دکھاوا اور نام و نمود تھا، اور انہیں جہنم میں ڈال دیا جائے گا۔"},
um64:{q:"نیت کی فقہی حیثیت کے بارے میں صحیح بات کیا ہے؟",o:["نیت کی جگہ دل ہے، زبان سے ادا نہیں کی جاتی؛ وضو میں رکن/شرط ہے، اور روزہ نماز میں عمل کے بعد بھی استمرار لازمی","نیت زبان سے کہنی ضروری ہے","نیت صرف روزے میں شرط ہے","نیت صرف حج میں شرط ہے"],e:"نماز یا روزے کے دوران اگر دل میں توڑنے کا ارادہ کر لے تو بعض علماء کے مطابق وہ باطل ہو جاتا ہے کیونکہ تسلسل باقی نہیں رہا۔"},
um65:{q:"حیض کا لغوی معنی کیا ہے؟",o:["بہنا (جیسے پانی بہتا ہے)","رکنا","ناپاکی","مہینہ"],e:"اصطلاحی معنی: وہ ماہواری خون جو ایک بالغہ، غیر حاملہ عورت سے ہر مہینے مخصوص ایام میں بغیر کسی بیماری کے نکلتا ہے۔"},
um66:{q:"حائضہ عورت کے بارے میں نماز اور روزے کی قضا کا حکم کیا ہے؟",o:["نماز حرام ہے اور اس کی قضا بھی نہیں؛ روزہ حرام ہے مگر اس کی قضا ہے","دونوں کی قضا ہے","کسی کی قضا نہیں","نماز کی قضا ہے، روزے کی نہیں"],e:"اس پر اجماع ہے۔ معاذہ (تابعیہ) کے سوال پر سیدہ عائشہ رضی اللہ عنہا نے فرمایا: ہمیں روزے کی قضا کا حکم دیا جاتا تھا، نماز کی نہیں۔"},
um67:{q:"سیدہ عائشہ رضی اللہ عنہا نے معاذہ سے پوچھا <span class='ar'>أَحَرُورِيَّةٌ أَنْتِ؟</span> — ”حروراء“ کیا تھا؟",o:["ایک گاؤں جہاں سے خوارج نکلے تھے، جو حضرت علی رضی اللہ عنہ کے خلاف تھے","ایک قبیلہ","ایک شہر یمن کا","ایک فرقہ شیعہ کا"],e:"خوارج اسی طرح کے (بے ضرورت) سوالات کرتے تھے، اس لیے سیدہ عائشہ رضی اللہ عنہا نے یہ پوچھا۔"},
um68:{q:"استحاضہ کا خون کس وجہ سے نکلتا ہے؟",o:["ایک رگ (جس کا نام عاذل ہے) کے پھٹنے کی وجہ سے — یہ بیماری ہے","بچہ دانی سے فطری طور پر","حمل کی وجہ سے","نفاس کی وجہ سے"],e:"حیض کا خون کالا، بدبودار اور گاڑھا ہوتا ہے؛ استحاضہ کا خون پتلا، عام خون جیسا اور بغیر بدبو۔"},
um69:{q:"استحاضہ میں تمییز (پہچان) کے ۳ درجے کون سے ہیں؟",o:["ایام معلوم ہوں ← صفات معلوم ہو ← قریبی عورتوں کی مثل ۶ یا ۷ دن","صفات ← ایام ← ۴۰ دن انتظار","ایام ← ۱۵ دن ← ۴۰ دن","صرف صفات اور ایام"],e:"استحاضہ میں ہر نماز کے لیے وضو کرے گی؛ غسل واجب نہیں۔ نماز، روزہ اور جماع سب جائز ہیں۔"},
um70:{q:"ام حبیبہ رضی اللہ عنہا کو کتنے سال استحاضہ کا خون آتا رہا؟",o:["۷ سال","۳ سال","۱۰ سال","۱ سال"],e:"نبی <span class='ar'>ﷺ</span> نے انہیں غسل کا حکم دیا؛ وہ پاکی کی خاطر ہر نماز کے لیے غسل کرتی تھیں (حالانکہ واجب نہیں تھا)۔"},
um71:{q:"حائضہ کے مسجد سے چیز لانے پر نبی <span class='ar'>ﷺ</span> نے سیدہ عائشہ رضی اللہ عنہا سے کیا فرمایا؟",o:["<span class='ar'>إِنَّ حَيْضَتَكِ لَيْسَتْ فِي يَدِكِ</span> — تمہارا حیض تمہارے ہاتھوں میں نہیں ہے","<span class='ar'>اُخْرُجِي مِنَ المَسْجِدِ</span>","<span class='ar'>اِغْتَسِلِي ثُمَّ خُذِي</span>","<span class='ar'>لا تَدْخُلِي المَسْجِدَ</span>"],e:"یہ جواز کے قائل علماء کی دلیل ہے؛ دوسری دلیل وہ لونڈی ہے جس کا مسجد میں خیمہ تھا۔"},
um72:{q:"حیض کی حالت میں طلاق دینے کا حکم کیا ہے؟",o:["جائز نہیں؛ جمہور کے ہاں طلاق واقع ہو جائے گی (مگر اس نے غلط کیا)، ابن قیم کے ہاں واقع نہیں ہوگی","بالکل جائز ہے","جائز نہیں اور جمہور کے ہاں بھی واقع نہیں ہوگی","صرف حنفیوں کے ہاں جائز ہے"],e:"دلیل: <span class='ar'>فَطَلِّقُوهُنَّ لِعِدَّتِهِنَّ</span> — عدت طہر سے شروع ہوتی ہے۔ اگر عورت حاملہ ہو تو طلاق جائز ہے کیونکہ وہاں حمل عدت ہے۔"},
um73:{q:"حیض کی حالت میں کیا جائز ہے اور کیا نہیں؟",o:["جماع حرام ہے، مگر مباشرت (جسم ملانا)، کھانا پینا اور ساتھ سونا جائز ہے","سب کچھ حرام ہے","جماع بھی جائز ہے","صرف کھانا پینا جائز ہے"],e:"سیدہ عائشہ رضی اللہ عنہا کی حدیث: آپ <span class='ar'>ﷺ</span> انہیں ازار پہننے کا حکم دیتے اور مباشرت کرتے؛ اعتکاف کی حالت میں آپ کا سر بھی وہ دھوتی تھیں۔"},
um74:{q:"باب الجامع (<span class='ar'>بَابُ الجَامِعِ</span>) کا مطلب کیا ہے؟",o:["ایسا باب جو نماز کے متفرق (مختلف) مسائل کو جمع کرتا ہے","جمعے کی نماز کا باب","مسجدِ جامع کا باب","جماعت کا باب"],e:"جامع = اکٹھا کرنے والا۔ اس میں مسجد میں داخل ہونے کے احکام، کھانے پینے کے بعد نماز کے آداب وغیرہ جمع ہیں۔"},
um75:{q:"تحیۃ المسجد کا شرعی حکم جمہور علماء کے نزدیک کیا ہے؟",o:["سنتِ مؤکدہ (بعض کے نزدیک واجب — دونوں اقوال قوی ہیں)","فرض","مباح","مکروہ"],e:"حدیثِ ابو قتادہ رضی اللہ عنہ: <span class='ar'>إِذَا دَخَلَ أَحَدُكُمُ المَسْجِدَ فَلا يَجْلِسْ حَتَّى يُصَلِّيَ رَكْعَتَيْنِ</span>۔"},
um76:{q:"سلیک الغطفانی رضی اللہ عنہ کا واقعہ کیا ہے؟",o:["وہ خطبے کے دوران مسجد میں آ کر بیٹھ گئے، تو نبی <span class='ar'>ﷺ</span> نے انہیں کھڑے ہو کر ۲ رکعت (اختصار کے ساتھ) پڑھنے کا حکم دیا","انہوں نے مسجد میں جھگڑا کیا","انہوں نے اذان دی","انہوں نے خطبے کے دوران بات کی"],e:"<span class='ar'>قُمْ فَصَلِّ رَكْعَتَيْنِ وَتَجَوَّزْ فِيهِمَا</span> — اس سے ثابت ہوتا ہے کہ بھول کر بیٹھنے والا اٹھ کر پڑھ لے۔"},
um77:{q:"اوقاتِ ممنوعہ میں نمازوں کا صحیح اور راجح حکم کیا ہے؟",o:["ذوات الاسباب (سبب والی) نمازیں جائز ہیں، نفلِ مطلق جائز نہیں","دونوں جائز ہیں","دونوں ناجائز ہیں","صرف نفلِ مطلق جائز ہے"],e:"دلیل: نبی <span class='ar'>ﷺ</span> کی ظہر کی چھوٹی ہوئی ۲ رکعت سنت آپ نے عصر کے بعد ادا کی، کیونکہ ایک وفد آ گیا تھا۔"},
um78:{q:"اگر مسجد میں داخل ہو کر فرض یا اس وقت کی سنتِ مؤکدہ پڑھ لی جائے تو تحیۃ المسجد کا کیا ہوگا؟",o:["ساقط ہو جائے گی — الگ سے نیت کرنے کی ضرورت نہیں","پھر بھی الگ پڑھنی ہوگی","اس کا گناہ ہوگا","صرف فجر میں ساقط ہوگی"],e:"صحابہ جب ۵ وقت نماز کے لیے آتے تھے تو صرف سنتیں پڑھتے تھے؛ اگر الگ ضروری ہوتا تو نبی <span class='ar'>ﷺ</span> ضرور بیان فرماتے۔"},
um79:{q:"حضرت علی رضی اللہ عنہ کی شہادت کب اور کس کے ہاتھوں ہوئی؟",o:["۱۳ رمضان ۴۰ ہجری · عبد الرحمن بن ملجم الخارجی","۳۵ ہجری · خوارج","۲۳ ہجری · ابو لؤلؤ","۴۰ ہجری · ابو لؤلؤ"],e:"ان کی کنیت ابو الحسن اور لقب ابو تراب تھا؛ بچوں میں سب سے پہلے (۱۳ سال کی عمر میں) اسلام قبول کیا اور ۵ سال خلافت کی۔"},
um80:{q:"المغیرہ بن شعبہ رضی اللہ عنہ کے بارے میں کیا صحیح ہے؟",o:["خندق کے سال اسلام قبول کیا، ۱۳۶ احادیث کے راوی، ۵۰ ہجری میں طاعون سے وفات","بدر کے سال اسلام لائے، ۴۳ احادیث کے راوی","خیبر کے سال اسلام لائے، ۳۶۰ احادیث کے راوی","فتحِ مکہ پر اسلام لائے، ۱۴۶ احادیث کے راوی"],e:"ان کی کنیت ابو عیسیٰ تھی اور وہ عقلمندی و ہوشیاری کی مثال تھے۔"},
um81:{q:"عبد اللہ بن مغفل رضی اللہ عنہ — کتے والی روایت کے راوی — کے بارے میں کیا صحیح ہے؟",o:["۴۳ احادیث کے راوی، وفات ۶۰ ہجری، اصحابِ شجرہ میں سے تھے","۱۳۶ احادیث کے راوی، وفات ۵۰ ہجری","۳۶۰ احادیث کے راوی، وفات ۵۳ ہجری","۵۳۹ احادیث کے راوی، وفات ۲۳ ہجری"],e:"وہ ان ۱۰ صحابہ میں شامل تھے جنہیں حضرت عمر رضی اللہ عنہ نے بصرہ بھیجا تھا تاکہ لوگ دین اور فقہ کی سمجھ حاصل کریں۔"},
um82:{q:"ابو موسیٰ الاشعری رضی اللہ عنہ کے بارے میں کیا صحیح ہے؟",o:["اصل نام عبد اللہ بن قیس؛ حضرت عمر رضی اللہ عنہ کے دور میں بصرہ کے گورنر؛ ۳۶۰ احادیث کے راوی","اصل نام عبد الرحمن بن صخر؛ کوفہ کے گورنر","اصل نام عبد اللہ بن مغفل؛ بصرہ کے گورنر","اصل نام حمران؛ مصر کے گورنر"],e:"ان کی وفات ۵۰، ۵۱ یا ۵۳ ہجری میں ہوئی۔ انہی کی روایت میں ہے کہ نبی <span class='ar'>ﷺ</span> زبان پر بھی مسواک کرتے تھے۔"},
um83:{q:"حذیفہ بن الیمان رضی اللہ عنہ کے بارے میں کیا صحیح ہے؟",o:["وہ اور ان کے والد دونوں صحابی تھے؛ احد میں والد کو غلط فہمی سے شہید کر دیا گیا؛ وفات ۳۶ ہجری","ان کے والد صحابی نہیں تھے؛ وفات ۵۰ ہجری","وہ بدر میں شہید ہوئے","ان سے صرف ۷ احادیث مروی ہیں"],e:"ان کی کنیت ابو عبد اللہ؛ صحیحین میں ان سے ۳۷ احادیث اور کل تقریباً ۲۲۰ احادیث روایت کی گئی ہیں۔"},
um84:{q:"حمران بن ابان کون تھے؟",o:["حضرت عثمان رضی اللہ عنہ کے آزاد کردہ غلام اور کاتب؛ وفات ۷۵ ہجری","حضرت عمر رضی اللہ عنہ کے کاتب","حضرت علی رضی اللہ عنہ کے غلام","ایک تابعی جو بصرہ کے قاضی تھے"],e:"عین التمر کے معرکے میں خالد بن ولید رضی اللہ عنہ نے انہیں قیدی بنایا تھا؛ حضرت عثمان رضی اللہ عنہ نے خرید کر آزاد کیا۔ انہی کی روایت عثمان رضی اللہ عنہ کے وضو کی حدیث ہے۔"},
um85:{q:"حضرت عثمان رضی اللہ عنہ کے وضو کی حدیث کے آخر میں کیا فضیلت بیان ہوئی؟",o:["جس نے ایسے وضو کیا پھر ۲ رکعت پڑھی اور ان میں اپنے نفس سے باتیں نہیں کیں، اس کے پچھلے گناہ معاف","اس کو ۷۰ رکعت کا ثواب ملے گا","اس کی دعا قبول ہوگی","اس کے لیے جنت واجب ہو جائے گی"],e:"نوٹس کی وضاحت: کبیرہ گناہ توبہ کے بغیر معاف نہیں ہوتے۔"},
um86:{q:"نواقض الوضو (وضو توڑنے والی چیزیں) میں محققین کے نزدیک کیا شامل ہے؟",o:["پیشاب/پاخانے کی جگہ سے کسی چیز کا نکلنا، گہری نیند، اور اونٹ کا گوشت کھانا","صرف پیشاب اور پاخانہ","صرف گہری نیند","صرف ہوا نکلنا"],e:"النوم المستغرق (گہری نیند) سے وضو ٹوٹ جاتا ہے؛ ہلکی اونگھ سے نہیں جس میں آس پاس کا احساس باقی رہے۔"},
um87:{q:"استجمار (ڈھیلے یا ٹشو سے پاکی) میں کتنے عدد استعمال کرنے چاہئیں؟",o:["طاق (وتر) عدد — کم از کم ۳","جفت عدد — کم از کم ۲","صرف ۱","کم از کم ۷"],e:"ہڈی یا جانوروں کے گوبر سے استنجا منع ہے کیونکہ یہ ناپاک ہیں یا جنات کی خوراک۔"},
um88:{q:"غسل کے کتنے رکن بتائے گئے ہیں؟",o:["۲ — نیت (جنابت کے غسل کے لیے) اور پورے جسم پر پانی بہانا","۳ — نیت، وضو، جسم دھونا","۱ — صرف جسم پر پانی بہانا","۴"],e:"غسل سے پہلے وضو کرنا، پہلے ہاتھ دھونا اور گندگی صاف کرنا سنت اور مستحب اعمال میں داخل ہیں۔"},
um89:{q:"کھڑے ہو کر پیشاب کرنے کا حکم کیا ہے؟",o:["ضرورت ہو، چھینٹوں سے بچاؤ یقینی ہو اور پردہ ہو تو جائز ہے — مگر افضل بیٹھ کر کرنا ہے","ہمیشہ حرام ہے","ہمیشہ جائز ہے","صرف سفر میں جائز ہے"],e:"حدیثِ حذیفہ رضی اللہ عنہ: نبی <span class='ar'>ﷺ</span> نے ایک قوم کے کوڑے دان کے پاس کھڑے ہو کر پیشاب کیا، پھر وضو کیا اور موزوں پر مسح کیا۔"},
um90:{q:"کتے کو پالنے کے بارے میں صحیح حکم کیا ہے؟",o:["بغیر وجہ پالنا جائز نہیں؛ صرف حفاظت، کھیتی باڑی یا مویشیوں کی حفاظت کے لیے جائز ہے","بالکل حرام ہے ہر صورت میں","ہر صورت میں جائز ہے","صرف شکار کے لیے جائز ہے"],e:"شکاری کتا (معلَّم) اگر ”بسم اللہ“ پڑھ کر چھوڑا جائے تو اس کا شکار حلال ہے، مگر کتا اپنی ذات میں ناپاک ہی رہے گا۔"},
um91:{q:"درس ۱۰ میں امتحان کے لیے کتنی احادیث حفظ (زبانی یاد) کرنے کو کہا گیا؟",o:["۱۲ احادیث","۱۰ احادیث","۲۰ احادیث","۴۴ احادیث"],e:"نشان لگوائے گئے حدیث نمبر: ۴۳، ۴۵، ۱، ۳۹، ۳۳، ۲۸، ۲۴، ۲۲، ۲۱، ۱۷، ۱۵، ۱۱ اور ۹۔"},
um92:{q:"قرآن اور حدیث میں بنیادی فرق کیا بتایا گیا؟",o:["قرآن کے الفاظ اور معنی دونوں اللہ کی طرف سے؛ حدیث کے الفاظ نبی <span class='ar'>ﷺ</span> کے، مگر معنی اور حکم اللہ کی طرف سے","دونوں کے الفاظ اللہ کی طرف سے","دونوں کے الفاظ نبی <span class='ar'>ﷺ</span> کے","حدیث میں حکم نبی <span class='ar'>ﷺ</span> کا اپنا ہوتا ہے"],e:"عمل کے اعتبار سے دونوں ایک ہیں، مگر مرتبے میں فرق ہے کیونکہ قرآن الخالق کا کلام ہے۔"},
um93:{q:"عمران بن حصین رضی اللہ عنہ کا واقعہ کس بات کی دلیل ہے؟",o:["قرآن بغیر حدیث کے سمجھا اور اس پر عمل نہیں کیا جا سکتا","حدیث قرآن کے مقابلے میں ہے","صرف قرآن کافی ہے","حدیث صرف اخلاق کے لیے ہے"],e:"انہوں نے پوچھا: قرآن میں کہاں ہے کہ ظہر کی ۴ اور مغرب کی ۳ رکعت فرض ہیں؟ یہ تفصیل حدیث میں ہے۔"},
