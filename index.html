<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kun Faqeehan Level 1 — Mock Exams</title>
<meta name="description" content="Mock exams and MCQ practice for Kun Faqeehan Level 1: Taabeer, Qira'ah wal-Kitabah, Qawa'id, Seerat and Ahadeeth al-Ahkam.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Figtree:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F4F1;
  --surface:#FFFFFF;
  --surface-2:#F7F9F7;
  --ink:#141A18;
  --ink-2:#3A4643;
  --muted:#697672;
  --line:#DBE2DD;
  --line-2:#EAEFEA;
  --green:#0E5A4E;
  --green-2:#0A4740;
  --green-tint:#DCEAE5;
  --green-ring:rgba(14,90,78,.20);
  --brass:#8E6417;
  --brass-tint:#F3E9D3;
  --wrong:#96252E;
  --wrong-tint:#F6E2E2;
  --amber:#8A6A10;
  --shadow:0 1px 2px rgba(20,26,24,.05), 0 8px 24px -14px rgba(20,26,24,.18);
  --shadow-lg:0 2px 4px rgba(20,26,24,.06), 0 24px 56px -26px rgba(20,26,24,.30);
  --r:10px;
  --r-lg:16px;
  --sans:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Spectral",ui-serif,Georgia,"Times New Roman",serif;
  --arabic:"Noto Naskh Arabic","Traditional Arabic","Segoe UI",serif;
  --urdu:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Noto Naskh Arabic",serif;
  --maxw:1080px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C1211;
    --surface:#141C1A;
    --surface-2:#1A2422;
    --ink:#E7EDE9;
    --ink-2:#BCC8C3;
    --muted:#8B9A95;
    --line:#26312E;
    --line-2:#1E2825;
    --green:#4FB39B;
    --green-2:#6ECBB4;
    --green-tint:#14312B;
    --green-ring:rgba(79,179,155,.26);
    --brass:#D6AC55;
    --brass-tint:#31280F;
    --wrong:#E2868C;
    --wrong-tint:#361B1D;
    --amber:#D6AC55;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.7);
    --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 28px 60px -28px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --paper:#0C1211;
  --surface:#141C1A;
  --surface-2:#1A2422;
  --ink:#E7EDE9;
  --ink-2:#BCC8C3;
  --muted:#8B9A95;
  --line:#26312E;
  --line-2:#1E2825;
  --green:#4FB39B;
  --green-2:#6ECBB4;
  --green-tint:#14312B;
  --green-ring:rgba(79,179,155,.26);
  --brass:#D6AC55;
  --brass-tint:#31280F;
  --wrong:#E2868C;
  --wrong-tint:#361B1D;
  --amber:#D6AC55;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.7);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 28px 60px -28px rgba(0,0,0,.85);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.55;
  font-feature-settings:"cv11","ss01";
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
img{max-width:100%}
button{font:inherit;color:inherit}
a{color:var(--green);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2.5px solid var(--green);outline-offset:2px;border-radius:6px}
.ar{font-family:var(--arabic);direction:rtl;unicode-bidi:isolate;font-size:1.12em;line-height:2}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
@media (max-width:560px){ .wrap{padding:0 14px} }

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:var(--maxw);margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px}
@media (max-width:560px){ .top-in{padding:9px 14px} }
.mark{width:34px;height:34px;border-radius:9px;background:var(--green);color:#fff;display:grid;place-items:center;flex:0 0 auto;font-family:var(--arabic);font-size:17px;font-weight:700;line-height:1;padding-bottom:2px}
:root[data-theme="dark"] .mark,:root:not([data-theme="light"]) .mark{color:#08110F}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .mark{color:#fff}}
.brand{min-width:0;flex:1}
.brand b{display:block;font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:-.01em;line-height:1.2}
.brand span{display:block;font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-acts{display:flex;gap:6px;align-items:center}
.iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);transition:background .14s,border-color .14s}
.iconbtn:hover{background:var(--surface-2);border-color:var(--muted)}
.iconbtn svg{width:17px;height:17px}
.langbtn{font-size:11.5px;font-weight:800;letter-spacing:.02em}
:root[data-lang="ur"] .langbtn{font-family:var(--urdu);font-size:11px;line-height:1}
.flipwrap{display:inline-flex;align-items:center}
[dir="rtl"] .flipwrap{transform:scaleX(-1)}

/* ---------- generic ---------- */
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.015em;margin:0}
h1{font-size:clamp(26px,5.2vw,36px);line-height:1.14}
h2{font-size:clamp(19px,3.4vw,23px);line-height:1.2}
h3{font-size:17px}
p{margin:0}
.lead{color:var(--ink-2);font-size:15.5px;max-width:62ch}
.sec{padding-top:30px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-head h2{flex:1}
.hint{font-size:13px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:9px;border:1px solid transparent;padding:9px 15px;font-weight:600;font-size:14.5px;cursor:pointer;background:var(--green);color:#fff;transition:filter .14s,background .14s,border-color .14s;white-space:nowrap}
:root[data-theme="dark"] .btn-primary,:root[data-theme="dark"] .btn{color:#06100E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#06100E}}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn{color:#fff}}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--muted);filter:none}
.btn-quiet{background:transparent;border-color:transparent;color:var(--ink-2);padding:8px 10px}
.btn-quiet:hover{background:var(--surface-2);filter:none}
.btn-sm{padding:7px 12px;font-size:13.5px}
.btn-lg{padding:12px 20px;font-size:15.5px}
.btn-danger{background:transparent;border-color:var(--line);color:var(--wrong)}
.btn-danger:hover{background:var(--wrong-tint);border-color:var(--wrong);filter:none}
.btn svg{width:16px;height:16px;flex:0 0 auto}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--brass);border-radius:var(--r);padding:14px 16px}
.note h3{font-size:15.5px;margin-bottom:4px}
.note p{font-size:14px;color:var(--ink-2)}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line-2);letter-spacing:.01em}
.tag-easy{color:var(--green);background:var(--green-tint);border-color:transparent}
.tag-medium{color:var(--brass);background:var(--brass-tint);border-color:transparent}
.tag-hard{color:var(--wrong);background:var(--wrong-tint);border-color:transparent}
.tag-mixed{color:var(--ink-2);background:var(--surface-2)}

/* ---------- stat band ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;margin-top:22px}
.stat{padding:14px 16px;border-right:1px solid var(--line-2)}
.stat:last-child{border-right:0}
.stat dt{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:3px}
.stat dd{margin:0;font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.05;letter-spacing:-.02em}
.stat dd small{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:0}
@media (max-width:700px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(1),.stat:nth-child(2){border-bottom:1px solid var(--line-2)}
}

/* ---------- syllabus / subject list ---------- */
.toc{border-top:1px solid var(--line);margin-top:2px}
.toc-row{display:grid;grid-template-columns:38px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;padding:15px 12px 15px 4px;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;position:relative;transition:background .13s}
.toc-row:hover{background:var(--surface)}
.toc-row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--green);opacity:0;transition:opacity .13s}
.toc-row:hover::before{opacity:1}
.toc-row[data-locked="1"]{cursor:default}
.toc-row[data-locked="1"]:hover{background:none}
.toc-row[data-locked="1"]::before{display:none}
.toc-n{font-family:var(--serif);font-size:20px;color:var(--muted);text-align:center;font-weight:500;font-variant-numeric:tabular-nums}
.toc-main{min-width:0}
.toc-title{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.toc-title strong{font-family:var(--serif);font-size:18.5px;font-weight:600;letter-spacing:-.01em}
.toc-title .ar{font-size:16px;color:var(--ink-2);line-height:1.4}
.toc-sub{font-size:13px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc-right{display:flex;align-items:center;gap:14px;flex:0 0 auto}
.toc-meta{text-align:right;font-size:12px;color:var(--muted);line-height:1.35}
.toc-meta b{display:block;font-family:var(--serif);font-size:17px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.chev{color:var(--muted);width:16px;height:16px;flex:0 0 auto}
@media (max-width:600px){
  .toc-row{grid-template-columns:28px 1fr auto;gap:10px;padding:13px 6px 13px 4px}
  .toc-n{font-size:16px}
  .toc-title strong{font-size:16.5px}
  .toc-sub{font-size:12px;white-space:normal}
  .toc-right{gap:8px}
  .toc-meta{font-size:11px}
  .toc-meta b{font-size:15px}
}

/* ---------- test rows ---------- */
.tests{display:flex;flex-direction:column;gap:10px}
.test{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);transition:border-color .13s,box-shadow .13s}
.test:hover{border-color:var(--muted);box-shadow:var(--shadow)}
.test-main{flex:1;min-width:0}
.test-main strong{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.005em}
.test-meta{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dot{width:3px;height:3px;border-radius:50%;background:var(--line);flex:0 0 auto}
.best{font-variant-numeric:tabular-nums;font-weight:700;color:var(--green)}
.best-low{color:var(--wrong)}
@media (max-width:560px){
  .test{flex-wrap:wrap;gap:10px}
  .test-main{flex:1 1 100%}
  .test .btn{flex:1}
}

/* ---------- difficulty group ---------- */
.dgroup{margin-top:22px}
.dgroup-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dgroup-head h3{font-size:15px;font-family:var(--sans);font-weight:700;letter-spacing:.01em}
.bars{display:flex;gap:2.5px;align-items:flex-end;height:12px}
.bars i{width:4px;background:var(--line);border-radius:1px;display:block}
.bars i:nth-child(1){height:5px}
.bars i:nth-child(2){height:8.5px}
.bars i:nth-child(3){height:12px}
.bars.l1 i:nth-child(1){background:var(--green)}
.bars.l2 i:nth-child(1),.bars.l2 i:nth-child(2){background:var(--brass)}
.bars.l3 i{background:var(--wrong)}

/* ---------- exam header ---------- */
.exam-top{position:sticky;top:0;z-index:35;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.exam-top-in{max-width:840px;margin:0 auto;padding:10px 20px 0}
.exam-bar{display:flex;align-items:center;gap:10px}
.exam-bar .ttl{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.prog{height:3px;background:var(--line);border-radius:2px;margin:9px 0 0;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:2px;transition:width .2s ease}
@media (max-width:560px){ .exam-top-in{padding:9px 14px 0} }

/* ---------- question ---------- */
.qwrap{max-width:840px;margin:0 auto;padding:22px 20px 140px}
@media (max-width:560px){ .qwrap{padding:18px 14px 150px} }
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.qstyle{font-size:11.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);background:var(--surface);padding:3px 8px;border-radius:999px}
.qtext{font-family:var(--serif);font-size:clamp(19px,2.6vw,23px);line-height:1.42;font-weight:500;letter-spacing:-.008em;margin-bottom:6px}
.qtext .ar{font-size:1.06em;font-weight:600}
.qsub{font-size:13.5px;color:var(--muted);margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:13px 15px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);cursor:pointer;transition:border-color .12s,background .12s,box-shadow .12s;position:relative}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt:disabled{cursor:default}
.opt .ltr{width:24px;height:24px;flex:0 0 auto;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12.5px;font-weight:800;color:var(--muted);margin-top:1px}
.opt .body{flex:1;min-width:0;font-size:15.5px;line-height:1.5}
.opt .body .ar{font-size:1.1em;font-weight:600;line-height:1.85}
.opt[data-sel="1"]{border-color:var(--green);background:var(--green-tint);box-shadow:0 0 0 3px var(--green-ring)}
.opt[data-sel="1"] .ltr{border-color:var(--green);background:var(--green);color:#fff}
:root[data-theme="dark"] .opt[data-sel="1"] .ltr{color:#06100E}
.opt[data-state="right"]{border-color:var(--green);background:var(--green-tint)}
.opt[data-state="right"] .ltr{border-color:var(--green);background:var(--green);color:#fff}
:root[data-theme="dark"] .opt[data-state="right"] .ltr{color:#06100E}
.opt[data-state="wrong"]{border-color:var(--wrong);background:var(--wrong-tint)}
.opt[data-state="wrong"] .ltr{border-color:var(--wrong);background:var(--wrong);color:#fff}
:root[data-theme="dark"] .opt[data-state="wrong"] .ltr{color:#1A0C0D}
.opt .mk{position:absolute;right:13px;top:50%;transform:translateY(-50%);width:18px;height:18px}
.opt[data-state="right"] .mk{color:var(--green)}
.opt[data-state="wrong"] .mk{color:var(--wrong)}

.expl{margin-top:14px;border:1px solid var(--line);border-left:3px solid var(--green);background:var(--surface);border-radius:var(--r);padding:13px 15px}
.expl.bad{border-left-color:var(--wrong)}
.expl b{display:block;font-size:13px;margin-bottom:4px;letter-spacing:.01em}
.expl p{font-size:14.5px;color:var(--ink-2);line-height:1.55}
.expl .ref{font-size:12px;color:var(--muted);margin-top:7px}

/* ---------- bottom bar ---------- */
.actions{position:fixed;left:0;right:0;bottom:0;z-index:36;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px 20px calc(10px + env(safe-area-inset-bottom))}
.actions-in{max-width:840px;margin:0 auto;display:flex;align-items:center;gap:9px}
.actions-in .grow{flex:1}
@media (max-width:560px){ .actions{padding:9px 14px calc(9px + env(safe-area-inset-bottom))} .actions-in .btn{padding:11px 13px} }

/* ---------- palette ---------- */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(10,16,15,.44);display:grid;place-items:end center;padding:0}
.sheet{background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:var(--r-lg) var(--r-lg) 0 0;width:100%;max-width:560px;max-height:82vh;overflow:auto;padding:16px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lg)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sheet-head h3{font-size:17px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0 14px}
.legend span{display:flex;align-items:center;gap:5px}
.sw{width:11px;height:11px;border-radius:3px;border:1.5px solid var(--line);display:inline-block}
.sw.a{background:var(--green);border-color:var(--green)}
.sw.m{background:var(--brass);border-color:var(--brass)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.pal button{aspect-ratio:1;border-radius:9px;border:1.5px solid var(--line);background:var(--surface-2);font-weight:700;font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums;color:var(--ink-2);transition:transform .1s}
.pal button:hover{transform:translateY(-1px)}
.pal button[data-a="1"]{background:var(--green);border-color:var(--green);color:#fff}
:root[data-theme="dark"] .pal button[data-a="1"]{color:#06100E}
.pal button[data-m="1"]{border-color:var(--brass);box-shadow:inset 0 0 0 2px var(--brass)}
.pal button[data-cur="1"]{outline:2.5px solid var(--ink);outline-offset:2px}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;z-index:70;background:rgba(10,16,15,.5);display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);width:100%;max-width:420px;padding:20px;box-shadow:var(--shadow-lg)}
.modal h3{font-size:19px;margin-bottom:7px}
.modal p{font-size:14.5px;color:var(--ink-2);margin-bottom:16px}
.modal-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- results ---------- */
.score{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:4px}
.score-big{font-family:var(--serif);font-size:clamp(50px,11vw,78px);line-height:.92;font-weight:600;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.score-big em{font-style:normal;color:var(--muted);font-size:.44em;letter-spacing:-.02em}
.score-side{padding-bottom:7px}
.score-pc{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.verdict{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 11px;border-radius:999px;margin-top:8px}
.verdict.pass{background:var(--green-tint);color:var(--green)}
.verdict.fail{background:var(--wrong-tint);color:var(--wrong)}
.segs{display:flex;gap:3px;margin:20px 0 4px;flex-wrap:wrap}
.segs button{height:26px;flex:1 1 14px;min-width:12px;border-radius:4px;border:0;cursor:pointer;background:var(--line);transition:transform .1s;padding:0}

.segs button[data-r="1"]{background:var(--green)}

.brk-item{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface)}
.brk-item dt{font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:4px}
.brk-item dd{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:24px 0 14px}
.chip{font-size:13px;font-weight:600;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.rev{display:flex;flex-direction:column;gap:12px}
.rev-item{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:15px 16px;scroll-margin-top:80px}

.rev-q{font-family:var(--serif);font-size:17px;font-weight:500;line-height:1.42;margin-bottom:11px}
.ans{display:flex;gap:9px;font-size:14.5px;padding:8px 11px;border-radius:8px;margin-bottom:6px;align-items:flex-start}
.ans b{flex:0 0 auto;font-size:12px;font-weight:700;padding-top:2px;min-width:66px}
.ans.you{background:var(--wrong-tint);color:var(--wrong)}
.ans.you b{color:var(--wrong)}
.ans.ok{background:var(--green-tint);color:var(--green)}
.ans.ok b{color:var(--green)}
.ans.none{background:var(--surface-2);color:var(--muted)}
.ans .ar{font-weight:600}

/* ---------- history ---------- */
.hrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 15px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;transition:border-color .13s}
.hrow:hover{border-color:var(--muted)}
.hrow-main{flex:1;min-width:0}
.hrow-main strong{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow-main span{font-size:12.5px;color:var(--muted)}
.hscore{font-family:var(--serif);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto}
.empty{border:1px dashed var(--line);border-radius:var(--r-lg);padding:34px 22px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.empty p{font-size:14.5px;max-width:44ch;margin:0 auto 16px}

.field{margin-bottom:18px}
.field > label,.field > span.lbl{display:block;font-size:13px;font-weight:700;margin-bottom:8px;color:var(--ink-2)}
.checks{display:flex;flex-direction:column;gap:7px}
.check{display:flex;align-items:flex-start;gap:10px;padding:10px 13px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;font-size:14.5px}
.check:hover{border-color:var(--muted)}

.check[data-on="1"] .box{background:var(--green);border-color:var(--green);color:#fff}

.check[data-on="1"] .box svg{opacity:1}
.check .tx{flex:1;min-width:0}
.check .tx small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}
.check[data-on="1"] .tx small{color:var(--ink-2)}

.segmented button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.rowsplit{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:640px){ .rowsplit{grid-template-columns:1fr} }
.crumb{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--muted);background:none;border:0;cursor:pointer;padding:6px 0;margin:18px 0 10px}
.crumb:hover{color:var(--ink)}
.crumb svg{width:15px;height:15px}
.foot{margin-top:52px;padding:22px 0 34px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;line-height:1.6}
.banner{background:var(--brass-tint);border:1px solid color-mix(in srgb,var(--brass) 34%,transparent);color:var(--ink);border-radius:var(--r);padding:11px 14px;font-size:13.5px;margin-top:14px}

{id:"qw17",s:"qawaid",d:"easy",t:"mcq",q:"Ism ki taqseem kitne mukhtalif aitbarat se ki gayi hai?",o:["4 \u2014 Jins, Adad, I'rab, Aam-o-Khas","2","3","5"],a:0,e:"Chaar aitbarat: Jins, Adad, I'rab (Mu'rab/Mabni), aur Aam-o-Khas (Ma'rifah/Nakirah).",r:"Dars 31 \u00b7 Ism ki Taqseem"},

/* --- MEDIUM --- */
{id:"qw20",s:"qawaid",d:"medium",t:"mcq",q:"Alamat-e-Taanees (Muannas ki pehchan) ki teen alamatein kaunsi hain?",o:["Gol Ta, Alif-e-Maqsoorah, Alif-e-Mamdoodah","Gol Ta, Tanween, Alif-Lam","Waw-Noon, Ya-Noon, Alif-Ta","Kasra, Fatha, Dhamma"],a:0,e:"Agar ye teeno na hon to kalimah Muzakkar hota hai \u2014 albatta aurton ke naam (Maryam, Zainab) aur Sama'ee alfaz bhi muannas hote hain.",r:"Dars 31 \u00b7 Alamat-e-Taanees"},
{id:"qw21",s:"qawaid",d:"medium",t:"mcq",q:"Adad (number) ke aitbar se Ism ki qismein kaunsi hain?",o:["Wahid, Tasniyah, Jama","Mufrad, Murakkab","Ma'rifah, Nakirah","Mazi, Haal, Mustaqbil"],a:0,e:"Wahid = ek, Tasniyah = do, Jama = do se zyada (Rajulun / Rajulani / Rijalun).",r:"Dars 31 \u00b7 Ism ki Taqseem"},
{id:"qw22",s:"qawaid",d:"medium",t:"mcq",q:"Course mein Jama ki kaunsi teen qismein padhi gayi hain?",o:["Jama-e-Mukassar, Jama-e-Muzakkar-Salim, Jama-e-Muannas-Salim","Jama-e-Qillah, Jama-e-Kasrah, Jama-e-Muntahal-Jumoo","Jama-e-Mukassar, Jama-e-Salim, Jama-e-Muntahal-Jumoo","Jama-e-Muzakkar, Jama-e-Muannas, Jama-e-Mushtarak"],a:0,e:"Jama-e-Muntahal-Jumoo ka naam zikr hua magar wo abhi nahi padhayi gayi.",r:"Dars 31 \u00b7 Jama ki Kismein"},
{id:"qw23",s:"qawaid",d:"medium",t:"mcq",q:"Jama-e-Muzakkar-Salim ki pehchan kya hai?",o:["Wahid ka wazan salamat rahe aur aakhir mein Waw-Noon ya Ya-Noon aaye","Aakhir mein Alif aur lambi Ta ho","Wahid ka wazan toot jaye","Aakhir mein gol Ta ho"],a:0,e:"Misal: <span class='ar'>مُسْلِمُونَ / مُسْلِمِينَ</span>.",r:"Dars 31 \u00b7 Jama ki Kismein"},
{id:"qw24",s:"qawaid",d:"medium",t:"mcq",q:"Jama-e-Muannas-Salim ki pehchan kya hai?",o:["Aakhir mein Alif aur lambi Ta ho \u2014 jaise <span class='ar'>مُسْلِمَاتٌ</span>","Aakhir mein Waw-Noon ho","Wahid ka wazan toot jaye","Aakhir mein gol Ta ho"],a:0,e:"Lambi Ta jama ki pehchan hai, jabke gol Ta wahid mein aati hai.",r:"Dars 31 \u00b7 Jama ki Kismein"},
{id:"qw25",s:"qawaid",d:"medium",t:"mcq",q:"Jama-e-Mukassar kis ko kehte hain?",o:["Jisme Wahid ka wazan toot jaye \u2014 jaise <span class='ar'>رَجُل \u2192 رِجَال</span>","Jisme Waw-Noon aaye","Jisme Alif-Ta aaye","Jisme sirf Alif-Lam aaye"],a:0,e:"Misalein: <span class='ar'>كِتَاب \u2192 كُتُب</span>, <span class='ar'>قَلَم \u2192 أَقْلَام</span>.",r:"Dars 31 \u00b7 Jama ki Kismein"},
{id:"qw26",s:"qawaid",d:"medium",t:"mcq",q:"I'rab ke aitbar se Ism ki do qismein kaunsi hain?",o:["Mu'rab aur Mabni","Ma'rifah aur Nakirah","Muzakkar aur Muannas","Marfoo aur Mansoob"],a:0,e:"Mu'rab: aamil badalne se aakhir ki harakat badalti rahe (Zaidun/Zaidan/Zaidin). Mabni: kabhi na badle (Haza, Zalika).",r:"Dars 31 \u00b7 Ism ki Taqseem"},
{id:"qw27",s:"qawaid",d:"medium",t:"mcq",q:"Aam-o-Khas ke aitbar se Ism ki qismein aur Ma'rifah ki tadaad?",o:["Ma'rifah (7 qismein) aur Nakirah","Ma'rifah (5 qismein) aur Nakirah","Ma'rifah (10 qismein) aur Nakirah","Ma'rifah (4 qismein) aur Nakirah"],a:0,e:"Ma'rifah ki saat qismein hain (Alam, Ism-e-Ishara, Ism-e-Mousool, Mu'arraf-bil-Lam waghera).",r:"Dars 31 \u00b7 Ism ki Taqseem"},
{id:"qw28",s:"qawaid",d:"medium",t:"mcq",q:"Kalimah ki kitni i'rabi halatein hoti hain?",o:["4 \u2014 Marfoo, Mansoob, Majroor, Majzoom","3 \u2014 Marfoo, Mansoob, Majroor","2 \u2014 Marfoo aur Mansoob","5"],a:0,e:"Marfoo (rafa), Mansoob (nasab), Majroor (jar), Majzoom (jazm).",r:"Dars 31 \u00b7 I'rabi Halatein"},
{id:"qw29",s:"qawaid",d:"medium",t:"mcq",q:"Majroor hona kis ke saath khas hai?",o:["Sirf Ism ke saath \u2014 Fi'l kabhi majroor nahi hota","Sirf Fi'l ke saath","Ism aur Fi'l dono","Sirf Harf ke saath"],a:0,e:"Fi'l ke aakhir mein zeer nahi aati. Marfoo aur Mansoob dono (Ism + Fi'l) mein mushtarak hain.",r:"Dars 31 \u00b7 Aetebar-e-Ikhtisas"},
{id:"qw30",s:"qawaid",d:"medium",t:"mcq",q:"Majzoom hona kis ke saath khas hai?",o:["Sirf Fi'l ke saath \u2014 Ism ke aakhir mein jazm nahi aata","Sirf Ism ke saath","Ism aur Fi'l dono","Sirf Harf ke saath"],a:0,e:"Jazm sirf fi'l ki khasoosiyat hai, isi liye ye fi'l ki alamaat mein bhi shumar hoti hai.",r:"Dars 31 \u00b7 Aetebar-e-Ikhtisas"},
{id:"qw31",s:"qawaid",d:"medium",t:"mcq",q:"Nisbat (voice) ke aitbar se Fi'l ki do qismein?",o:["Ma'roof (active) aur Majhool (passive)","Lazim aur Muta'addi","Mazi aur Muzare","Mu'rab aur Mabni"],a:0,e:"Ma'roof: nisbat Fa'il ki taraf. Majhool: nisbat Maf'ool ki taraf (<span class='ar'>أُكِلَ التُّفَّاحُ</span>).",r:"Dars 31 \u00b7 Fi'l ki Taqseem"},
{id:"qw32",s:"qawaid",d:"medium",t:"mcq",q:"Majhool mein jo Maf'ool Fa'il ki jagah rakha jata hai, use kya kehte hain?",o:["Na'ib Fa'il (Maf'ool-mal-lam-yusamma-fa'iluhu)","Mubtada","Khabar","Maf'ool Bihi"],a:0,e:"<span class='ar'>أُكِلَ التُّفَّاحُ</span> mein \u201cat-Tuffahu\u201d Na'ib Fa'il hai.",r:"Dars 31 \u00b7 Fi'l Majhool"},
{id:"qw33",s:"qawaid",d:"medium",t:"mcq",q:"Maf'ool ki zaroorat ke aitbar se Fi'l ki qismein?",o:["Lazim (intransitive) aur Muta'addi (transitive)","Ma'roof aur Majhool","Mazi, Muzare, Amr","Mu'rab aur Mabni"],a:0,e:"Lazim: <span class='ar'>ذَهَبَ زَيْدٌ</span>. Muta'addi: <span class='ar'>ضَرَبَ زَيْدٌ عَمْراً</span>.",r:"Dars 31 \u00b7 Fi'l ki Taqseem"},
{id:"qw34",s:"qawaid",d:"medium",t:"mcq",q:"Fi'l-e-Amr ke andar kaunsa zamana hota hai?",o:["Mustaqbil (future) \u2014 hukm pehle, kaam baad mein","Mazi","Haal","Koi zamana nahi"],a:0,e:"Revision dars: Amr mein Mustaqbil zamana hota hai kyunki hukm pehle diya jata hai aur kaam baad mein hota hai.",r:"Dars 31 \u00b7 Fi'l ki Taqseem"},
{id:"qw35",s:"qawaid",d:"medium",t:"mcq",q:"Fi'l-e-Muzare mein kaunse zamane paye jate hain?",o:["Haal aur Mustaqbil dono","Sirf Haal","Sirf Mustaqbil","Mazi aur Haal"],a:0,e:"<span class='ar'>يَذْهَبُ</span> = woh jata hai (haal) ya jayega (mustaqbil).",r:"Dars 31 \u00b7 Fi'l ki Taqseem"},
{id:"qw36",s:"qawaid",d:"medium",t:"mcq",q:"Ilm-e-Sarf ka khas faida kya bataya gaya hai?",o:["Segha pehchan kar durust tarjuma karna","Sirf i'rab lagana","Sirf sentence structure samajhna","Sirf lughat yaad karna"],a:0,e:"Nahw ka khas faida: Arabi ibarat sahi padhna. Sarf ka khas faida: segha pehchan kar durust tarjuma.",r:"Lecture 1 \u00b7 Nahw vs Sarf"},

/* --- HARD --- */
{id:"qw45",s:"qawaid",d:"hard",t:"mcq",q:"Huroof-e-Aamilah ki kitni aur kaunsi qismein hain?",o:["4 \u2014 Jarra, Mushabbahah bil-Fi'l, Jazimah, Nasibah","2 \u2014 Jarra aur Nasibah","3 \u2014 Jarra, Jazimah, Atf","5"],a:0,e:"Pehli do Ism par dakhil hoti hain, baad ki do Fi'l-e-Muzare par.",r:"Dars 31 \u00b7 Harf ki Taqseem"},
{id:"qw46",s:"qawaid",d:"hard",t:"mcq",q:"Huroof-e-Jarra ki tadaad kitni hai?",o:["17","10","6","5"],a:0,e:"17 huroof; ye ism par dakhil ho kar uske aakhir ko jar/zeer dete hain \u2014 <span class='ar'>فِي المَسْجِدِ</span>.",r:"Dars 31 \u00b7 Huroof-e-Aamilah"},
{id:"qw47",s:"qawaid",d:"hard",t:"mcq",q:"Huroof-e-Mushabbahah bil-Fi'l kitne hain aur kaunse?",o:["6 \u2014 Inna, Anna, Ka'anna, Lakinna, Laita, La'alla","5 \u2014 Inna, Anna, Lakinna, Laita, La'alla","4 \u2014 An, Lan, Kai, Izan","10"],a:0,e:"Ye Mubtada-Khabar (jumla ismiya) par dakhil hote hain.",r:"Dars 31 \u00b7 Huroof-e-Aamilah"},
{id:"qw48",s:"qawaid",d:"hard",t:"mcq",q:"Huroof-e-Mushabbahah bil-Fi'l ka amal kya hai?",o:["Ism (Mubtada) ko nasab dete hain aur Khabar ko rafa","Ism ko rafa aur Khabar ko nasab","Fi'l ko jazm dete hain","Fi'l ko nasab dete hain"],a:0,e:"Misal: <span class='ar'>زَيْدٌ قَائِمٌ \u2192 إِنَّ زَيْداً قَائِمٌ</span>.",r:"Dars 31 \u00b7 Huroof-e-Aamilah"},
{id:"qw49",s:"qawaid",d:"hard",t:"mcq",q:"Huroof-e-Jazimah kitne hain?",o:["5 \u2014 Lam, Lamma, Lam-e-Amr, La-e-Nahyi, In Shartiyyah","4 \u2014 An, Lan, Kai, Izan","6","17"],a:0,e:"Ye fi'l-e-muzare par dakhil ho kar uske aakhir ko jazm dete hain \u2014 <span class='ar'>لَمْ يَفْعَلْ</span>.",r:"Dars 31 \u00b7 Huroof-e-Aamilah"},
{id:"qw50",s:"qawaid",d:"hard",t:"mcq",q:"Huroof-e-Nasibah kitne hain aur kaunse?",o:["4 \u2014 An, Lan, Kai, Izan","5 \u2014 Lam, Lamma, Lam-e-Amr, La-e-Nahyi, In","6 \u2014 Inna, Anna, Ka'anna, Lakinna, Laita, La'alla","10"],a:0,e:"Ye fi'l-e-muzare ko nasab dete hain \u2014 <span class='ar'>أَنْ يَذْهَبَ</span>, <span class='ar'>لَنْ يَفْعَلَ</span>.",r:"Dars 31 \u00b7 Huroof-e-Aamilah"},
{id:"qw51",s:"qawaid",d:"hard",t:"mcq",q:"Huroof-e-Ghair Aamilah ki do qismein kaunsi batayi gayi hain?",o:["Huroof-e-Istifham aur Huroof-e-Atf","Huroof-e-Jarra aur Huroof-e-Atf","Huroof-e-Nasibah aur Huroof-e-Jazimah","Huroof-e-Nida aur Huroof-e-Qasam"],a:0,e:"Ghair Aamilah huroof jumle mein aate hain magar i'rab nahi badalte.",r:"Dars 31 \u00b7 Harf ki Taqseem"},
{id:"qw52",s:"qawaid",d:"hard",t:"mcq",q:"Huroof-e-Istifham kitne hain aur kaunse?",o:["3 \u2014 Hamzah, Hal, Ma (teeno ke maane \u201cKya\u201d)","2 \u2014 Hamzah aur Hal","4 \u2014 Hamzah, Hal, Ma, Man","5"],a:0,e:"<span class='ar'>هَلْ كَتَبَ زَيْدٌ؟</span> \u00b7 <span class='ar'>مَا هَذَا؟</span>",r:"Dars 31 \u00b7 Huroof-e-Ghair Aamilah"},
{id:"qw53",s:"qawaid",d:"hard",t:"mcq",q:"Huroof-e-Atf kitne hain?",o:["10","6","4","17"],a:0,e:"Waw, Fa, Summa, Hatta, Imma, Am, Aw, La, Bal, Lakin \u2014 kul 10.",r:"Dars 31 \u00b7 Huroof-e-Ghair Aamilah"},
{id:"qw54",s:"qawaid",d:"hard",t:"mcq",q:"Murakkab-e-Taam (Jumla) ki do bunyadi qismein?",o:["Khabariyah aur Insha'iyah","Ismiyah aur Fi'liyah","Taam aur Naqis","Mufeed aur Ghair Mufeed"],a:0,e:"Khabariyah: kehne wale ko sacha ya jhoota kaha ja sake. Insha'iyah: na sacha na jhoota kaha ja sake.",r:"Dars 31 \u00b7 Murakkab-e-Taam"},
{id:"qw55",s:"qawaid",d:"hard",t:"mcq",q:"Jumla Khabariyah ki do qismein aur unke ajza?",o:["Ismiyah (Mubtada + Khabar) aur Fi'liyah (Fi'l + Fa'il + Maf'ool/Jar-Majroor)","Ismiyah (Fi'l + Fa'il) aur Fi'liyah (Mubtada + Khabar)","Amr aur Nahyi","Taam aur Naqis"],a:0,e:"Ismiyah ka pehla juz Ism hota hai, Fi'liyah ka pehla juz Fi'l.",r:"Dars 31 \u00b7 Jumla Khabariyah"},
{id:"qw56",s:"qawaid",d:"hard",t:"mcq",q:"Jumla Insha'iyah ki kitni qismein batayi gayi hain?",o:["10","6","4","7"],a:0,e:"Amr, Nahyi, Istifham, Tamanni, Tarajji, Uqood, Nida, Ta'ajjub, Arz, Qasam.",r:"Dars 31 \u00b7 Jumla Insha'iyah"},
{id:"qw57",s:"qawaid",d:"hard",t:"mcq",q:"Murakkab-e-Naqis ki kitni qismein batayi gayi hain?",o:["6","4","3","10"],a:0,e:"Tauseefi, Izafi, Ishari, Jari, Binai (Adadi), aur Man'a Sarf (Imtizaji/Muzajji).",r:"Dars 31 \u00b7 Murakkab-e-Naqis"},
{id:"qw58",s:"qawaid",d:"hard",t:"mcq",q:"Murakkab-e-Tauseefi kis se milkar banta hai?",o:["Mausoof + Sifat","Muzaaf + Muzaaf Ilaih","Ism-e-Ishara + Musharun Ilaih","Jar + Majroor"],a:0,e:"Pehla juz Mausoof, doosra juz Sifat \u2014 jaise <span class='ar'>رَجُلٌ عَاقِلٌ</span>.",r:"Dars 31 \u00b7 Murakkab-e-Naqis"},
{id:"qw59",s:"qawaid",d:"hard",t:"mcq",q:"Murakkab-e-Tauseefi mein Mausoof aur Sifat ke darmiyan kitni halaton mein mutabaqat (agreement) lazim hai?",o:["4 halaton mein (kul 10 mein se)","10 halaton mein","2 halaton mein","6 halaton mein"],a:0,e:"Ustad ka qaida: 2 jins + 2 wus'at + 3 adad + 3 i'rab = 10 halatein, in mein se theek 4 mein mutabaqat lazim hai.",r:"Lecture 28 \u00b7 Murakkab Tauseefi ka Qaida"},
{id:"qw60",s:"qawaid",d:"hard",t:"mcq",q:"Murakkab-e-Binai (Adadi) kya hai?",o:["11 se 19 tak ke adad \u2014 <span class='ar'>أَحَدَ عَشَرَ</span> se <span class='ar'>تِسْعَةَ عَشَرَ</span> tak","1 se 10 tak ke adad","20 se 90 tak ke adad","Sirf 100 aur 1000"],a:0,e:"Do kalime mila kar ek kar diye jate hain aur beech ka harf (Waw) mahzoof hota hai: <span class='ar'>أَحَدٌ وَعَشَرٌ \u2192 أَحَدَ عَشَرَ</span>.",r:"Dars 31 \u00b7 Murakkab-e-Naqis"},
{id:"qw61",s:"qawaid",d:"hard",t:"mcq",q:"Murakkab-e-Man'a Sarf (Imtizaji) ki misal kaunsi hai?",o:["<span class='ar'>بَعْلَبَكَّ</span> \u00b7 Hyderabad \u00b7 Rampur \u00b7 Sitapur","<span class='ar'>أَحَدَ عَشَرَ</span>","<span class='ar'>رَجُلٌ عَاقِلٌ</span>","<span class='ar'>فِي المَسْجِدِ</span>"],a:0,e:"Do kalimon ko mila kar ek naam bana diya jaye aur beech mein koi harf mahzoof na ho \u2014 Hadhramaut bhi isi ki misal hai.",r:"Dars 31 \u00b7 Murakkab-e-Naqis"},
{id:"qw62",s:"qawaid",d:"hard",t:"mcq",q:"<span class='ar'>مُحَمَّدٌ عَاقِلٌ</span> \u2014 ye kya hai?",o:["Mubtada + Khabar (mukammal jumla), kyunki Sifat par Alif-Laam nahi","Murakkab-e-Tauseefi","Murakkab-e-Izafi","Murakkab-e-Jari"],a:0,e:"Lecture 28: agar dono ma'rifah hon (<span class='ar'>مُحَمَّدٌ العَاقِلُ</span>) tab Murakkab Tauseefi banta hai; warna Mubtada-Khabar.",r:"Lecture 28 \u00b7 Wus'at ka Qaida"},
{id:"qw63",s:"qawaid",d:"hard",t:"mcq",q:"Ism ki alamaat mein kaunsi cheez shamil NAHI hai?",o:["Aakhir mein Jazm","Shuru mein Alif-Laam","Aakhir mein Tanween","Aakhir mein Gol Ta"],a:0,e:"Jazm sirf Fi'l ki alamat hai. Ism ki alamaat: Alif-Laam, Tanween, Jar, Gol Ta, Musanna, Jama.",r:"Dars 31 \u00b7 Alamaat"},
{id:"qw64",s:"qawaid",d:"hard",t:"mcq",q:"Fi'l ki alamaat mein kaunsi shamil hai?",o:["Shuru mein <span class='ar'>قَدْ</span> ya <span class='ar'>سَوْفَ</span>, aakhir mein Jazm ya Ta-e-Taanees Saakina","Shuru mein Alif-Laam","Aakhir mein Tanween","Aakhir mein Gol Ta"],a:0,e:"Paanch alamaat: Qad, Seen/Sawfa, Jazm, Ta-e-Taanees Saakina, aur Ta-ul-Fa'il.",r:"Dars 31 \u00b7 Alamaat"},
{id:"qw65",s:"qawaid",d:"hard",t:"mcq",q:"Agar kisi kalime ke aakhir mein Gol Ta ho to wo Ism hoga; aur agar Ta-ul-Fa'il ho to?",o:["Wo Fi'l hoga \u2014 jaise <span class='ar'>كَتَبْتُ، كَتَبْتَ</span>","Wo bhi Ism hoga","Wo Harf hoga","Wo Murakkab hoga"],a:0,e:"Revision dars ka farq: Gol Ta \u2192 Ism, saakin ya mutaharrik Ta-ul-Fa'il \u2192 Fi'l.",r:"Dars 31 \u00b7 Alamaat"},
{id:"qw66",s:"qawaid",d:"hard",t:"mcq",q:"Harf ki pehchan kya hai?",o:["Usme Ism aur Fi'l dono mein se kisi ki koi alamat nahi payi jati","Usme Tanween hoti hai","Usme Jazm hota hai","Usme Alif-Laam hota hai"],a:0,e:"Harf ki alamat yehi hai ke Ism ya Fi'l ki koi alamat us mein maujood na ho.",r:"Dars 31 \u00b7 Alamaat"},
{id:"qw67",s:"qawaid",d:"hard",t:"mcq",q:"Arabi mein Fi'l ke Tasniyah/Jama hone ke bare mein sahih baat kya hai?",o:["Fi'l hamesha Wahid hota hai; uske saath lagi zameer Tasniyah/Jama hoti hai","Fi'l bhi Tasniyah aur Jama hota hai","Fi'l sirf Jama hota hai","Fi'l ka adad Ism se alag hota hi nahi"],a:0,e:"Revision dars: English ke bar-aks Arabi mein fi'l khud kabhi tasniyah ya jama nahi hota.",r:"Dars 31 \u00b7 Alamaat (Farq)"},
{id:"qw68",s:"qawaid",d:"hard",t:"mcq",q:"Mabni Ism ki misal kaunsi hai?",o:["<span class='ar'>هَؤُلاءِ</span> hamesha zeer par, <span class='ar'>هَذَا / ذَلِكَ</span> hamesha zabar par","<span class='ar'>زَيْدٌ / زَيْداً / زَيْدٍ</span>","<span class='ar'>كِتَابٌ</span>","<span class='ar'>مُسْلِمُونَ</span>"],a:0,e:"Mabni ka i'rab kabhi nahi badalta. <span class='ar'>خَمْسَةَ عَشَرَ</span> bhi hamesha fatha par mabni hai.",r:"Dars 31 \u00b7 Mu'rab aur Mabni"},
{id:"qw69",s:"qawaid",d:"hard",t:"mcq",q:"<span class='ar'>كِتَابٌ</span> Nakirah hai. Ma'rifah kaise banega?",o:["<span class='ar'>الكِتَابُ</span> \u2014 Alif-Laam dakhil karne se","Tanween barhane se","Jama banane se","Tasniyah banane se"],a:0,e:"Mu'arraf-bil-Lam Ma'rifah ki qismon mein se hai: <span class='ar'>المَرْأَةُ، الرَّجُلُ</span>.",r:"Dars 31 \u00b7 Ma'rifah aur Nakirah"}

{id:"sr1",s:"seerat",d:"easy",t:"mcq",q:"Deen ka ilm hasil karna har Musalman par kya hai?",o:["Farz","Sunnat","Mustahab","Mubah"],a:0,e:"Lecture 1: Farz ka mafhum \u2014 ada karne par sawab, na karne par gunah.",r:"Lecture 1"},
{id:"sr2",s:"seerat",d:"easy",t:"mcq",q:"Ilm-e-Deen hasil karne ki do bunyadi qismein kaunsi hain?",o:["Farz-e-Ayn (Wajib) ilm aur Tafseeli ilm","Aqli aur Naqli ilm","Zahiri aur Batini ilm","Duniyawi aur Deeni ilm"],a:0,e:"Farz-e-Ayn har Musalman par farz hai; Tafseeli ilm chand logon par wajib hai taake qaum ki rehnumai ho sake.",r:"Lecture 1"},
{id:"sr3",s:"seerat",d:"easy",t:"mcq",q:"\u201cAr-Raheeq Al-Makhtum\u201d ke musannif kaun hain?",o:["Shaikh Safiur Rahman Mubarakpuri","Ibn Hisham","Ibn Kathir","Shaikh Abdul Ghani al-Maqdisi"],a:0,e:"Unka talluq Husainabad, Mubarakpur, Azamgarh (UP, Hindustan) se tha.",r:"Lecture 2"},
{id:"sr4",s:"seerat",d:"easy",t:"mcq",q:"\u201cTajalliyat-e-Nabuwwat\u201d kiski kitab hai aur uski khususiyat kya hai?",o:["Shaikh Safiur Rahman Mubarakpuri ki \u2014 Ar-Raheeq ke mushkil asbaaq ko talba ke liye aasan kiya gaya hai","Ibn Ishaq ki \u2014 sabse purani seerat","Imam Bukhari ki \u2014 sahih riwayaat","Ibn Sa'd ki \u2014 tabaqaat"],a:0,e:"Ye college aur university ke talba ko saamne rakh kar tarteeb di gayi hai \u2014 yehi hamare course ki kitab hai.",r:"Lecture 2"},
{id:"sr5",s:"seerat",d:"easy",t:"mcq",q:"Rabita Aalam-e-Islami ke aalmi muqable mein Ar-Raheeq Al-Makhtum ka kaunsa number aaya aur kitna inaam mila?",o:["Pehla number \u00b7 50,000 Saudi Riyal","Doosra number \u00b7 25,000 Riyal","Pehla number \u00b7 10,000 Riyal","Teesra number \u00b7 50,000 Riyal"],a:0,e:"Shaikh ne Arabi zabaan mein maqala likha jo poori dunya mein 1st aaya.",r:"Lecture 2"},
{id:"sr6",s:"seerat",d:"easy",t:"mcq",q:"Nabi <span class='ar'>\uFDFA</span> ki Seerat ki 4 khususiyat kaunsi hain?",o:["Jamiyat, Shumuliyat, Tarikhiyat, Amaliyat","Jamiyat, Sadaqat, Amanat, Hikmat","Shumuliyat, Wusaat, Barakat, Rehmat","Tarikhiyat, Riwayat, Sanad, Matn"],a:0,e:"Jamiyat = mukammal hona, Shumuliyat = har shoba-e-hayat ke liye namuna, Tarikhiyat = sanad ke saath, Amaliyat = amli.",r:"Lecture 2"},
{id:"sr7",s:"seerat",d:"easy",t:"mcq",q:"Makkah mein but-parasti ka aaghaz karne wala kaun tha?",o:["Amr bin Aamir bin Luhayy al-Khuzai","Abu Lahab","Walid bin Mugheera","Abrahah"],a:0,e:"Wo Shaam (Syria) se ek but laya aur Khana Kaaba ke paas nasab kar diya; log uski andhi taqleed karne lage.",r:"Lecture 3"},
{id:"sr8",s:"seerat",d:"easy",t:"mcq",q:"Deen-e-Ibrahimi ke baqi asaraat mein kaunsi cheez shamil thi?",o:["Baitullah ki ta'zeem, Hajj-o-Umrah, hurmat wale mahine, Ashura ka roza, namaz","Zakat aur Sadqat ka nizam","Quran ki tilawat","Jumme ki namaz"],a:0,e:"Namaz padhte the lekin unka tareeqa asli deen se alag tha \u2014 Kuffar-e-Makkah khud ko Deen-e-Ibrahimi ke pairukaar maante the.",r:"Lecture 3"},
{id:"sr9",s:"seerat",d:"easy",t:"mcq",q:"\u201cHaneef\u201d kaun hota hai?",o:["Jo tamam jhoote maaboodon se munh mod kar akele Allah ka ho jaye aur Deen-e-Ibrahimi par qaayam rahe","Jo Isaai ho jaye","Jo Yahudi ho jaye","Jo but-parasti kare magar Allah ko bhi maane"],a:0,e:"Mash'hoor Hunafa: Muhammad <span class='ar'>\uFDFA</span>, Zaid bin Amr bin Nufail, Waraqah bin Naufal, Quss bin Sa'idah, Umayyah bin Abi as-Salt, Labeed bin Rabee'ah.",r:"Lecture 4"},
{id:"sr10",s:"seerat",d:"easy",t:"mcq",q:"Nabi <span class='ar'>\uFDFA</span> ki wiladat kis saal hui?",o:["<span class='ar'>عَامُ الفِيلِ</span> \u2014 Aam-ul-Feel (haathiyon ka saal)","Aam-ul-Hijrah","Aam-ul-Wufood","Aam-ul-Huzn"],a:0,e:"Wohi saal jab Abrahah haathiyon ka lashkar le kar Kaaba par hamla karne aaya tha.",r:"Lecture 12"},
{id:"sr11",s:"seerat",d:"easy",t:"mcq",q:"Nabi <span class='ar'>\uFDFA</span> ki wiladat ka din aur maheena?",o:["Peer (Monday) ki subah \u00b7 Rabi-ul-Awwal","Jumma \u00b7 Rabi-ul-Awwal","Peer \u00b7 Ramadan","Jumeraat \u00b7 Rabi-us-Sani"],a:0,e:"Mausam bahar tha, maqam Makkah Mukarramah (Shaab-e-Bani Hashim).",r:"Lecture 12"},
{id:"sr12",s:"seerat",d:"easy",t:"mcq",q:"Jadeed tehqiq (Mahmood Pasha Falaki) ke mutabiq wiladat ki asal tareekh kya thi?",o:["9 Rabi-ul-Awwal \u00b7 22 April 571 Eeswi","12 Rabi-ul-Awwal \u00b7 20 April 571","8 Rabi-ul-Awwal \u00b7 22 April 570","9 Rabi-ul-Awwal \u00b7 22 April 610"],a:0,e:"Riwayaat mein 8, 9 ya 12 Rabi-ul-Awwal ka ikhtilaf hai; jadeed tehqiq 9 ko tarjeeh deti hai.",r:"Lecture 12"},
{id:"sr13",s:"seerat",d:"easy",t:"mcq",q:"Nabi <span class='ar'>\uFDFA</span> ki walida mohtarma ka naam?",o:["Aminah bint Wahb","Halima Sadia","Suwaybah","Fatima bint Asad"],a:0,e:"Nasab: Aminah bint Wahb bin Abd Manaf bin Zuhra bin Kilab.",r:"Lecture 7"},
{id:"sr14",s:"seerat",d:"easy",t:"mcq",q:"Nabi <span class='ar'>\uFDFA</span> ke walid aur walida ka nasab kis par jaakar milta hai?",o:["Kilab","Adnan","Hashim","Qusai"],a:0,e:"Hazrat Abdullah aur Hazrat Aminah dono ka nasab Kilab par mil jata hai.",r:"Lecture 7"},
{id:"sr15",s:"seerat",d:"easy",t:"mcq",q:"Nabi <span class='ar'>\uFDFA</span> ke dada Abdul Muttalib ke do bade karname kaunse hain?",o:["Zamzam ki khudai aur Ashab-ul-Feel ka waqia","Dar-ul-Nadwa ka qayam aur Hilf-ul-Fudool","Rihlat-ash-Shita aur Rihlat-as-Saif","Hajar-e-Aswad ka faisla aur Kaaba ki taamir"],a:0,e:"Qabeela Jurhum ne Zamzam paat diya tha; Abdul Muttalib ko 3 din khwab mein sateek jagah dikhayi gayi.",r:"Lecture 9"},
{id:"sr16",s:"seerat",d:"easy",t:"mcq",q:"Ashab-ul-Feel ka hamla karne wala badshah kaun tha aur kahan ka tha?",o:["Abrahah \u2014 Yemen ka","Heraclius \u2014 Rome ka","Najashi \u2014 Habsha ka","Numan bin Mundhir \u2014 Heera ka"],a:0,e:"Usne Kaaba ke bajaye apne Kaleesa ki taraf logon ko bulane ki koshish ki thi; Allah ne Ababeel ke zariye lashkar tabah kiya (Surah Al-Fil).",r:"Lecture 9"},
{id:"sr17",s:"seerat",d:"easy",t:"mcq",q:"Jubayr bin Mut'im (RA) ki hadees mein Nabi <span class='ar'>\uFDFA</span> ke kitne naam bayan hue?",o:["5 \u2014 Muhammad, Ahmad, Al-Mahi, Al-Hashir, Al-Aqib","3 \u2014 Muhammad, Ahmad, Al-Aqib","99","7"],a:0,e:"Quran/Hadees mein 99 naamon ki koi daleel nahi; zabardasti ginti poori karna Ghulu hai.",r:"Lecture 12"},
{id:"sr18",s:"seerat",d:"easy",t:"mcq",q:"Nabi <span class='ar'>\uFDFA</span> ki kunniyat kya thi?",o:["Abul Qasim","Abu Hafs","Abu Turab","Abul Hasan"],a:0,e:"Us daur mein confusion se bachne ke liye is kunniyat ko rakhne se mana farmaya tha; ab rakhi ja sakti hai.",r:"Lecture 12"},

/* --- MEDIUM --- */
{id:"sr25",s:"seerat",d:"medium",t:"mcq",q:"Qusai bin Kilab ka laqab \u201cMujammi\u201d kyun pada?",o:["Bikhre hue Quraish ko Makkah mein jama kar ke ek taqatwar qabila banaya","Kaaba ki chaabi jama ki","Hajjiyon ka chanda jama karta tha","Nasab-name jama kiye"],a:0,e:"Mujammi = jama karne wala. Unki wafat taqreeban 480 Eeswi mein hui.",r:"Lecture 8"},
{id:"sr26",s:"seerat",d:"medium",t:"mcq",q:"Dar-ul-Nadwa kya tha?",o:["Masjid-e-Haram ke shumal mein Quraish ka \u201cParliament House\u201d jahan faisle, mashware, nikah aur jung ke mamlaat tay hote the","Kaaba ka khazana","Hajjiyon ki rehaish","Quraish ka bazaar"],a:0,e:"Qusai bin Kilab ne ise qayam kiya tha.",r:"Lecture 8"},
{id:"sr27",s:"seerat",d:"medium",t:"mcq",q:"Qusai ne kaunse 5 aham mansab apne paas rakhe?",o:["Hijaba/Sadana, Siqaya, Rifada, Nadwa, Liwa","Hijaba, Imarah, Qada, Nadwa, Liwa","Sadana, Siqaya, Zakat, Nadwa, Jihad","Rifada, Siqaya, Tijarat, Liwa, Qada"],a:0,e:"Hijaba = Kaaba ki chaabi, Siqaya = paani pilana, Rifada = mehman-nawazi, Nadwa = Majlis-e-Shoora ki sadarat, Liwa = jhanda uthana.",r:"Lecture 8"},
{id:"sr28",s:"seerat",d:"medium",t:"mcq",q:"Abd Manaf ka asal naam kya tha aur unke kitne bete the?",o:["Mughira \u00b7 4 bete (Hashim, Al-Muttalib, An-Nawfal, Abd Shams)","Amr \u00b7 3 bete","Shaybah \u00b7 4 bete","Mujammi \u00b7 5 bete"],a:0,e:"Hashim Nabi <span class='ar'>\uFDFA</span> ke par-dada the.",r:"Lecture 8"},
{id:"sr29",s:"seerat",d:"medium",t:"mcq",q:"Hashim ka asal naam kya tha aur laqab \u201cHashim\u201d kyun pada?",o:["Amr \u00b7 Hajjiyon ke liye rotiyan tod kar shorbe mein mila kar Thareed khilane ki wajah se","Mughira \u00b7 Kaaba ki deewar todne ki wajah se","Shaybah \u00b7 Buton ko todne ki wajah se","Amr \u00b7 Dushman ki safein todne ki wajah se"],a:0,e:"Hashim ka matlab \u201ctodne wala\u201d. Inhi ki nisbat se Nabi <span class='ar'>\uFDFA</span> \u201cHashmi\u201d kehlate hain.",r:"Lecture 8"},
{id:"sr30",s:"seerat",d:"medium",t:"mcq",q:"Hashim ne Quraish ke liye kaunse 2 bade tijarati safar ka nizam qayam kiya?",o:["Rihlat-ash-Shita (sardiyon mein Yemen) aur Rihlat-as-Saif (garmiyon mein Shaam)","Rihlat-ash-Shita (Shaam) aur Rihlat-as-Saif (Yemen)","Rihlat-al-Hajj aur Rihlat-al-Umrah","Rihlat-al-Bahr aur Rihlat-al-Barr"],a:0,e:"Quran mein bhi zikr: <span class='ar'>رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ</span>.",r:"Lecture 8"},
{id:"sr31",s:"seerat",d:"medium",t:"mcq",q:"Hashim ki wafat kahan hui aur unke bete ka naam \u201cShaybah\u201d kyun rakha gaya?",o:["Ghazza (Gaza, Falasteen) \u00b7 baalon mein safedi ki wajah se","Madinah \u00b7 unke dada ke naam par","Makkah \u00b7 Kaaba ki nisbat se","Shaam \u00b7 wahan ke rivaj se"],a:0,e:"Shaybah = safed baal wala. Yehi baad mein \u201cAbdul Muttalib\u201d ke naam se mash'hoor hue.",r:"Lecture 8"},
{id:"sr32",s:"seerat",d:"medium",t:"mcq",q:"Shaybah ka naam \u201cAbdul Muttalib\u201d kyun pada?",o:["Makkah walon ne samjha ke Muttalib koi naya ghulam khareed kar laye hain","Unhone Muttalib ki khidmat ki thi","Muttalib ne unhein god liya tha","Wo Muttalib ke naam par paida hue the"],a:0,e:"Bhatija hone ke bawajood yehi naam mash'hoor ho gaya \u2014 \u201cMuttalib ka ghulam\u201d.",r:"Lecture 9 / 15"},
{id:"sr33",s:"seerat",d:"medium",t:"mcq",q:"Hazrat Abdullah ke Fidya (ransom) mein kitne oont zabah kiye gaye?",o:["100","10","50","1000"],a:0,e:"Qur'a har baar Abdullah ke naam nikalta aur 10 oont barhaye jate; 10vi martaba (100 oont) par oonton ke naam nikla.",r:"Lecture 10"},
{id:"sr34",s:"seerat",d:"medium",t:"mcq",q:"<span class='ar'>أَنَا ابْنُ الذَّبِيحَيْنِ</span> \u2014 \u201cdo Zabih\u201d se kaun murad hain?",o:["Hazrat Ismail (AS) aur Hazrat Abdullah","Hazrat Ibrahim (AS) aur Hazrat Ismail (AS)","Hazrat Abdullah aur Hazrat Abdul Muttalib","Hazrat Ishaq (AS) aur Hazrat Ismail (AS)"],a:0,e:"Baad mein Islami Shariat ne bhi insan ki jaan ki Diyat 100 oont hi muqarrar ki.",r:"Lecture 10"},
{id:"sr35",s:"seerat",d:"medium",t:"mcq",q:"Hazrat Abdullah ki wafat kahan hui aur kahan dafan hue?",o:["Madinah (Yathrib) \u2014 nanhiyal Banu Najjar ke yahan; \u2018Dar al-Nabigha\u2019 mein dafan","Makkah \u2014 Shaab-e-Bani Hashim mein","Ghazza \u2014 Falasteen mein","Abwa \u2014 raste mein"],a:0,e:"Inteqal ke waqt Nabi <span class='ar'>\uFDFA</span> abhi walida ke pet mein the.",r:"Lecture 10"},
{id:"sr36",s:"seerat",d:"medium",t:"mcq",q:"Nabi <span class='ar'>\uFDFA</span> ko sabse pehle doodh kis ne pilaya?",o:["Suwaybah \u2014 Abu Lahab ki laundi","Halima Sadia \u2014 Banu Sa'ad","Aminah bint Wahb","Umm Aiman"],a:0,e:"Suwaybah ne Hazrat Hamza (RA) aur Abu Salama (RA) ko bhi doodh pilaya; teeno raza'i bhai bane.",r:"Lecture 13"},
{id:"sr37",s:"seerat",d:"medium",t:"mcq",q:"Raza'at saabit hone ki shart kya hai?",o:["2 saal ke andar 5 martaba pet bhar kar doodh peena","3 martaba doodh peena","Sirf ek baar doodh peena","2 saal ke baad bhi doodh peena"],a:0,e:"Raza'at se wo tamam rishte haram hote hain jo nasab se haram hote hain, magar waris nahi bante.",r:"Lecture 13"},
{id:"sr38",s:"seerat",d:"medium",t:"mcq",q:"Halima Sadia ka talluq kis qabeele se tha aur unke shohar ka naam?",o:["Banu Sa'ad (Hawazin ki shakh) \u00b7 Harith bin Abdul Uzza (Abu Kabsha)","Banu Najjar \u00b7 Abu Zuaib","Banu Khuza'a \u00b7 Hulail","Banu Zuhra \u00b7 Wahb"],a:0,e:"Kuffar-e-Makkah tehqeer ke liye Nabi <span class='ar'>\uFDFA</span> ko \u201cIbn Abi Kabsha\u201d kehte the.",r:"Lecture 13"},
{id:"sr39",s:"seerat",d:"medium",t:"mcq",q:"Shaq-e-Sadar ka waqia Nabi <span class='ar'>\uFDFA</span> ki zindagi mein kitni baar pesh aaya?",o:["2 baar \u2014 bachpan mein (Banu Saad) aur Meraj ke safar se qabl","1 baar \u2014 sirf bachpan mein","3 baar","4 baar"],a:0,e:"Hazrat Anas (RA) farmate hain ke wo Aap <span class='ar'>\uFDFA</span> ke seene par silai ke nishanat dekhte the (Sahih Muslim).",r:"Lecture 14"},
{id:"sr40",s:"seerat",d:"medium",t:"mcq",q:"Walida ka inteqal kahan hua aur us waqt Nabi <span class='ar'>\uFDFA</span> ki umar kitni thi?",o:["Abwa ke maqam par \u00b7 6 saal","Madinah mein \u00b7 6 saal","Makkah mein \u00b7 8 saal","Abwa mein \u00b7 4 saal"],a:0,e:"Yathrib se wapsi par Abwa mein beemari, wafat aur tadfeen hui. Aap <span class='ar'>\uFDFA</span> paidaishi yateem the.",r:"Lecture 14 / 15"},
{id:"sr41",s:"seerat",d:"medium",t:"mcq",q:"Abdul Muttalib ki wafat ke waqt Nabi <span class='ar'>\uFDFA</span> ki umar kitni thi?",o:["8 saal, 2 mahine, 10 din","6 saal","10 saal","12 saal"],a:0,e:"Unke baad walid ke sage bhai Abu Talib ne kefalat ki.",r:"Lecture 15"},
{id:"sr42",s:"seerat",d:"medium",t:"mcq",q:"Mulk-e-Sham ke safar mein kis Isaai rahib ne Nabi <span class='ar'>\uFDFA</span> ko pehchana?",o:["Buhaira \u2014 Busra ke qareeb","Waraqah bin Naufal \u2014 Makkah mein","Quss bin Sa'idah \u2014 Yemen mein","Najashi \u2014 Habsha mein"],a:0,e:"Us waqt Aap <span class='ar'>\uFDFA</span> ki umar 12 saal thi; rahib ne Aap ko \u201cSardar\u201d aur \u201cRahmat-ul-Aalameen\u201d qarar diya.",r:"Lecture 15"},
{id:"sr43",s:"seerat",d:"medium",t:"mcq",q:"Jang-e-Fijar ke waqt Nabi <span class='ar'>\uFDFA</span> ki umar aur wo maheena?",o:["20 baras \u00b7 Dhul-Qa'dah (hurmat wala mahina)","25 baras \u00b7 Rajab","20 baras \u00b7 Muharram","15 baras \u00b7 Dhul-Hijjah"],a:0,e:"\u201cFijar\u201d lafz \u201cFujoor\u201d se hai \u2014 hurmat wale mahine mein jang karna gunah tha, isi liye ye naam pada.",r:"Lecture 16"},
{id:"sr44",s:"seerat",d:"medium",t:"mcq",q:"Hilf-ul-Fudool mein kaunse 5 qabail shareek the?",o:["Banu Hashim, Banul Muttalib, Banu Asad, Banu Zuhrah, Banu Taym","Banu Hashim, Banu Umayyah, Banu Makhzoom, Banu Zuhrah, Banu Taym","Banu Khuza'a, Banu Kinanah, Banu Asad, Banu Taym, Banu Sahm","Banu Najjar, Banu Aws, Banu Khazraj, Banu Zuhrah, Banu Asad"],a:0,e:"Ahdnama: Makkah mein har mazloom ki himayat ki jayegi. Aap <span class='ar'>\uFDFA</span> farmate the ke iske badle surkh oont bhi pasand nahi.",r:"Lecture 16"},
{id:"sr45",s:"seerat",d:"medium",t:"mcq",q:"Hazrat Khadija (RA) se nikah ke waqt Nabi <span class='ar'>\uFDFA</span> ki umar kitni thi?",o:["25 saal (is par Ijma hai)","30 saal","35 saal","20 saal"],a:0,e:"Khadija (RA) ki umar ka mash'hoor qaul 40 saal hai; deegar aqwaal 28 ya 30, jadeed tehqiq mein 28 raajih hai.",r:"Lecture 18"},
{id:"sr46",s:"seerat",d:"medium",t:"mcq",q:"Hazrat Khadija (RA) ke pehle do shohar kaun the?",o:["Atiq bin Aaiz Makhzoomi aur Abu Hala Tamimi","Abu Hala Tamimi aur Waraqah bin Naufal","Atiq bin Aaiz aur Hakeem bin Hizam","Abu Sufyan aur Abu Hala"],a:0,e:"Aap (RA) do martaba bewa theen; Abu Hala se ek bacha bhi tha jo baad mein Musalman hua.",r:"Lecture 18"},
{id:"sr47",s:"seerat",d:"medium",t:"mcq",q:"Nabi <span class='ar'>\uFDFA</span> ki kitni aulad thi aur unke naam?",o:["6 \u2014 2 bete (Qasim, Abdullah) aur 4 betiyan (Zainab, Ruqayyah, Umm Kulthum, Fatima)","7 \u2014 3 bete aur 4 betiyan","5 \u2014 1 beta aur 4 betiyan","4 \u2014 2 bete aur 2 betiyan"],a:0,e:"Hazrat Ibrahim ke ilawa tamam aulad Hazrat Khadija (RA) se thi; Ibrahim Hazrat Maria al-Qibtiyya (RA) se the.",r:"Lecture 18"},
{id:"sr48",s:"seerat",d:"medium",t:"mcq",q:"Nabi <span class='ar'>\uFDFA</span> ki kaunsi sahibzadi Aap ki wafat ke baad tak zinda rahin?",o:["Hazrat Fatima (RA) \u2014 Aap ki wafat ke 6 mahine baad faut huin","Hazrat Zainab (RA)","Hazrat Ruqayyah (RA)","Hazrat Umm Kulthum (RA)"],a:0,e:"Tamam bete bachpan mein faut ho gaye aur baqi betiyan Aap <span class='ar'>\uFDFA</span> ki hayat mein.",r:"Lecture 18"},

/* --- HARD --- */
{id:"sr55",s:"seerat",d:"hard",t:"mcq",q:"Kaaba ki az-sar-e-nau taamir ke waqt Nabi <span class='ar'>\uFDFA</span> ki umar aur memaar ka naam?",o:["35 saal \u00b7 memaar Baqoom (Roomi)","30 saal \u00b7 memaar Waleed bin Mughira","35 saal \u00b7 memaar Abu Umayya","40 saal \u00b7 memaar Baqoom"],a:0,e:"Sailab se deewarein phat gayi thi aur pehle aag se kamzor ho chuki thi.",r:"Lecture 19"},
{id:"sr56",s:"seerat",d:"hard",t:"mcq",q:"Hijr / Hatim kyun banana pada?",o:["Halal maal kam pad gaya, is liye Ibrahim (AS) ki buniyad par mukammal taamir na ho saki","Jagah kam thi","Quraish ka jhagda ho gaya","Sailab ka khatra tha"],a:0,e:"Shimal ki taraf taqreeban 6 haath chhod kar chhoti deewar banayi gayi \u2014 usi ko Hijr ya Hatim kehte hain.",r:"Lecture 19"},
{id:"sr57",s:"seerat",d:"hard",t:"mcq",q:"Hajar-e-Aswad ke jhagde ka hal kis ki tajweez se nikla?",o:["Abu Umayya (sabse buzurg sardar) \u2014 jo subah sabse pehle Masjid-e-Haram mein dakhil ho wo hakam banega","Abu Talib","Waleed bin Mughira","Abdul Muttalib"],a:0,e:"Subah sabse pehle Nabi <span class='ar'>\uFDFA</span> dakhil hue; Quraish khush ho kar bole <span class='ar'>هَذَا الأَمِينُ رَضِينَا</span>.",r:"Lecture 19"},
{id:"sr58",s:"seerat",d:"hard",t:"mcq",q:"Nabi <span class='ar'>\uFDFA</span> ko \u201cAl-Ameen\u201d ka laqab kyun mila?",o:["Mamlaat mein be-misal amanatdari, sachayi aur parhezgari ki buniyad par","Jang mein bahaduri ki wajah se","Sakhawat ki wajah se","Ilm ki wajah se"],a:0,e:"\u201cAs-Sadiq\u201d laqab sachayi par aur \u201cAl-Ameen\u201d amanatdari par tha.",r:"Lecture 17 / 20"},
{id:"sr59",s:"seerat",d:"hard",t:"mcq",q:"Hazrat Khadija (RA) kis tareeqe par tijarat karwati theen aur Sham ke safar mein unka ghulam kaun saath gaya?",o:["Mudarabah (profit-sharing) \u00b7 ghulam Maysarah","Musharakah \u00b7 ghulam Zaid bin Harithah","Mudarabah \u00b7 ghulam Zaid bin Harithah","Ijarah \u00b7 ghulam Maysarah"],a:0,e:"Maysarah ne amanatdari aur husn-e-sulook ki tamam baatein Hazrat Khadija (RA) tak pohanchayin, jo nikah ka sabab bani.",r:"Lecture 17 / 18"},
{id:"sr60",s:"seerat",d:"hard",t:"mcq",q:"Nabi <span class='ar'>\uFDFA</span> ne Ghaar-e-Hira mein ibadat ka mamool kitne arse tak rakha?",o:["Taqreeban 3 saal \u2014 har saal Ramzan ka poora mahina","6 mahine","1 saal","5 saal"],a:0,e:"Mahina poora kar ke subah Makkah aate, Kaaba ka tawaf karte, phir ghar jaate. Hazrat Khadija (RA) khana pohanchati theen.",r:"Lecture 21"},
{id:"sr61",s:"seerat",d:"hard",t:"mcq",q:"Nubuwwat se pehle zahir hone wali alaamaat mein kya shamil tha?",o:["Ru'ya-e-Saliha (sache khwab), roshni nazar aana, ghaibi aawazein, aur ek patthar ka salam karna","Sirf sache khwab","Sirf patthar ka salam","Farishton ka nazar aana"],a:0,e:"<span class='ar'>إِنِّي لَأَعْرِفُ حَجَراً بِمَكَّةَ كَانَ يُسَلِّمُ عَلَيَّ قَبْلَ أَنْ أُبْعَثَ</span> \u2014 ye Khawariq-e-Aadat tha, Allah ke hukm se.",r:"Lecture 21"},
{id:"sr62",s:"seerat",d:"hard",t:"mcq",q:"Notes ke mutabiq pehli Wahi ka nuzool kab hua?",o:["21 Ramadan, Yaum-ul-Ithnayn ki raat, Laylatul Qadr \u00b7 10 August 610 CE","17 Ramadan, Jumma ki raat","27 Ramadan, Yaum-ul-Ithnayn","15 Shaban ki raat"],a:0,e:"Quran Ramadan mein aur Laylatul Qadr mein nazil hua; mahireen ke andaze se us saal Peer 21 Ramadan ko thi.",r:"Lecture 23"},
{id:"sr63",s:"seerat",d:"hard",t:"mcq",q:"Pehli Wahi ke waqt Nabi <span class='ar'>\uFDFA</span> ki umar Qamari aur Shamsi hisaab se kitni thi?",o:["Qamari: 40 saal 6 mahine 12 din \u00b7 Shamsi: 39 saal 3 mahine 22 din","Qamari: 40 saal \u00b7 Shamsi: 40 saal","Qamari: 41 saal \u00b7 Shamsi: 40 saal","Qamari: 39 saal \u00b7 Shamsi: 40 saal 6 mahine"],a:0,e:"Shamsi saal 365 din, Qamari 354 din \u2014 har saal 10-11 din ka farq, jo 40 saal mein ~6 mahine ban jata hai.",r:"Lecture 23"},
{id:"sr64",s:"seerat",d:"hard",t:"mcq",q:"\u201c17 Ramadan\u201d wale mauqif ki tardeed ki sabse mazboot wajah kya hai?",o:["17 Ramadan aakhri aashrah ki taaq raat nahi hai, jabke Laylatul Qadr aakhri aashrah ki taaq raaton mein hai","17 Ramadan Jumma ka din tha","17 Ramadan Ghazwa-e-Badr ka din nahi tha","17 Ramadan Shaban mein aata hai"],a:0,e:"Nabi <span class='ar'>\uFDFA</span> ne pehle aur doosre aashrah mein itikaf ke baad ailan kiya ke Laylatul Qadr aakhri aashrah ki taaq raaton mein talash karo.",r:"Lecture 23"},
{id:"sr65",s:"seerat",d:"hard",t:"mcq",q:"Fatrat-ul-Wahi ki muddat ke bare mein muallif ne kis qaul ko tarjeeh di?",o:["Sirf chand ayyam (taqreeban 8\u20139 din)","3 saal","2 saal","40 din"],a:0,e:"Wajah: itni badi zimmedari ke baad 3 saal ka waqfa hota to us darmiyan ki koi maloomat nahi milti, aur Dawah shuru ho chuki thi.",r:"Lecture 24"},
{id:"sr66",s:"seerat",d:"hard",t:"daleel",q:"Wahi ke dobara nuzool par kaunsi Surah ki aayaat nazil huin aur usse kya mila?",o:["Surah Al-Muddatthir \u2014 isse Risalah (paigham pohanchane ka hukm) mila","Surah Al-Alaq \u2014 isse Nubuwwat mili","Surah Al-Fatihah \u2014 isse tarbiyat shuru hui","Surah Al-Kawthar"],a:0,e:"<span class='ar'>قُمْ فَأَنْذِرْ</span> ke saath Tableegh ka hukm shuru hua; pehle sirf Nabi banaye gaye the.",r:"Lecture 24 / 25"},
{id:"sr67",s:"seerat",d:"hard",t:"mcq",q:"Sabse pehle Islam qabool karne wali 4 aham shakhsiyat kaunsi hain?",o:["Khadija (RA), Abu Bakr Siddique (RA), Ali (RA), Zaid bin Harithah (RA)","Khadija (RA), Abu Bakr (RA), Umar (RA), Ali (RA)","Abu Bakr (RA), Ali (RA), Uthman (RA), Zaid (RA)","Khadija (RA), Waraqah (RA), Ali (RA), Zaid (RA)"],a:0,e:"Khadija (RA) pehli Muminah, Abu Bakr (RA) pehle Mumin (mardon mein), Ali (RA) bachon mein, Zaid (RA) azad-karda logon mein.",r:"Lecture 25"},
{id:"sr68",s:"seerat",d:"hard",t:"mcq",q:"As-Sabiqun al-Awwalun ki taqreeban tadaad kitni batayi gayi hai?",o:["Taqreeban 130","Taqreeban 40","Taqreeban 300","Taqreeban 70"],a:0,e:"Khufiya dawat taqreeban 2\u20133 saal chali aur inhi logon ko As-Sabiqun al-Awwalun kaha jata hai.",r:"Lecture 25 / 26"},
{id:"sr69",s:"seerat",d:"hard",t:"mcq",q:"Dar-e-Arqam ki kya haisiyat thi?",o:["Islam ka sabse pehla Madrasah \u2014 Arqam bin Abi al-Arqam ka ghar jo aabadi se thoda bahar tha","Quraish ka majlis khana","Pehli masjid","Abu Bakr (RA) ka ghar"],a:0,e:"Jo bhi Islam qabool karta usko Dar-e-Arqam bula liya jata aur wahan tarbiyat hoti thi.",r:"Lecture 26"},
{id:"sr70",s:"seerat",d:"hard",t:"mcq",q:"Surah Al-Muddatthir ki ibtedayi aayaat ke baad sabse pehli mukammal Surah kaunsi nazil hui?",o:["Surah Al-Fatihah (Umm-ul-Kitab)","Surah Al-Alaq","Surah Al-Ikhlas","Surah Al-Masad"],a:0,e:"Isi Surah ki roshni mein Nabi <span class='ar'>\uFDFA</span> shuruati Musalmanon ki tarbiyat farmate the.",r:"Lecture 26"},
{id:"sr71",s:"seerat",d:"hard",t:"mcq",q:"Risalah shuru hone ke baad sabse pehla amali hukm kaunsa tha?",o:["Salah \u2014 shuru mein subah aur shaam do-do rakat","Zakat","Roza","Hajj"],a:0,e:"Hazrat Jibreel-e-Ameen ne Salah aur Wudu ka tareeqa batlaya; panj-waqta Salah baad mein muta'ayyan hui.",r:"Lecture 26"},
{id:"sr72",s:"seerat",d:"hard",t:"mcq",q:"Sahaba ki tarbiyat kaunse 3 dhaaron (dimensions) se ki ja rahi thi?",o:["Zahiri Taharat, Baatini Taharat, Akhlaqi Tarbiyah","Aqeedah, Fiqh, Tasawwuf","Ilm, Amal, Dawah","Namaz, Roza, Zakat"],a:0,e:"Zahiri = wudu/ghusl, Baatini = Tawheed aur shirk se safai, Akhlaqi = huqooq-ul-ibad aur makarim-e-akhlaq.",r:"Lecture 26"},
{id:"sr73",s:"seerat",d:"hard",t:"mcq",q:"Aelaniya dawat ke do marhale kaunse the?",o:["Pehle qareebi khandan/qarabat-daar, phir Safa pahadi se aam log","Pehle aam log, phir khandan","Pehle hajji, phir Makkah wale","Pehle Madinah, phir Makkah"],a:0,e:"Surah Ash-Shu'ara ki aayat <span class='ar'>وَأَنْذِرْ عَشِيرَتَكَ الأَقْرَبِينَ</span> ke baad Banu Hashim aur Banu Muttalib ke taqreeban 45 afraad jama kiye gaye.",r:"Lecture 27 / 28"},
{id:"sr74",s:"seerat",d:"hard",t:"mcq",q:"Quraish ke mashware mein Walid bin Mugheera ne 4 rayein radd ki. Aakhir mein kaunsi rai ko sabse munasib kaha?",o:["Jaadoogar (Sahir) \u2014 kyunki jaadoo ki baaton mein taseer hoti hai","Kahin (soothsayer)","Majnoon (pagal)","Sha'ir (poet)"],a:0,e:"Unhone kaha jaadoo ka asar ye bataya jaye ke isse gharon mein Tafreeq paida ho jati hai.",r:"Lecture 29"},
{id:"sr75",s:"seerat",d:"hard",t:"mcq",q:"Nazar bin Harith ne dawat rokne ke liye kya kiya?",o:["Heera aur Shaam se Dara, Sikandar, Rustam-o-Isfandiyar ke qisse seekh kar majlison mein sunana aur gaane wali laundiyan khareedna","Quraish ko jama kar ke jhande lagwaye","Hajjiyon ko rok diya","Masjid-e-Haram band karwa diya"],a:0,e:"Iske radd mein aayat nazil hui: <span class='ar'>وَمِنَ النَّاسِ مَنْ يَشْتَرِي لَهْوَ الحَدِيثِ لِيُضِلَّ عَنْ سَبِيلِ اللهِ</span>.",r:"Lecture 30"},
{id:"sr76",s:"seerat",d:"hard",t:"mcq",q:"Mushrikeen ke shor-o-gul ke daur mein Nabi <span class='ar'>\uFDFA</span> ko kaunsi hidayat di gayi?",o:["<span class='ar'>وَلا تَجْهَرْ بِصَلاتِكَ وَلا تُخَافِتْ بِهَا</span> \u2014 darmiyani aawaz","Bilkul khamosh rehna","Bahut buland aawaz se padhna","Namaz chhod dena"],a:0,e:"Maqsad Quran, Allah ki zaat aur Jibreel-e-Ameen ko unki galiyon se bachana tha. Ye aayat \u201cAmeen bil-Jehr\u201d ke masle se mutalliq nahi hai.",r:"Lecture 30"},
{id:"sr77",s:"seerat",d:"hard",t:"daleel",q:"Nabuwat ke kaunse saal mushrikeen ke majma-e-aam mein pehli baar alal-ailan tilawat ka mauqa mila aur kaunsi Surah padhi gayi?",o:["5ve baras Ramzan mein \u00b7 Surah An-Najm","3re baras Ramzan mein \u00b7 Surah Al-Alaq","4the baras \u00b7 Surah Al-Muddatthir","6the baras \u00b7 Surah Al-Fatihah"],a:0,e:"Quraish ka tay tha ke jahan Nabi <span class='ar'>\uFDFA</span> Quran padhein wahan shor macha diya jaye.",r:"Lecture 30"},
{id:"sr78",s:"seerat",d:"hard",t:"mcq",q:"Quraish ne dawat mein shak-o-shubhaat paida karne ke liye Quran ke bare mein kya kaha?",o:["Oont-patang khwab, khud gadha hua, koi insaan sikhata hai, mil-jul kar gadha jhoot, pehlon ke afsaane, jinn/shaitan ka asar","Sirf ye ke ye shairi hai","Sirf ye ke ye Taurat se liya gaya hai","Sirf ye ke ye kahino ki baatein hain"],a:0,e:"Quran ne jawab diya ke Nabi <span class='ar'>\uFDFA</span> Ummi hain, aur shaitan <span class='ar'>كُلِّ أَفَّاكٍ أَثِيمٍ</span> par utarte hain \u2014 jabke Aap Sadiq-o-Ameen the.",r:"Lecture 30"},
{id:"sr79",s:"seerat",d:"hard",t:"daleel",q:"Abu Lahab ki gustakhi par kaunsi Surah nazil hui?",o:["Surah Al-Masad (Lahab)","Surah Al-Kawthar","Surah Al-Kafirun","Surah An-Nasr"],a:0,e:"Aelaniya dawat ke aaghaz mein sabse pehle mukhalifat Aap ke chacha Abu Lahab ki taraf se hui.",r:"Lecture 28 / 7"},
{id:"sr80",s:"seerat",d:"hard",t:"daleel",q:"Nabi <span class='ar'>\uFDFA</span> ke beton ki wafat par kuffar ne \u201cAbtar\u201d ka taana diya, jiske jawab mein kaunsi Surah nazil hui?",o:["Surah Al-Kawthar","Surah Al-Ahzab","Surah Al-Masad","Surah Ad-Duha"],a:0,e:"<span class='ar'>إِنَّا أَعْطَيْنَاكَ الكَوْثَرَ</span> \u2014 aur wazeh hua ke dushman khud Abtar (be-naam-o-nishan) honge.",r:"Lecture 18"},
{id:"sr81",s:"seerat",d:"hard",t:"mcq",q:"Zamana-e-jahiliyat mein nikah ki 4 qismein (Sahih Bukhari, Hazrat Aisha RA) mein se kaunsi Islam ne baaqi rakhi?",o:["Nikah-e-Naas \u2014 paigham, Mahr aur ba-qaida ijab-o-qbool","Nikah-e-Istibza","Group Marriage (Reht)","Bagaya"],a:0,e:"Baqi teeno (Istibza, Reht, Bagaya) haram qarar de kar khatam kar diye gaye.",r:"Lecture 6"},
{id:"sr82",s:"seerat",d:"hard",t:"mcq",q:"Jahiliyat mein bewa ki Iddat kitni thi aur Islam ne kya muqarrar ki?",o:["Jahiliyat mein 1 saal (Hufsh mein) \u00b7 Islam mein 4 mahine 10 din izzat ke saath","Jahiliyat mein 6 mahine \u00b7 Islam mein 1 saal","Jahiliyat mein 4 mahine \u00b7 Islam mein 1 saal","Jahiliyat mein 3 mahine \u00b7 Islam mein 4 mahine 10 din"],a:0,e:"Hufsh: tang aur ganda kamra; nahana, kapde badalna aur khushboo lagana mana tha, aur saal ke aakhir mein \u201cmengni\u201d phenkne ki rasm thi.",r:"Lecture 5 / 6"},
{id:"sr83",s:"seerat",d:"hard",t:"mcq",q:"Arab ki kaunsi 4 khoobiyan Nabuwwat ke intekhab ki wajah banin?",o:["Sakhawat, Sachai, Ahad ki Pabandi, Zehanat aur Quwwat-e-Hifza","Sakhawat, Bahaduri, Daulat, Tijarat","Sachai, Ilm, Sabr, Zuhd","Ahad ki pabandi, Hilm, Ilm, Adl"],a:0,e:"Sachai ki misal: sakht dushmani ke bawajood Abu Sufyan ne Heraclius ke saamne Nabi <span class='ar'>\uFDFA</span> ke bare mein sach bola.",r:"Lecture 6"},
{id:"sr84",s:"seerat",d:"hard",t:"mcq",q:"\u201cHumus\u201d kya tha?",o:["Quraish ki bida'at \u2014 khud ko \u201cHaram ke paasbaan\u201d aur afzal samajh kar Arafah na jaana","Ek but ka naam","Hajj ka ek rukn","Ek qabeela"],a:0,e:"Quran ne radd kiya: <span class='ar'>ثُمَّ أَفِيضُوا مِنْ حَيْثُ أَفَاضَ النَّاسُ</span>. Nange tawaaf ki rasm bhi isi se judi thi.",r:"Lecture 4"}

{id:"um2",s:"umdat",d:"easy",t:"mcq",q:"Umdatul-Ahkam ke musannif kaun hain?",o:["Hafiz Taqiyy-ud-Deen Abu Muhammad Abdul Ghani bin Abdul Wahid al-Maqdisi","Ibn Daqeeq al-Eid","Ibn al-Mulaqqin","Hafiz Ibn Hajar al-Asqalani"],a:0,e:"Unka madhhab Hanbali tha aur wo bohot aala darje ke aalim the.",r:"Lecture 1"},
