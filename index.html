/* Aasan Fiqh — Tarteeb: Abdul Hafeez Umri Madani · Nazar-e-Sani: Ta Saeed Khalid Umri Madani
   Syllabus: Shuru se "Namaz ki Duaein" tak — Book p.10 se p.59 tak (26 abwab) */
BANK.push(
/* --- EASY --- */
{id:"fq1",s:"fiqh",d:"easy",t:"mcq",q:"Kitab \u201cAasan Fiqh\u201d kis ne tarteeb di hai?",o:["Abdul Hafeez Umri Madani","Ta Saeed Khalid Umri Madani","Shaikh Abdul Ghani al-Maqdisi","Safiur Rahman Mubarakpuri"],a:0,e:"Nazar-e-Sani (revision) Ta Saeed Khalid Umri Madani (M.A. Makkah Mukarramah) ne ki hai.",r:"Aasan Fiqh \u00b7 Title page"},
{id:"fq2",s:"fiqh",d:"easy",t:"mcq",q:"Kitab mein kaunse paanch mauzuaat ke fiqhi masail jama kiye gaye hain?",o:["Taharat, Namaz, Zakat, Roza aur Hajj","Taharat, Namaz, Nikah, Talaq aur Meeras","Aqeedah, Namaz, Roza, Zakat aur Jihad","Taharat, Namaz, Bay, Riba aur Hajj"],a:0,e:"Title par: <span class='ar'>(طهارت، نماز، زکوٰۃ، روزہ اور حج کے مسائل)</span>.",r:"Aasan Fiqh \u00b7 Title page"},
{id:"fq3",s:"fiqh",d:"easy",t:"mcq",q:"Fiqh ka lughawi ma'na kya hai?",o:["Samajh-boojh","Ilm","Amal","Faisla"],a:0,e:"Fiqh ki tareef: <span class='ar'>تفصیلی دلائل کے ساتھ شرعی احکام معلوم کرنا</span>.",r:"Aasan Fiqh \u00b7 p.10"},
{id:"fq4",s:"fiqh",d:"easy",t:"mcq",q:"Farz ki tareef kya hai?",o:["Allah aur Rasool ne jis kaam ko lazimi taur par karne ka hukm diya; karne par sawab aur na karne par gunah","Jiske karne mein sawab aur na karne par gunah nahi","Jiske karne aur chhodne ka ikhtiyar ho","Jis se mana kiya gaya ho"],a:0,e:"Farz ko \u201cWajib\u201d bhi kaha jata hai \u2014 jaise Namaz, Roza waghera.",r:"Aasan Fiqh \u00b7 p.10 (Istilahat)"},
{id:"fq5",s:"fiqh",d:"easy",t:"mcq",q:"Farz-e-Ayn aur Farz-e-Kifayah mein farq kya hai?",o:["Farz-e-Ayn har insan par lazim hai; Farz-e-Kifayah chand log ada kar dein to kaafi ho jata hai","Dono ek hi hain","Farz-e-Kifayah har insan par lazim hai","Farz-e-Ayn sirf mardon par hai"],a:0,e:"Farz-e-Ayn: Namaz, Roza. Farz-e-Kifayah: janaze ki tadfeen-o-takfeen \u2014 agar koi ada na kare to tamam Musalman gunahgaar honge.",r:"Aasan Fiqh \u00b7 p.10"},
{id:"fq6",s:"fiqh",d:"easy",t:"mcq",q:"Mustahab ki tareef kya hai?",o:["Aisa kaam jise karne mein sawab ho aur na karne par koi gunah na ho","Aisa kaam jo lazim ho","Aisa kaam jis se mana kiya gaya ho","Aisa kaam jo baatil ho"],a:0,e:"Ise \u201cMandoob\u201d, \u201cNafl\u201d aur \u201cSunnat\u201d bhi kaha jata hai \u2014 jaise miswaak karna.",r:"Aasan Fiqh \u00b7 p.10"},
{id:"fq7",s:"fiqh",d:"easy",t:"mcq",q:"Shart aur Rukn mein kya farq hai?",o:["Shart ibadat se bahar hoti hai magar zaroori hai; Rukn ibadat ka hissa hai aur uske baghair ibadat baatil ho jati hai","Dono ek hi hain","Rukn ibadat se bahar hota hai","Shart ibadat ka hissa hai"],a:0,e:"Misal: Wudu Namaz ki shart hai; Qiyam, Rukoo aur Sajdah Namaz ke arkan hain.",r:"Aasan Fiqh \u00b7 p.10"},
{id:"fq8",s:"fiqh",d:"easy",t:"mcq",q:"Paani ki kitni qismein batayi gayi hain?",o:["2 \u2014 Ma-e-Tahoor aur Ma-e-Najis","3","4","2 \u2014 Meetha aur Khara"],a:0,e:"Ma-e-Tahoor (paak paani) apni asli haalat par baqi rehta hai aur doosri cheez ko bhi paak kar sakta hai; Ma-e-Najis ka istemal haram hai.",r:"Aasan Fiqh \u00b7 p.11"},
{id:"fq9",s:"fiqh",d:"easy",t:"mcq",q:"Ma-e-Tahoor ki misalein kaunsi hain?",o:["Barish, kuwein, nehar, chashme aur samandar ka paani","Sirf barish ka paani","Sirf kuwein ka paani","Sirf Zamzam ka paani"],a:0,e:"Ma-e-Tahoor ka hukm: har qism ki taharat ke liye iska istemal jaiz hai \u2014 wudu, ghusl, istinja waghera.",r:"Aasan Fiqh \u00b7 p.11"},
{id:"fq10",s:"fiqh",d:"easy",t:"mcq",q:"Paani kab \u201cNajis\u201d kehlata hai?",o:["Jab gandagi girne ki wajah se uska rang, maza badal jaye ya usme badbu paida ho jaye","Jab uska rang thoda halka ho jaye","Jab wo thanda ho jaye","Jab wo lambe arse tak thehra rahe"],a:0,e:"Aur wo teen sifaat yehi hain: rang, boo aur maza. Agar gandagi girne par bhi in teen mein koi tabdeeli na ho to paani paak hi rehta hai.",r:"Aasan Fiqh \u00b7 p.11\u201312"},
{id:"fq11",s:"fiqh",d:"easy",t:"mcq",q:"Jo paani lambe arse tak ek jagah thehra rahe \u2014 uska hukm?",o:["Wo paak hai, kyunki tabdeeli gandagi ki wajah se nahi balki thehrne ki wajah se hai","Wo napak hai","Uska istemal makrooh hai","Sirf istinja ke liye jaiz hai"],a:0,e:"Kitab ki sareeh ibarat: <span class='ar'>لہذا پانی پاک ہے</span>.",r:"Aasan Fiqh \u00b7 p.12"},
{id:"fq12",s:"fiqh",d:"easy",t:"mcq",q:"Najasaton mein kaunsi cheezein shamil hain?",o:["Sabeelain se nikalne wali cheezein (peshab, pakhana, madhi, wadi, mani), Dam-e-Masfooh, kutte ka thook, murda janwaron ka gosht, aur haram janwaron ka peshab-pakhana","Sirf peshab aur pakhana","Sirf kutte ka thook","Sirf khoon"],a:0,e:"Dam-e-Masfooh = zabah ke waqt jo behta hua khoon nikalta hai (Surah Al-An'am: 145).",r:"Aasan Fiqh \u00b7 p.13"},
{id:"fq13",s:"fiqh",d:"easy",t:"mcq",q:"Halal janwaron ke gobar aur peshab ka hukm kya hai?",o:["Paak hai","Napak hai","Makrooh hai","Ikhtilafi hai"],a:0,e:"Daleel: Nabi <span class='ar'>\uFDFA</span> ne qabeela Urayna ke logon ko dawa ke taur par oonton ka doodh aur peshab peene ka hukm diya (Bukhari).",r:"Aasan Fiqh \u00b7 p.13"},
{id:"fq14",s:"fiqh",d:"easy",t:"mcq",q:"Billi ke joothe (bache hue paani) ka hukm kya hai?",o:["Paak hai","Napak hai","Sirf wudu ke liye jaiz","Sirf peene ke liye jaiz"],a:0,e:"Daleel: Sahih Abu Dawood. Isi tarah halal janwaron ka jootha bhi paak hai (Sahih Tirmidhi), aur murda machhli aur tiddi bhi paak hai.",r:"Aasan Fiqh \u00b7 p.13"},
{id:"fq15",s:"fiqh",d:"easy",t:"mcq",q:"Wo kide-makode jin mein behta hua khoon nahi hota \u2014 unka hukm?",o:["Paak hain \u2014 jaise makkhi aur chuinti","Napak hain","Makrooh hain","Unhein maar dena zaroori hai"],a:0,e:"Kitab mein \u201cMani\u201d (mard ka mani) bhi un cheezon mein zikr hai jo napak nahi hain.",r:"Aasan Fiqh \u00b7 p.13"},
{id:"fq16",s:"fiqh",d:"easy",t:"mcq",q:"Istinja aur Istijmar mein farq kya hai?",o:["Istinja: sabeelain ko paani se dhona \u00b7 Istijmar: patthar waghera se saaf karna","Istinja: patthar se saaf karna \u00b7 Istijmar: paani se dhona","Dono ek hi hain","Istinja: wudu \u00b7 Istijmar: ghusl"],a:0,e:"Istijmar har paak cheez se jaiz hai \u2014 patthar, dhela, eent, lakdi, kagaz, kapda, tissue waghera.",r:"Aasan Fiqh \u00b7 p.20"},
{id:"fq17",s:"fiqh",d:"easy",t:"mcq",q:"Istijmar mein kam az kam kitni martaba saaf karna wajib hai?",o:["3 martaba","1 martaba","5 martaba","7 martaba"],a:0,e:"Salman Farsi (RA) ki riwayat: Nabi <span class='ar'>\uFDFA</span> ne teen patthar se kam istijmar karne se mana farmaya (Muslim).",r:"Aasan Fiqh \u00b7 p.20"},
{id:"fq18",s:"fiqh",d:"easy",t:"mcq",q:"Azaan ka ma'na kya hai?",o:["Namaz ke waqt ka ailan karna","Jamaat khadi hone ka ailan karna","Buland aawaz se pukarna","Masjid mein jama hona"],a:0,e:"Iqamat ka ma'na: jamaat khadi hone ka ailan karna. Azaan aur Iqamat sirf mardon par wajib hai.",r:"Aasan Fiqh \u00b7 p.49"},
{id:"fq19",s:"fiqh",d:"easy",t:"mcq",q:"Azaan ke kul kitne jumle hain aur Iqamat ke kitne?",o:["Azaan: 15 jumle \u00b7 Iqamat: 11 jumle","Azaan: 11 \u00b7 Iqamat: 15","Azaan: 7 \u00b7 Iqamat: 5","Azaan: 15 \u00b7 Iqamat: 15"],a:0,e:"Ye imtehan mein bohot poocha jata hai \u2014 pandrah aur gyarah.",r:"Aasan Fiqh \u00b7 p.49\u201350"},
{id:"fq20",s:"fiqh",d:"easy",t:"mcq",q:"Namaz Islam ka kaunsa rukn hai?",o:["Doosra rukn","Pehla rukn","Teesra rukn","Chautha rukn"],a:0,e:"Daleel: Bukhari. Aur Qiyamat ke din sab se pehle Namaz ka hisaab liya jayega (Sahih Tirmidhi).",r:"Aasan Fiqh \u00b7 p.53"},

/* --- MEDIUM --- */
{id:"fq25",s:"fiqh",d:"medium",t:"mcq",q:"Najasat door karne ke bare mein: neend se bedaar hone par kya hukm hai?",o:["Teen baar haath dhoye baghair paani mein haath daalna mana hai","Sirf ek baar dhona kaafi hai","Koi hukm nahi","Paanch baar dhona zaroori hai"],a:0,e:"Daleel: Muslim. Wajah: insan ko maloom nahi ke uska haath raat bhar kahan raha.",r:"Aasan Fiqh \u00b7 p.16"},
{id:"fq26",s:"fiqh",d:"medium",t:"mcq",q:"Sheer-khwar (doodh peete) bache ke peshab ko paak karne ka tareeqa kya hai?",o:["Ladke ke peshab par paani chhidak dena kaafi hai, aur ladki ke peshab ko dhona chahiye","Dono ka dhona zaroori hai","Dono par chhidakna kaafi hai","Sirf ladki ke peshab par chhidakna kaafi hai"],a:0,e:"Albatta jab bacha khana khane lage to uske peshab ko bhi dhona zaroori hai (Sahih Abu Dawood).",r:"Aasan Fiqh \u00b7 p.16"},
{id:"fq27",s:"fiqh",d:"medium",t:"mcq",q:"Aurat ke lambe kapde (burqa ya daman) ka hukm jab wo gandi jagah se guzar jaye?",o:["Baad wali paak zameen se guzarne par wo paak ho jata hai","Use dhona zaroori hai","Wo hamesha napak rehta hai","Namaz us mein nahi ho sakti"],a:0,e:"Umm Salamah (RA) ke sawal par Nabi <span class='ar'>\uFDFA</span> ne farmaya: <span class='ar'>اس کے بعد والا حصہ اس کو پاک کر دے گا</span> (Ibn Majah: Sahih).",r:"Aasan Fiqh \u00b7 p.16"},
{id:"fq28",s:"fiqh",d:"medium",t:"mcq",q:"Zameen ki gandagi kaise paak hoti hai?",o:["Dhoop ya hawa mein sookh kar khatam ho jaye to zameen paak ho jati hai","Sirf paani bahane se","Mitti daalne se","Wo kabhi paak nahi hoti"],a:0,e:"Isi tarah joote ya chappal ki gandagi zameen par ragadne se paak ho jati hai, aur phir unhein pehan kar namaz padhna bhi jaiz hai (Abu Dawood: Sahih).",r:"Aasan Fiqh \u00b7 p.16"},
{id:"fq29",s:"fiqh",d:"medium",t:"mcq",q:"Kutte ne bartan mein munh daal diya to kya karna chahiye?",o:["Pehle use ulat kar khali karein, phir saat martaba dhoyein \u2014 pehli martaba mitti se","Sirf saat martaba paani se dhoyein","Teen martaba dhoyein","Bartan tod dein"],a:0,e:"Daleel: Bukhari, Tirmidhi. Kutte ka jootha napak hai.",r:"Aasan Fiqh \u00b7 p.16"},
{id:"fq30",s:"fiqh",d:"medium",t:"mcq",q:"Ma'kool-ul-Lahm (halal gosht wale) murda janwar ka chamda kaise paak hota hai?",o:["Dabaghat (tanning) dene se","Dhone se","Dhoop mein rakhne se","Wo paak nahi hota"],a:0,e:"Daleel: Ahmad, Abu Dawood \u2014 bahawala Ash-Sharh al-Mumti'.",r:"Aasan Fiqh \u00b7 p.16"},
{id:"fq31",s:"fiqh",d:"medium",t:"mcq",q:"Das Fitri cheezein (Khisal-e-Fitrat) mein kaunsi shamil hain?",o:["Moonch katna, daadhi badhana, miswaak, naak mein paani, naakhun tarashna, joron ko dhona, baghal ke baal, zer-e-naaf baal, istinja, khatna","Sirf miswaak aur naakhun katna","Sirf khatna aur istinja","Sirf daadhi badhana aur moonch katna"],a:0,e:"Sayyidah Aisha (RA) ki riwayat (Muslim) \u2014 kul das cheezein jo taharat aur nazaafat se mutalliq hain.",r:"Aasan Fiqh \u00b7 p.16"},
{id:"fq32",s:"fiqh",d:"medium",t:"mcq",q:"Bait-ul-Khala mein dakhil hone se pehle kaunsi dua padhi jati hai?",o:["<span class='ar'>اَللّٰهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ</span>","<span class='ar'>غُفْرَانَكَ</span>","<span class='ar'>بِسْمِ اللهِ تَوَكَّلْتُ عَلَى اللهِ</span>","<span class='ar'>اَللّٰهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ</span>"],a:0,e:"Nikalne ke baad <span class='ar'>غُفْرَانَكَ</span> padhi jati hai (Abu Dawood). Dakhil hote waqt baaya paair pehle, nikalte waqt daaya paair pehle.",r:"Aasan Fiqh \u00b7 p.18"},
{id:"fq33",s:"fiqh",d:"medium",t:"mcq",q:"Qada-e-hajat ke waqt kis taraf munh ya peeth karna mana hai?",o:["Qibla ki taraf","Mashriq ki taraf","Maghrib ki taraf","Shumal ki taraf"],a:0,e:"Deegar adab: sharamgah chhupana, cheenton se bachna, guftagu na karna, aur seedhe haath se sharamgah ko na chhoona (Bukhari, Muslim).",r:"Aasan Fiqh \u00b7 p.18"},
{id:"fq34",s:"fiqh",d:"medium",t:"mcq",q:"Wo kaunsi teen jagahein hain jahan qada-e-hajat karna haram hai?",o:["Aam raaston mein, saya-daar jagahon/phal-daar darakhton ke neeche, aur thehre hue paani mein","Sirf raaston mein","Sirf paani mein","Sirf masjid ke qareeb"],a:0,e:"Daleel: Muslim, Abu Dawood.",r:"Aasan Fiqh \u00b7 p.18"},
{id:"fq35",s:"fiqh",d:"medium",t:"mcq",q:"Wo cheezein jin se Istijmar jaiz nahi \u2014 kaunsi hain?",o:["Jin mein Allah ka naam ho, insano-janwaron ki khurak, haddi, aur leed/sookha gobar","Sirf haddi","Sirf kagaz","Sirf patthar"],a:0,e:"Haddi jinnon ki ghiza hai aur leed-gobar jinnon ke janwaron ki ghiza hai, is liye in se istijmar mana hai.",r:"Aasan Fiqh \u00b7 p.20"},
{id:"fq36",s:"fiqh",d:"medium",t:"mcq",q:"Wudu ki fazilat mein <span class='ar'>الطُّهُورُ شَطْرُ الإِيمَانِ</span> ka matlab kya hai?",o:["Taharat aadha imaan hai","Taharat imaan ki kunji hai","Taharat namaz ki shart hai","Taharat sunnat hai"],a:0,e:"Aur doosri hadees: <span class='ar'>مِفْتَاحُ الصَّلاةِ الطُّهُورُ</span> \u2014 taharat namaz ki kunji hai (Ibn Majah: Sahih).",r:"Aasan Fiqh \u00b7 p.22"},
{id:"fq37",s:"fiqh",d:"medium",t:"mcq",q:"Wudu karne walon ki Qiyamat ke din kya pehchan hogi?",o:["Unke chehre aur aaza wudu ke nishanat se roshan aur chamakdaar honge","Unhein sabse pehle bulaya jayega","Unke sar par taaj hoga","Unhein Jannat ki chaabi milegi"],a:0,e:"<span class='ar'>إِنَّ أُمَّتِي يُدْعَوْنَ يَوْمَ القِيَامَةِ غُرّاً مُحَجَّلِينَ مِنْ آثَارِ الوُضُوءِ</span> (Bukhari, Muslim).",r:"Aasan Fiqh \u00b7 p.22"},
{id:"fq38",s:"fiqh",d:"medium",t:"mcq",q:"Wudu ke shurut (sharaait) kitni aur kaunsi hain?",o:["3 \u2014 niyyat, paani ka paak hona, aur paani pohanchne se rokne wali cheez ka na hona","2","4","5"],a:0,e:"Rokne wali cheezein: mom, nail polish, paint, tel, chikna paint waghera. Agar ek shart bhi poori na ho to wudu sahih nahi hoga.",r:"Aasan Fiqh \u00b7 p.26"},
{id:"fq39",s:"fiqh",d:"medium",t:"mcq",q:"Wudu ke Faraiz kitne hain?",o:["6","4","5","7"],a:0,e:"Chehra dhona (kulli + naak), haath kohniyon samet, poore sar ka masah (kaanon samet), paanv takhnon samet, tarteeb, aur Muwalat.",r:"Aasan Fiqh \u00b7 p.27"},
{id:"fq40",s:"fiqh",d:"medium",t:"mcq",q:"\u201cMuwalat\u201d ka matlab kya hai?",o:["Tamam aaza ek doosre ke baad bila-takheer dhona","Tarteeb se dhona","Teen martaba dhona","Niyyat karna"],a:0,e:"Rehnumae Muallim: ek aaza dhone ke baad doosre ko dhone mein itni takheer nahi honi chahiye ke pehla aaza sookh jaye.",r:"Aasan Fiqh \u00b7 p.27"},
{id:"fq41",s:"fiqh",d:"medium",t:"daleel",q:"Wudu ke Faraiz ki Quran se daleel kaunsi aayat hai?",o:["<span class='ar'>يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا قُمْتُمْ إِلَى الصَّلاةِ فَاغْسِلُوا وُجُوهَكُمْ وَأَيْدِيَكُمْ إِلَى المَرَافِقِ وَامْسَحُوا بِرُءُوسِكُمْ وَأَرْجُلَكُمْ إِلَى الكَعْبَيْنِ</span> \u2014 Al-Ma'idah: 6","<span class='ar'>وَأَقِيمُوا الصَّلاةَ</span>","<span class='ar'>إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ</span>","<span class='ar'>الطُّهُورُ شَطْرُ الإِيمَانِ</span>"],a:0,e:"Isi aayat se chaar faraiz aur unki tarteeb dono saabit hote hain.",r:"Aasan Fiqh \u00b7 p.27 (Daleel)"},
{id:"fq42",s:"fiqh",d:"medium",t:"mcq",q:"Wudu mein aaza ko dhone ka hukm kya hai?",o:["Ek martaba dhona farz hai, teen martaba se zyada dhona israaf aur haram hai","Teen martaba dhona farz hai","Do martaba farz hai","Jitna marzi dhoya ja sakta hai"],a:0,e:"Daleel: Bukhari, Muslim; aur zyadti ke bare mein Abu Dawood (Hasan).",r:"Aasan Fiqh \u00b7 p.28"},
{id:"fq43",s:"fiqh",d:"medium",t:"mcq",q:"Miswaak ke paanch mustahab auqat kaunse hain?",o:["Wudu ke waqt, namaz ke waqt, tilawat-e-Quran ke waqt, neend se bedaar hone par, aur munh ki kaifiyat badalne par","Sirf wudu aur namaz ke waqt","Sirf subah aur sham","Sirf Ramzan mein"],a:0,e:"Miswaak har waqt mustahab hai, magar in paanch auqat mein iski ahmiyat zyada hai (Sharh Muslim \u2014 Imam Nawawi).",r:"Aasan Fiqh \u00b7 p.28"},
{id:"fq44",s:"fiqh",d:"medium",t:"mcq",q:"Nawaqid-e-Wudu (wudu todne wali cheezein) kitni aur kaunsi hain?",o:["5 \u2014 sabeelain se kisi cheez ka kharij hona, gehri neend, be-hosh hona, sharamgah ko bila-kapde haath lagana, aur oont ka gosht khana","3","4","6"],a:0,e:"Daleel: Bukhari, Muslim, Tirmidhi; oont ke gosht ke liye Muslim; gehri neend ke liye Abu Dawood (Hasan).",r:"Aasan Fiqh \u00b7 p.30"},
{id:"fq45",s:"fiqh",d:"medium",t:"mcq",q:"Wo haalaat jo Nawaqid-e-Wudu NAHI hain \u2014 kaunse hain?",o:["Aag par pakki cheez khana, qai (vomiting) hona, nakseer phootna, aur sabeelain ke ilawa jism se khoon/peep nikalna","Sirf qai hona","Sirf nakseer","Oont ka gosht khana"],a:0,e:"In haalaat mein wudu nahi toot'ta, agar kar lein to behtar hai lekin wajib nahi.",r:"Aasan Fiqh \u00b7 p.32"},
{id:"fq46",s:"fiqh",d:"medium",t:"mcq",q:"Wo kaunse teen afaal hain jinke liye wudu karna WAJIB hai?",o:["Namaz padhne ke liye, Baitullah ka tawaf karne ke liye, aur Quran pakadne ke liye","Sirf namaz ke liye","Sirf tawaf ke liye","Sirf sone se pehle"],a:0,e:"Daleel: Al-Ma'idah: 6 (namaz), Muttafaq alaih (tawaf), Muwatta aur Nasa'i (Quran pakadna).",r:"Aasan Fiqh \u00b7 p.33"},
{id:"fq47",s:"fiqh",d:"medium",t:"mcq",q:"Mozon par masah ki shurut kitni aur kaunsi hain?",o:["2 \u2014 mozay wudu ki haalat mein pehne gaye hon, aur mozay gandagi se paak hon","1 \u2014 sirf chamde ke hon","3","4"],a:0,e:"Daleel: Bukhari, Muslim. Mard apne imama (pagdi) par bhi masah kar sakta hai (Muslim, Sahih Ibn Majah).",r:"Aasan Fiqh \u00b7 p.34"},
{id:"fq48",s:"fiqh",d:"medium",t:"mcq",q:"Mozon par masah ki muddat kitni hai?",o:["Muqeem ke liye: ek din aur ek raat \u00b7 Musafir ke liye: teen din aur teen raat","Dono ke liye ek din","Dono ke liye teen din","Muqeem: teen din \u00b7 Musafir: ek din"],a:0,e:"Daleel dono ke liye: Muslim.",r:"Aasan Fiqh \u00b7 p.34"},
{id:"fq49",s:"fiqh",d:"medium",t:"mcq",q:"Mozon par masah karne ka sahih tareeqa kya hai?",o:["Dono haath tar kar ke daaya haath daaye paair par aur baaya haath baaye paair par ek saath pherna \u2014 sirf mozon ke ooper","Mozon ke neeche masah karna","Pehle daaya phir baaya, mozon ke ooper aur neeche dono","Teen martaba masah karna"],a:0,e:"Masah ek hi martaba karna chahiye. Mozon ke neeche masah karna sunnat se saabit nahi.",r:"Aasan Fiqh \u00b7 p.36"},
{id:"fq50",s:"fiqh",d:"medium",t:"mcq",q:"Tayammum ke shurut kitne aur kaunse hain?",o:["2 \u2014 dil mein tayammum ki niyyat karna, aur mitti ka paak hona","1","3","4"],a:0,e:"Tayammum ka tareeqa: \u201cBismillah\u201d keh kar paak zameen par ek baar dono haath maarna, phir chehre aur dono hatheliyon ki pusht par masah karna (Bukhari, Muslim).",r:"Aasan Fiqh \u00b7 p.41"},

/* --- HARD --- */
{id:"fq60",s:"fiqh",d:"hard",t:"mcq",q:"Wudu ka masnoon tareeqa \u2014 sar ke masah ka sahih tareeqa kya hai?",o:["Dono haath sar ke agle hisse se guddi tak le jayein aur waheen se wapas agle hisse tak le aayein","Sirf agle hisse par masah karein","Sirf guddi par masah karein","Teen martaba poore sar par masah karein"],a:0,e:"Daleel: Bukhari. Aur masah ek hi baar karna hai.",r:"Aasan Fiqh \u00b7 p.24"},
{id:"fq61",s:"fiqh",d:"hard",t:"mcq",q:"Kaanon ke masah ka masnoon tareeqa kya hai?",o:["Shahadat ki dono ungliyon se kaanon ke andar, aur dono angoothon se kaanon ke ooper wale hisse par masah karein","Sirf kaanon ke andar masah karein","Sirf kaanon ke peeche masah karein","Kaanon ka masah zaroori nahi"],a:0,e:"Daleel: Sahih Sunan Nasa'i. Wudu ke faraiz mein bhi kaanon ka masah sar ke masah mein shamil hai.",r:"Aasan Fiqh \u00b7 p.24 / p.27"},
{id:"fq62",s:"fiqh",d:"hard",t:"mcq",q:"Wudu ke baad ki masnoon dua kaunsi hai?",o:["<span class='ar'>أَشْهَدُ أَنْ لا إِلَهَ إِلَّا اللهُ وَحْدَهُ لا شَرِيكَ لَهُ وَأَشْهَدُ أَنَّ مُحَمَّداً\u2026</span>","<span class='ar'>غُفْرَانَكَ</span>","<span class='ar'>اَللّٰهُمَّ بَاعِدْ بَيْنِي وَبَيْنَ خَطَايَايَ</span>","<span class='ar'>بِسْمِ اللهِ تَوَكَّلْتُ عَلَى اللهِ</span>"],a:0,e:"Kitab ne ye dua wudu ke tareeqe ke aakhir mein zikr ki hai (Muslim, Tirmidhi, Nasa'i).",r:"Aasan Fiqh \u00b7 p.24 / p.28"},
{id:"fq63",s:"fiqh",d:"hard",t:"mcq",q:"Hazrat Humran (RA) ki riwayat mein Hazrat Uthman (RA) ke wudu ke baad kaunse alfaz aaye?",o:["<span class='ar'>رَأَيْتُ رَسُولَ اللهِ \uFDFA تَوَضَّأَ نَحْوَ وُضُوئِي هَذَا</span>","<span class='ar'>هَذَا وُضُوءٌ لا يَقْبَلُهُ اللهُ إِلَّا بِهِ</span>","<span class='ar'>مَنْ تَوَضَّأَ هَكَذَا غُفِرَ لَهُ</span>","<span class='ar'>الوُضُوءُ شَطْرُ الإِيمَانِ</span>"],a:0,e:"Yaani: \u201cMain ne Rasoolullah <span class='ar'>\uFDFA</span> ko dekha ke Aap ne isi tarah wudu kiya\u201d (Muslim).",r:"Aasan Fiqh \u00b7 p.24"},
{id:"fq64",s:"fiqh",d:"hard",t:"mcq",q:"Wudu ke shurut mein <span class='ar'>إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ</span> se kya saabit hota hai, aur niyyat ka mahal kya hai?",o:["Niyyat shart hai, aur uska mahal DIL hai \u2014 zabaan se kehna murad nahi","Niyyat zabaan se kehna zaroori hai","Niyyat mustahab hai","Niyyat sirf ghusl mein shart hai"],a:0,e:"Rehnumae Muallim: <span class='ar'>اس کا مطلب زبان سے نیت کرنا نہیں ہے، بلکہ دل سے نیت کرنا مراد ہے</span> \u2014 kyunki niyyat ka talluq dil se hai.",r:"Aasan Fiqh \u00b7 p.26"},
{id:"fq65",s:"fiqh",d:"hard",t:"mcq",q:"Wo kaunse afaal hain jinke liye wudu karna MUSTAHAB hai?",o:["Zikr karne ke liye, wudu toot'ne par fauran dobara, ghusl-e-janabat se pehle, raat ko sone se pehle, meyyat uthane ki wajah se, aur qai hone ke baad","Sirf sone se pehle","Sirf zikr ke liye","Sirf ghusl se pehle"],a:0,e:"Daleel: Sahih Abu Dawood (zikr), Sahih at-Targheeb, Bukhari (ghusl aur sona), Sahih Tirmidhi (meyyat aur qai).",r:"Aasan Fiqh \u00b7 p.33"},
{id:"fq66",s:"fiqh",d:"hard",t:"mcq",q:"Mozon par masah ki muddat kab se shuru hoti hai?",o:["Wudu toot'ne ke baad jab pehli baar masah kiya jaye, usi waqt se muddat shuru hoti hai","Mozay pehnte waqt se","Wudu karte waqt se","Suraj tuloo hone se"],a:0,e:"Kitab ki misal: Fajr ka wudu Zohar tak baqi raha, Zohar mein toota, phir masah kiya \u2014 muddat usi waqt se shuru hui.",r:"Aasan Fiqh \u00b7 p.36"},
{id:"fq67",s:"fiqh",d:"hard",t:"mcq",q:"Masah ki muddat khatam hone ke baad agar shakhs ba-wudu hai to kya hukm hai?",o:["Jab tak wudu baqi rahe us waqt tak namazein padh sakta hai; agla wudu karte waqt mozay utarne aur paanv dhone honge","Fauran wudu toot jata hai","Mozay utarna zaroori nahi","Namaz nahi ho sakti"],a:0,e:"Kitab ki misal: Asr ke waqt muddat khatam hui magar wudu baqi tha \u2014 usne Asr aur Maghrib usi wudu se padhi, phir wudu toota.",r:"Aasan Fiqh \u00b7 p.36"},
{id:"fq68",s:"fiqh",d:"hard",t:"mcq",q:"Ghusl wajib hone ke haalaat kaunse hain?",o:["Shahwat ke sath mani kharij hone par, ihtilaam par (tar-tari dekhne par), jima par, haidh ka khoon band hone par, nifas ka khoon band hone par, aur insan ke marne par (meyyat ko ghusl dena)","Sirf jima ke baad","Sirf haidh ke baad","Sirf ihtilaam par"],a:0,e:"Madhi ya Wadi kharij hone par sirf dhona aur wudu kaafi hai, ghusl zaroori nahi (Tirmidhi: Sahih).",r:"Aasan Fiqh \u00b7 p.38"},
{id:"fq69",s:"fiqh",d:"hard",t:"mcq",q:"Masnoon Ghusl (mustahab ghusl) kaunse mauqon par hai?",o:["Namaz-e-Jumma ke liye, Eidain ke liye, meyyat ko ghusl dene wale ke liye, Hajj/Umrah ka ihraam baandhne wale ke liye, aur ghair-Musalman ke Islam qabool karne ke baad","Sirf Jumma ke liye","Sirf Eidain ke liye","Sirf ihraam ke liye"],a:0,e:"Daleel: Muttafaq alaih (Jumma), Muwatta Imam Malik (Eidain), Sahih Tirmidhi (meyyat), Tirmidhi Hasan (ihraam), Ahmad/Abu Dawood Sahih (Islam qabool karna).",r:"Aasan Fiqh \u00b7 p.38"},
{id:"fq70",s:"fiqh",d:"hard",t:"mcq",q:"Tayammum kin do haalaton mein jaiz hai?",o:["Jab paani na mile, aur jab paani ke istemal mein koi majboori ho","Sirf jab paani na mile","Sirf safar mein","Jab waqt kam ho"],a:0,e:"Daleel: <span class='ar'>فَلَمْ تَجِدُوا مَاءً فَتَيَمَّمُوا صَعِيداً طَيِّباً</span> (Al-Ma'idah: 6), aur majboori ke liye Sahih Abu Dawood/Sahih Ibn Majah.",r:"Aasan Fiqh \u00b7 p.41"},
{id:"fq71",s:"fiqh",d:"hard",t:"mcq",q:"Tayammum kin cheezon se jaiz hai aur kin se nahi?",o:["Jaiz: mitti, patthar, eent, cement, ret, ghubaar (zameen ki qism se) \u00b7 Najaiz: raakh, lakdi, loha (jo zameen ki qism se nahi)","Sirf mitti se jaiz","Har cheez se jaiz","Sirf ret se jaiz"],a:0,e:"Aur agar mitti waghera bhi maiyassar na ho to tayammum ke baghair hi us waqt namaz padh lein (Bukhari).",r:"Aasan Fiqh \u00b7 p.41"},
{id:"fq72",s:"fiqh",d:"hard",t:"mcq",q:"Nawaqid-e-Tayammum (tayammum todne wali cheezein) kya hain?",o:["Paani mil jana, aur wo tamam cheezein jin se wudu toot'ta hai","Sirf paani mil jana","Sirf neend","Sirf waqt guzar jana"],a:0,e:"Tayammum wudu aur ghusl dono ka badal ban sakta hai \u2014 paani na milne par wudu ke badle bhi aur ghusl ke badle bhi.",r:"Aasan Fiqh \u00b7 p.41\u201342"},
{id:"fq73",s:"fiqh",d:"hard",t:"mcq",q:"Haidh ki ibtida aur inteha ki kam se kam aur aam tor par umar kya batayi gayi hai?",o:["Ibtida kam az kam 9 saal, aur inteha amooman 50 saal","Ibtida 7 saal, inteha 40 saal","Ibtida 12 saal, inteha 60 saal","Koi hadd muqarrar nahi"],a:0,e:"Haidh ke dinon ki tadaad mutayyin nahi hai; aurton ki umar, tabiyat aur aab-o-hawa ke lihaz se mukhtalif ho sakti hai.",r:"Aasan Fiqh \u00b7 p.44"},
{id:"fq74",s:"fiqh",d:"hard",t:"mcq",q:"<span class='ar'>القَصَّةُ البَيْضَاءُ</span> kya hai?",o:["Haidh ke aakhri dinon mein khoon ki jagah saaf safed paani ka aana \u2014 jo haidh khatam hone ki alamat hai","Nifas ka khoon","Istihaza ka khoon","Haidh ki ibtida ki alamat"],a:0,e:"Kitab: \u201cSaaf safedi\u201d \u2014 aurat jab apne aakhri dinon mein khoon ki bajaye saaf safed paani ka qatra dekhe to ayyam-e-haidh khatam (Bukhari).",r:"Aasan Fiqh \u00b7 p.44"},
{id:"fq75",s:"fiqh",d:"hard",t:"mcq",q:"Nifas kya hai aur uski muddat kitni hai?",o:["Wiladat ke sabab rehm se nikalne wala khoon \u00b7 muddat 40 din, ya us se kam bhi ho sakti hai","Mahwari khoon \u00b7 muddat 10 din","Bimari ka khoon \u00b7 muddat 7 din","Wiladat se pehle ka khoon \u00b7 muddat 40 din"],a:0,e:"Masla: agar wiladat se 1 ya 2 din pehle dard ke sath khoon aaye to wo Nifas shumar hoga; aur agar dard ke baghair ho to wo Istihaza ke hukm mein hoga.",r:"Aasan Fiqh \u00b7 p.44"},
{id:"fq76",s:"fiqh",d:"hard",t:"mcq",q:"Haidh aur Nifas ki haalat mein kaunse kaam mamnoo hain?",o:["Namaz, roza, masjid mein qiyam, Baitullah ka tawaf, Mus'haf ko chhoona, jima, aur talaq dena","Sirf namaz aur roza","Sirf jima","Sirf tawaf"],a:0,e:"Namaz ki qaza zaroori nahi (Nasa'i: Sahih) magar roze ki qaza zaroori hai (Bukhari). Zaroorat ke waqt masjid se guzar sakti hai aur parde se Mus'haf pakad sakti hai.",r:"Aasan Fiqh \u00b7 p.44"},
{id:"fq77",s:"fiqh",d:"hard",t:"mcq",q:"Haidh aur Nifas ki haalat mein kaunse umoor JAIZ hain?",o:["Aurat ke sath khana-peena aur uthna-baithna, Allah ka zikr aur duaein padhna (zaroorat ke mutabiq Quran padhna), aur tawaf ke ilawa Hajj ke baqi manasik ada karna","Kuch bhi jaiz nahi","Sirf khana-peena","Sirf zikr"],a:0,e:"Daleel: Muslim (khana-peena/uthna-baithna), Bukhari (Hajj ke manasik).",r:"Aasan Fiqh \u00b7 p.45"},
{id:"fq78",s:"fiqh",d:"hard",t:"mcq",q:"Istihaza kya hai aur uski kitni suratein hain?",o:["Wo khoon jo aadat (ayyam-e-haidh) ke ilawa aaye \u00b7 3 suratein","Wiladat ka khoon \u00b7 2 suratein","Mahwari khoon \u00b7 4 suratein","Sirf bimari ka khoon \u00b7 1 surat"],a:0,e:"1) Ayyam mutayyin hon to wahi shumar karegi. 2) Ayyam mutayyin na hon to rang se farq karegi (kaala = haidh, doosra rang = istihaza). 3) Na ayyam mutayyin ho na rang se farq \u2014 to purani aadat ya jaisi aurton ki aadat ke mutabiq.",r:"Aasan Fiqh \u00b7 p.45"},
{id:"fq79",s:"fiqh",d:"hard",t:"mcq",q:"Istihaza ke ahkam kya hain?",o:["Is haalat mein mamool ke mutabiq tamam ibadaat anjaam degi; har namaz ke liye naya wudu karna zaroori hai","Namaz aur roza dono mana hain","Ghusl har namaz ke liye wajib hai","Kuch bhi ada nahi karegi"],a:0,e:"Daleel: Bukhari (ibadaat), Abu Dawood/Nasa'i Hasan (har namaz ka wudu). Har namaz ke liye ghusl karna sirf mustahab hai.",r:"Aasan Fiqh \u00b7 p.45"},
{id:"fq80",s:"fiqh",d:"hard",t:"mcq",q:"Masjid jaane ke adab mein sabse pehla adab kya hai?",o:["Ba-wudu ho kar jana","Buland aawaz se zikr karna","Jaldi chalna","Naye kapde pehnna"],a:0,e:"Ghar se nikalte waqt dua: <span class='ar'>بِسْمِ اللهِ تَوَكَّلْتُ عَلَى اللهِ وَلا حَوْلَ وَلا قُوَّةَ إِلَّا بِاللهِ</span> (Abu Dawood, Tirmidhi: Sahih). Aur sanjeedagi-o-waqar ke sath chalna.",r:"Aasan Fiqh \u00b7 p.47"},
{id:"fq81",s:"fiqh",d:"hard",t:"mcq",q:"Masjid mein dakhil hote aur nikalte waqt ki duaein aur paair ki tarteeb kya hai?",o:["Dakhil hote waqt daaya paair pehle aur <span class='ar'>اَللّٰهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ</span>; nikalte waqt baaya paair pehle aur <span class='ar'>اَللّٰهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ</span>","Dakhil hote waqt baaya paair, nikalte waqt daaya","Dono waqt daaya paair","Koi tarteeb nahi"],a:0,e:"Daleel: Muslim. Dhyaan: bait-ul-khala ke bar-aks masjid mein daaya paair pehle hai.",r:"Aasan Fiqh \u00b7 p.47"},
{id:"fq82",s:"fiqh",d:"hard",t:"mcq",q:"Masjid ke adab mein \u201cTashbeek\u201d kya hai aur uska hukm?",o:["Ek haath ki ungliyan doosre haath ki ungliyon mein daalna \u2014 (masjid mein namaz ke intezar mein) mana hai","Ungliyan chatkhana \u2014 jaiz hai","Haath baandhna \u2014 sunnat hai","Ungliyon se ishara karna \u2014 wajib hai"],a:0,e:"Ungliyon ko chatkhana bhi mana hai (Sahih Sunan Nasa'i). Aur masjid jaane se pehle kachha lehsan-pyaz khana mana hai kyunki uski badbu namaziyon aur farishton ko takleef deti hai.",r:"Aasan Fiqh \u00b7 p.47"},
{id:"fq83",s:"fiqh",d:"hard",t:"mcq",q:"Fajr ki azaan mein <span class='ar'>حَيَّ عَلَى الفَلاحِ</span> ke baad kya izafa kiya jata hai?",o:["<span class='ar'>اَلصَّلاةُ خَيْرٌ مِنَ النَّوْمِ</span> \u2014 do martaba","<span class='ar'>قَدْ قَامَتِ الصَّلاةُ</span> \u2014 do martaba","<span class='ar'>اَللهُ أَكْبَرُ</span> \u2014 chaar martaba","Koi izafa nahi"],a:0,e:"Ye izafa sirf Fajr ki azaan mein hai, aur <span class='ar'>حَيَّ عَلَى الفَلاحِ</span> ke BAAD kehna chahiye.",r:"Aasan Fiqh \u00b7 p.49"},
{id:"fq84",s:"fiqh",d:"hard",t:"mcq",q:"Azaan sunne wala jawab kaise de?",o:["Waisa hi kahe jaisa muazzin kehta hai, albatta <span class='ar'>حَيَّ عَلَى الصَّلاةِ</span> aur <span class='ar'>حَيَّ عَلَى الفَلاحِ</span> ke jawab mein <span class='ar'>لا حَوْلَ وَلا قُوَّةَ إِلَّا بِاللهِ</span> kahe","Bilkul khamosh rahe","Sirf aakhir mein Ameen kahe","Sirf takbeer ka jawab de"],a:0,e:"Daleel: Bukhari, Muslim. Aur Nabi <span class='ar'>\uFDFA</span> ne farmaya: jo dil se azaan ka jawab de wo Jannat mein dakhil hoga (Muslim).",r:"Aasan Fiqh \u00b7 p.49"},
{id:"fq85",s:"fiqh",d:"hard",t:"mcq",q:"Azaan ki sunnatein mein \u201cHayya ala as-Salah\u201d aur \u201cHayya ala al-Falah\u201d par kya kiya jata hai?",o:["\u201cHayya ala as-Salah\u201d par daayein jaanib aur \u201cHayya ala al-Falah\u201d par baayein jaanib mudna \u2014 taake dono taraf aawaz pohanche","Dono par daayein mudna","Dono par baayein mudna","Qibla rukh hi rehna"],a:0,e:"Daleel: Abu Dawood (Sahih). Magar jab mic se ye maqsad poora ho jata hai to iski zaroorat nahi rehti.",r:"Aasan Fiqh \u00b7 p.51"},
{id:"fq86",s:"fiqh",d:"hard",t:"mcq",q:"Azaan ke baad ki masnoon dua kaunsi hai?",o:["<span class='ar'>اَللّٰهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ وَالصَّلاةِ القَائِمَةِ آتِ مُحَمَّداً الوَسِيلَةَ وَالفَضِيلَةَ وَابْعَثْهُ مَقَاماً مَحْمُوداً الَّذِي وَعَدْتَهُ</span>","<span class='ar'>اَللّٰهُمَّ بَاعِدْ بَيْنِي وَبَيْنَ خَطَايَايَ</span>","<span class='ar'>غُفْرَانَكَ</span>","<span class='ar'>سُبْحَانَ رَبِّيَ الأَعْلَى</span>"],a:0,e:"Pehle durood padha jata hai (Muslim), phir ye dua (Bukhari). Jo ye dua padhe uske liye Qiyamat ke din shifa'at yaqeeni hai.",r:"Aasan Fiqh \u00b7 p.51"},
{id:"fq87",s:"fiqh",d:"hard",t:"mcq",q:"Namaz kab aur kahan farz ki gayi?",o:["Me'raj ki raat, jab Allah ne Nabi <span class='ar'>\uFDFA</span> ko saaton aasmanon ke ooper apne paas bula kar paanch namazein farz farmayin","Hijrat ke baad Madinah mein","Nabuwwat ke pehle saal Makkah mein","Ghazwa-e-Badr ke baad"],a:0,e:"Daleel: Bukhari. Aur Namaz Islam ka doosra rukn hai.",r:"Aasan Fiqh \u00b7 p.53"},
{id:"fq88",s:"fiqh",d:"hard",t:"mcq",q:"Namaz Momin aur Kafir ke darmiyan farq karne wali cheez hai \u2014 iska natija kya hai?",o:["Jisne namaz chhod di usne kufr kiya","Wo gunahgaar hai magar Musalman hai","Uspar sirf qaza lazim hai","Ye masla ikhtilafi hai"],a:0,e:"Daleel: Ibn Majah, Nasa'i, Ibn Hibban (Sahih). Aur Qiyamat ke din sabse pehle Namaz ka hisaab liya jayega.",r:"Aasan Fiqh \u00b7 p.53"},
{id:"fq89",s:"fiqh",d:"hard",t:"mcq",q:"Takbeer-e-Tahreema kya hai aur Raf-ul-Yadain ka ma'na kya hai?",o:["Namaz ki sabse pehli takbeer ko Takbeer-e-Tahreema kehte hain \u00b7 Raf-ul-Yadain: namaz mein dono haathon ko kandhon tak uthana","Takbeer-e-Tahreema: rukoo ki takbeer \u00b7 Raf-ul-Yadain: haath baandhna","Takbeer-e-Tahreema: aakhri takbeer \u00b7 Raf-ul-Yadain: salam pherna","Dono ek hi cheez hain"],a:0,e:"\u201cTahreema\u201d isliye ke is takbeer se namaz ke ilawa saare kaam karna haram ho jate hain. Kaan ki loki ko chhoona durust nahi.",r:"Aasan Fiqh \u00b7 p.54 / p.56"},
{id:"fq90",s:"fiqh",d:"hard",t:"mcq",q:"Namaz mein haath baandhne ka masnoon tareeqa kya hai?",o:["Daaya haath baayein haath par rakh kar seene par haath baandhna","Naaf ke neeche haath baandhna","Haath latka kar rakhna","Sirf daaya haath seene par"],a:0,e:"Daleel: Bukhari (Ind al-Ta'ammul). Iske baad Dua-e-Istiftah padhi jati hai.",r:"Aasan Fiqh \u00b7 p.54"},
{id:"fq91",s:"fiqh",d:"hard",t:"mcq",q:"Namaz mein Surah Fatihah se pehle kya padha jata hai?",o:["Ta'awwuz (<span class='ar'>أَعُوذُ بِاللهِ مِنَ الشَّيْطَانِ الرَّجِيمِ</span>) aur Basmalah (<span class='ar'>بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ</span>)","Sirf Basmalah","Sirf Ta'awwuz","Durood"],a:0,e:"Ye Dua-e-Istiftah ke baad, aahista padhe jate hain. Dua-e-Istiftah sirf pehli rakat mein padhi jati hai.",r:"Aasan Fiqh \u00b7 p.54\u201355"},
{id:"fq92",s:"fiqh",d:"hard",t:"mcq",q:"Sajdah kitne aaza par kiya jata hai aur wo kaunse hain?",o:["7 \u2014 dono hatheliyan, dono ghutne, dono paanv ki ungliyan, aur peshani-o-naak","5 \u2014 hatheliyan, ghutne aur peshani","7 \u2014 hatheliyan, kohniyan, ghutne aur peshani","3 \u2014 peshani, naak aur hatheliyan"],a:0,e:"Sajde mein kam az kam teen martaba <span class='ar'>سُبْحَانَ رَبِّيَ الأَعْلَى</span> padha jata hai.",r:"Aasan Fiqh \u00b7 p.54 / p.56"},
{id:"fq93",s:"fiqh",d:"hard",t:"mcq",q:"Rukoo ki haalat mein kamar aur sar ka sahih andaz kya hai?",o:["Kamar bilkul seedhi rakhein aur sar kamar ke barabar rakhein","Sar kamar se ooncha rakhein","Sar kamar se neecha rakhein","Kamar jhuka kar rakhein"],a:0,e:"Rukoo mein dono haathon ki ungliyon se ghutnon ko mazbooti se pakad kar kam az kam teen martaba <span class='ar'>سُبْحَانَ رَبِّيَ العَظِيمِ</span> padhein.",r:"Aasan Fiqh \u00b7 p.54"},
{id:"fq94",s:"fiqh",d:"hard",t:"mcq",q:"Rukoo se uthne par Imam aur Muqtadi kya kehte hain?",o:["Imam ya akela namazi <span class='ar'>سَمِعَ اللهُ لِمَنْ حَمِدَهُ</span> aur <span class='ar'>رَبَّنَا لَكَ الحَمْدُ\u2026</span> dono kehta hai; Muqtadi sirf <span class='ar'>رَبَّنَا لَكَ الحَمْدُ\u2026</span> kehta hai","Dono hi dono jumle kehte hain","Muqtadi sirf <span class='ar'>سَمِعَ اللهُ لِمَنْ حَمِدَهُ</span> kehta hai","Koi kuch nahi kehta"],a:0,e:"\u201cMuqtadi\u201d ka matlab: Imam ke peeche namaz padhne wala. <span class='ar'>سَمِعَ اللهُ لِمَنْ حَمِدَهُ</span> sirf Imam ya akela namaz padhne wala kehta hai.",r:"Aasan Fiqh \u00b7 p.55\u201356"},
{id:"fq95",s:"fiqh",d:"hard",t:"mcq",q:"Sirri (aahista) aur Jehri (buland aawaz wali) namazein kaunsi hain?",o:["Sirri: Zohar aur Asr \u00b7 Jehri: Maghrib, Isha aur Fajr","Sirri: Fajr aur Asr \u00b7 Jehri: Zohar, Maghrib aur Isha","Sirri: Maghrib aur Isha \u00b7 Jehri: Zohar, Asr aur Fajr","Sab namazein jehri hain"],a:0,e:"Jehri namazon mein bhi sirf pehli DO rakaton mein aawaz se padha jata hai; baqi mein aahista.",r:"Aasan Fiqh \u00b7 p.55"},
{id:"fq96",s:"fiqh",d:"hard",t:"mcq",q:"Teesri aur chauthi rakat mein kya padha jata hai?",o:["Sirf Surah Fatihah","Surah Fatihah aur koi doosri Surah","Sirf Tasbeeh","Durood"],a:0,e:"Aur teen ya chaar rakat wali namaz mein doosri rakat ke baad Tashahhud (Tahiyyat) ke baad \u201cAllahu Akbar\u201d keh kar Raf-ul-Yadain karte hue khade hote hain.",r:"Aasan Fiqh \u00b7 p.55"},
{id:"fq97",s:"fiqh",d:"hard",t:"mcq",q:"Dua-e-Istiftah kaunsi hai?",o:["<span class='ar'>اَللّٰهُمَّ بَاعِدْ بَيْنِي وَبَيْنَ خَطَايَايَ كَمَا بَاعَدْتَ بَيْنَ المَشْرِقِ وَالمَغْرِبِ\u2026</span>","<span class='ar'>سُبْحَانَ رَبِّيَ العَظِيمِ</span>","<span class='ar'>رَبِّ اغْفِرْ لِي</span>","<span class='ar'>اَلتَّحِيَّاتُ لِلهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ</span>"],a:0,e:"Tarjuma: \u201cAe Allah! meri aur mere gunahon ke darmiyan dooriyan paida farma, jaise tune mashriq aur maghrib ke darmiyan doori rakhi hai\u2026\u201d (Bukhari, Muslim).",r:"Aasan Fiqh \u00b7 p.58"},
{id:"fq98",s:"fiqh",d:"hard",t:"mcq",q:"Dono sajdon ke darmiyan ki dua kya hai?",o:["<span class='ar'>رَبِّ اغْفِرْ لِي، رَبِّ اغْفِرْ لِي</span>","<span class='ar'>سُبْحَانَ رَبِّيَ الأَعْلَى</span>","<span class='ar'>سَمِعَ اللهُ لِمَنْ حَمِدَهُ</span>","<span class='ar'>رَبَّنَا لَكَ الحَمْدُ</span>"],a:0,e:"Ya ye dua: <span class='ar'>اَللّٰهُمَّ اغْفِرْ لِي وَارْحَمْنِي وَاهْدِنِي وَاجْبُرْنِي وَعَافِنِي وَارْزُقْنِي وَارْفَعْنِي</span> (Tirmidhi, Abu Dawood: Sahih).",r:"Aasan Fiqh \u00b7 p.58"},
{id:"fq99",s:"fiqh",d:"hard",t:"mcq",q:"Tashahhud (Tahiyyat) ke baad kaunsa Durood padha jata hai?",o:["Durood-e-Ibrahimi \u2014 <span class='ar'>اَللّٰهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ\u2026</span>","<span class='ar'>سُبْحَانَ رَبِّيَ الأَعْلَى</span>","Dua-e-Istiftah","<span class='ar'>رَبِّ اغْفِرْ لِي</span>"],a:0,e:"Daleel: Bukhari. Iske baad ma'thoor duaein padhi jati hain \u2014 jaise azaab-e-qabr, Dajjal ke fitne, zindagi-o-maut ke fitne se panah ki dua.",r:"Aasan Fiqh \u00b7 p.59"},
{id:"fq100",s:"fiqh",d:"hard",t:"mcq",q:"Durood ke baad ki ma'thoor duaon mein kin cheezon se panah maangi jati hai?",o:["Azaab-e-Qabr, Masih Dajjal ke fitne, aur zindagi-o-maut ke fitne se","Sirf azaab-e-qabr se","Sirf Dajjal se","Sirf gareebi se"],a:0,e:"<span class='ar'>اَللّٰهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ القَبْرِ، وَأَعُوذُ بِكَ مِنْ فِتْنَةِ المَسِيحِ الدَّجَّالِ، وَأَعُوذُ بِكَ مِنْ فِتْنَةِ المَحْيَا وَالمَمَاتِ</span> (Bukhari, Muslim).",r:"Aasan Fiqh \u00b7 p.59"},
{id:"fq101",s:"fiqh",d:"hard",t:"mcq",q:"Namaz kaise khatam ki jati hai?",o:["Daayein taraf munh pher kar <span class='ar'>السَّلامُ عَلَيْكُمْ وَرَحْمَةُ اللهِ</span>, phir baayein taraf bhi wahi","Sirf ek taraf salam","Sirf dua par khatam","Takbeer keh kar"],a:0,e:"Aakhri rakat se farigh hone ke baad doosre Tashahhud ke liye baithte hain, phir Durood aur ma'thoor duaein, phir salam.",r:"Aasan Fiqh \u00b7 p.55"},
{id:"fq102",s:"fiqh",d:"hard",t:"mcq",q:"Tashahhud (Tahiyyat) ke alfaz kya hain?",o:["<span class='ar'>اَلتَّحِيَّاتُ لِلهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ، السَّلامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ\u2026</span>","<span class='ar'>اَللّٰهُمَّ بَاعِدْ بَيْنِي وَبَيْنَ خَطَايَايَ</span>","<span class='ar'>سُبْحَانَ رَبِّيَ العَظِيمِ</span>","<span class='ar'>رَبَّنَا لَكَ الحَمْدُ</span>"],a:0,e:"Doosri rakat ke baad baayan qadam bicha kar us par baithte hain, daaya qadam khada rakhte hain, ungliyan Qibla rukh rakh kar shahadat ki ungli se ishara karte hain (Bukhari, Muslim).",r:"Aasan Fiqh \u00b7 p.55 / p.58"}
);

/* ---- Hadith 9 ---- */
{id:"hz9a",s:"umdat",d:"easy",t:"mcq",q:"Hifz ki hadees #9 \u2014 <span class='ar'>كَانَ رَسُولُ اللهِ ﷺ يُعْجِبُهُ التَّيَمُّنُ…</span> \u2014 iske rawi kaun hain?",o:["Sayyidah Aisha (RA)","Sayyidah Umm Salamah (RA)","Hazrat Anas bin Malik (RA)","Hazrat Abu Hurairah (RA)"],a:0,e:"Nabi \u0635 ki zaati aur gharelu zindagi ki riwayat aksar Sayyidah Aisha (RA) se milti hai.",r:"Hifz \u00b7 Hadees 9"},
{id:"hz9b",s:"umdat",d:"easy",t:"trans",q:"Hadees #9 mein <span class='ar'>التَّيَمُّن</span> ka ma'na kya hai?",o:["Daayein taraf se shuru karna","Yemen ki taraf rukh karna","Mubarak hona","Tayammum karna"],a:0,e:"At-Tayammun = daayein taraf se aaghaz karna. Iska tayammum (mitti se taharat) se koi talluq nahi.",r:"Hifz \u00b7 Hadees 9 \u00b7 Alfaz"},
{id:"hz9c",s:"umdat",d:"medium",t:"trans",q:"Hadees #9 mein <span class='ar'>تَنَعُّلِهِ وَتَرَجُّلِهِ وَطُهُورِهِ</span> ka tarteeb-waar tarjuma?",o:["Joota pehenna, baal banana, taharat (wudu) karna","Baal banana, joota pehenna, khana khana","Wudu karna, namaz padhna, joota pehenna","Khana khana, paani peena, baal banana"],a:0,e:"Tana'ul = joota pehenna; Tarajjul = kanghi/baal banana; Tuhoor = taharat ya'ni wudu.",r:"Hifz \u00b7 Hadees 9 \u00b7 Alfaz"},
{id:"hz9d",s:"umdat",d:"medium",t:"mcq",q:"Hadees #9 se kaunsa fa'idah mustanbat hota hai?",o:["Pakeeza umoor daayein haath se aur safai wale kaam baayein haath se karna mustahab hai","Har kaam daayein haath se karna farz hai","Baayein haath ka istemal bilkul mana hai","Sirf wudu mein daayein se shuru karna wajib hai"],a:0,e:"Daayan haath = khana, peena, musafaha; Baayan haath = istinja waghera. Wudu mein daayein aaza pehle dhona afzal aur masnoon hai.",r:"Hifz \u00b7 Hadees 9 \u00b7 Fawaid"},

/* ---- Hadith 11 ---- */
{id:"hz11a",s:"umdat",d:"easy",t:"mcq",q:"Hadees #11 \u2014 bait-ul-khala mein dakhil hone ki dua \u2014 ke rawi kaun hain?",o:["Hazrat Anas bin Malik (RA)","Hazrat Abu Qatadah (RA)","Hazrat Jabir bin Abdullah (RA)","Hazrat Hudhaifah (RA)"],a:0,e:"Anas bin Malik (RA) Khadim-e-Rasool the aur 10 saal Aap \u0635 ki khidmat ki, is liye rozmarra ke aamal unse kasrat se marwi hain.",r:"Hifz \u00b7 Hadees 11 \u00b7 Rawi"},
{id:"hz11b",s:"umdat",d:"easy",t:"mcq",q:"Bait-ul-khala mein dakhil hote waqt kaunsi dua padhi jati hai?",o:["<span class='ar'>اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ</span>","<span class='ar'>غُفْرَانَكَ</span>","<span class='ar'>بِسْمِ اللهِ تَوَكَّلْتُ عَلَى اللهِ</span>","<span class='ar'>اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ</span>"],a:0,e:"Nikalte waqt <span class='ar'>غُفْرَانَكَ</span> padhi jati hai. Dakhil hote waqt baayan paanv pehle, nikalte waqt daayan.",r:"Hifz \u00b7 Hadees 11"},
{id:"hz11c",s:"umdat",d:"medium",t:"trans",q:"<span class='ar'>الْخُبُث</span> aur <span class='ar'>الْخَبَائِث</span> ka ma'na kya hai?",o:["Nar (male) shayateen aur maada (female) shayateen","Gandagi aur napaki","Bure aamal aur bure alfaz","Jinn aur insan"],a:0,e:"Khubuth = male devils, Khaba'ith = female devils \u2014 dono se panah maangi ja rahi hai.",r:"Hifz \u00b7 Hadees 11 \u00b7 Alfaz"},
{id:"hz11d",s:"umdat",d:"hard",t:"mcq",q:"Hadees #11 ke fawaid mein peshab ke chheenton ke bare mein kya kaha gaya?",o:["Jo peshab ke chheenton se bachaav ki tadbeer nahi karta wo qabr ke azaab mein mubtala hoga","Chheenton se bachna sirf mustahab hai","Iska namaz se koi talluq nahi","Chheentein paak hain"],a:0,e:"Najasat se apne aap ko paak rakhna har Musalman par WAJIB hai; agar najasat baqi rahi to wudu nahi hoga aur wudu na hua to namaz na hogi.",r:"Hifz \u00b7 Hadees 11 \u00b7 Fawaid"},

/* ---- Hadith 15 ---- */
{id:"hz15a",s:"umdat",d:"medium",t:"mcq",q:"Hadees #15 \u2014 <span class='ar'>لَا يُمْسِكَنَّ أَحَدُكُمْ ذَكَرَهُ بِيَمِينِهِ…</span> \u2014 ke rawi kaun hain?",o:["Hazrat Abu Qatadah al-Harith bin Rib'i al-Ansari (RA)","Hazrat Abu Hurairah (RA)","Hazrat Anas bin Malik (RA)","Hazrat Mughirah bin Shu'bah (RA)"],a:0,e:"Abu Qatadah (RA) mash'hoor Ansari Sahabi aur \u201cFaris-u-Rasoolillah\u201d (Nabi \u0635 ke shahsawar) kehlate the.",r:"Hifz \u00b7 Hadees 15 \u00b7 Rawi"},
{id:"hz15b",s:"umdat",d:"medium",t:"mcq",q:"Hadees #15 mein kitni cheezon se mana kiya gaya?",o:["3 \u2014 daayein haath se sharamgah pakadna, daayein haath se istinja, aur bartan mein saans lena","2","4","5"],a:0,e:"Teeno mamnuaat ek hi hadees mein jama hain \u2014 do taharat se mutalliq aur ek khane-peene ke adab se.",r:"Hifz \u00b7 Hadees 15"},
{id:"hz15c",s:"umdat",d:"medium",t:"trans",q:"<span class='ar'>وَلَا يَتَنَفَّسْ فِي الْإِنَاءِ</span> ka tarjuma?",o:["Aur wo (peene ke) bartan mein saans na le","Aur wo bartan ko na chhoo'e","Aur wo bartan na tode","Aur wo bartan se na piye"],a:0,e:"Yatanaffas = saans lena; Al-Inaa = bartan. Ye khane-peene ki nazafat ka adab hai.",r:"Hifz \u00b7 Hadees 15 \u00b7 Alfaz"},
{id:"hz15d",s:"umdat",d:"hard",t:"mcq",q:"Hadees #15 se kaunsa usooli fa'idah nikalta hai?",o:["Daayein haath ki baayein haath par fazilat \u2014 pakeeza kaam daayein se, gandagi ke kaam baayein se","Dono haath barabar hain","Baayein haath ka istemal haram hai","Ye sirf safar ke liye khaas hai"],a:0,e:"Iztiraari surat mein gandagi ka izala baayein haath se kiya jaye; aur khane-peene mein najasat ki aamezish se sehat ka nuqsan hota hai.",r:"Hifz \u00b7 Hadees 15 \u00b7 Fawaid"},

/* ---- Hadith 17 ---- */
{id:"hz17a",s:"umdat",d:"easy",t:"mcq",q:"Hadees #17 (miswaak ki fazilat) ke rawi kaun hain aur unki kitni marwiyaat hain?",o:["Hazrat Abu Hurairah (RA) \u00b7 5374","Hazrat Anas bin Malik (RA) \u00b7 2286","Hazrat Aisha (RA) \u00b7 2210","Hazrat Ibn Umar (RA) \u00b7 1630"],a:0,e:"Abu Hurairah (RA) sabse zyada ahadees ke rawi hain. 7 Hijri mein Khaibar ke mauqe par Islam laaye, wafat 59 Hijri.",r:"Hifz \u00b7 Hadees 17 \u00b7 Rawi"},
{id:"hz17b",s:"umdat",d:"easy",t:"trans",q:"<span class='ar'>لَوْلَا أَنْ أَشُقَّ عَلَى أُمَّتِي</span> ka tarjuma?",o:["Agar mujhe apni ummat par mashaqqat ka andesha na hota","Agar meri ummat mujhe mana na karti","Agar main apni ummat se door na hota","Agar meri ummat mein ikhtilaf na hota"],a:0,e:"Ashuqqa = main mashaqqat mein daaloon. Isi wajah se miswaak ko farz nahi kiya gaya.",r:"Hifz \u00b7 Hadees 17 \u00b7 Alfaz"},
{id:"hz17c",s:"umdat",d:"medium",t:"mcq",q:"Is hadees se miswaak ka shar'i hukm kya saabit hota hai?",o:["Mustahab \u2014 farz nahi, taake ummat mashaqqat mein na pade","Farz","Wajib","Mubah"],a:0,e:"Hadees ka \u201cLawla\u201d (agar na hota) ka andaz hi bata raha hai ke hukm nahi diya gaya, ya'ni farz nahi kiya gaya.",r:"Hifz \u00b7 Hadees 17 \u00b7 Hukm"},
{id:"hz17d",s:"umdat",d:"hard",t:"mcq",q:"Hadees #17 ke fawaid mein kaunsa usool bayan hua?",o:["Mafasid ko door karna masalih hasil karne se pehle zaroori hai \u2014 pehle nuqsan roko, phir faide hasil karo","Har mustahab ko farz banaya ja sakta hai","Mashaqqat se deen mein sawab barhta hai","Miswaak sirf Jumma ke din masnoon hai"],a:0,e:"Saath hi: Islami Shariat aasaan hai mushkil nahi, aur kisi ko uski himmat se barh kar takleef nahi di jati.",r:"Hifz \u00b7 Hadees 17 \u00b7 Fawaid"},

/* ---- Hadith 21 ---- */
{id:"hz21a",s:"umdat",d:"medium",t:"mcq",q:"Hadees #21 \u2014 <span class='ar'>دَعْهُمَا فَإِنِّي أَدْخَلْتُهُمَا طَاهِرَتَيْنِ</span> \u2014 ke rawi kaun hain?",o:["Hazrat Al-Mughirah bin Shu'bah (RA)","Hazrat Hudhaifah bin al-Yaman (RA)","Hazrat Anas bin Malik (RA)","Hazrat Abu Qatadah (RA)"],a:0,e:"Mughirah bin Shu'bah (RA), kunniyat Abu Isa, Ghazwa-e-Khandaq ke saal Islam laaye; 136 ahadees ke rawi; wafat 50 Hijri.",r:"Hifz \u00b7 Hadees 21 \u00b7 Rawi"},
{id:"hz21b",s:"umdat",d:"medium",t:"trans",q:"<span class='ar'>طَاهِرَتَيْنِ</span> se kya murad hai aur ye kis masle ki bunyaad hai?",o:["Pak halat (ba-wudu) mein \u2014 yehi mozon par masah ki sab se aham shart hai","Naye mozay \u2014 mozay naye hone chahiyein","Safed mozay \u2014 rang ki shart","Chamde ke mozay \u2014 maadde ki shart"],a:0,e:"Masah ki asal shart yehi hai ke mozay wudu ki halat mein pehne gaye hon, na ke unka maadda ya rang.",r:"Hifz \u00b7 Hadees 21 \u00b7 Hukm"},
{id:"hz21c",s:"umdat",d:"medium",t:"trans",q:"<span class='ar'>فَأَهْوَيْتُ لِأَنْزِعَ خُفَّيْهِ</span> ka tarjuma?",o:["To main jhuka taake Aap ke dono mozay utaroon","To main jhuka taake Aap ke paanv dhoun","To main aage badha taake paani laaon","To main baith gaya taake intezar karoon"],a:0,e:"Ahwaytu = main jhuka; Anzi'a = main utaroon; Khuffayn = dono mozay.",r:"Hifz \u00b7 Hadees 21 \u00b7 Alfaz"},
{id:"hz21d",s:"umdat",d:"hard",t:"mcq",q:"Hadees #21 se masah ka tareeqa aur ek akhlaqi sabaq kya milta hai?",o:["Masah mozay ki baalai jaanib kiya jaye; aur ulama-o-buzurgon ki khidmat mustahab amal hai","Masah neechli jaanib kiya jaye; khidmat mana hai","Masah teen martaba kiya jaye; khidmat wajib hai","Masah dono jaanib kiya jaye; khidmat makrooh hai"],a:0,e:"Mughirah (RA) ka Nabi \u0635 ke mozay utarne ke liye jhukna khidmat-e-buzurgan ki daleel hai.",r:"Hifz \u00b7 Hadees 21 \u00b7 Fawaid"},

/* ---- Hadith 22 ---- */
{id:"hz22a",s:"umdat",d:"medium",t:"mcq",q:"Hadees #22 ke rawi Hazrat Hudhaifah bin al-Yaman (RA) ke bare mein kya sahih hai?",o:["Sahib-e-Sirr-e-Rasool the; unke walid bhi Sahabi the jo Uhud mein ghalat-fahmi se shaheed hue; wafat 36 Hijri","Wo Khaibar ke saal Islam laaye; 5374 ahadees ke rawi","Wo Ansari the aur Yaum-ul-Harrah mein shaheed hue","Wo Nabi \u0635 ke shahsawar the"],a:0,e:"Kunniyat Abu Abdullah. Sahihayn mein 37 ahadees, kul taqreeban 220.",r:"Hifz \u00b7 Hadees 22 \u00b7 Rawi"},
{id:"hz22b",s:"umdat",d:"medium",t:"mcq",q:"Hadees #22 mein Nabi \u0635 ne safar mein kaunse teen kaam kiye?",o:["Peshab kiya, wudu kiya, aur mozon par masah kiya","Wudu kiya, namaz padhi, aur so gaye","Ghusl kiya, wudu kiya, aur mozay utare","Tayammum kiya, namaz padhi, aur safar jari rakha"],a:0,e:"Hadees mukhtasar (<span class='ar'>مُخْتَصَرًا</span>) bayan ki gayi hai \u2014 teen aamal tarteeb ke sath.",r:"Hifz \u00b7 Hadees 22"},
{id:"hz22c",s:"umdat",d:"medium",t:"trans",q:"<span class='ar'>مُخْتَصَرًا</span> ka is hadees mein kya matlab hai?",o:["Ye hadees ikhtisaar (mukhtasar andaz) ke sath bayan ki gayi hai","Nabi \u0635 ne mukhtasar wudu kiya","Safar mukhtasar tha","Masah mukhtasar kiya gaya"],a:0,e:"Ye rawi ki taraf se ishara hai ke riwayat ka matn mukhtasar naql kiya gaya hai.",r:"Hifz \u00b7 Hadees 22 \u00b7 Alfaz"},
{id:"hz22d",s:"umdat",d:"hard",t:"mcq",q:"Hadees #22 se masah ki muddat ka kya hukm mustanbat hota hai?",o:["Musafir 3 din 3 raat, muqeem 1 din 1 raat \u2014 ba-shart ye ke is dauran ghusl wajib na hua ho","Dono ke liye 1 din 1 raat","Dono ke liye 3 din 3 raat","Koi muddat muqarrar nahi"],a:0,e:"Aur har hadath-e-asghar (peshab waghera) se mozon par masah karna jaiz hai \u2014 masah baatil nahi hota.",r:"Hifz \u00b7 Hadees 22 \u00b7 Fawaid"},

/* ---- Hadith 24 ---- */
{id:"hz24a",s:"umdat",d:"hard",t:"mcq",q:"Hadees #24 \u2014 <span class='ar'>لَا يَنْصَرِفْ حَتَّى يَسْمَعَ صَوْتًا أَوْ يَجِدَ رِيحًا</span> \u2014 ke rawi kaun hain?",o:["Hazrat Abdullah bin Zaid bin Aasim al-Mazini (RA), unse Abbad bin Tameem","Hazrat Abu Hurairah (RA), unse Hammam","Hazrat Anas (RA), unse Qatadah","Hazrat Aisha (RA), unse Urwah"],a:0,e:"Abdullah bin Zaid (RA) Ansari Sahabi hain; unhi se Nabi \u0635 ke wudu ka mukammal tareeqa bhi marwi hai.",r:"Hifz \u00b7 Hadees 24 \u00b7 Rawi"},
{id:"hz24b",s:"umdat",d:"medium",t:"trans",q:"<span class='ar'>يُخَيَّلُ إِلَيْهِ</span> ka tarjuma?",o:["Use khayal aata hai / gumaan hota hai","Use yaqeen ho jata hai","Use hukm diya jata hai","Use maloom ho jata hai"],a:0,e:"Yehi lafz masle ki jaan hai: mahaz gumaan aur khayal \u2014 yaqeen nahi.",r:"Hifz \u00b7 Hadees 24 \u00b7 Alfaz"},
{id:"hz24c",s:"umdat",d:"hard",t:"mcq",q:"Is hadees se kaunsa fiqhi qaida saabit hota hai?",o:["Yaqeen shakk se zail nahi hota \u2014 shakk par wudu nahi tootega aur namaz baatil nahi hogi","Shakk ho to namaz dohrani chahiye","Shakk ho to wudu dohrana wajib hai","Shakk ki halat mein namaz makrooh hai"],a:0,e:"Awaz ya boo hawa kharij hone ki alamatein hain \u2014 in ke baghair mahaz waswasa mu'tabar nahi. Bila sabab namaz todna bhi mamnoo hai.",r:"Hifz \u00b7 Hadees 24 \u00b7 Hukm"},
{id:"hz24d",s:"umdat",d:"hard",t:"mcq",q:"Agar kisi ko namaz mein hawa kharij hone ka yaqeen ho jaye to?",o:["Namaz tod kar wudu karna hoga \u2014 kyunki ab shakk nahi yaqeen hai","Phir bhi namaz jari rakhe","Sirf salam pher de","Namaz baad mein dohra le magar ab jari rakhe"],a:0,e:"Hadees ka hukm sirf shakk ki halat ke liye hai. Hawa kharij hone se wudu toot jata hai, chahe awaz se ho ya baghair awaz ke.",r:"Hifz \u00b7 Hadees 24 \u00b7 Fawaid"},

/* ---- Hadith 28 ---- */
{id:"hz28a",s:"umdat",d:"easy",t:"mcq",q:"Hadees #28 ke mutabiq Fitrah ki paanch cheezein kaunsi hain?",o:["Khitaan, Istihdaad, Qass ash-Shaarib, Taqleem al-Azfaar, Natf al-Ibit","Miswaak, wudu, ghusl, istinja, khitaan","Nakhun katna, baal katna, ghusl, miswaak, khitaan","Khitaan, miswaak, naak mein paani, nakhun katna, daadhi badhana"],a:0,e:"Ya'ni khatna, zer-e-naaf baal saaf karna, moonchein katna, nakhun katna, aur baghal ke baal ukhadna.",r:"Hifz \u00b7 Hadees 28"},
{id:"hz28b",s:"umdat",d:"medium",t:"trans",q:"<span class='ar'>الْاسْتِحْدَاد</span> aur <span class='ar'>نَتْفُ الْإِبِط</span> ka ma'na?",o:["Zer-e-naaf baal saaf karna \u00b7 Baghal ke baal ukhadna","Nakhun katna \u00b7 Moonchein katna","Khatna karna \u00b7 Daadhi badhana","Miswaak karna \u00b7 Naak saaf karna"],a:0,e:"Istihdaad lafz \u201cHadeed\u201d (loha/ustra) se hai. Natf ka ma'na ukhadna hai \u2014 isi liye moondne ke bajaye ukhadne ki koshish behtar hai.",r:"Hifz \u00b7 Hadees 28 \u00b7 Alfaz"},
{id:"hz28c",s:"umdat",d:"hard",t:"mcq",q:"Hadees #28 ke fawaid mein baghal ke baalon ke bare mein kya kaha gaya?",o:["Kisi sahih hadees mein moondne ka zikr nahi; koshish ye ho ke ukhade jaayein, agarche aaj aksar log moondte hain","Sirf moondna masnoon hai","Unhein chhod dena behtar hai","Ye masla hadees mein nahi hai"],a:0,e:"Matn ka lafz <span class='ar'>نَتْف</span> (ukhadna) hai, <span class='ar'>حَلْق</span> (moondna) nahi.",r:"Hifz \u00b7 Hadees 28 \u00b7 Fawaid"},
{id:"hz28d",s:"umdat",d:"hard",t:"mcq",q:"Hadees #28 mein badi moonchein rakhne ke bare mein kaunsa fa'idah bayan hua?",o:["Ye ghair-fitri amal hai \u2014 aatish-parast iske aadi the, is liye Musalmanon ko mana kiya gaya","Ye mustahab hai","Ye mubah hai","Iska koi hukm nahi"],a:0,e:"Deen-e-Islam nazafat aur taharat ikhtiyar karne ki talqeen karta hai; nakhun badhana bhi fitrat ke munaafi hai.",r:"Hifz \u00b7 Hadees 28 \u00b7 Fawaid"},

/* ---- Hadith 33 ---- */
{id:"hz33a",s:"umdat",d:"medium",t:"mcq",q:"Hadees #33 (aurat ko ihtilaam) ki rawi kaun hain aur sawal kisne kiya tha?",o:["Rawi: Umm Salamah (RA) \u00b7 Sawal: Umm Sulaim (RA), Abu Talhah (RA) ki biwi","Rawi: Aisha (RA) \u00b7 Sawal: Umm Habibah (RA)","Rawi: Umm Sulaim (RA) \u00b7 Sawal: Umm Salamah (RA)","Rawi: Aisha (RA) \u00b7 Sawal: Fatimah bint Abi Hubaish (RA)"],a:0,e:"Umm Salamah (RA) Nabi \u0635 ki zawja mutahhara aur sab se aakhir mein wafat pane wali Ummahat-ul-Mu'mineen hain.",r:"Hifz \u00b7 Hadees 33 \u00b7 Rawi"},
{id:"hz33b",s:"umdat",d:"medium",t:"trans",q:"<span class='ar'>نَعَمْ، إِذَا رَأَتِ الْمَاءَ</span> ka tarjuma aur uska hukm?",o:["\u201cHaan, jab wo paani (mani) dekhe\u201d \u2014 ya'ni mani dekhne par ghusl wajib hai","\u201cHaan, jab wo paani piye\u201d \u2014 khane-peene ka mas'ala","\u201cHaan, jab paani mil jaye\u201d \u2014 tayammum ka mas'ala","\u201cHaan, jab wo paani mein utre\u201d \u2014 ghusl ka tareeqa"],a:0,e:"Ghusl ka madaar mani ke kharij hone par hai, mahaz khwab dekhne par nahi.",r:"Hifz \u00b7 Hadees 33 \u00b7 Hukm"},
{id:"hz33c",s:"umdat",d:"medium",t:"trans",q:"<span class='ar'>إِنَّ اللهَ لَا يَسْتَحْيِي مِنَ الْحَقِّ</span> ka tarjuma?",o:["Beshak Allah haq (sachai) se sharm nahi farmata","Beshak Allah haq ko pasand farmata hai","Beshak Allah sharm karne walon ko pasand karta hai","Beshak Allah haq ko zahir farmata hai"],a:0,e:"Umm Sulaim (RA) ne apne nazuk sawal ka aaghaz isi tamheed se kiya \u2014 ye adab-e-guftagu ki misal hai.",r:"Hifz \u00b7 Hadees 33 \u00b7 Alfaz"},
{id:"hz33d",s:"umdat",d:"hard",t:"mcq",q:"Hadees #33 se kaunsa tarbiyati fa'idah nikalta hai?",o:["Sharm-o-haya ilm ke husool mein rukawat nahi honi chahiye, aur guftagu ka andaz aisa ho ke sunne wale par nagawar asar na pade","Auraton ko sawal nahi karna chahiye","Aise masail par baat karna makrooh hai","Ye sawal sirf mardon ke liye tha"],a:0,e:"Saath hi ye ke haya Allah ki sifat-e-aaliya mein se ek sifat hai, jaisa Uski shaan ke laiq hai.",r:"Hifz \u00b7 Hadees 33 \u00b7 Fawaid"},

/* ---- Hadith 39 ---- */
{id:"hz39a",s:"umdat",d:"medium",t:"mcq",q:"Hadees #39 (paanch khususiyat) ke rawi kaun hain?",o:["Hazrat Jabir bin Abdullah al-Ansari (RA)","Hazrat Abu Hurairah (RA)","Hazrat Anas bin Malik (RA)","Hazrat Abdullah bin Umar (RA)"],a:0,e:"Jabir (RA) Bay'at-e-Aqabah mein apne walid ke sath shareek the; unke walid Abdullah (RA) Uhud mein shaheed hue.",r:"Hifz \u00b7 Hadees 39 \u00b7 Rawi"},
{id:"hz39b",s:"umdat",d:"hard",t:"mcq",q:"Hadees #39 mein bayan ki gayi paanch khususiyat kaunsi hain?",o:["Ru'b se madad, zameen ka masjid-o-tahoor hona, ghaneemat ka halal hona, shifa'at, aur tamam logon ki taraf bhejna","Quran, Me'raj, Shifa'at, Kausar, aur Khatam-un-Nabuwwat","Namaz, Roza, Zakat, Hajj, aur Jihad","Ilm, Hilm, Sabr, Shukr, aur Tawakkul"],a:0,e:"<span class='ar'>أُعْطِيتُ خَمْسًا لَمْ يُعْطَهُنَّ أَحَدٌ مِنَ الْأَنْبِيَاءِ قَبْلِي</span> \u2014 ye paanch Aap \u0635 ki khususiyat hain.",r:"Hifz \u00b7 Hadees 39"},
{id:"hz39c",s:"umdat",d:"hard",t:"trans",q:"<span class='ar'>وَجُعِلَتْ لِيَ الْأَرْضُ مَسْجِدًا وَطَهُورًا</span> se kaunsa fiqhi mas'ala nikalta hai?",o:["Zameen sajdah-gah bhi hai aur pak karne wali bhi \u2014 isi se tayammum ki asal saabit hoti hai","Sirf masjid mein namaz jaiz hai","Zameen par sajdah karna farz hai","Mitti khana jaiz hai"],a:0,e:"Isi liye Imam Bukhari ne ye hadees Kitab at-Tayammum mein laayi hai. Mamnoo maqamaat ke ilawa har jagah namaz ho sakti hai.",r:"Hifz \u00b7 Hadees 39 \u00b7 Hukm"},
{id:"hz39d",s:"umdat",d:"hard",t:"mcq",q:"Hadees #39 ke mutabiq Nabi \u0635 aur sabiqa Ambiya ki bi'that mein bunyadi farq kya hai?",o:["Har Nabi khaas apni qaum ki taraf bheja jata tha, magar Aap \u0635 tamam insaniyat ki taraf","Sabiqa Ambiya ko shifa'at nahi di gayi thi","Sabiqa Ambiya par ghaneemat halal thi","Sabiqa Ambiya ko kitab nahi di gayi thi"],a:0,e:"<span class='ar'>وَبُعِثْتُ إِلَى النَّاسِ عَامَّةً</span>. Isi se saabit hota hai ke Aap \u0635 tamam Ambiya mein afzal hain.",r:"Hifz \u00b7 Hadees 39 \u00b7 Fawaid"},

/* ---- Hadith 41 ---- */
{id:"hz41a",s:"umdat",d:"medium",t:"mcq",q:"Hadees #41 mein kis khatoon ko kitne arse tak Istihaza raha?",o:["Umm Habibah (RA) \u2014 saat (7) saal","Fatimah bint Abi Hubaish (RA) \u2014 teen saal","Umm Sulaim (RA) \u2014 paanch saal","Umm Salamah (RA) \u2014 saat saal"],a:0,e:"Rawi Sayyidah Aisha (RA) hain. Umm Habibah bint Jahsh (RA) Abdur Rahman bin Auf (RA) ki zawja theen.",r:"Hifz \u00b7 Hadees 41"},
{id:"hz41b",s:"umdat",d:"hard",t:"mcq",q:"Hadees #41 se Mustahaza ke ghusl ka sahih hukm kya hai?",o:["Har namaz ke liye ghusl WAJIB nahi \u2014 Umm Habibah (RA) ye apni marzi se karti theen","Har namaz ke liye ghusl wajib hai","Ghusl bilkul mana hai","Sirf Jumma ke din ghusl wajib hai"],a:0,e:"Ali, Ibn Abbas aur Aisha (RA) wujoob ke qail na the; Imam Abu Hanifah, Imam Malik aur Imam Ahmad ka bhi yehi mauqif hai. Wajib sirf haidh ke ayyam guzarne ke baad ka ghusl hai.",r:"Hifz \u00b7 Hadees 41 \u00b7 Hukm"},
{id:"hz41c",s:"umdat",d:"medium",t:"trans",q:"<span class='ar'>اسْتُحِيضَتْ</span> ka ma'na kya hai?",o:["Use istihaza ka khoon aata raha (aadat se hat kar)","Use haidh aaya","Use nifas hua","Wo bimar ho gayi"],a:0,e:"Istihaza wo khoon hai jo aadat (ayyam-e-haidh) ke ilawa aaye \u2014 ye ek rag ke phatne ki wajah se hota hai.",r:"Hifz \u00b7 Hadees 41 \u00b7 Alfaz"},
{id:"hz41d",s:"umdat",d:"hard",t:"mcq",q:"Mustahaza aurat ke liye har namaz ke waqt kya karna zaroori hai?",o:["Naya wudu karna","Naya ghusl karna","Namaz chhod dena","Sirf niyyat badalna"],a:0,e:"Ghusl mustahab hai, magar har namaz ke liye naya WUDU zaroori hai. Is halat mein wo ma'mool ke mutabiq tamam ibadaat anjaam degi.",r:"Hifz \u00b7 Hadees 41 \u00b7 Hukm"},

/* ---- Hadith 43 ---- */
{id:"hz43a",s:"umdat",d:"easy",t:"mcq",q:"Hadees #43 \u2014 <span class='ar'>كَانَ يَتَّكِئُ فِي حِجْرِي فَيَقْرَأُ الْقُرْآنَ وَأَنَا حَائِضٌ</span> \u2014 ki rawi kaun hain?",o:["Sayyidah Aisha (RA)","Sayyidah Umm Salamah (RA)","Sayyidah Hafsah (RA)","Sayyidah Maymunah (RA)"],a:0,e:"Haidh aur taharat ke abwab mein sab se zyada riwayat Sayyidah Aisha (RA) se hain.",r:"Hifz \u00b7 Hadees 43 \u00b7 Rawi"},

tw32:{q:"متن میں انواعُ العبادۃ (عبادت کی قسمیں) میں کون سی شامل ہیں؟",
o:["اسلام، ایمان، احسان؛ دعا، خوف، رجاء، توکل، رغبت، رہبت، خشوع، خشیت، انابت، استعانت، استعاذت، استغاثت، ذبح، نذر","صرف نماز، روزہ، زکات، حج","صرف دعا اور ذبح","صرف توکل اور صبر"],
e:"یہ سب اللہ کے لیے خالص ہونی چاہئیں۔ دلیل: <span class='ar'>وَأَنَّ المَسَاجِدَ لِلهِ فَلا تَدْعُوا مَعَ اللهِ أَحَداً</span>۔"},

tw33:{q:"جس نے ان عبادتوں میں سے کوئی ایک بھی غیر اللہ کے لیے پھیر دی، اس کا حکم کیا ہے؟",
o:["<span class='ar'>فَهُوَ مُشْرِكٌ كَافِرٌ</span>","وہ گناہ گار ہے مگر مسلمان ہے","اس پر صرف توبہ لازم ہے","کوئی حرج نہیں"],
e:"دلیل: <span class='ar'>وَمَنْ يَدْعُ مَعَ اللهِ إِلَهاً آخَرَ لا بُرْهَانَ لَهُ بِهِ فَإِنَّمَا حِسَابُهُ عِنْدَ رَبِّهِ إِنَّهُ لا يُفْلِحُ الكَافِرُونَ</span>۔"},

tw34:{q:"حدیث میں دعا کے بارے میں کیا آیا ہے؟",
o:["<span class='ar'>الدُّعَاءُ مُخُّ العِبَادَةِ</span> — دعا عبادت کا مغز ہے","دعا صرف مستحب ہے","دعا عبادت نہیں","دعا صرف رمضان میں قبول ہوتی ہے"],
e:"دلیل: <span class='ar'>وَقَالَ رَبُّكُمُ ادْعُونِي أَسْتَجِبْ لَكُمْ إِنَّ الَّذِينَ يَسْتَكْبِرُونَ عَنْ عِبَادَتِي سَيَدْخُلُونَ جَهَنَّمَ دَاخِرِينَ</span>۔"},

tw35:{q:"کلمہ <span class='ar'>لا إِلَهَ إِلَّا اللهُ</span> کا معنی کیا ہے؟",
o:["<span class='ar'>لا مَعْبُودَ بِحَقٍّ إِلَّا اللهُ</span> — اللہ کے سوا کوئی برحق معبود نہیں","اللہ کے سوا کوئی خالق نہیں","اللہ کے سوا کوئی رزاق نہیں","اللہ کے سوا کوئی زندہ نہیں"],
e:"<span class='ar'>لا إِلَهَ</span> نفی کرتا ہے اللہ کے سوا ہر اس چیز کی جس کی عبادت کی جاتی ہے؛ <span class='ar'>إِلَّا اللهُ</span> عبادت کو اکیلے اللہ کے لیے ثابت کرتا ہے۔"},

tw36:{q:"<span class='ar'>شَهَادَةُ أَنَّ مُحَمَّداً رَسُولُ اللهِ</span> کا معنی کیا ہے؟",
o:["جس بات کا حکم دیا اس میں اطاعت، جس کی خبر دی اس میں تصدیق، جس سے منع کیا اس سے بچنا، اور اللہ کی عبادت صرف اسی طریقے سے جو آپ نے مقرر کیا","صرف آپ کی محبت رکھنا","صرف آپ کا نام لینا","صرف آپ پر درود پڑھنا"],
e:"<span class='ar'>طَاعَتُهُ فِيمَا أَمَرَ، وَتَصْدِيقُهُ فِيمَا أَخْبَرَ، وَاجْتِنَابُ مَا عَنْهُ نَهَى وَزَجَرَ، وَأَلَّا يُعْبَدَ اللهُ إِلَّا بِمَا شَرَعَ</span>۔"},

tw37:{q:"الایمان کے کتنے شعبے ہیں اور ان کا سب سے اعلیٰ اور سب سے ادنیٰ درجہ کیا ہے؟",
o:["بضع و سبعون شعبہ · اعلیٰ: <span class='ar'>لا إِلَهَ إِلَّا اللهُ</span> · ادنیٰ: راستے سے رکاوٹ ہٹانا","۷۰ شعبے · اعلیٰ: نماز · ادنیٰ: سلام","۶۰ شعبے · اعلیٰ: روزہ · ادنیٰ: مسواک","۱۰۰ شعبے · اعلیٰ: حج · ادنیٰ: صدقہ"],
e:"اور <span class='ar'>الحَيَاءُ شُعْبَةٌ مِنَ الإِيمَانِ</span> — حیا ایمان کا ایک شعبہ ہے۔"},

tw38:{q:"ہجرت کی شرعی تعریف کیا ہے؟",
o:["<span class='ar'>الانْتِقَالُ مِنْ بَلَدِ الشِّرْكِ إِلَى بَلَدِ الإِسْلامِ</span>","مکہ سے مدینہ جانا","گاؤں سے شہر جانا","دین کے لیے سفر کرنا"],
e:"اور ہجرت اس امت پر فریضہ ہے، اور یہ قیامت تک باقی رہے گی۔"},

tw39:{q:"ہجرت کے قیامت تک باقی رہنے کی سنت سے دلیل کون سی ہے؟",
o:["<span class='ar'>لا تَنْقَطِعُ الهِجْرَةُ حَتَّى تَنْقَطِعَ التَّوْبَةُ، وَلا تَنْقَطِعُ التَّوْبَةُ حَتَّى تَطْلُعَ الشَّمْسُ مِنْ مَغْرِبِهَا</span>","<span class='ar'>إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ</span>","<span class='ar'>الدُّعَاءُ مُخُّ العِبَادَةِ</span>","<span class='ar'>بُنِيَ الإِسْلامُ عَلَى خَمْسٍ</span>"],
e:"یعنی ہجرت کا سلسلہ توبہ کے ختم ہونے تک، اور توبہ سورج کے مغرب سے طلوع ہونے تک ختم نہیں ہوگی۔"},

tw40:{q:"نواقضُ الاسلام کا دوسرا ناقض کیا ہے؟",
o:["اپنے اور اللہ کے درمیان واسطے بنانا، انہیں پکارنا، ان سے شفاعت مانگنا اور ان پر بھروسہ کرنا — <span class='ar'>كَفَرَ إِجْمَاعاً</span>","نماز چھوڑ دینا","زکات نہ دینا","شراب پینا"],
e:"متن نے اس پر اجماع کا لفظ استعمال کیا: ایسا شخص بالاجماع کافر ہے۔"},

tw41:{q:"تیسرا ناقض کیا ہے؟",
o:["جو مشرکین کی تکفیر نہ کرے، یا ان کے کفر میں شک کرے، یا ان کے مذہب کو صحیح کہے — وہ کافر ہے","جو مشرکین سے تجارت کرے","جو مشرکین کے ملک میں رہے","جو مشرکین کی زبان سیکھے"],
e:"<span class='ar'>مَنْ لَمْ يُكَفِّرِ المُشْرِكِينَ، أَوْ شَكَّ فِي كُفْرِهِمْ، أَوْ صَحَّحَ مَذْهَبَهُمْ؛ كَفَرَ</span>۔"},

tw42:{q:"چوتھا ناقض کیا ہے؟",
o:["یہ عقیدہ رکھنا کہ نبی <span class='ar'>ﷺ</span> کی ہدایت کے علاوہ کوئی ہدایت زیادہ مکمل ہے، یا آپ کے حکم سے کسی کا حکم بہتر ہے","نماز میں غفلت","قرآن نہ پڑھنا","دین میں سوال کرنا"],
e:"جیسے وہ لوگ جو طواغیت کے حکم کو آپ <span class='ar'>ﷺ</span> کے حکم پر ترجیح دیتے ہیں — <span class='ar'>فَهُوَ كَافِرٌ</span>۔"},

tw43:{q:"پانچواں ناقض کیا ہے؟",
o:["جو رسول <span class='ar'>ﷺ</span> کی لائی ہوئی کسی چیز سے بغض رکھے، اگرچہ اس پر عمل بھی کرتا ہو — کافر ہے","جو رسول <span class='ar'>ﷺ</span> کی حدیث نہ پڑھے","جو سنت چھوڑ دے","جو بدعت کرے"],
e:"<span class='ar'>مَنْ أَبْغَضَ شَيْئاً مِمَّا جَاءَ بِهِ الرَّسُولُ ﷺ وَلَوْ عَمِلَ بِهِ كَفَرَ</span> — عمل کرنے کے باوجود بغض ناقض ہے۔"},

/* ---------- HARD ---------- */
tw50:{q:"دلیلِ خوف کی آیت کون سی ہے؟",
o:["<span class='ar'>فَلا تَخَافُوهُمْ وَخَافُونِ إِنْ كُنْتُمْ مُؤْمِنِينَ</span>","<span class='ar'>وَعَلَى اللهِ فَتَوَكَّلُوا</span>","<span class='ar'>فَلا تَخْشَوْهُمْ وَاخْشَوْنِ</span>","<span class='ar'>وَأَنِيبُوا إِلَى رَبِّكُمْ</span>"],
e:"متن میں ہر عبادت کی الگ دلیل دی گئی ہے؛ خوف کی دلیل یہی آیت ہے۔"},

tw51:{q:"دلیلِ رجاء (امید) کی آیت کون سی ہے؟",
o:["<span class='ar'>فَمَنْ كَانَ يَرْجُو لِقَاءَ رَبِّهِ فَلْيَعْمَلْ عَمَلاً صَالِحاً وَلا يُشْرِكْ بِعِبَادَةِ رَبِّهِ أَحَداً</span>","<span class='ar'>فَلا تَخَافُوهُمْ وَخَافُونِ</span>","<span class='ar'>وَمَنْ يَتَوَكَّلْ عَلَى اللهِ فَهُوَ حَسْبُهُ</span>","<span class='ar'>إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ</span>"],
e:"رجاء کے ساتھ عملِ صالح اور شرک سے بچنا بھی ضروری قرار دیا گیا۔"},

tw52:{q:"دلیلِ توکل کی آیات کون سی ہیں؟",
o:["<span class='ar'>وَعَلَى اللهِ فَتَوَكَّلُوا إِنْ كُنْتُمْ مُؤْمِنِينَ</span> اور <span class='ar'>وَمَنْ يَتَوَكَّلْ عَلَى اللهِ فَهُوَ حَسْبُهُ</span>","<span class='ar'>فَلا تَخَافُوهُمْ وَخَافُونِ</span>","<span class='ar'>قُلْ أَعُوذُ بِرَبِّ الفَلَقِ</span>","<span class='ar'>وَأَنِيبُوا إِلَى رَبِّكُمْ</span>"],
e:"دونوں آیات متن میں توکل کی دلیل کے طور پر ذکر کی گئی ہیں۔"},

tw53:{q:"رغبت، رہبت اور خشوع کی دلیل کون سی آیت ہے؟",
o:["<span class='ar'>إِنَّهُمْ كَانُوا يُسَارِعُونَ فِي الخَيْرَاتِ وَيَدْعُونَنَا رَغَباً وَرَهَباً وَكَانُوا لَنَا خَاشِعِينَ</span>","<span class='ar'>فَلا تَخْشَوْهُمْ وَاخْشَوْنِ</span>","<span class='ar'>وَأَنِيبُوا إِلَى رَبِّكُمْ وَأَسْلِمُوا لَهُ</span>","<span class='ar'>إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ</span>"],
e:"ایک ہی آیت میں تینوں عبادات (رغباً، رہباً، خاشعین) کا ذکر ہے۔"},

tw54:{q:"دلیلِ خشیت کی آیت کون سی ہے؟",
o:["<span class='ar'>فَلا تَخْشَوْهُمْ وَاخْشَوْنِ</span>","<span class='ar'>فَلا تَخَافُوهُمْ وَخَافُونِ</span>","<span class='ar'>وَعَلَى اللهِ فَتَوَكَّلُوا</span>","<span class='ar'>ادْعُونِي أَسْتَجِبْ لَكُمْ</span>"],
e:"دھیان: خوف کی دلیل <span class='ar'>خَافُونِ</span> والی آیت ہے اور خشیت کی <span class='ar'>اخْشَوْنِ</span> والی — امتحان میں یہ دونوں ملا دی جاتی ہیں۔"},

tw55:{q:"دلیلِ انابت کی آیت کون سی ہے؟",
o:["<span class='ar'>وَأَنِيبُوا إِلَى رَبِّكُمْ وَأَسْلِمُوا لَهُ</span>","<span class='ar'>إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ</span>","<span class='ar'>قُلْ أَعُوذُ بِرَبِّ النَّاسِ</span>","<span class='ar'>إِذْ تَسْتَغِيثُونَ رَبَّكُمْ</span>"],
e:"انابت = اللہ کی طرف رجوع کرنا اور اس کے لیے جھک جانا۔"},

tw56:{q:"دلیلِ استعانت کی آیت اور حدیث کون سی ہے؟",
o:["آیت: <span class='ar'>إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ</span> · حدیث: <span class='ar'>إِذَا اسْتَعَنْتَ فَاسْتَعِنْ بِاللهِ</span>","آیت: <span class='ar'>قُلْ أَعُوذُ بِرَبِّ الفَلَقِ</span> · حدیث: <span class='ar'>الدُّعَاءُ مُخُّ العِبَادَةِ</span>","آیت: <span class='ar'>وَأَنِيبُوا إِلَى رَبِّكُمْ</span> · حدیث: <span class='ar'>لَعَنَ اللهُ مَنْ ذَبَحَ لِغَيْرِ اللهِ</span>","آیت: <span class='ar'>إِذْ تَسْتَغِيثُونَ رَبَّكُمْ</span> · حدیث: کوئی نہیں"],
e:"آیت سورۃ الفاتحہ کی ہے، اور حدیث حضرت ابن عباس رضی اللہ عنہما کی مشہور وصیت سے ہے۔"},

tw57:{q:"دلیلِ استعاذہ (پناہ مانگنا) کی آیات کون سی ہیں؟",
o:["<span class='ar'>قُلْ أَعُوذُ بِرَبِّ الفَلَقِ</span> اور <span class='ar'>قُلْ أَعُوذُ بِرَبِّ النَّاسِ</span>","<span class='ar'>إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ</span>","<span class='ar'>إِذَا تَسْتَغِيثُونَ رَبَّكُمْ فَاسْتَجَابَ لَكُمْ</span>","<span class='ar'>وَأَنِيبُوا إِلَى رَبِّكُمْ</span>"],
e:"یعنی سورۃ الفلق اور سورۃ الناس کی ابتدائی آیات۔"},

tw58:{q:"دلیلِ استغاثہ (فریاد کرنا) کی آیت کون سی ہے؟",
o:["<span class='ar'>إِذْ تَسْتَغِيثُونَ رَبَّكُمْ فَاسْتَجَابَ لَكُمْ</span>","<span class='ar'>قُلْ أَعُوذُ بِرَبِّ الفَلَقِ</span>","<span class='ar'>إِيَّاكَ نَعْبُدُ</span>","<span class='ar'>وَأَنِيبُوا إِلَى رَبِّكُمْ</span>"],
e:"استغاثہ بھی خالص اللہ کے لیے ہے؛ غیر اللہ سے فریاد شرک ہے۔"},

tw59:{q:"دلیلِ ذبح کی آیت اور سنت کون سی ہے؟",
o:["آیت: <span class='ar'>قُلْ إِنَّ صَلاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلهِ رَبِّ العَالَمِينَ ∗ لا شَرِيكَ لَهُ</span> · سنت: <span class='ar'>لَعَنَ اللهُ مَنْ ذَبَحَ لِغَيْرِ اللهِ</span>","آیت: <span class='ar'>وَأَنِيبُوا إِلَى رَبِّكُمْ</span> · سنت: <span class='ar'>الدُّعَاءُ مُخُّ العِبَادَةِ</span>","آیت: <span class='ar'>يُوفُونَ بِالنَّذْرِ</span> · سنت: کوئی نہیں","آیت: <span class='ar'>إِيَّاكَ نَعْبُدُ</span> · سنت: <span class='ar'>إِذَا اسْتَعَنْتَ فَاسْتَعِنْ بِاللهِ</span>"],
e:"نُسُک = قربانی/ذبح۔ سنت کی دلیل بتاتی ہے کہ غیر اللہ کے لیے ذبح پر لعنت ہے۔"},

tw60:{q:"دلیلِ نذر (منت) کی آیت کون سی ہے؟",
o:["<span class='ar'>يُوفُونَ بِالنَّذْرِ وَيَخَافُونَ يَوْماً كَانَ شَرُّهُ مُسْتَطِيراً</span>","<span class='ar'>قُلْ إِنَّ صَلاتِي وَنُسُكِي</span>","<span class='ar'>إِذْ تَسْتَغِيثُونَ رَبَّكُمْ</span>","<span class='ar'>وَعَلَى اللهِ فَتَوَكَّلُوا</span>"],
e:"نذر بھی عبادت ہے، اس لیے غیر اللہ کے لیے منت ماننا شرک ہے۔"},

tw61:{q:"دلیلِ شہادتین (کلمہ) کی آیت کون سی ہے؟",
o:["<span class='ar'>شَهِدَ اللهُ أَنَّهُ لا إِلَهَ إِلَّا هُوَ وَالمَلائِكَةُ وَأُولُو العِلْمِ قَائِماً بِالقِسْطِ</span>","<span class='ar'>وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللهَ مُخْلِصِينَ</span>","<span class='ar'>لَقَدْ جَاءَكُمْ رَسُولٌ مِنْ أَنْفُسِكُمْ</span>","<span class='ar'>وَلِلهِ عَلَى النَّاسِ حِجُّ البَيْتِ</span>"],
e:"اور شہادت ”محمد رسول اللہ“ کی دلیل: <span class='ar'>لَقَدْ جَاءَكُمْ رَسُولٌ مِنْ أَنْفُسِكُمْ عَزِيزٌ عَلَيْهِ مَا عَنِتُّمْ…</span>"},

tw62:{q:"صلاۃ، زکاۃ اور تفسیرِ توحید کی دلیل ایک ہی آیت ہے — کون سی؟",
o:["<span class='ar'>وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللهَ مُخْلِصِينَ لَهُ الدِّينَ حُنَفَاءَ وَيُقِيمُوا الصَّلاةَ وَيُؤْتُوا الزَّكَاةَ وَذَلِكَ دِينُ القَيِّمَةِ</span>","<span class='ar'>يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ</span>","<span class='ar'>وَلِلهِ عَلَى النَّاسِ حِجُّ البَيْتِ</span>","<span class='ar'>شَهِدَ اللهُ أَنَّهُ لا إِلَهَ إِلَّا هُوَ</span>"],
e:"اسی آیت سے اخلاص (توحید)، صلاۃ اور زکاۃ تینوں ثابت ہوتے ہیں۔"},

tw63:{q:"دلیلِ صیام اور دلیلِ حج کون سی آیات ہیں؟",
o:["صیام: <span class='ar'>يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ</span> · حج: <span class='ar'>وَلِلهِ عَلَى النَّاسِ حِجُّ البَيْتِ مَنِ اسْتَطَاعَ إِلَيْهِ سَبِيلاً</span>","صیام: <span class='ar'>وَأَتِمُّوا الحَجَّ</span> · حج: <span class='ar'>كُتِبَ عَلَيْكُمُ الصِّيَامُ</span>","صیام: <span class='ar'>وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللهَ</span> · حج: <span class='ar'>شَهِدَ اللهُ</span>","دونوں کی ایک ہی دلیل ہے"],
e:"دونوں کی الگ الگ دلیلیں متن میں دی گئی ہیں — امتحان میں انہیں ملا کر پوچھا جاتا ہے۔"},

tw64:{q:"ارکانِ ستہ (ایمان کے ۶ ارکان) پر دلیل کون سی آیت ہے؟",
o:["<span class='ar'>لَيْسَ البِرَّ أَنْ تُوَلُّوا وُجُوهَكُمْ قِبَلَ المَشْرِقِ وَالمَغْرِبِ وَلَكِنَّ البِرَّ مَنْ آمَنَ بِاللهِ وَاليَوْمِ الآخِرِ وَالمَلائِكَةِ وَالكِتَابِ وَالنَّبِيِّينَ</span>","<span class='ar'>إِنَّا كُلَّ شَيْءٍ خَلَقْنَاهُ بِقَدَرٍ</span>","<span class='ar'>شَهِدَ اللهُ أَنَّهُ لا إِلَهَ إِلَّا هُوَ</span>","<span class='ar'>إِنَّ اللهَ مَعَ الَّذِينَ اتَّقَوْا</span>"],
e:"اور دلیل القدر خاص طور پر: <span class='ar'>إِنَّا كُلَّ شَيْءٍ خَلَقْنَاهُ بِقَدَرٍ</span>۔"},

tw65:{q:"الاحسان کی سنت سے دلیل کیا ہے؟",
o:["حدیثِ جبریل المشہور — حضرت عمر رضی اللہ عنہ سے مروی","حدیثِ نیت","حدیثِ سواک","حدیثِ مسح علی الخفین"],
e:"اس حدیث میں جبریل علیہ السلام نے اسلام، ایمان، احسان اور قیامت کی نشانیوں کے بارے میں پوچھا؛ آخر میں نبی <span class='ar'>ﷺ</span> نے فرمایا: <span class='ar'>فَإِنَّهُ جِبْرِيلُ، أَتَاكُمْ يُعَلِّمُكُمْ دِينَكُمْ</span>۔"},

tw66:{q:"حدیثِ جبریل میں قیامت کی امارات (نشانیاں) کیا بتائی گئیں؟",
o:["لونڈی اپنی مالکہ کو جنم دے گی، اور ننگے پاؤں، ننگے بدن، مفلس بکریوں کے چرواہے سردار بن جائیں گے","سورج مغرب سے نکلے گا اور دجال آئے گا","آگ یمن سے نکلے گی","دابۃ الارض ظاہر ہوگا"],
e:"<span class='ar'>أَنْ تَلِدَ الأَمَةُ رَبَّتَهَا، وَأَنْ تَرَى الحُفَاةَ العُرَاةَ العَالَةَ رِعَاءَ الشَّاءِ يَتَطَاوَلُونَ فِي البُنْيَانِ</span>۔"},

tw67:{q:"اللہ نے نبی <span class='ar'>ﷺ</span> کو کس بات کے ساتھ بھیجا اور اس کی دلیل کون سی سورت ہے؟",
o:["شرک سے ڈرانے اور توحید کی دعوت دینے کے لیے · سورۃ المدثر (<span class='ar'>يَا أَيُّهَا المُدَّثِّرُ</span>)","صرف قرآن سنانے کے لیے · سورۃ العلق","صرف اخلاق سکھانے کے لیے · سورۃ القلم","جہاد کے لیے · سورۃ التوبہ"],
e:"<span class='ar'>بَعَثَهُ اللهُ بِالنِّذَارَةِ عَنِ الشِّرْكِ، وَيَدْعُو إِلَى التَّوْحِيدِ</span>۔ معنی <span class='ar'>﴿قُمْ فَأَنْذِرْ﴾</span>: شرک سے ڈرا اور توحید کی دعوت دے۔"},

tw68:{q:"متن کی تفسیر کے مطابق <span class='ar'>﴿وَرَبَّكَ فَكَبِّرْ﴾</span> اور <span class='ar'>﴿وَثِيَابَكَ فَطَهِّرْ﴾</span> کا معنی کیا ہے؟",
o:["پہلا: اپنے رب کی توحید کے ساتھ عظمت بیان کر · دوسرا: اپنے اعمال کو شرک سے پاک کر","پہلا: بلند آواز سے تکبیر کہہ · دوسرا: کپڑے دھو","پہلا: اذان دے · دوسرا: وضو کر","پہلا: نماز پڑھ · دوسرا: غسل کر"],
e:"متن کی تفسیر: <span class='ar'>﴿وَرَبَّكَ فَكَبِّرْ﴾ أَيْ: عَظِّمْهُ بِالتَّوْحِيدِ</span>، اور <span class='ar'>﴿وَثِيَابَكَ فَطَهِّرْ﴾ أَيْ: طَهِّرْ أَعْمَالَكَ عَنِ الشِّرْكِ</span>۔"},

tw69:{q:"<span class='ar'>﴿وَالرُّجْزَ فَاهْجُرْ﴾</span> میں ”الرُّجْز“ سے کیا مراد ہے؟",
o:["الاصنام (بت) — اور ان سے ہجرت کا مطلب انہیں چھوڑنا اور ان سے اور ان کے اہل سے براءت کرنا","گناہ","ناپاکی","شیطان"],
e:"متن: <span class='ar'>وَالرُّجْزَ: الأَصْنَامُ، وَهَجْرُهَا: تَرْكُهَا، وَالبَرَاءَةُ مِنْهَا وَأَهْلِهَا</span>۔"},

tw70:{q:"نبی <span class='ar'>ﷺ</span> نے کتنے سال توحید کی دعوت دی اور اس کے بعد کیا ہوا؟",
o:["۱۰ سال · پھر معراج ہوئی، ۵ نمازیں فرض ہوئیں، ۳ سال مکہ میں نماز پڑھی، پھر ہجرت کا حکم ملا","۵ سال · پھر ہجرت","۱۳ سال · پھر معراج","۱۰ سال · پھر فوراً ہجرت"],
e:"<span class='ar'>أَخَذَ عَلَى هَذَا عَشْرَ سِنِينَ يَدْعُو إِلَى التَّوْحِيدِ، وَبَعْدَ العَشْرِ عُرِجَ بِهِ إِلَى السَّمَاءِ…</span>"},

tw71:{q:"مدینہ آنے کے بعد کون سے احکام دیے گئے اور اس پر کتنا عرصہ گزرا؟",
o:["زکاۃ، صوم، حج، اذان، جہاد، امر بالمعروف و نہی عن المنکر · ۱۰ سال","صرف زکاۃ اور صوم · ۵ سال","صرف جہاد · ۳ سال","صرف اذان اور حج · ۱۳ سال"],
e:"<span class='ar'>أُمِرَ بِبَقِيَّةِ شَرَائِعِ الإِسْلامِ… أَخَذَ عَلَى هَذَا عَشْرَ سِنِينَ</span>۔ اس کے بعد آپ <span class='ar'>ﷺ</span> کی وفات ہوئی مگر آپ کا دین باقی ہے۔"},

tw72:{q:"متن کے مطابق آپ <span class='ar'>ﷺ</span> نے جس خیر کی رہنمائی کی اور جس شر سے ڈرایا — وہ کیا ہے؟",
o:["خیر: توحید اور ہر وہ چیز جو اللہ کو پسند ہو · شر: شرک اور ہر وہ چیز جو اللہ کو ناپسند ہو","خیر: نماز · شر: بدعت","خیر: علم · شر: جہالت","خیر: صبر · شر: غصہ"],
e:"<span class='ar'>وَالخَيْرُ الَّذِي دَلَّهَا عَلَيْهِ: التَّوْحِيدُ، وَجَمِيعُ مَا يُحِبُّهُ اللهُ وَيَرْضَاهُ. وَالشَّرُّ الَّذِي حَذَّرَهَا مِنْهُ: الشِّرْكُ، وَجَمِيعُ مَا يَكْرَهُهُ اللهُ وَيَأْبَاهُ</span>۔"},

tw73:{q:"اللہ نے نبی <span class='ar'>ﷺ</span> کو کس کی طرف بھیجا، اور اس کی دلیل؟",
o:["تمام لوگوں کی طرف، اور ان کی اطاعت جن و انس دونوں پر فرض کی · <span class='ar'>قُلْ يَا أَيُّهَا النَّاسُ إِنِّي رَسُولُ اللهِ إِلَيْكُمْ جَمِيعاً</span>","صرف عربوں کی طرف · <span class='ar'>وَأَنْذِرْ عَشِيرَتَكَ</span>","صرف قریش کی طرف · <span class='ar'>قُمْ فَأَنْذِرْ</span>","صرف اہلِ کتاب کی طرف"],
e:"<span class='ar'>بَعَثَهُ اللهُ إِلَى النَّاسِ كَافَّةً، وَافْتَرَضَ طَاعَتَهُ عَلَى جَمِيعِ الثَّقَلَيْنِ — الجِنِّ وَالإِنْسِ</span>۔"},

tw74:{q:"”اللہ نے آپ <span class='ar'>ﷺ</span> کے ذریعے دین مکمل کیا“ — اس کی دلیل؟",
o:["<span class='ar'>اليَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِي وَرَضِيتُ لَكُمُ الإِسْلامَ دِيناً</span>","<span class='ar'>إِنَّكَ مَيِّتٌ وَإِنَّهُمْ مَيِّتُونَ</span>","<span class='ar'>قُلْ يَا أَيُّهَا النَّاسُ</span>","<span class='ar'>وَمَا كَانَ مُحَمَّدٌ أَبَا أَحَدٍ مِنْ رِجَالِكُمْ</span>"],
e:"اور آپ کی موت پر دلیل: <span class='ar'>إِنَّكَ مَيِّتٌ وَإِنَّهُمْ مَيِّتُونَ ∗ ثُمَّ إِنَّكُمْ يَوْمَ القِيَامَةِ عِنْدَ رَبِّكُمْ تَخْتَصِمُونَ</span>۔"},

tw75:{q:"بعث (دوبارہ اٹھائے جانے) کے بعد لوگوں کا کیا ہوگا، اور اس کی دلیل؟",
o:["محاسبہ ہوگا اور اعمال کا بدلہ ملے گا · <span class='ar'>لِيَجْزِيَ الَّذِينَ أَسَاءُوا بِمَا عَمِلُوا وَيَجْزِيَ الَّذِينَ أَحْسَنُوا بِالحُسْنَى</span>","سب جنت میں جائیں گے · <span class='ar'>وَاللهُ غَفُورٌ رَحِيمٌ</span>","سب کا حساب معاف ہوگا","صرف کفار کا حساب ہوگا"],
e:"متن: <span class='ar'>وَبَعْدَ البَعْثِ مُحَاسَبُونَ وَمَجْزِيُّونَ بِأَعْمَالِهِمْ</span>۔"},

tw76:{q:"جو بعث کا انکار کرے اس کا حکم کیا ہے، اور دلیل؟",
o:["وہ کافر ہے · <span class='ar'>زَعَمَ الَّذِينَ كَفَرُوا أَنْ لَنْ يُبْعَثُوا قُلْ بَلَى وَرَبِّي لَتُبْعَثُنَّ ثُمَّ لَتُنَبَّؤُنَّ بِمَا عَمِلْتُمْ</span>","وہ گناہ گار ہے مگر مسلمان ہے","اس پر صرف توبہ لازم ہے","یہ مسئلہ اختلافی ہے"],
e:"<span class='ar'>وَمَنْ كَذَّبَ بِالبَعْثِ كَفَرَ</span> — متن نے صراحتاً کافر قرار دیا۔"},

tw77:{q:"اللہ نے تمام رسولوں کو کس حیثیت سے بھیجا، اور ان میں پہلے اور آخر کون ہیں؟",
o:["مبشرین و منذرین · پہلے: نوح علیہ السلام · آخر: محمد <span class='ar'>ﷺ</span> (خاتم النبیین)","صرف منذرین · پہلے: آدم علیہ السلام · آخر: عیسیٰ علیہ السلام","صرف مبشرین · پہلے: ابراہیم علیہ السلام · آخر: محمد <span class='ar'>ﷺ</span>","مبشرین و منذرین · پہلے: ابراہیم علیہ السلام · آخر: عیسیٰ علیہ السلام"],
e:"دلیلِ نوح: <span class='ar'>إِنَّا أَوْحَيْنَا إِلَيْكَ كَمَا أَوْحَيْنَا إِلَى نُوحٍ وَالنَّبِيِّينَ مِنْ بَعْدِهِ</span>۔ دلیلِ ختم: <span class='ar'>وَمَا كَانَ مُحَمَّدٌ أَبَا أَحَدٍ مِنْ رِجَالِكُمْ وَلَكِنْ رَسُولَ اللهِ وَخَاتَمَ النَّبِيِّينَ</span>۔"},

tw78:{q:"ہر امت کی طرف رسول بھیجا گیا — کن دو باتوں کے ساتھ؟ دلیل؟",
o:["اللہ کی اکیلی عبادت کا حکم اور طاغوت کی عبادت سے ممانعت · <span class='ar'>وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَسُولاً أَنِ اعْبُدُوا اللهَ وَاجْتَنِبُوا الطَّاغُوتَ</span>","نماز اور زکات کا حکم · <span class='ar'>وَأَقِيمُوا الصَّلاةَ</span>","صرف توحید · <span class='ar'>قُلْ هُوَ اللهُ أَحَدٌ</span>","صرف اخلاق · <span class='ar'>إِنَّكَ لَعَلَى خُلُقٍ عَظِيمٍ</span>"],
e:"اور اللہ نے تمام بندوں پر فرض کیا: طاغوت کا کفر اور اللہ پر ایمان۔"},

tw79:{q:"ابن القیم (رحمہ اللہ) کے مطابق طاغوت کا معنی کیا ہے؟",
o:["<span class='ar'>مَا تَجَاوَزَ بِهِ العَبْدُ حَدَّهُ مِنْ مَعْبُودٍ، أَوْ مَتْبُوعٍ، أَوْ مُطَاعٍ</span>","صرف بت","صرف شیطان","صرف ظالم بادشاہ"],
e:"یعنی ہر وہ چیز جس کے ذریعے بندہ اپنی حد سے گزر جائے — چاہے معبود ہو، یا جس کی پیروی کی جائے، یا جس کی اطاعت کی جائے۔"},

tw80:{q:"طواغیت بہت ہیں، مگر ان کے رؤوس (سردار) کتنے ہیں؟",
o:["۵","۳","۷","۱۰"],
e:"ابلیس (ملعون)، جس کی عبادت کی جائے اور وہ راضی ہو، جو لوگوں کو اپنی عبادت کی دعوت دے، جو غیب کے علم کا دعویٰ کرے، اور جو اللہ کے نازل کیے ہوئے کے علاوہ فیصلہ کرے۔"},

tw81:{q:"متن کے آخر میں کون سی آیت <span class='ar'>لا إِلَهَ إِلَّا اللهُ</span> کا معنی بیان کرتی ہے؟",
o:["<span class='ar'>لا إِكْرَاهَ فِي الدِّينِ قَدْ تَبَيَّنَ الرُّشْدُ مِنَ الغَيِّ فَمَنْ يَكْفُرْ بِالطَّاغُوتِ وَيُؤْمِنْ بِاللهِ فَقَدِ اسْتَمْسَكَ بِالعُرْوَةِ الوُثْقَى</span>","<span class='ar'>قُلْ هُوَ اللهُ أَحَدٌ</span>","<span class='ar'>شَهِدَ اللهُ أَنَّهُ لا إِلَهَ إِلَّا هُوَ</span>","<span class='ar'>وَمَا خَلَقْتُ الجِنَّ وَالإِنْسَ إِلَّا لِيَعْبُدُونِ</span>"],
e:"متن: <span class='ar'>وَهَذَا مَعْنَى ‘لا إِلَهَ إِلَّا اللهُ’</span> — طاغوت کا کفر اور اللہ پر ایمان۔"},

tw82:{q:"متن کی آخری حدیث میں دین کا سر، ستون اور چوٹی کیا بتائی گئی؟",

tw83:{q:"نواقضُ الاسلام کا چھٹا ناقض اور اس کی دلیل؟",
o:["دین کی کسی چیز، اس کے ثواب یا عذاب کا مذاق اڑانا · <span class='ar'>قُلْ أَبِاللهِ وَآيَاتِهِ وَرَسُولِهِ كُنْتُمْ تَسْتَهْزِئُونَ</span>","جادو کرنا · <span class='ar'>وَمَا كَفَرَ سُلَيْمَانُ</span>","مشرکین کی مدد · <span class='ar'>وَمَنْ يَتَوَلَّهُمْ مِنْكُمْ</span>","دین سے اعراض · <span class='ar'>وَمَنْ أَعْرَضَ عَنْ ذِكْرِي</span>"],

tw84:{q:"ساتواں ناقض کیا ہے اور اس میں کیا شامل ہے؟",

o:["دوسرا رکن","پہلا رکن","تیسرا رکن","چوتھا رکن"],
e:"دلیل: بخاری۔ اور قیامت کے دن سب سے پہلے نماز کا حساب لیا جائے گا (صحیح ترمذی)۔"},
