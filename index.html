/* ---------------------------------------------------------- *
 * Screen: Test runner
 * ---------------------------------------------------------- */
function renderTestScreen(){
  var p = state.progress;
  if(!p || p.finishedAt || p.testId !== state.route.testId){
    return renderTop() + '<div class="wrap sec"><div class="empty"><h3>'+t('sessionInactive')+'</h3><p>'+t('sessionInactiveB')+'</p><button class="btn" data-act="nav" data-to="#/home">'+t('backToHome')+'</button></div></div>' + renderOverlays();
  }
  var qid = p.qids[p.cur];
  var q = BANK_BY_ID[qid];
  var order = p.optOrder[qid];
  var opts = qOpts(q);
  var answeredDisp = p.answers[qid];
  var answered = answeredDisp!==undefined && answeredDisp!==null;
  var showFeedback = p.mode==='practice' && answered;
  var donePct = Math.round(((p.cur+1)/p.qids.length)*100);
  var letters=['A','B','C','D'];

  var optsHtml='';
  for(var disp=0; disp<4; disp++){
    var orig = order[disp];
    var isSelected = answeredDisp===disp;
    var stateAttr='';
    if(showFeedback){
      if(orig===q.a) stateAttr='data-state="right"';
      else if(isSelected) stateAttr='data-state="wrong"';
    }
    var mk='';
    if(showFeedback && (orig===q.a || isSelected)){
      mk = '<svg class="mk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">'+(orig===q.a?'<path d="M20 6L9 17l-5-5"/>':'<path d="M18 6L6 18M6 6l12 12"/>')+'</svg>';
    }
    optsHtml += '<button class="opt" role="radio" aria-checked="'+isSelected+'" data-act="select-opt" data-qid="'+qid+'" data-idx="'+disp+'" '+(isSelected&&!showFeedback?'data-sel="1"':'')+' '+stateAttr+' '+((p.mode==='practice'&&answered)?'disabled':'')+'>' +
      '<span class="ltr">'+letters[disp]+'</span>' +
      '<span class="body">'+opts[orig]+'</span>' + mk +
    '</button>';
  }

  var explHtml='';
  if(showFeedback){
    var isRight = order[answeredDisp]===q.a;
    explHtml = '<div class="expl '+(isRight?'':'bad')+'" aria-live="polite"><b>'+(isRight?t('correct'):t('notQuite'))+'</b><p>'+qExpl(q)+'</p><div class="ref">'+q.r+'</div></div>';
  }

  var isLast = p.cur===p.qids.length-1;
  var subjectTag = !p.subjectId ? ('<span class="tag">'+subjName(SUBJECTS.filter(function(s){return s.id===q.s;})[0])+'</span>') : '';

  return '' +
  '<div class="exam-top"><div class="exam-top-in">' +
    '<div class="exam-bar">' +
      '<button class="iconbtn" data-act="back-from-test" aria-label="'+t('exitTest')+'"><span class="flipwrap">'+ICONS.chevLeft+'</span></button>' +
      '<div class="ttl">'+p.title+'</div>' +
      '<span class="pill" id="elapsedDisplay">'+formatElapsed(currentElapsedSeconds())+'</span>' +
      '<span class="pill">'+(p.cur+1)+'/'+p.qids.length+'</span>' +
      '<button class="iconbtn" data-act="open-palette" aria-label="'+t('questionList')+'">'+ICONS.grid+'</button>' +
    '</div>' +
    '<div class="prog"><i style="width:'+donePct+'%"></i></div>' +
  '</div></div>' +
  '<div class="qwrap">' +
    '<div class="qhead">' +
      '<span class="qstyle">'+styleLabel(q)+'</span>' +
      '<span class="tag tag-'+q.d+'">'+diffLabel(q.d)+'</span>' + subjectTag +
      '<button class="btn btn-quiet btn-sm" data-act="toggle-flag" data-qid="'+qid+'" style="margin-left:auto">'+ICONS.flag+' '+(p.flags[qid]?t('marked'):t('markForReview'))+'</button>' +
    '</div>' +
    '<div class="qtext">'+qText(q)+'</div>' +
    '<div class="opts" role="radiogroup" aria-label="'+t('answerOptions')+'">'+optsHtml+'</div>' +
    explHtml +
  '</div>' +
  '<div class="actions"><div class="actions-in">' +
    '<button class="btn btn-ghost" data-act="prev-q" '+(p.cur===0?'disabled':'')+'><span class="flipwrap">'+ICONS.chevLeft+'</span> '+t('prev')+'</button>' +
    '<div class="grow"></div>' +
    (isLast ? '<button class="btn" data-act="submit-test">'+t('submitTest')+'</button>'
            : '<button class="btn" data-act="next-q">'+t('next')+' <span class="flipwrap">'+ICONS.chevRight+'</span></button>') +
  '</div></div>' +
  renderOverlays();
}

/* ---------------------------------------------------------- *
 * Screen: Results
 * ---------------------------------------------------------- */
function renderResults(){
  var a = state.attempts.filter(function(x){ return x.id===state.route.attemptId; })[0];
  if(!a){
    return renderTop() + '<div class="wrap sec"><div class="empty"><h3>'+t('resultNotFound')+'</h3><p>'+t('resultNotFoundB')+'</p><button class="btn" data-act="nav" data-to="#/history">'+t('goToHistory')+'</button></div></div>' + renderOverlays();
  }
  var pct = a.total ? Math.round(a.score/a.total*100) : 0;
  var verdict, vClass;
  if(pct>=85){ verdict=t('excellent'); vClass='pass'; }
  else if(pct>=70){ verdict=t('goodWork'); vClass='pass'; }
  else if(pct>=50){ verdict=t('needsReview'); vClass='fail'; }
  else { verdict=t('keepPracticing'); vClass='fail'; }

  var filter = state.ui.reviewFilter || 'all';
  var segsHtml='';
  a.qids.forEach(function(qid,i){
    var disp=a.answers[qid];
    var ansd = disp!==undefined && disp!==null;
    var ok = ansd && a.optOrder[qid][disp]===BANK_BY_ID[qid].a;
    segsHtml += '<button data-act="jump-review" data-qid="'+qid+'" '+(ansd?('data-r="'+(ok?1:0)+'"'):'')+' aria-label="'+t('question')+' '+(i+1)+'" title="Q'+(i+1)+'"></button>';
  });

  var brkHtml = '<div class="brk">' +
    '<div class="brk-item"><dt>'+t('correct')+'</dt><dd>'+a.score+'</dd></div>' +
    '<div class="brk-item"><dt>'+t('incorrect')+'</dt><dd>'+countIncorrect(a)+'</dd></div>' +
    '<div class="brk-item"><dt>'+t('skipped')+'</dt><dd>'+countSkipped(a)+'</dd></div>' +
    '<div class="brk-item"><dt>'+t('timeTaken')+'</dt><dd style="font-size:16px">'+formatElapsed(a.elapsedSec)+'</dd></div>' +
  '</div>';
  var diffSet = {};
  a.qids.forEach(function(qid){ diffSet[BANK_BY_ID[qid].d]=1; });
  if(Object.keys(diffSet).length>1){
    var perDiff='';
    ['easy','medium','hard'].forEach(function(d){
      var idsD = a.qids.filter(function(qid){ return BANK_BY_ID[qid].d===d; });
      if(!idsD.length) return;
      var c=0;
      idsD.forEach(function(qid){ var disp=a.answers[qid]; if(disp!==undefined&&disp!==null&&a.optOrder[qid][disp]===BANK_BY_ID[qid].a) c++; });
      perDiff += '<div class="brk-item"><dt>'+diffLabel(d)+'</dt><dd>'+c+'/'+idsD.length+'</dd></div>';
    });
    brkHtml += '<div class="brk" style="margin-top:10px">'+perDiff+'</div>';
  }

  var revHtml='';
  a.qids.forEach(function(qid,i){
    var q = BANK_BY_ID[qid];
    var disp = a.answers[qid];
    var ansd = disp!==undefined && disp!==null;
    var order = a.optOrder[qid];
    var opts = qOpts(q);
    var ok = ansd && order[disp]===q.a;
    var status = !ansd ? 'skip' : (ok ? 'right' : 'wrong');
    if(filter==='incorrect' && status!=='wrong') return;
    if(filter==='skipped' && status!=='skip') return;
    if(filter==='correct' && status!=='right') return;
    var ansHtml;
    if(!ansd){
      ansHtml = '<div class="ans none"><b>'+t('yourAnswer')+'</b> '+t('notAnswered')+'</div><div class="ans ok"><b>'+t('correct')+'</b> '+opts[q.a]+'</div>';
    } else if(ok){
      ansHtml = '<div class="ans ok"><b>'+t('yourAnswer')+'</b> '+opts[order[disp]]+'</div>';
    } else {
      ansHtml = '<div class="ans you"><b>'+t('yourAnswer')+'</b> '+opts[order[disp]]+'</div><div class="ans ok"><b>'+t('correct')+'</b> '+opts[q.a]+'</div>';
    }
    var subjectTag = !a.subjectId ? ('<span class="tag">'+subjName(SUBJECTS.filter(function(s){return s.id===q.s;})[0])+'</span>') : '';
    revHtml += '<div class="rev-item '+status+'" id="rev-'+qid+'">' +
      '<div class="rev-n"><span>Q'+(i+1)+'</span><span class="tag tag-'+q.d+'">'+diffLabel(q.d)+'</span>'+subjectTag+(a.flags&&a.flags[qid]?'<span class="tag">'+t('marked')+'</span>':'')+'</div>' +
      '<div class="rev-q">'+qText(q)+'</div>' + ansHtml +
      '<div class="expl '+((ok||!ansd)?'':'bad')+'"><p>'+qExpl(q)+'</p><div class="ref">'+q.r+'</div></div>' +
    '</div>';
  });

  var html = '<div class="wrap sec">' +
    '<button class="crumb" data-act="nav" data-to="'+(a.subjectId?('#/subject/'+a.subjectId):'#/home')+'">'+backIcon()+' '+(a.subjectId?t('backToSubject'):t('backToHome'))+'</button>' +
    '<h2 style="margin-bottom:4px">'+a.title+'</h2>' +
    '<p class="hint">'+(a.mode==='practice'?t('practiceMode'):t('examMode'))+' \u00b7 '+new Date(a.finishedAt).toLocaleString()+'</p>' +
    '<div class="score" style="margin-top:18px">' +
      '<div class="score-big">'+a.score+'<em>/'+a.total+'</em></div>' +
      '<div class="score-side"><div class="score-pc">'+pct+'%</div><span class="verdict '+vClass+'">'+verdict+'</span></div>' +
    '</div>' +
    '<div class="segs">'+segsHtml+'</div>' +
    '<div class="segs-key"><span><i class="sw" style="background:var(--green);border-color:var(--green)"></i> '+t('correct')+'</span><span><i class="sw" style="background:var(--wrong);border-color:var(--wrong)"></i> '+t('incorrect')+'</span><span><i class="sw" style="background:var(--line)"></i> '+t('skipped')+'</span></div>' +
    brkHtml +
    '<div class="chips">' +
      '<button class="chip" aria-pressed="'+(filter==='all')+'" data-act="filter-review" data-filter="all">'+t('all')+' ('+a.qids.length+')</button>' +
      '<button class="chip" aria-pressed="'+(filter==='incorrect')+'" data-act="filter-review" data-filter="incorrect">'+t('incorrect')+' ('+countIncorrect(a)+')</button>' +
      '<button class="chip" aria-pressed="'+(filter==='skipped')+'" data-act="filter-review" data-filter="skipped">'+t('skipped')+' ('+countSkipped(a)+')</button>' +
      '<button class="chip" aria-pressed="'+(filter==='correct')+'" data-act="filter-review" data-filter="correct">'+t('correct')+' ('+a.score+')</button>' +
    '</div>' +
    '<div class="rev">'+(revHtml || '<p class="hint">'+t('noMatchFilter')+'</p>')+'</div>' +
    '<div style="margin-top:24px;display:flex;gap:10px;flex-wrap:wrap">' +
      '<button class="btn" data-act="force-start" data-testid="'+a.testId+'">'+ICONS.refresh+' '+t('retakeThis')+'</button>' +
      '<button class="btn btn-ghost" data-act="nav" data-to="#/history">'+t('viewHistory')+'</button>' +
    '</div>' + renderFoot() +
  '</div>';
  return renderTop() + html + renderOverlays();
}

/* ---------------------------------------------------------- *
 * Screen: History
 * ---------------------------------------------------------- */
function renderHistory(){
  var list = state.attempts.filter(function(a){ return a.finishedAt; });
  var html = '<div class="wrap sec"><div class="sec-head"><h2>'+t('history')+'</h2><span class="hint">'+list.length+' '+(list.length!==1?t('attempts'):t('attempt'))+'</span></div>';
  if(!list.length){
    html += '<div class="empty"><h3>'+t('noAttemptsTitle')+'</h3><p>'+t('noAttemptsBody')+'</p><button class="btn" data-act="nav" data-to="#/home">'+t('browseSubjects')+'</button></div>';
  } else {
    html += '<div class="tests" style="gap:10px">';
    list.forEach(function(a){
      var pct = a.total ? Math.round(a.score/a.total*100) : 0;
      html += '<button class="hrow" data-act="view-attempt" data-id="'+a.id+'">' +
        '<div class="hrow-main"><strong>'+a.title+'</strong><span>'+(a.mode==='practice'?t('practice'):t('exam'))+' \u00b7 '+new Date(a.finishedAt).toLocaleDateString()+' \u00b7 '+a.total+' '+t('qsShort')+'</span></div>' +
        '<div class="hscore" style="color:'+(pct>=70?'var(--green)':'var(--wrong)')+'">'+pct+'%</div>' +
      '</button>';
    });
    html += '</div>';
  }
  html += renderFoot() + '</div>';
  return renderTop() + html + renderOverlays();
}

/* ---------------------------------------------------------- *
 * Screen: Hifz — the 12 memorisation hadiths
 * ---------------------------------------------------------- */
function toggleHifzCard(n){
  state.ui.hifzOpen = (state.ui.hifzOpen===n) ? null : n;
  render();
}
function setHifzMode(m){ state.ui.hifzMode = m; state.ui.hifzRevealed = {}; render(); }
function revealMatn(n){ state.ui.hifzRevealed[n]=true; render(); }
function renderHifz(){
  var mode = state.ui.hifzMode || 'all';
  var html = '<div class="wrap sec">' +
    '<button class="crumb" data-act="nav" data-to="#/subject/umdat">'+backIcon()+' '+t('backToSubject')+'</button>' +
    '<h1 style="font-size:clamp(22px,4.2vw,30px)">'+t('hifzTitle')+'</h1>' +
    '<p class="lead">'+t('hifzLead')+'</p>' +
    '<div class="note" style="margin-top:16px"><h3>'+t('hifzExamNote')+'</h3><p>'+t('hifzExamBody')+'</p></div>' +
    '<div class="field" style="margin-top:20px"><div class="segmented">' +
      '<button data-act="hifz-mode" data-mode="all" aria-pressed="'+(mode==='all')+'">'+t('showAll')+'</button>' +
      '<button data-act="hifz-mode" data-mode="ar" aria-pressed="'+(mode==='ar')+'">'+t('showArabic')+'</button>' +
      '<button data-act="hifz-mode" data-mode="hide" aria-pressed="'+(mode==='hide')+'">'+t('testMe')+'</button>' +
    '</div></div>' +
    '<div style="margin:6px 0 20px"><button class="btn" data-act="start-test" data-testid="hifz:all">'+t('practiceHifz')+' \u00b7 '+BANK.filter(function(q){return q.id.indexOf('hz')===0;}).length+' '+t('questions')+'</button></div>';

  html += '<div class="hifz-list">';
  HIFZ.forEach(function(h){
    var open = state.ui.hifzOpen===h.n;
    var revealed = mode!=='hide' || state.ui.hifzRevealed[h.n];
    var matnBlock;
    if(revealed){
      matnBlock = '<div class="matn ar">'+h.ar+'</div>';
    } else {
      matnBlock = '<button class="matn-hidden" data-act="reveal-matn" data-n="'+h.n+'">'+t('revealMatn')+'</button>';
    }
    html += '<div class="hifz-card'+(open?' open':'')+'">' +
      '<button class="hifz-head" data-act="hifz-toggle" data-n="'+h.n+'">' +
        '<span class="hifz-n">'+h.n+'</span>' +
        '<span class="hifz-t"><strong>'+(isUr()?h.tu:h.t)+'</strong><small>'+t('hadithNo')+' #'+h.n+' \u00b7 '+h.rawi+'</small></span>' +
        '<span class="flipwrap">'+ICONS.chevRight.replace('<svg ','<svg class="chev" ')+'</span>' +
      '</button>' +
      matnBlock;
    if(mode!=='ar'){
      html += '<div class="hifz-body">' +
        '<div class="hf"><b>'+t('transliteration')+'</b><p class="tl">'+h.tl+'</p></div>' +
        '<div class="hf"><b>'+t('translation')+'</b><p>'+(isUr()?h.uru:h.ur)+'</p><p class="en">'+h.en+'</p></div>';
      if(open){
        html += '<div class="hf"><b>'+t('narrator')+'</b><p><strong>'+h.rawi+'</strong><br>'+h.rawiNote+'</p></div>' +
          '<div class="hf"><b>'+t('keyTerms')+'</b><ul class="kt">' +
            h.key.map(function(k){ return '<li><span class="ar">'+k[0]+'</span> <span>'+k[1]+'</span></li>'; }).join('') +
          '</ul></div>' +
          '<div class="hf"><b>'+t('fawaid')+'</b><ol class="fw">' +
            h.fawaid.map(function(f){ return '<li>'+f+'</li>'; }).join('') +
          '</ol></div>' +
          '<div class="hf"><b>'+t('source')+'</b><p class="src">'+h.src+'</p></div>';
      }
      html += '</div>';
    }
    html += '</div>';
  });
  html += '</div>' + renderFoot() + '</div>';
  return renderTop() + html + renderOverlays();
}

/* ---------------------------------------------------------- *
 * Screen: Custom builder
 * ---------------------------------------------------------- */
function builderToggle(field, id){
  var b = state.ui.builder;
  var idx = b[field].indexOf(id);
  if(idx>=0){ if(b[field].length>1) b[field].splice(idx,1); }
  else { b[field].push(id); }
  render();
}
function builderStart(){
  var b = state.ui.builder;
  var pool = shuffleArr(BANK.filter(function(q){ return b.subjects.indexOf(q.s)>=0 && b.difficulties.indexOf(q.d)>=0; }));
  var count = Math.min(b.count, pool.length);
  var qids = pool.slice(0,count).map(function(q){ return q.id; });
  var allActive = activeSubjectIds();
  var subjLabel = (b.subjects.length===allActive.length) ? t('allSubjects')
    : b.subjects.map(function(id){ return subjName(SUBJECTS.filter(function(s){return s.id===id;})[0]); }).join(', ');
  var diffLbl = (b.difficulties.length===3) ? t('mixedAll').split(' \u00b7 ')[0] : b.difficulties.map(diffLabel).join('/');
  startTest({
    id:'custom:'+Date.now(),
    title:t('custom')+' \u00b7 '+subjLabel+' \u00b7 '+diffLbl,
    subjectId: b.subjects.length===1 ? b.subjects[0] : null,
    kind:'custom', qids:qids
  });
}
function renderBuilder(){
  var activeSubs = SUBJECTS.filter(function(s){ return !s.noNotes; });
  var b = state.ui.builder;
  var subsHtml = activeSubs.map(function(s){
    var on = b.subjects.indexOf(s.id)>=0;
    return '<button class="check" data-act="builder-toggle-subject" data-id="'+s.id+'" data-on="'+(on?1:0)+'">' +
      '<span class="box">'+ICONS.check+'</span><span class="tx">'+subjName(s)+' <small>'+bankCountForSubject(s.id)+' '+t('questions')+'</small></span></button>';
  }).join('');
  var diffHtml = ['easy','medium','hard'].map(function(d){
    var on = b.difficulties.indexOf(d)>=0;
    return '<button class="check" data-act="builder-toggle-diff" data-id="'+d+'" data-on="'+(on?1:0)+'">' +
      '<span class="box">'+ICONS.check+'</span><span class="tx">'+diffLabel(d)+'</span></button>';
  }).join('');
  var pool = BANK.filter(function(q){ return b.subjects.indexOf(q.s)>=0 && b.difficulties.indexOf(q.d)>=0; });
  var countHtml = '<div class="segmented">' +
    [10,20,30].map(function(c){ return '<button data-act="builder-set-count" data-count="'+c+'" aria-pressed="'+(b.count===c)+'" '+(c>pool.length?'disabled':'')+'>'+c+'</button>'; }).join('') +
    '<button data-act="builder-set-count" data-count="'+(pool.length||1)+'" aria-pressed="'+(b.count>=pool.length && pool.length>0)+'">'+t('max')+' ('+pool.length+')</button>' +
  '</div>';

  var html = '<div class="wrap sec">' +
    '<button class="crumb" data-act="nav" data-to="#/home">'+backIcon()+' '+t('home')+'</button>' +
    '<h1 style="font-size:clamp(22px,4.2vw,30px)">'+t('builderTitle')+'</h1>' +
    '<p class="lead">'+t('builderLead')+'</p>' +
    '<div class="field" style="margin-top:22px"><span class="lbl">'+t('chooseSubjects')+'</span><div class="checks">'+subsHtml+'</div></div>' +
    '<div class="field"><span class="lbl">'+t('difficulty')+'</span><div class="checks">'+diffHtml+'</div></div>' +
    '<div class="field"><span class="lbl">'+t('numQuestions')+'</span>'+countHtml+'</div>' +
    '<div class="field"><span class="lbl">'+t('mode')+'</span><div class="segmented">' +
      '<button data-act="set-mode" data-mode="practice" aria-pressed="'+(state.settings.defaultMode==='practice')+'">'+t('practice')+'</button>' +
      '<button data-act="set-mode" data-mode="exam" aria-pressed="'+(state.settings.defaultMode==='exam')+'">'+t('exam')+'</button>' +
    '</div></div>' +
    '<p class="hint">'+pool.length+' '+(pool.length!==1?t('questions'):t('question'))+' '+t('matchSelection')+'</p>' +
    '<button class="btn btn-lg" style="margin-top:14px" data-act="builder-start" '+(pool.length===0?'disabled':'')+'>'+t('startCustom')+'</button>' +
    renderFoot() + '</div>';
  return renderTop() + html + renderOverlays();
}

/* ---------------------------------------------------------- *
 * Screen: Settings
 * ---------------------------------------------------------- */
function doReset(){
  state.attempts=[]; state.progress=null;
  var keepLang = state.settings.lang, keepTheme = state.settings.theme;
  state.settings=defaultSettings();
  state.settings.lang = keepLang; state.settings.theme = keepTheme;
  try{
    if(HAS_LS){
      window.localStorage.removeItem(LS_KEYS.attempts);
      window.localStorage.removeItem(LS_KEYS.progress);
    }
  }catch(e){}
  MEM_STORE={};
  saveSettings();
  applyTheme(state.settings.theme); applyLang(state.settings.lang);
  closeOverlays();
  navigate('#/home');
  showToast(t('resetDone'));
}
function renderSettings(){
  var s = state.settings;
  var html = '<div class="wrap sec">' +
    '<h1 style="font-size:clamp(22px,4.2vw,30px)">'+t('settings')+'</h1>' +
    '<div class="field" style="margin-top:22px"><span class="lbl">'+t('language')+'</span><div class="segmented">' +
      '<button data-act="set-lang" data-lang="en" aria-pressed="'+(s.lang!=='ur')+'">'+t('langEnglish')+'</button>' +
      '<button data-act="set-lang" data-lang="ur" aria-pressed="'+(s.lang==='ur')+'">'+t('langUrdu')+'</button>' +
    '</div><p class="hint" style="margin-top:8px">'+t('langNote')+'</p></div>' +
    '<div class="field"><span class="lbl">'+t('appearance')+'</span><div class="segmented">' +
      '<button data-act="set-theme" data-theme="auto" aria-pressed="'+(s.theme==='auto')+'">'+t('auto')+'</button>' +
      '<button data-act="set-theme" data-theme="light" aria-pressed="'+(s.theme==='light')+'">'+t('light')+'</button>' +
      '<button data-act="set-theme" data-theme="dark" aria-pressed="'+(s.theme==='dark')+'">'+t('dark')+'</button>' +
    '</div></div>' +
    '<div class="field"><span class="lbl">'+t('defaultMode')+'</span><div class="segmented">' +
      '<button data-act="set-mode" data-mode="practice" aria-pressed="'+(s.defaultMode==='practice')+'">'+t('practice')+'</button>' +
      '<button data-act="set-mode" data-mode="exam" aria-pressed="'+(s.defaultMode==='exam')+'">'+t('exam')+'</button>' +
    '</div></div>' +
    '<div class="field"><span class="lbl">'+t('shuffling')+'</span><div class="checks">' +
      '<button class="check" data-act="toggle-setting" data-key="shuffleQuestions" data-on="'+(s.shuffleQuestions?1:0)+'"><span class="box">'+ICONS.check+'</span><span class="tx">'+t('shuffleQ')+'<small>'+t('shuffleQSub')+'</small></span></button>' +
      '<button class="check" data-act="toggle-setting" data-key="shuffleOptions" data-on="'+(s.shuffleOptions?1:0)+'"><span class="box">'+ICONS.check+'</span><span class="tx">'+t('shuffleO')+'<small>'+t('shuffleOSub')+'</small></span></button>' +
    '</div></div>' +
    (!HAS_LS ? '<div class="banner">'+t('storageBlocked')+'</div>' : '') +
    '<div class="field" style="margin-top:30px"><span class="lbl">'+t('data')+'</span>' +
      '<p class="hint" style="margin-bottom:10px">'+t('dataNote')+'</p>' +
      '<button class="btn btn-danger" data-act="confirm-reset">'+t('resetAll')+'</button>' +
    '</div>' + renderFoot() + '</div>';
  return renderTop() + html + renderOverlays();
}

/* ---------------------------------------------------------- *
 * Ticking elapsed display
 * ---------------------------------------------------------- */
var tickInterval=null;
function startTick(){
  stopTick();
  tickInterval = setInterval(function(){
    var el = document.getElementById('elapsedDisplay');
    if(el) el.textContent = formatElapsed(currentElapsedSeconds());
  }, 1000);
}
function stopTick(){ if(tickInterval){ clearInterval(tickInterval); tickInterval=null; } }

/* ---------------------------------------------------------- *
 * Render dispatcher
 * ---------------------------------------------------------- */
function render(){
  var app = document.getElementById('app');
  var html;
  switch(state.route.screen){
    case 'test': html = renderTestScreen(); break;
    case 'subject': html = renderSubject(state.route.id); break;
    case 'history': html = renderHistory(); break;
    case 'hifz': html = renderHifz(); break;
    case 'builder': html = renderBuilder(); break;
    case 'settings': html = renderSettings(); break;
    case 'results': html = renderResults(); break;
    default: html = renderHome();
  }
  app.innerHTML = html;
  afterRender();
}
function afterRender(){
  if(state.route.screen==='test'){ ensureLive(); startTick(); }
  else { stopTick(); }
}

/* ---------------------------------------------------------- *
 * Event delegation
 * ---------------------------------------------------------- */
function onAppClick(e){
  if(e.target && e.target.classList){
    if(e.target.classList.contains('sheet-bg')){ closeSheet(); return; }
    if(e.target.classList.contains('modal-bg')){ closeModal(); return; }
  }
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if(!el) return;
  var act = el.dataset.act;
  var def;
  switch(act){
    case 'nav': navigate(el.dataset.to); break;
    case 'cycle-theme': cycleTheme(); break;
    case 'toggle-lang': toggleLang(); break;
    case 'set-lang': setLang(el.dataset.lang); break;
    case 'start-test': def = resolveTestDefById(el.dataset.testid); if(def) startTest(def); break;
    case 'force-start': def = resolveTestDefById(el.dataset.testid); if(def) startTest(def,{forceNew:true}); break;
    case 'confirm-restart': def = resolveTestDefById(el.dataset.testid); if(def) openModal('confirmRestart',{testDef:def}); break;
    case 'resume-progress': if(state.progress) navigate('#/test/'+encodeURIComponent(state.progress.testId)); break;
    case 'select-opt': selectOption(el.dataset.qid, parseInt(el.dataset.idx,10)); break;
    case 'toggle-flag': toggleFlag(el.dataset.qid); break;
    case 'goto-q': gotoQuestion(parseInt(el.dataset.idx,10)); render(); break;
    case 'prev-q': prevQuestion(); render(); break;
    case 'next-q': nextQuestion(); render(); break;
    case 'open-palette': openSheet('palette'); break;
    case 'close-sheet': closeSheet(); break;
    case 'close-modal': closeModal(); break;
    case 'submit-test': attemptSubmit(); break;
    case 'confirm-submit': finalizeAndGoResults(); break;
    case 'modal-confirm-restart': if(state.ui.modal){ def = state.ui.modal.payload.testDef; closeModal(); createFreshAttempt(def); } break;
    case 'modal-confirm-discard': if(state.ui.modal){ def = state.ui.modal.payload.pendingTestDef; closeModal(); createFreshAttempt(def); } break;
    case 'jump-review': {
      var target = document.getElementById('rev-'+el.dataset.qid);
      if(target && target.scrollIntoView) target.scrollIntoView({behavior: prefersReducedMotion()?'auto':'smooth', block:'start'});
      break;
    }
    case 'filter-review': setReviewFilter(el.dataset.filter); break;
    case 'hifz-toggle': toggleHifzCard(parseInt(el.dataset.n,10)); break;
    case 'hifz-mode': setHifzMode(el.dataset.mode); break;
    case 'reveal-matn': revealMatn(parseInt(el.dataset.n,10)); break;
    case 'builder-toggle-subject': builderToggle('subjects', el.dataset.id); break;
    case 'builder-toggle-diff': builderToggle('difficulties', el.dataset.id); break;
    case 'builder-set-count': state.ui.builder.count = parseInt(el.dataset.count,10); render(); break;
    case 'builder-start': builderStart(); break;
    case 'set-theme': state.settings.theme = el.dataset.theme; applyTheme(state.settings.theme); saveSettings(); render(); break;
    case 'set-mode': state.settings.defaultMode = el.dataset.mode; saveSettings(); render(); break;
    case 'toggle-setting': state.settings[el.dataset.key] = !state.settings[el.dataset.key]; saveSettings(); render(); break;
    case 'confirm-reset': openModal('confirmReset'); break;
    case 'do-reset': doReset(); break;
    case 'view-attempt': navigate('#/results/'+el.dataset.id); break;
    case 'back-from-test': {
      var p = state.progress;
      navigate(p && p.subjectId ? '#/subject/'+p.subjectId : '#/home');
      break;
    }
  }
}
function onKeydown(e){
  if(e.key==='Escape' && (state.ui.modal || state.ui.sheet)){ closeOverlays(); return; }
  if(state.route.screen!=='test') return;
  if(state.ui.modal || state.ui.sheet) return;
  var p = state.progress; if(!p) return;
  var qid = p.qids[p.cur];
  var key = e.key.toLowerCase();
  if(key>='1' && key<='4'){ selectOption(qid, key.charCodeAt(0)-'1'.charCodeAt(0)); }
  else if('abcd'.indexOf(key)>=0 && key.length===1){ selectOption(qid, 'abcd'.indexOf(key)); }
  else if(key==='arrowright'){ isUr()?prevQuestion():nextQuestion(); render(); }
  else if(key==='arrowleft'){ isUr()?nextQuestion():prevQuestion(); render(); }
  else if(key==='m'){ toggleFlag(qid); }
  else if(key==='p'){ openSheet('palette'); }
}

/* ---------------------------------------------------------- *
 * Boot
 * ---------------------------------------------------------- */
function boot(){
  state.settings = loadSettings();
  state.attempts = loadAttempts();
  state.progress = loadProgress();
  state.ui.builder = { subjects: activeSubjectIds(), difficulties:['easy','medium','hard'], count:20 };
  state.ui.hifzOpen = null; state.ui.hifzMode='all'; state.ui.hifzRevealed={};
  applyTheme(state.settings.theme);
  applyLang(state.settings.lang);
  state.route = parseHash();
  if(state.route.screen==='results') state.ui.reviewFilter='all';
  window.addEventListener('hashchange', onRouteChange);
  window.addEventListener('beforeunload', function(){
    if(state.route.screen==='test'){ commitElapsed(); saveProgress(); }
  });
  document.getElementById('app').addEventListener('click', onAppClick);
  document.addEventListener('keydown', onKeydown);
  render();
}
boot();
</script>
